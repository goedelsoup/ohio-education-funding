# The Astro site subproject. Tasks run with this directory as cwd, so pnpm finds
# package.json without `--dir`. Address from the repository root as
# `mise run //web:<task>`, or run bare names from inside this directory.

[tasks.gate]
description = "Everything the web job in CI runs: check, unit, build, dist links, measure, e2e."
run = [
  "mise run install",
  "mise run check",
  "mise run test-unit",
  "mise run build",
  "mise run check-dist",
  "mise run measure",
  "mise run test-e2e",
]

[tasks.install]
description = "Install dependencies exactly as locked."
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Serve the site with hot reload."
run = "pnpm dev"

[tasks.check]
description = "Type-check the Astro and TypeScript sources."
run = "pnpm check"

[tasks.test-unit]
description = "The formula, the projection, the link graph, the 404 matcher."
run = "pnpm test:unit"

[tasks.build]
description = "Build the static site."
# Where the formula is checked against the Rust checkpoints and where the corpus
# is parsed and validated, so a corpus authoring defect surfaces here rather than
# as a page that comes out wrong days later.
run = "pnpm build"

[tasks.check-dist]
description = "Fail if the built site carries a relative href a static host cannot serve."
# After `build`, never in the unit suite: that runs first, so it would be reading the previous
# commit's `dist/`. See the header of scripts/check-dist-links.ts for why this asks a question the
# route-table test structurally cannot.
run = "pnpm check:dist"

[tasks.test-e2e]
description = "The site in Chromium, a third of it with JavaScript disabled."
# The class of bug unit tests structurally cannot catch: the verification gate
# held shut on every tab except the one it exists for, and only a real browser
# found it. Needs `pnpm exec playwright install chromium` once.
run = "pnpm test:e2e"

[tasks.measure]
description = "What the built pages look like, as numbers: measure, size census, boxes, chrome."
# In the gate and grading nothing, which is deliberate. #183 builds the instrument; each redesign
# phase then fills in one entry of THRESHOLDS in src/lib/measure.ts and this starts biting. A check
# that arrives red teaches whoever added it to skip it, so this one arrives green over the very
# figures it exists to condemn, and prints them.
#
# After `build`, never before: it reports on `dist/`, and a stale one is the previous commit.
run = "pnpm measure"

[tasks.baseline]
description = "Capture the pages as images, and say what moved since the last --promote."
# NOT in the gate, and the reference images are not committed. A screenshot is a rendering of text
# and this site ships no font binary, so a reference taken here is red on a runner with different
# faces — see the header of scripts/baseline.ts. Promote before a redesign phase, capture after it,
# and look at what moved.
run = "pnpm baseline"

[tasks.schemas]
description = "Emit the JSON Schema the editor's YAML language server reads."
run = "pnpm schemas"

[tasks.corpus-report]
description = "Report on the corpus as the web layer sees it."
run = "pnpm corpus:report"
