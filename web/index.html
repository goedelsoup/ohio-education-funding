<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohio school funding</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <h1>Ohio school funding</h1>
  <p class="sub">What the Fair School Funding Plan computes for a district, what it actually
    receives, and what a different decision would do. Figures are the Department of Education
    and Workforce's own FY2027 model.</p>

  <div class="tabs" role="tablist">
    <button data-tab="district" role="tab" aria-selected="true">District</button>
    <button data-tab="statewide" role="tab" aria-selected="false">Statewide</button>
    <button data-tab="scenario" role="tab" aria-selected="false">Scenario</button>
  </div>

  <section data-panel="district" role="tabpanel">
    <div class="card">
      <label for="pick">District</label>
      <select id="pick"><option>Loading…</option></select>
    </div>
    <div id="district-out"></div>
  </section>

  <section data-panel="statewide" role="tabpanel" hidden>
    <div id="statewide-out"></div>
  </section>

  <section data-panel="scenario" role="tabpanel" hidden>
    <div class="card">
      <h2>Levers</h2>
      <div id="scenario-controls"></div>
      <p class="note"><button id="scenario-reset" class="flag" style="cursor:pointer">Reset to
        current law</button></p>
    </div>
    <div id="scenario-out"></div>
  </section>

  <footer>
    <p id="verified"></p>
    <p id="prov"></p>
  </footer>
</div>
<div id="tip" hidden></div>
<script type="module" src="app/main.js"></script>
</body>
</html>
