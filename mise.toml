# mise — host toolchains and the task runner. https://mise.jdx.dev
#
# `mise install` provisions the toolchains. `mise run //:ci` runs everything
# `.github/workflows/ci.yml` runs; `mise tasks --all` lists every task.
#
# # Why this exists
#
# It was written when there was no git remote, so `.github/workflows/ci.yml` had
# never executed once and this file was the only thing running the gates. There
# is a remote now and that workflow runs on every push, so the two are peers:
# this is what you run before pushing, and it runs the same gates in the same
# order, so that a green local gate means something about the remote one. The
# count used to be written out here as "nine"; it is not, because a hand-written
# figure beside a list that changes is a figure that goes stale unread.
#
# Worth remembering why it was needed at all. `cargo doc -D warnings` was red for
# at least two phases and nothing said so, because a workflow with nowhere to
# push is a workflow that does not run.

# Monorepo task mode. Each directory in `config_roots` holding a `mise.toml` is a
# subproject addressable from here as `//<path>:<task>` — `mise run //crates:test`.
# Subproject tasks run with their own directory as cwd, which is what lets them
# call bare `cargo` and `pnpm` with no `--manifest-path` or `--dir`.
monorepo_root = true

[settings]
experimental = true

# The yidam CLI tasks live in mise.yidam.toml, the INHERITED task layer: it is as
# much yidam's to correct as the vendored prelude is, and `mise run
# yidam-vendor-update` replaces it wholesale. Domain tasks belong in THIS file, or
# the next re-vendor discards them.
#
# It sits at the repository root rather than under .yidam/ only because mise has
# to find it there. `[task_config] includes` and not a top-level `extends`: mise
# accepts `extends` on an individual task and never on a config file, so it warns
# about an unknown field and carries on — and the failure looks like nothing at
# all, every inherited task simply absent.
[task_config]
# Ordering is load-bearing. An inherited task cannot be overridden from this
# file — neither `[tasks.<name>]` nor a `mise-tasks/<name>` file task shadows a
# name an included task file defines; the include wins and the local definition
# is invisible, absent from `mise tasks` entirely. A *later include* does win, so
# `mise.guards.toml` is where an inherited task gets overridden, and it has to
# stay after the file it overrides. Both this line and that file survive
# `yidam-vendor-update`, which replaces only `mise.yidam.toml`.
includes = ["mise.yidam.toml", "mise.guards.toml"]

# Where the Rust toolchain lives, stated because leaving it unstated is not the
# no-op it looks like.
#
# mise's rust backend exports `CARGO_HOME` and `RUSTUP_HOME` for every task it
# runs. With `rust.cargo_home` and `rust.rustup_home` unset it renders them as
# the literal string `undefined` resolved against this file's directory — so
# every task ran with
#
#   CARGO_HOME=<repo>/undefined
#   RUSTUP_HOME=<repo>/undefined
#
# There is no toolchain there, so `mise exec -- cargo` fails with "couldn't exec
# process" and the gate looks like a missing-cargo problem. Put the host's cargo
# on `PATH` to work around that and it gets worse quietly: rustup reads those
# same two variables, decides it has an empty installation, and provisions a
# fresh 1.4 GB toolchain into `<repo>/undefined/` — an untracked, ungitignored
# directory inside the working tree, one `git add -A` away from being committed.
#
# Pointing both at the host's real homes is what makes `mise run //:ci` work
# with no `PATH` preamble, and is why `undefined/` cannot come back.
[env]
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
# And the rustup shims, which mise does not add itself: its `rust` install for
# the pinned version *is* a symlink to `~/.cargo/bin`, so the `<install>/bin` it
# would put on PATH resolves to `~/.cargo/bin/bin` and does not exist.
# `RUSTUP_TOOLCHAIN` is still exported from the `[tools]` pin below, so the shim
# found here selects that version and the pin keeps meaning what it says. Written
# without the number because the number moves; see the pin for why it has to.
#
# `.yidam/bin` comes FIRST, ahead of cargo's directory, and the order is
# load-bearing rather than tidy. `mise run yidam-build` installs the CLI into
# .yidam/bin/ beside the pin it was built from — one binary per repository, so it
# always matches this repository's vendored prelude. Any `yidam` left in
# ~/.cargo/bin by an older install would otherwise shadow it, and the line above
# puts that directory on PATH for every task here.
#
# The failure that ordering prevents is a quiet one: an older binary missing a
# subcommand exits with `unrecognized subcommand`, which inside a redirected
# script step is indistinguishable from success. This guards anything mise runs;
# a script or CI step that assembles PATH by hand has to put .yidam/bin first
# itself.
_.path = [".yidam/bin", "{{env.HOME}}/.cargo/bin"]

[monorepo]
config_roots = ["crates", "web"]

[tools]
# <!-- YIDAM:TOOLS --> written by yidam-vendor-update from .yidam.toml — do not edit
"github:goedelsoup/yidam" = { version = "0.15.0", version_prefix = "cli/v" }
# <!-- /YIDAM:TOOLS -->
# Pinned rather than "latest" so the gate is reproducible, and pinned to *this*
# version because `.github/workflows/ci.yml` has nothing to select a toolchain
# with: there is no `rust-toolchain.toml`, so its `rustup show` step is a no-op
# that leaves the runner's current stable active. This pin is therefore a mirror
# of the runner rather than a floor. When GitHub's image moves to a newer stable,
# clippy gains lints and CI can go red with no commit behind it — and this line is
# what has to move for a local run to reproduce the failure. That is exactly how
# it went red at 1.97 while the local gate sat green on 1.82, and again at 1.98
# on `chunks_exact_to_as_chunks` while this line still said 1.97: the failing job
# was a PR that touched neither crate the lint fired in.
#
# **Moving this line is the whole procedure.** With the pin behind the runner
# there is no local invocation that reproduces the failure — `cargo clippy` is
# green, the log is the only evidence, and the fix has to be written against a
# compiler nobody in the repository is running. Bump it first, then lint.
#
# The workspace's real floor is lower — `Option::is_none_or` (1.82) in `connect`
# and `spreadsheet`, `u16::is_multiple_of` (1.87) in `edfund-core`, and now
# `slice::as_chunks` in both, which those two lint fixes introduced — but nothing
# enforces it, so treat this as the only version any check has been verified
# against.
#
# mise installs Rust through rustup with its own profile and does not read a
# `rust-toolchain.toml` component list, so rustfmt and clippy are requested here
# or a clean install omits them and the lint task fails with "no such command".
rust = { version = "1.98.0", components = "rustfmt,clippy" }
# Both named in `.github/workflows/ci.yml`; kept identical so a green local gate
# means something about the remote one.
node = "24"
pnpm = "11"

# --- Root tasks (`//:<task>`) ------------------------------------------------
#
# NB: a root task must not share a name with a subproject task fanned out via
# `//...:<task>`, because `//...` matches the root too and the task would recurse.
#
# The inherited layer brings one such name with it: `//:bundle` packages the
# corpus into .yidam/bundle.yiz, and `//crates:bundle` regenerates the web feed.
# Different jobs, same word, and neither is renameable — `//:bundle` is replaced
# on every re-vendor, and `//crates:bundle` is the domain's own. It is inert
# today because nothing invokes `//...` and nothing calls either by fan-out, so
# both stay reachable at their full addresses. Say which one you mean; a bare
# `mise run bundle` from the root is the corpus one.
#
# It brought a second collision that was NOT inert, and this is the record of it
# (#124). Every `<!-- REGEN: ... -->` block in this repository is generated by
# `edfund-connect index` — all fourteen, in the eight documents listed in
# `connect::index::DOCUMENTS`. None is generated by yidam.
#
# They used to be written `<!-- REGEN: yidam <cmd> -->`, from before there was a
# yidam binary to run. yidam's regen claims a block by that marker, and it has
# generators for seven of those command names, so it claimed eight blocks it does
# not own and produced different content for every one: `mise run regen-check`
# was red on a clean tree, and following its printed instruction rewrote six
# files, replacing web/README.md's live feed contract table with `_No bundle_`
# and turning `//:generated` red. Two gates that could not both be green.
#
# The marker now names the owner, so yidam claims nothing and `mise run regen` is
# a no-op here. Keep it that way: a new block belongs to `edfund-connect`, and
# writing `yidam` in its marker hands it to a generator that does not know what
# this repository means by the word. The marker is the ownership record — it
# lives in the documents, so a re-vendor cannot reach it.

[tasks.ci]
description = "Everything CI runs: the crate gate, the web gate, the generated-file check, the corpus lint."
# `//:graph-lint` runs last, and that is the only reason it is not first. It is by
# far the cheapest of the four, so ordering it here costs a developer who breaks it
# the whole gate — but it is also the one whose failure is a *finding* rather than a
# broken build, and putting a finding ahead of `cargo test` would bury the build.
#
# It joined this list with the CI job of the same name (#437), and the two have to
# move together: it was outside CI for long enough that `main` went red and stayed
# red across a merge, which is the whole argument for gating on it.
run = [
  "mise run //crates:gate",
  "mise run //web:gate",
  "mise run //:generated",
  "mise run //:graph-lint",
]

[tasks.generated]
description = "Fail if the committed feed, the figure manifest, the series manifest, the site icon, or any REGEN block is stale."
# Every one of these artifacts is committed and every one is easy to forget. If
# any drifts the repository is describing itself wrongly and nothing else would
# notice — which is exactly what happened to the connector table and the corpus
# node count.
#
# `crates/figures.json` is the corpus-to-crate cross-check's crate half (#131):
# the figures a corpus node quotes, computed from the crates that own them. Stale
# here means `//web:test-unit` is comparing this month's prose against last
# month's calculators and calling it agreement. `crates/series.json` is the same
# thing for the columns the wiki draws (#441): stale here means a chart on a node
# page is drawing last month's bars under this month's figures.
run = '''
set -e
stale() {
  echo "error: $1 is stale." >&2
  echo "  regenerate: $2" >&2
  diff "$3" "$1" | head -40 >&2
  exit 1
}
cargo run --quiet --manifest-path crates/Cargo.toml -p bundle > /tmp/edfund-bundle.json
if ! diff -q /tmp/edfund-bundle.json web/public/data/bundle.json > /dev/null; then
  stale web/public/data/bundle.json \
    "cargo run --manifest-path crates/Cargo.toml -p bundle > web/public/data/bundle.json" \
    /tmp/edfund-bundle.json
fi
cargo run --quiet --manifest-path crates/Cargo.toml -p figures > /tmp/edfund-figures.json
if ! diff -q /tmp/edfund-figures.json crates/figures.json > /dev/null; then
  stale crates/figures.json \
    "cargo run --manifest-path crates/Cargo.toml -p figures > crates/figures.json" \
    /tmp/edfund-figures.json
fi
cargo run --quiet --manifest-path crates/Cargo.toml -p figures series > /tmp/edfund-series.json
if ! diff -q /tmp/edfund-series.json crates/series.json > /dev/null; then
  stale crates/series.json \
    "cargo run --manifest-path crates/Cargo.toml -p figures series > crates/series.json" \
    /tmp/edfund-series.json
fi
cargo run --quiet --manifest-path crates/Cargo.toml -p connect --bin edfund-connect -- index --check
# The site icon, and the four other files that share its geometry. `web/public/favicon.svg` is the
# single source for the icon at every size — `src/lib/og/mark.ts` reads it and the two PNG routes
# rasterize it — and it is emitted by `design/logo/outline.ts` from the coordinates the outline is
# derived from. Without this check the only thing stopping someone editing the SVG directly is a
# comment at the top of it, and the drift would show up as the tab icon and the home screen icon
# disagreeing, which is invisible to whoever caused it.
node design/logo/outline.ts --check
echo "the feed, both manifests, the site icon and every REGEN block are current"
'''

[tasks.deploy]
description = "Manually publish web/dist to Cloudflare Pages. Production deploys itself on merge to main."
# Production is deployed by the `deploy` job in `.github/workflows/ci.yml`, on
# every push to `main` that clears all three gates, from the exact `dist/` the
# browser suite ran against. This task is the escape hatch — a Cloudflare outage
# mid-merge, or a deploy needed while the remote is unreachable — and running it
# should be a decision rather than a habit.
#
# Note what it does from a branch. `--branch main` sends the *checked-out tree*
# to production, reviewed or not, and it can land after the automated deploy of a
# commit that came later, so the live site goes backwards with nothing in the
# repository to say why. Check out `main` first.
#
# `--dir` steers which package pnpm runs, not where dlx resolves paths, so the
# directory argument is `web/dist` and not `dist`. And on direct upload wrangler
# labels the deployment with whatever branch is checked out: deploy from a
# `phase/*` branch without `--branch main` and the upload succeeds, wrangler
# prints a URL, and the live site does not change.
#
# The wrangler version is pinned, and pinned to the same 4.125.0 the workflow
# uses. `@latest` on a path that holds a production credential fetches whatever
# was published this morning; and if the escape hatch ran a different wrangler
# than the automated deploy, the two would eventually disagree about what a
# direct upload means, which is exactly the argument you do not want to be
# having during the outage that made you reach for this task.
depends = ["//web:build"]
run = "pnpm dlx wrangler@4.125.0 pages deploy web/dist --project-name ohio-education-funding --branch main"
