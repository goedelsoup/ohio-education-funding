# mise — host toolchains and the task runner. https://mise.jdx.dev
#
# `mise install` provisions the toolchains. `mise run //:ci` runs everything
# `.github/workflows/ci.yml` runs; `mise tasks --all` lists every task.
#
# # Why this exists
#
# It was written when there was no git remote, so `.github/workflows/ci.yml` had
# never executed once and this file was the only thing running the gates. There
# is a remote now and that workflow runs on every push, so the two are peers:
# this is what you run before pushing, and it runs the same nine gates in the
# same order, so that a green local gate means something about the remote one.
#
# Worth remembering why it was needed at all. `cargo doc -D warnings` was red for
# at least two phases and nothing said so, because a workflow with nowhere to
# push is a workflow that does not run.

# Monorepo task mode. Each directory in `config_roots` holding a `mise.toml` is a
# subproject addressable from here as `//<path>:<task>` — `mise run //crates:test`.
# Subproject tasks run with their own directory as cwd, which is what lets them
# call bare `cargo` and `pnpm` with no `--manifest-path` or `--dir`.
monorepo_root = true

[settings]
experimental = true

# Where the Rust toolchain lives, stated because leaving it unstated is not the
# no-op it looks like.
#
# mise's rust backend exports `CARGO_HOME` and `RUSTUP_HOME` for every task it
# runs. With `rust.cargo_home` and `rust.rustup_home` unset it renders them as
# the literal string `undefined` resolved against this file's directory — so
# every task ran with
#
#   CARGO_HOME=<repo>/undefined
#   RUSTUP_HOME=<repo>/undefined
#
# There is no toolchain there, so `mise exec -- cargo` fails with "couldn't exec
# process" and the gate looks like a missing-cargo problem. Put the host's cargo
# on `PATH` to work around that and it gets worse quietly: rustup reads those
# same two variables, decides it has an empty installation, and provisions a
# fresh 1.4 GB toolchain into `<repo>/undefined/` — an untracked, ungitignored
# directory inside the working tree, one `git add -A` away from being committed.
#
# Pointing both at the host's real homes is what makes `mise run //:ci` work
# with no `PATH` preamble, and is why `undefined/` cannot come back.
[env]
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
# And the rustup shims, which mise does not add itself: its `rust` install for
# 1.97.0 *is* a symlink to `~/.cargo/bin`, so the `<install>/bin` it would put on
# PATH resolves to `~/.cargo/bin/bin` and does not exist. `RUSTUP_TOOLCHAIN` is
# still exported from the `[tools]` pin below, so the shim found here selects
# 1.97.0 and the pin keeps meaning what it says.
_.path = ["{{env.HOME}}/.cargo/bin"]

[monorepo]
config_roots = ["crates", "web"]

[tools]
# Pinned rather than "latest" so the gate is reproducible, and pinned to *this*
# version because `.github/workflows/ci.yml` has nothing to select a toolchain
# with: there is no `rust-toolchain.toml`, so its `rustup show` step is a no-op
# that leaves the runner's current stable active. This pin is therefore a mirror
# of the runner rather than a floor. When GitHub's image moves to a newer stable,
# clippy gains lints and CI can go red with no commit behind it — and this line is
# what has to move for a local run to reproduce the failure. That is exactly how
# it went red at 1.97 while the local gate sat green on 1.82.
#
# The workspace's real floor is lower — `Option::is_none_or` (1.82) in `connect`
# and `spreadsheet`, `u16::is_multiple_of` (1.87) in `edfund-core` — but nothing
# enforces it, so treat this as the only version any check has been verified
# against.
#
# mise installs Rust through rustup with its own profile and does not read a
# `rust-toolchain.toml` component list, so rustfmt and clippy are requested here
# or a clean install omits them and the lint task fails with "no such command".
rust = { version = "1.97.0", components = "rustfmt,clippy" }
# Both named in `.github/workflows/ci.yml`; kept identical so a green local gate
# means something about the remote one.
node = "24"
pnpm = "11"

# --- Root tasks (`//:<task>`) ------------------------------------------------
#
# NB: a root task must not share a name with a subproject task fanned out via
# `//...:<task>`, because `//...` matches the root too and the task would recurse.

[tasks.ci]
description = "Everything CI runs: the crate gate, the web gate, and the generated-file check."
run = [
  "mise run //crates:gate",
  "mise run //web:gate",
  "mise run //:generated",
]

[tasks.generated]
description = "Fail if the committed feed or any REGEN block is stale."
# Both artifacts are committed and both are easy to forget. If either drifts the
# repository is describing itself wrongly and nothing else would notice — which
# is exactly what happened to the connector table and the corpus node count.
run = '''
set -e
cargo run --quiet --manifest-path crates/Cargo.toml -p bundle > /tmp/edfund-bundle.json
if ! diff -q /tmp/edfund-bundle.json web/public/data/bundle.json > /dev/null; then
  echo "error: web/public/data/bundle.json is stale." >&2
  echo "  regenerate: cargo run --manifest-path crates/Cargo.toml -p bundle > web/public/data/bundle.json" >&2
  diff /tmp/edfund-bundle.json web/public/data/bundle.json | head -40 >&2
  exit 1
fi
cargo run --quiet --manifest-path crates/Cargo.toml -p connect --bin edfund-connect -- index --check
echo "the feed and every REGEN block are current"
'''

[tasks.deploy]
description = "Manually publish web/dist to Cloudflare Pages. Production deploys itself on merge to main."
# Production is deployed by the `deploy` job in `.github/workflows/ci.yml`, on
# every push to `main` that clears all three gates, from the exact `dist/` the
# browser suite ran against. This task is the escape hatch — a Cloudflare outage
# mid-merge, or a deploy needed while the remote is unreachable — and running it
# should be a decision rather than a habit.
#
# Note what it does from a branch. `--branch main` sends the *checked-out tree*
# to production, reviewed or not, and it can land after the automated deploy of a
# commit that came later, so the live site goes backwards with nothing in the
# repository to say why. Check out `main` first.
#
# `--dir` steers which package pnpm runs, not where dlx resolves paths, so the
# directory argument is `web/dist` and not `dist`. And on direct upload wrangler
# labels the deployment with whatever branch is checked out: deploy from a
# `phase/*` branch without `--branch main` and the upload succeeds, wrangler
# prints a URL, and the live site does not change.
depends = ["//web:build"]
run = "pnpm dlx wrangler@latest pages deploy web/dist --project-name ohio-education-funding --branch main"
