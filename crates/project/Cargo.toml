[package]
name = "project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Forward projection of funding inputs, and policy simulation over them"

[dependencies]
deflator = { path = "../deflator" }
# The report card and the District Profile Report are `dispersion`'s fixtures, so their readers
# are too. This crate used to carry a second copy of each; see issue #157. Was a dev-dependency.
dispersion = { path = "../dispersion" }
edfund-core = { path = "../edfund-core" }
foundation = { path = "../foundation" }
# For `capacity_denominator`, which runs R.C. 3317.017(B) over three different denominators and
# needs the minimum-state-share floor applied the way the calculator applies it. `local-capacity`
# was deliberately kept out of this crate when all it would have supplied was one `f64` — see the
# note on `MINIMUM_STATE_SHARE_FY2022` — and that reasoning ends where this crate starts calling
# it. No crate enters the graph: `dispersion` already depends on it.
local-capacity = { path = "../local-capacity" }
# For `margin`, which needs the twenty-mill floor and the predicate that says what being on it
# means — `FloorStatus::valuation_growth_reaches_revenue` is the whole of why the valuation charge
# is a pure loss for one half of the state and a recapture for the other. A leaf crate on
# `edfund-core` alone, so nothing enters the graph but the semantics.
millage = { path = "../millage" }

[[bin]]
name = "edfund-project"
path = "src/main.rs"

[lints]
workspace = true
