[package]
name = "project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Forward projection of funding inputs, and policy simulation over them"

[dependencies]
deflator = { path = "../deflator" }
# The report card and the District Profile Report are `dispersion`'s fixtures, so their readers
# are too. This crate used to carry a second copy of each; see issue #157. Was a dev-dependency.
dispersion = { path = "../dispersion" }
edfund-core = { path = "../edfund-core" }
foundation = { path = "../foundation" }

[[bin]]
name = "edfund-project"
path = "src/main.rs"

[lints]
workspace = true
