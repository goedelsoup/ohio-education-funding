[package]
name = "dispersion"
description = "School finance equity statistics: dispersion and wealth neutrality across agencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
edfund-core = { path = "../edfund-core" }
# For `ohio_panel::trough`, which is a real-terms result and so cannot be computed without a
# deflator. It was a dev-dependency while the deflation lived in `tests/f33_ohio_panel_trough.rs`,
# under a comment saying nothing this crate computes is in constant dollars. That stopped being
# true when the trough moved into the library so `crates/figures` could pin what the corpus
# publishes about it — the test asserted bands where the corpus states values.
deflator = { path = "../deflator" }

[dev-dependencies]
# For `tests/report_card_2425.rs`, which splits the report card on the FY2027 guarantee. The
# model is `foundation`'s fixture, so its reader is `foundation`'s; this test was carrying a
# third parser of it. `foundation` dev-depends on this crate in turn, which Cargo allows
# because neither dependency is a build one.
foundation = { path = "../foundation" }
# For `tests/what_fell_out_of_the_state_column.rs`, which checks the FY2016 finding against the
# words LSC used for capacity aid. The greenbooks are `project`'s fixture and its reader is
# `project`'s; the alternative was a fourth copy of the flattening. `project` depends on this
# crate in turn, which Cargo allows because neither dependency is a build one.
project = { path = "../project" }

[lints]
workspace = true
