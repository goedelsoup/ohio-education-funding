properties:
  name: Lottery Profits Education Fund (Fund 7017)
  level: state
  legal_basis: |
    Ohio Constitution, Article XV, Section 6(A) — the lottery authorized by amendment in 1973 and
    its net proceeds earmarked for education by a further amendment in 1987. R.C. 3770.06 creates
    the state lottery funds, including the lottery profits education fund. [verified]
  restriction: |
    Constitutionally restricted to "the support of elementary, secondary, vocational, and special
    education programs" — but "as determined in appropriations made by the General Assembly",
    which is the clause that makes the restriction one of purpose rather than of level. [verified]
  growth_behavior: |
    Tracks lottery and video lottery terminal profits, neither appropriated nor formula-driven.
    Its *share* of school funding has been falling over the long run and rose after FY2014 on
    VLTs rather than on the lottery itself. Because the fund is one input to a foundation aid
    total the General Assembly sets, growth in the fund does not mechanically raise what any
    district receives. [inference]
  series_path: |
    Not yet populated as a per-district series, and it cannot be: the fund is appropriated into
    foundation aid rather than distributed on its own formula, so there is no per-district lottery
    figure to hold. Statewide totals are in
    [`dew-greenbook.txt`](../../../crates/project/fixtures/dew-greenbook.txt), the analysis **as
    enacted**, whose columns are headed `Appropriation`. The redbook beside it carries the same
    five lines under columns headed `Introduced`, and its amounts are the executive proposal.
    [verified]
revisions:
  - was: |
      Fund 7017 was published at **$1,338,945,000** of an **$11.15 billion** FY2026 foundation
      aid total, marked `[verified]`.
    now: |
      Those are the **executive proposal**. As enacted the line is **$1,436,583,202** of
      **$11,230,057,557**, and FY2027 is $1,398,174,884 of $11,525,218,197.
    found_by: |
      LSC's greenbook, `crates/project/fixtures/dew-greenbook.txt`, whose columns are headed
      `Appropriation` where the redbook the figures came from heads its own `Introduced`.
    reach: |
      The correction sharpens the node's point rather than softening it: between the proposal
      and the act the lottery line rose $97,638,202 while the other four fell $15,575,916, which
      is the substitution argument inside a single table. It also marks a verification failure of
      a particular kind — a redbook figure is a proposal, and marking one `[verified]` reads as
      though the act had been checked. The same correction reached
      [`casino-tax-distribution`](casino-tax-distribution.yml), which cites these figures for
      comparison, before it reached the node they are about.
