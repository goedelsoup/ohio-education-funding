revisions:
  - was: |
      "Three times the General Assembly wrote a protection against these losses into a budget act
      and the Governor struck it out. Not once did one survive."
    now: |
      Two survived. H.B. 1's full reimbursement stood through FY2013, until H.B. 153 accelerated
      the phase-out over it, and H.B. 166 enacted for FY2020 and FY2021 the nuclear-plant
      exemption H.B. 64's veto had removed, which H.B. 110 extended through FY2026.
    found_by: |
      Reading the H.B. 166 and H.B. 110 greenbooks for the schedule (#784). The H.B. 1 half was in
      the sentence that followed the claim.
    reach: |
      The heading and the closing inference of the section. hb-1-2009's "passed and lost" and
      hb-49-2017's count of vetoes cited this node and are corrected with it.
  - was: |
      "FY2016's supplement stood and FY2017's did not."
    now: |
      FY2017's appropriation did not stand and the payment was made: $44,208,587 in FY2017 and
      $9,467,328 in FY2018 against an enacted $0, under a $44,000,000 adjusted appropriation whose
      authority is open.
    found_by: |
      Reading line 200697's actuals in the H.B. 49 and H.B. 166 workbooks while building the
      year-by-year series (#784).
    reach: |
      hb-64-2015's account of the veto, which said the same; nothing bound the claim, because a
      vetoed amount has no figure to bind and the payment had not been looked for.
