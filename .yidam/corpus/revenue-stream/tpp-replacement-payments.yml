class: revenue-stream
label: Tangible Personal Property Tax Replacement Payments
summary: >-
  State payments created by H.B. 66 to hold districts harmless for the phase-out of the
  tangible personal property tax, and later for the utility assessment phase-down. Funded from
  the commercial activity tax the same act created.
description: |
  State payments created by [H.B. 66](../legislation/hb-66-2005.yml) to hold districts harmless
  for the phase-out of the tangible personal property tax on general business, and later
  extended to the phase-down of utility tangible personal property assessment. [verified]
  Funded from the commercial activity tax the same act created. [verified]

  A district's tax base was reduced by a state decision and replaced with a state payment. The
  immediate effect was neutral by construction.
  The structural effect was not. What had been a locally-levied tax — subject to the district's
  own voted millage, growing or shrinking with local industrial activity, and beyond the reach
  of the state budget — became an appropriation whose continuation depends on each biennium.
  [inference] The replacement payments were designed to phase down, and the schedule has been
  revised more than once. [verified]

  The exposure is concentrated. Districts with large industrial or utility tangible personal
  property bases lost far more of their tax base than districts without, and are correspondingly
  more exposed to each revision of the phase-down. [inference] Which districts those are, and
  what the payments are worth to them now, is not established here. [open]
findings: |
  ### The phase-down has been contested twice, and both times the protection was vetoed

  "The schedule has been revised more than once" is true and understates what happened. Twice in
  three budgets the General Assembly wrote a protection against these losses into an act and the
  Governor struck it out. [verified — the greenbooks, committed at
  [`lsc-education-greenbooks.txt`](../../../crates/project/fixtures/lsc-education-greenbooks.txt)]

  - **[H.B. 64](../legislation/hb-64-2015.yml)** appropriated **$78.3 million** for a second year
    of the TPP supplement in FY2017, with the supporting formula calculations and a $12 million
    annual GRF cash transfer into the School District TPP Supplement Fund. All of it vetoed;
    FY2016's supplement stood and FY2017's did not. The same act's veto also removed an exemption
    from the phase-out for districts containing a nuclear power plant where replacement payments
    were 10% or more of total resources — which would have reached Perry Local in Lake County and
    Benton-Carroll-Salem in Ottawa County, and no one else.
  - **[H.B. 49](../legislation/hb-49-2017.yml)** capped a district's fixed-rate TPP reimbursement
    loss, including loss of the supplement, at **3.5% of total resources** in FY2018, extended the
    cap to JVSDs, and slowed the phase-down to one-fourth of one mill of average valuation from
    FY2020. Vetoed entire.

  ### Why none of this is visible in any series here

  A vetoed appropriation is never appropriated, so it appears in no enacted total, no actual, and
  no line item — the whole apparatus of this repository reads documents that record what happened.
  The $78.3 million that did not reach districts in FY2017 is not a hole in the data; it is a
  quantity that has no place in the data at all. **The only committed source in which it exists is
  LSC's analysis of the act that contained it.** [verified]

  That is the argument for reading acts rather than only the money they moved, and this stream is
  where it pays best: the phase-down is the thing being fought over, and the record of the fight is
  entirely in provisions that never took effect. [inference]
properties:
  name: Tangible personal property tax replacement payments
  level: state
  legal_basis: |
    Created by Am. Sub. H.B. 66 (2005); provisions codified in R.C. 5751 (commercial activity
    tax) and the school funding chapter, with phase-down schedules revised in subsequent
    budget acts. Exact citations not established. [open]
  restriction: Unrestricted; paid into the district general fund as the lost tax revenue was.
  growth_behavior: |
    Declining by design. Scheduled to phase down after an initial hold-harmless period, with
    the schedule repeatedly revised by later budget acts. Does not grow with the underlying
    business activity it replaced, so a district that adds industrial capacity gains no
    replacement revenue from it.
  series_path: |
    Not yet populated, and it is the one stream here whose series genuinely does not exist in what
    is held. [unentered] The replacement payments are a line inside state aid rather than a
    reported category, so they are not separable from the state column of
    crates/dispersion/fixtures/f33-ohio-panel.csv nor identified in the FY2027 model. The
    phase-down schedule is an appropriation history, which makes this an `lsc-budget` target.
