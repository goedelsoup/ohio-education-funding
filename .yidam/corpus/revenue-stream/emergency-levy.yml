properties:
  name: Emergency levy
  level: local
  legal_basis: |
    R.C. 5705.194 as amended by H.B. 129 (136th General Assembly), effective March 20, 2026; the
    election at R.C. 5705.195 and the ballot at 5705.197, both re-enacted by the same act; the
    H.B. 96 prohibition on new levies for elections from January 1, 2026.
  restriction: |
    Current expenses of the district. A renewal under division (C) is for current expenses
    "notwithstanding the original purpose of the existing tax". [verified]
  growth_behavior: |
    Flat in nominal dollars by design: voted as a sum, exempt from reduction, and renewable only
    at the same or a lesser sum. Its rate falls as values rise. [verified]
  series_path: |
    No per-levy series. crates/dispersion/fixtures/sd1-district-taxes.csv aggregates fixed-sum
    levies into each district's class rates, TY2021 through TY2024. [verified]
