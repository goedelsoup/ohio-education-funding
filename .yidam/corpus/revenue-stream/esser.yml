class: revenue-stream
label: ESSER — Elementary and Secondary School Emergency Relief
summary: >-
  A federal channel that was large, restricted, temporary, and is now gone — three acts between
  2020 and 2021, distributed in proportion to Title I. It inflates every FY2020 through FY2024
  figure here in a way that is invisible unless named.
description: |
  A federal channel that was large, restricted, temporary, and is now gone — and which inflates
  every FY2020 through FY2024 figure in Ohio's district finance series in a way that is
  invisible unless it is named.

  **Three acts, one fund.** ESSER I under the CARES Act (March 2020), ESSER II under CRRSA
  (December 2020), and ESSER III under the American Rescue Plan (March 2021), each larger than
  the last. Distributed to districts **in proportion to their Title I Part A shares**, which
  means it arrived on a poverty formula and was therefore concentrated in exactly the districts
  Ohio's own system leaves most dependent on a weak local base. [verified]

  **It expired.** The last obligation deadline fell in September 2024. A district that used
  ESSER for recurring costs — staff, programmes, interventions — faced the loss of that money
  with no state channel replacing it. This is the fiscal cliff that runs underneath every
  FY2025 and FY2026 forecast in
  [`district-finances.csv`](../../../crates/project/fixtures/district-finances.csv). [verified]
findings: |
  ### The size of it, and why every cross-year comparison touches it

  FY2022 is the peak. In that year Ohio districts took **13.87% of school revenue from federal
  sources against a national 13.24%** — $2,466 per pupil against $2,493 — which places Ohio
  25th of 51 and, unusually for this corpus, entirely unremarkable. [verified —
  `crates/dispersion/src/census_states.rs`]

  All four of those figures are the **state-level** F-33 table, and the citation used to name
  `national_peers.rs`, which is the district panel and computes none of them. The two sources are
  close and not equal — the district panel gives Ohio a 51.7% local share against this table's
  51.8%, and `litigation/derolph-i-1997` publishes the 51.8% — so the wrong one was cited for
  figures that reproduce only from the right one. The table had no public reader when the citation
  was written; it does now.

  The unremarkable federal share is what makes the rest of Ohio's position remarkable. Ohio is
  seventh of fifty-one on local share and forty-fifth on state share; it is ordinary on federal
  share and ordinary on spending per pupil. The distinctive thing is the split between the two
  domestic levels, and the federal channel is a constant that does not explain it. [inference]

  **Federal money is compensatory in Ohio, monotonically, and it is small.** Quartiling the 611
  comparable districts by local revenue per pupil in FY2022: [verified —
  `dispersion::national_peers::ohio_by_local_wealth`, pinned by test]

      quartile   local/pupil   state/pupil   federal/pupil
      Q1 poorest      $4,342        $8,970          $2,738
      Q2              $6,678        $7,199          $2,231
      Q3              $8,541        $6,232          $2,181
      Q4 richest     $13,932        $4,522          $1,825

  The local gap between the top and bottom quartile is **$9,590 per pupil**. State equalization
  closes **$4,448 of it, 46%**. The federal channel closes **$913, or 9.5%**. Together they
  leave **$4,229 per pupil** of the local gap standing. [verified]

  **And FY2022 is the most favourable year that will ever be measured for this**, because the
  federal column is at its ESSER peak. The offset shown here is an upper bound on a channel
  that has since contracted to its pre-pandemic level. Whatever the answer to "does the system
  equalize", it is worse than these figures after September 2024. [inference]

  What this does not establish: how the cliff actually landed. Whether districts spent ESSER on
  recurring or one-time costs, and which ones are now cutting, needs the FY2025 and FY2026
  five-year forecasts read against the ESSER allocations — both of which exist, and neither of
  which is joined here. [open]
properties:
  name: Elementary and Secondary School Emergency Relief Fund
  level: federal
  legal_basis: |
    CARES Act (Pub. L. 116-136) Section 18003; CRRSA Act (Pub. L. 116-260) Section 313; American
    Rescue Plan Act (Pub. L. 117-2) Section 2001. Distributed to states, sub-allocated to districts
    in proportion to Title I Part A shares. [verified]
  restriction: |
    Restricted to costs of responding to COVID-19, defined broadly enough to cover staffing,
    facilities, technology and learning recovery. ARP ESSER additionally required 20% to be spent
    on addressing lost instructional time. [verified] Time-limited rather than purpose-limited in
    practice, which is what made it dangerous to build recurring costs on. [inference]
  growth_behavior: |
    Not a growing stream but a bounded one, in three tranches, with obligation deadlines running to
    September 2024. Zero thereafter. Any series carrying this channel must mark the boundary rather
    than reporting a decline. [verified]
  series_path: |
    No ESSER-specific series exists and none is extractable from what is held: the federal
    channel is reported as one figure. What can be seen is its shape —
    crates/dispersion/fixtures/f33-ohio-panel.csv carries federal revenue per district for
    FY2012-FY2022, in which the ESSER rise from 6.60% of Ohio school revenue in FY2020 to 14.02%
    in FY2022 is legible as an aggregate. [verified] Separating ESSER from Title I and IDEA
    inside that figure needs the allocation files, which no connector retrieves.
unfilled:
  - field: an ESSER-specific series
    why: The federal channel is reported as one figure; separating it needs the allocation files, which no connector retrieves.
