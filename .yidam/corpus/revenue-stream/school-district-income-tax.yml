revisions:
  - was: |
      Issue #787 suggested that some low-wealth rural districts rely on the income tax because
      their property base is small.
    now: |
      The tax is rural and small-town, but it is not concentrated among the districts with the
      least property. The lowest-valuation quarter levies it less often than the second, and
      among rural and small-town districts the levying and non-levying medians are within 2%.
    found_by: |
      Joining SD-2-Q4 for FY2025 to TY2024 valuation per pupil from Table SD-1 and to the 2013
      typology.
    reach: |
      A small property base does not explain why a district turns to the income tax. Whether the
      levying districts depend on it more than on property is still open.
  - was: |
      Issue #787 framed local capacity as measuring residents' income rather than the district's
      property.
    now: |
      Capacity blends both. Valuation per pupil is one term, and residents' federal adjusted
      gross income makes up the other two. The district's own income tax is in none of them.
    found_by: |
      Reading R.C. 3317.017(A)(5) in the statute fixture.
    reach: |
      The income tax sits outside the capacity measure. It enters Chapter 3317 only through the
      qualification requirement, by R.C. 3317.021(C).
properties:
  name: School district income tax
  level: local
  legal_basis: |
    R.C. Chapter 5748: 5748.01 (definitions and the two bases), 5748.02 (resolution, the Tax
    Commissioner's estimate and the election), 5748.021 (replacing a traditional tax with an
    earned-income tax), 5748.03 (ballot form), 5748.08 (with a bond issue) and 5748.09 (with a
    property levy, closed to new resolutions by H.B. 96). R.C. 3317.021(C) converts it into
    mills for the qualification requirement. [verified]
  restriction: |
    Set by the resolution. A tax may be for current expenses, for permanent improvements, or for
    both with the rate apportioned between them, and the apportionment binds each year's levy.
    [verified] (R.C. 5748.02(B)(1))
  growth_behavior: |
    Grows with residents' income, because the rate applies to a base that rises with wages, and
    on the traditional base with retirement and investment income as well. There is no reduction
    factor. This is the opposite of a voted property levy, whose yield H.B. 920 holds roughly
    flat. [inference] The rate changes only by a new election.
  series_path: |
    crates/dispersion/fixtures/school-district-income-tax.csv — one row per district per fiscal
    year, FY2024 and FY2025, from Table SD-2-Q4, read through `dispersion::income_tax`. Each row
    carries its rate, base and status. [verified] The districts' own figure is line 1.030 of
    the five-year forecast, in crates/project/fixtures/district-finances.csv.
