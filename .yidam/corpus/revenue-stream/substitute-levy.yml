    why: |
      Table SD-1 aggregates fixed-sum levies into each district's class rates, so no committed
      fixture names which districts carry a substitute levy or what its growth adds each year.
properties:
  name: Substitute levy
  level: local
  legal_basis: |
    R.C. 5705.199 as amended by H.B. 96, effective January 1, 2026, which confines new levies to
    resolutions before that date; renewal at R.C. 5705.194(D).
  restriction: |
    "The necessary requirements of the school district", the purpose of the levies it replaced;
    a renewal under R.C. 5705.194(D) is for current expenses. [verified]
  growth_behavior: |
    Grows each year by its prior-year rate on new construction, by its own formula and not by
    reduction. A renewal under R.C. 5705.194(D) freezes the sum. [verified]
  series_path: |
    No per-levy series. crates/dispersion/fixtures/sd1-district-taxes.csv aggregates fixed-sum
    levies into each district's class rates, TY2021 through TY2024. [verified]
