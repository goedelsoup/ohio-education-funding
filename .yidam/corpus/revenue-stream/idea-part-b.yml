class: revenue-stream
label: IDEA Part B
summary: >-
  Federal special education money on a federal formula, routinely conflated with Ohio's six
  special education weights. The two count different children and are computed differently: a
  block allocation against a multiplier on a state-defined category.
description: |
  Federal special education money, on a federal formula, routinely conflated with Ohio's six
  special education weights — and the conflation matters because the two count different children
  and are computed different ways. [verified]

  **Ohio's weights are a multiplier on a state-defined category; IDEA Part B is a block
  allocation.** [Special education weights](../formula-component/fsfp-special-education-weights.yml)
  attach a multiple to a pupil in one of six clinical categories and run through the state share.
  IDEA Part B allocates to a district on a base amount plus population and poverty factors — not
  on its count of children with disabilities at all, beyond a frozen base from 1999. A district
  that identifies more students receives no more Part B money for them. [verified]

  So federal special education funding
  does **not** respond to a district's special education population, and any analysis that reads
  the two channels as a combined per-disabled-pupil figure is combining a rate with a lump sum.

  **The proportionate share is a real deduction.** Part B requires a district to spend a
  proportionate share of its allocation on children with disabilities enrolled by their parents in
  non-public schools within its boundaries — money the district administers and does not control.
  Each allocation file carries it as its own column beside the district's own count, and four
  years of it are now a held series. [verified]
  ([`ode-idea-part-b-allocations`](../../catalog/ode-idea-part-b-allocations.md))

  **The receiving-entity list is not the district list.** The FY2021 file lists 997 entities:
  traditional districts, community schools, and county boards of developmental disabilities.
  **Joint vocational school districts do not appear at all**, because federal special education
  money reaches career-technical students through their member districts — so a statewide roll-up
  built from this file silently omits career-technical provision, and the omission is undetectable
  from the file itself. That is how
  [Eastland-Fairfield](../education-agency/eastland-fairfield-ctc.yml) was confirmed as
  structurally different rather than merely missing. [verified]

  **Congress has never funded it at the promised level.** The 1975 Act contemplated a federal
  contribution of up to 40% of the excess cost of educating a child with a disability; the actual
  figure has run far below that for the whole life of the statute, which is why the shortfall is a
  standing item in every state's budget politics. The Ohio-specific number is not established
  here. [open]
findings: |
  ### The proportionate share, as the department's files add up

  The four final editions put the statewide proportionate share at **$15,174,643.47** in FY2021,
  **$15,560,688.50** in FY2022, **$16,267,189.29** in FY2023 and **$16,433,446.71** in FY2024. No
  edition prints a total row, so each figure is this repository's sum of every agency's cell.
  [verified]
  ([`crates/project`](../../../crates/project/tests/the_federal_money_beside_category_three.rs))

  In FY2024 the share was **3.65%** of the school-age allocation. It was owed by **232** agencies,
  and the same editions count **10,245** non-public school students with disabilities. Every other
  agency on the list owes nothing. Across the four years the share stays between 3.6% and 3.9% of
  the allocation, and the number of agencies owing it between 225 and 232. [verified]
  ([`crates/project`](../../../crates/project/tests/the_federal_money_beside_category_three.rs))

  FY2021's count is a floor. Fifty-seven of its nonpublic count cells are printed `<10`, and
  Brookville Local's share is printed blank rather than zero. FY2022 to FY2024 suppress no
  nonpublic count. [verified]
  ([`crates/project`](../../../crates/project/tests/the_federal_money_beside_category_three.rs))

  ### Beside Category 3, never inside it

  The share is the second federal channel that reaches chartered nonpublic pupils, after
  [Emergency Assistance to Non-Public Schools](../program/emergency-assistance-to-nonpublic-schools.yml).
  It is smaller than either that program or any year of Category 3, and it is not paid to the
  schools at all. The district keeps the money and buys services it controls for the pupils.
  Adding it to [auxiliary services](../program/auxiliary-services.yml) would turn a federal
  set-aside inside a public district's grant into a state payment to private schools. [inference]

  The FY2022 American Rescue Plan supplement carries a proportionate share of its own. It is a
  separate grant and is not included above. [verified]
  ([`ode-idea-part-b-allocations`](../../catalog/ode-idea-part-b-allocations.md))
revisions:
  - was: |
      The description said the FY2021 allocation file "lists 979 entities".
    now: |
      It lists 997. The count was made by hand before the file was parsed. The connector now reads
      every IRN line, refuses a duplicate, and the test pins 997 rows for FY2021.
    found_by: |
      Building `dew-idea-part-b` for
      [#762](https://github.com/goedelsoup/ohio-education-funding/issues/762).
    reach: |
      One count. The claim it supports, that the list is not the district list, is unchanged, and
      the catalog entry carried the same figure and is corrected with it.
properties:
  name: Individuals with Disabilities Education Act, Part B — Grants to States
  level: federal
  legal_basis: |
    Individuals with Disabilities Education Act, Part B, Section 611; 20 U.S.C. 1411. Allocated to
    states, sub-allocated by the state education agency to local educational agencies. [verified]
  restriction: |
    Restricted to excess costs of special education and related services, with maintenance-of-effort
    and supplement-not-supplant conditions: a district may not reduce its own special education
    spending because Part B money arrived. Includes a mandatory proportionate share for
    parentally-placed non-public students. [verified]

    **A second gate, from the accountability side.** Ohio's
    [ESSA plan](../../catalog/ohio-essa-state-plan.md), as it stands to be amended in April 2026,
    proposes that persistently identified schools may be subject to "annual approval of
    expenditure of all federal funds by the Department", IDEA named alongside Title I A, and that
    districts with many such schools may have their IDEA expenditure plans approved likewise.
    [verified] (as a statement of what the amendment proposes) Approval by the U.S. Department of
    Education is not established here. [open]

    Worth noting because IDEA money does not respond to disability counts and now may not respond
    freely to the district's own judgment about how to spend it either. The channel is a lump sum
    on a 1999 base, and the discretion over that sum is what a school improvement designation
    would narrow. [inference]
  growth_behavior: |
    Base amount frozen at each district's FY1999 allocation, with growth distributed on general
    population and poverty rather than on disability counts. [verified] The practical effect is
    that the channel drifts away from the distribution of need over time, and a district whose
    identified population has grown since 1999 is funded on a twenty-five-year-old base.
    [inference]
  series_path: |
    `crates/project/fixtures/idea-part-b-allocations.csv`, built by the `dew-idea-part-b` connector
    from the department's final allocation editions for FY2021-FY2024. It has one row per agency
    per year, keyed on IRN, with both student counts, the allocation and the proportionate share.
    `project::ledger::nonpublic_federal::idea_part_b` totals it by year. [verified]

    In the F-33 panel, crates/dispersion/fixtures/f33-ohio-panel.csv, IDEA is still inside the
    undifferentiated federal column and cannot be separated from it.
unfilled:
  - field: the series before FY2021 and the American Rescue Plan supplement
    why: |
      The department serves FY2011-FY2020 as `_Adjusted` editions in a different layout, and the
      FY2022 supplement is a second grant with its own share. Neither is read, so the series is
      four years long and covers the regular grant only.
