class: revenue-stream
label: State Foundation Aid
description: |
  The money the state pays education agencies through the funding formula — whatever formula
  is in force — computed per agency and disbursed across the fiscal year in periodic payments.
  [verified] It is the stream every `funding-regime` node in this corpus is a method for
  distributing.

  Its defining characteristic is the mirror image of the local property tax's. Local revenue
  is voter-controlled and inflation-frozen; foundation aid is inflation-indifferent by design
  but entirely dependent on a biennial appropriation. [inference] A district cannot vote itself
  more foundation aid, and no enactment can guarantee it against the next General Assembly's
  budget. The [phase-in percentage](../parameter/fsfp-phase-in-percentage.yml) is where that
  dependence becomes visible: the formula computes an amount, and the appropriation decides
  what fraction of it arrives.

  Because foundation aid is a residual — computed cost less deemed local share — its
  distribution is more unequal than the underlying cost, and deliberately so. A district with
  low local capacity receives a larger share of its cost from the state. [verified] This means
  that a uniform cut to foundation aid is not uniform in effect: it falls hardest on the
  districts for whom it is the largest revenue share. [inference]

  **The appropriation behind it grew and the department around it did not.** Across FY2014 to
  FY2026 the appropriation line that carries the formula — ALI 200550, Foundation Funding — rose
  45.6% in cash and 3.9% against CPI-U, while the Department of Education's whole enacted
  appropriation rose 29.1% in cash and **fell 7.9%** in constant dollars. [verified — the
  appropriation series, `lsc-appropriation-spreadsheet`] So the Fair School Funding Plan was not
  paid for out of a growing budget; it gained on everything else inside a shrinking one.

  That is a statement about appropriations rather than payments, and the two are different
  claims: an appropriation is a ceiling the General Assembly sets, and at least one line in this
  chapter prorates because it is a residual claimant. What a district actually received is the
  department's own report. [verified]

  **No categorical line absorbed it.** Of the 61 lines appropriated in both FY2014 and FY2026,
  the gains outweigh the losses — roughly $1.08 billion against $0.55 billion in FY2026 dollars.
  The department's real-terms fall is not surviving lines shrinking; it is the department going
  from **112 appropriation lines to 80**. 51 that existed in FY2014 do not exist in FY2026, and
  19 new ones appeared. [verified — the appropriation series]

  Whether that is abolition or consolidation this series cannot say, and the distinction is the
  whole meaning of it. A line ceasing to be listed may have been folded into another, and the two
  largest real gains in the window are the two Foundation Funding lines — which is exactly what
  consolidation into the formula would look like. Settling it needs the acts' own language rather
  than their appropriation tables. [open]

  One thing the composition does say plainly: the largest real-terms falls among surviving lines
  are federal pass-throughs — Title I, IDEA, Improving Teacher Quality, the child nutrition
  programmes. That is a federal story arriving in a state budget document, not a decision of the
  General Assembly's. [verified — the appropriation series]

  **The formula's line changed its number.** It is `200501 Base Cost Funding` through FY2005 and
  `200550 Foundation Funding` from FY2008, retitled `Foundation Funding - All Students` at FY2022.
  The renumbering happened inside FY2006-07 — the one biennium whose greenbook has no line-item
  table — so the series can say the number changed and not in which act. [verified — the
  appropriation series] Anything tracing `200550` backwards stops at FY2008 and should not
  conclude the formula did.
properties:
  name: State foundation aid
  level: state
  legal_basis: |
    R.C. 3317 (school foundation program), with the operative formula provisions amended by
    each biennial appropriation act.
  restriction: |
    Largely unrestricted general operating revenue at the district level, though categorical
    components (special education, transportation, career-technical) carry spending and
    reporting requirements tied to their purpose.
  growth_behavior: |
    Set by formula and appropriation, not by any automatic escalator. Grows when the General
    Assembly raises base cost, advances the phase-in, or updates cost inputs; falls or
    stagnates otherwise. Caps and guarantees can detach an agency's payment from the formula
    result entirely.
  series_path: |
    crates/foundation/fixtures/fy27-department-model.csv for the FY2027 formula run, and
    crates/project/fixtures/district-finances.csv for FY2020-FY2024 as districts reported
    receiving it. [verified] crates/dispersion/fixtures/f33-ohio-panel.csv carries the state
    column FY2012-FY2022 on federal definitions, which is the only decade-length view and is not
    the department's own accounting. crates/project/fixtures/appropriation-lines.csv carries
    what the General Assembly appropriated rather than what was paid — every line item in the
    chapter, enacted, actual and adjusted, **FY1999 through FY2027**, from LSC's greenbooks for
    the earlier bienniums and its workbooks for the later ones. [verified] FY2006-07 and FY2012-13
    carry no enacted figure, each for a reason of the publisher's. [verified]
    `project::appropriations` restates it in constant dollars.
