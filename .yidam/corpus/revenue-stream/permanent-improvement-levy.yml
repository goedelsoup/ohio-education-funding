unfilled:
  - field: permanent improvement millage by district
    why: |
      Table SD-1 aggregates every levy into its class rates, and no committed fixture separates a
      district's permanent improvement millage from its operating millage.
  - field: school levies first voted under R.C. 5705.19
    why: |
      No committed version of R.C. 5705.19 predates H.B. 110's of 2021, so when school districts
      were excluded, and whether any levy they voted under it survives, is unknown.
properties:
  name: Permanent improvement levy
  level: local
  legal_basis: |
    R.C. 5705.21(A), for the purpose of R.C. 5705.19(F) or for general permanent improvements;
    renewal at R.C. 5705.21 and the election at R.C. 5705.25.
  restriction: |
    Restricted to permanent improvements, the single purpose its resolution states. It is not
    available for the current expenses the funding formula computes. [verified]
  growth_behavior: |
    Fixed in dollars on carryover property, as a rate reduced by R.C. 319.301; it grows only with
    new construction. Since 2026 a renewal may only keep or lower its effective rate. [verified]
  series_path: |
    No per-levy series. crates/dispersion/fixtures/sd1-district-taxes.csv aggregates permanent
    improvement millage into each district's class rates, TY2021 through TY2024. [verified]
