class: litigation
label: EdChoice Constitutional Challenge (Franklin County, 2025)
summary: >-
  A challenge to Ohio's EdChoice scholarship programs brought by a coalition of public school
  districts, decided in their favor in Franklin County on 24 June 2025 in a 47-page decision
  holding the program unconstitutional.
description: |
  A challenge to Ohio's EdChoice scholarship programs brought by a coalition of public school
  districts organized as Vouchers Hurt Ohio, filed in Franklin County Common Pleas Court in
  2022 and decided in the districts' favor on 24 June 2025 by Judge Jaiza Page, in a 47-page
  decision holding the program unconstitutional. [verified] Roughly 100 to 200 districts joined
  as plaintiffs; accounts differ and the exact figure is not settled here. [open] The program at
  issue was reported at approximately $700 million annually. [inference]

  **Two grounds, and they are independent.** The court found that using public funds to
  subsidize tuition at private religious schools violates Article VI, Section 2's bar on any
  religious or other sect having exclusive right to or control of any part of the school funds;
  and separately that the expansion of EdChoice undermines the state's duty to maintain a
  thorough and efficient system, particularly while public schools remain underfunded.
  [verified] The second ground is what connects this case to *DeRolph* — it is the first time
  since 2003 that the thorough-and-efficient standard has done work in a decided Ohio case
  about money. [inference]

  The grounds also distinguish this case sharply from *Zelman v. Simmons-Harris*, in which the
  United States Supreme Court upheld the Cleveland voucher program against a federal
  Establishment Clause challenge in 2002. [verified] A federal ruling that vouchers do not
  establish religion says nothing about whether Ohio's own constitution permits them, and the
  sectarian-funds clause is Ohio text with no federal analogue. [inference]

  This is a trial-level decision and the Attorney General moved to appeal, so its precedential
  weight is limited and its outcome unsettled. [verified]

  **The caption and the docket number are now read off an Ohio appellate decision in this very
  case.** *Columbus City School Dist. v. State*, 2024-Ohio-1217, 10th Dist. No. 24AP-60, decided
  29 March 2024, states both on its first page: the parties are *Columbus City School District et
  al. v. State of Ohio et al.* and the trial court case is **Franklin C.P. No. 22CV-000067**.
  [verified]

  That decision is not about EdChoice. The Ohio Senate President, a non-party, was served with a
  deposition subpoena on 22 March 2023; the trial court granted his motion to quash in part and
  modified the subpoena to twenty written questions, and he appealed on legislative privilege. The
  Tenth District dismissed for want of a final appealable order, holding that he had not shown the
  order left him without a meaningful remedy after final judgment. [verified] So the appellate
  record of this case, as of this revision, consists of one dismissed interlocutory appeal about
  who may be deposed. [verified]

  **The merits decision itself is not held and the reason is a term of use, not a wall.** Ohio's
  Reporter of Decisions offers the supreme court, the twelve district courts of appeals and the
  Court of Claims as its sources, and no common pleas court. The Franklin County Clerk of Courts
  publishes the docket under conditions of use stating that the data "is not intended for
  distribution by other persons, entities or organizations" and that an organization wanting files
  must file a public records request. Both read off those publishers' own pages rather than off a
  document this repository holds. [inference] So the ruling is readable by a person and is not
  redistributable from here, which is the same shape as the educational service center minute books
  in [`the-order-was-never-the-states`](../../decisions/the-order-was-never-the-states.yml). See
  [`what-a-citator-reaches`](../../decisions/what-a-citator-reaches.yml).

  Appellate status of the merits ruling: no Ohio appellate decision in this case later than
  2024-Ohio-1217 was found on 14 August 2026, searching an index whose Tenth District coverage
  reached 31 July 2026. That is a bound on one search rather than a fact about the docket, and the
  docket itself has not been read. [inference] The number of districts joined as plaintiffs remains
  unestablished. [open]
properties:
  seeded_because: |
    It is the live test of whether the *DeRolph* standard constrains anything in the current
    system.
  case_name: |
    Columbus City School District et al. v. State of Ohio et al. — the coalition action brought
    by Vouchers Hurt Ohio member districts. [verified] Read from *Columbus City School Dist. v.
    State*, 2024-Ohio-1217, the case's own appellate decision.
  citation: |
    Franklin County Court of Common Pleas No. 22CV-000067; decision of Judge Jaiza Page,
    24 June 2025, 47 pages. [verified] The case number is stated on the first page of
    2024-Ohio-1217 as `C.P.C. No 22CV-000067`; the date, judge and length are from reporting and
    are not read off the ruling, which this repository does not hold. [inference]
  court: Franklin County Court of Common Pleas
  filed: 2022-01-04
  decided: 2025-06-24
  holding: |
    Ohio's EdChoice scholarship program is unconstitutional on two independent grounds: it
    directs school funds to religious and sectarian institutions contrary to Article VI,
    Section 2, and its expansion undermines the state's duty to secure a thorough and efficient
    system of common schools. [verified] Filing date approximate. [open]
  remedy: |
    Not established here. Appeal announced by the Ohio Attorney General; no relief in effect at
    the time of this revision. [verified] Appellate posture must be re-checked before this node
    is cited — a cached judgment in an active appeal is the specific staleness risk the
    `ohio-courts` connector is required to flag.
