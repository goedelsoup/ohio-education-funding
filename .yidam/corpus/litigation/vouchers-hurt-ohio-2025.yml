class: litigation
label: EdChoice Constitutional Challenge (Franklin County, 2025)
description: |
  A challenge to Ohio's EdChoice scholarship programs brought by a coalition of public school
  districts organized as Vouchers Hurt Ohio, filed in Franklin County Common Pleas Court in
  2022 and decided in the districts' favor on 24 June 2025 by Judge Jaiza Page, in a 47-page
  decision holding the program unconstitutional. [verified] Roughly 100 to 200 districts joined
  as plaintiffs; accounts differ and the exact figure is not settled here. [open] The program at
  issue was reported at approximately $700 million annually. [inference]

  **Two grounds, and they are independent.** The court found that using public funds to
  subsidize tuition at private religious schools violates Article VI, Section 2's bar on any
  religious or other sect having exclusive right to or control of any part of the school funds;
  and separately that the expansion of EdChoice undermines the state's duty to maintain a
  thorough and efficient system, particularly while public schools remain underfunded.
  [verified] The second ground is what connects this case to *DeRolph* — it is the first time
  since 2003 that the thorough-and-efficient standard has done work in a decided Ohio case
  about money. [inference]

  The grounds also distinguish this case sharply from *Zelman v. Simmons-Harris*, in which the
  United States Supreme Court upheld the Cleveland voucher program against a federal
  Establishment Clause challenge in 2002. [verified] A federal ruling that vouchers do not
  establish religion says nothing about whether Ohio's own constitution permits them, and the
  sectarian-funds clause is Ohio text with no federal analogue. [inference]

  This is a trial-level decision and the Attorney General moved to appeal, so its precedential
  weight is limited and its outcome unsettled. [verified]

  Docket number, the exact case caption, and appellate status remain unestablished. [open]
properties:
  seeded_because: |
