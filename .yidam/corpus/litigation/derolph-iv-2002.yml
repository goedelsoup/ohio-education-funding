class: litigation
label: DeRolph v. State (DeRolph IV, 2002)
summary: >-
  The last of the four DeRolph decisions, and the one that matters most for where Ohio is now.
  It vacated DeRolph III, reinstated DeRolph I and II as controlling, and released jurisdiction
  without ever finding compliance.
description: |
  The last of the four *DeRolph* decisions, and the one that matters most for understanding
  where Ohio is now.

  **What it did is more specific than "reaffirmed."** On 11 December 2002 the Supreme Court of
  Ohio **vacated *[DeRolph III](derolph-iii-2001.yml)*** — the September 2001 decision that had
  found the plan constitutional *subject to* four prescribed methodological fixes — and
  reinstated *[DeRolph I](derolph-i-1997.yml)* and *[DeRolph II](derolph-ii-2000.yml)* as the
  controlling law of the case. [verified] The effect was to strip out
  the remedial specifics the court had supplied a year earlier and leave standing the bare
  declaration that the system is unconstitutional, together with the direction to the General
  Assembly to enact a compliant one. A reading that treats the four decisions as cumulative
  gets the operative holding wrong.

  **Then it ended without a compliance finding.** On 16 May 2003 the court granted a writ of
  prohibition barring the trial court from conducting further proceedings, terminating the
  remand. [verified] The United States Supreme Court denied certiorari on 20 October 2003.
  [verified] The declaration of unconstitutionality was never withdrawn and the system was
  never adjudicated compliant. The case simply stopped.

  This produces the condition every subsequent Ohio funding regime operates under: a standing
  constitutional judgment against the funding system with no court supervising a remedy.
  [inference] It is why the [Evidence-Based Model](../funding-regime/evidence-based-model.yml)
  could be repealed after two years without judicial consequence, why the
  [Bridge formula](../funding-regime/bridge-formula.yml) could distribute aid by reference to
  prior-year amounts for a decade, and why the
  [Fair School Funding Plan](../funding-regime/fair-school-funding-plan.yml)'s phase-in depends
  entirely on legislative willingness. Whether the current system would satisfy *DeRolph* has
  not been tested and, on the existing record, cannot be. [open]
properties:
  case_name: DeRolph v. State
  citation: 97 Ohio St.3d 434, 2002-Ohio-6750
  court: Supreme Court of Ohio
  filed: 1991-12-19
  decided: 2002-12-11
  holding: |
    Vacated DeRolph III (93 Ohio St.3d 309, 6 September 2001) and reinstated DeRolph I and
    DeRolph II as controlling. The school funding system remains unconstitutional under
    Article VI, Section 2; the General Assembly is directed to enact a compliant system.
    [verified]
  remedy: |
    Directed to the General Assembly with no specified design and no stated consequence for
    non-compliance. Enforcement ended 16 May 2003 when the court issued a writ of prohibition
    barring further trial-court proceedings — without a compliance finding. Certiorari denied
    by the U.S. Supreme Court 20 October 2003. [verified]

    The 2003 prohibition action is not modeled as a separate node and should be; it is the
    single most consequential event in the sequence and currently lives only as a property.
    [open]
