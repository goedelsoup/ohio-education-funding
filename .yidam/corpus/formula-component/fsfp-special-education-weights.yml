revisions:
  - was: |
      The clinical definitions of the six disability categories were recorded as being "in rule
      rather than in the calculator", and unread.
    now: |
      They are in **statute**. R.C. 3317.013 names all six in the same order as the multiples,
      cross-referencing Chapter 3323 for each term.
    found_by: |
      R.C. 3317.013, read via `ohio-laws`.
    reach: |
      The ordering inferred from the money is the ordering the General Assembly wrote, so no
      figure moves. What changes is that the categories are named rather than ranked — which is
      what any claim about who sits in Category 6 needs, and Category 6 is 15% of the pupils
      and 48% of the money.
properties:
  name: Special education weights
  function: |
    For each category k in 1..6:
      aid_k = ADM_k x weight_k x statewide average base cost per pupil x state share percentage

    weights = [0.2435, 0.6179, 1.4845, 1.9812, 2.6830, 3.9554]
    statewide average base cost per pupil, FY2027 = $8,241.61

    Total = sum over the six. Reconciles to the department's published `[C] Special Education`
    to the cent for all 609 districts.
  function_tex: |
    \begin{aligned}
    \text{aid}_k &= \text{ADM}_k \times w_k \\
      &\quad \times \text{statewide average base cost per pupil} \times \text{state share} \\
    w &= (0.2435,\ 0.6179,\ 1.4845,\ 1.9812,\ 2.6830,\ 3.9554) \\
    \text{statewide average base cost per pupil} &= \$8{,}241.61 && \text{FY2027} \\
    \text{total} &= \sum_{k=1}^{6} \text{aid}_k
    \end{aligned}
  statutory_basis: |
    R.C. 3317.013 sets the six categories and their weights; the categories themselves are defined
    by rule. The weights here are transcribed from the FY2027 calculator and confirmed against the
    department's own per-category amounts, which is a check on the transcription rather than on the
    statute. [verified]
  calculator: |
    Not a standalone crate. Reproduced from published inputs for all 609 districts in
    `crates/project/tests/finances_and_the_guarantee.rs`; carried in
    `crates/project::panel::SpecialEducation`.
