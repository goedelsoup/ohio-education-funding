class: formula-component
label: FSFP Disadvantaged Pupil Impact Aid
description: |
  **$525m**, and the only one of the six whose mechanism is neither a weight times a count nor an
  equalisation off wealth. DPIA blends two poverty counts, expresses the blend as a share of
  enrolment, indexes that share against the state's — and **squares it**. [verified]

  **THE SQUARING IS THE WHOLE CHARACTER OF THE PROGRAM AND NOTHING IN A DPIA TOTAL SHOWS IT.** Aid
  scales with the **square** of relative poverty, so a district at twice the state's rate scores
  four times the index rather than twice. $525m distributed on a convex curve concentrates far more
  sharply than a per-pupil rate would, and the convexity is a policy choice as substantial as the
  amount. Verified for all 609 districts, in both directions: away from an index of one, the plain
  ratio and the published figure diverge. [verified]

  **THE TWO POVERTY COUNTS ARE NOT NESTED.** `d1` is 65% of the FY2025 economically disadvantaged
  ADM plus 35% of the FY2026 directly certified ADM. The second is administrative — a child is
  directly certified through participation in another benefit program — and it finds a **median
  61%** of what the disadvantaged count does, **fewer than half in 146 districts**. Putting 35% of
  the weight on the smaller measure lowers the funded count almost everywhere. [verified]

  Almost. **Three districts have more directly certified children than economically disadvantaged
  ones** — Beachwood 1.03x, Nordonia Hills 1.54x, Ottawa Hills 2.35x on 32.9 disadvantaged pupils.
  All three have poverty shares of 0.03 to 0.18 against a statewide median of 0.49. Small counts,
  where two differently-built measures can invert. Recorded because the corpus briefly asserted the
  blend could not exceed its larger input, which is false, and because either count is a tempting
  poverty proxy elsewhere. [verified]

  **AND ONE DISTRICT DOES NOT FOLLOW THE RULE — BECAUSE A RULE THIS NODE DID NOT HOLD OVERRODE
  IT.** Edgerton Local's published blend is 342.38 against 352.03 computed from the stated 65/35
  weights. This node called it "the size of a data correction rather than a mechanism". It is a
  mechanism: **the weighted ADM is capped at the district's own enrolled ADM.** Edgerton's enrolled
  ADM is 342.3818, and the published figure is that number rounded to the two decimals the column
  carries. The blend would have given it more disadvantaged pupils than pupils.

  Three independent selections over the panel return the same single district, which is what makes
  this an identification rather than a coincidence: the only district whose blend exceeds its
  enrolment, the only one whose weighted ADM equals its enrolment, and the only one at a
  disadvantaged percentage of ~100%. [verified —
  `crates/project/tests/questions_the_corpus_left_open.rs`]

  **AND THE CAUSE IS NOW KNOWN: A PRIOR-YEAR COUNT AGAINST A COLLAPSED ENROLMENT.** This node
  said Edgerton's count "is on a different basis than enrolment or it is wrong". It is on a
  different basis, the act names which, and nothing is wrong with it.

  The blend's first term is the **FY2025** count. Edgerton's enrolment fell from **504.48 in
  FY2025 to 342.38 in FY2026** — a third of the district in one year. Its count of 497.21 is
  **98.6% of the enrolment it was measured against** and 145% of the one it is applied to.

  The three districts whose count most exceeds current enrolment make the point better than any
  argument:

      district                 ED/FY2025   current/FY2025   ED/current
      Edgerton Local             0.9856        0.6787          1.4522
      Garfield Heights City      0.9878        0.8634          1.1441
      Clearview Local            0.9857        0.9042          1.0901

  All three sit at 98.6% against the year the act measures in. What separates them is entirely
  how much they shrank. A ratio that is identical in three unrelated districts is not a data error
  in any of them — the dispersion is in the denominator. [verified —
  `crates/project/tests/what_the_act_says_and_the_code_does_not.rs`]

  **WHAT THE STATEWIDE SHARE IS.** `d3` divides by 0.533380310606710 — the statewide economically
  disadvantaged percentage. R.C. 3317.02(I)(1)(a)(i) defines it as a **computation, not a
  constant**: the statewide ADM it divides by is the sum of enrolled ADM for all city, local and
  exempted village districts, statewide community school enrolment, and statewide STEM school
  enrolment. So it is recomputed rather than carried forward, and its value moves when any of
  those three move. [verified — `ohio-laws`] How far it has moved between biennia is still
  unrecorded here, because the corpus holds one year of the calculator. [open]

  **AND THE CITATION ON THIS NODE WAS WRONG.** It cited R.C. 3317.029. **There is no such
  section.** Disadvantaged pupil impact aid is R.C. 3317.022(A)(4), inside the section that
  assembles core foundation funding, and the $422 per pupil is statutory there. [verified]

  **THE SQUARING IS IN STATUTE AFTER ALL.** This node recorded that it "is visible in the
  workbook's own formula and has not been located in statute here." It is at R.C.
  3317.02(I)(1)(a), which defines the index as **the square of the quotient** of the district's
  percentage over the statewide one. Not a departmental elaboration — the General Assembly's own
  construction. [verified]

  ~~**BUT THE 65/35 BLEND IS NOT IN THE LAW AT ALL.**~~ **IT IS — IN THE ACT, NOT THE CODE.**
  This node said the blend was "a departmental choice inside a delegation, changeable without a
  bill". That was wrong, and wrong by concluding *not in law* from *not in the Revised Code*. The
  Revised Code is not all of the law. H.B. 96 of the 136th General Assembly sets it in a table:

      economically disadvantaged student ADM        FY2026    FY2027
      FY2025 students                                 75%       65%
      students certified as categorically eligible    25%       35%

  So the blend is **uncodified statutory law** — the same category as the four supplements —
  changeable by the next budget and not by the department. [verified — `lsc-budget`,
  `crates/project/tests/what_the_act_says_and_the_code_does_not.rs`]

  **What *is* delegated is narrower and more interesting.** R.C. 3317.03(B)(21) hands the
  department the **definition** of "economically disadvantaged", constrained only by "a student
  shall not be categorically excluded … based on anything other than family income." The act then
  sets **weights** on two counts whose definitions it does not control. Two levels, and this node
  had collapsed them into one. [verified]

  And the act names the **vintage**, which nothing else did: the first term is the **FY2025**
  count. That is what explains Edgerton, below.

  **THE POVERTY MEASURE IS TOP-CODED AND THIS COMPONENT IS NOT.** The report card's economically
  disadvantaged share saturates at 100% under community eligibility, which is why 100 districts
  print exactly that. The count DPIA uses is an ADM rather than a share and does not saturate the
  same way — so the two poverty figures a district page can show are different measures, and the
  corpus holds both. [verified]
properties:
  name: Disadvantaged Pupil Impact Aid
  function: |
    d1a  FY2025 economically disadvantaged ADM
    d1b  FY2026 directly certified ADM
    d1   = 0.65 x d1a + 0.35 x d1b
    d2   = d1 / enrolled ADM
    d3   = (d2 / 0.533380310606710) ^ 2          <- squared, for all 609 districts

    Aid = d1 x $422 x d3, in effect: the department publishes the total, and the per-pupil amount
    of $422 against the weighted count scaled by the index reproduces it.
  statutory_basis: |
    R.C. 3317.022(A)(4) for the programme and the $422; R.C. 3317.02(I)(1) for the index and its
    squaring; R.C. 3317.03(B)(21) for the count. This node previously cited R.C. 3317.029, which
    does not exist. [verified — `ohio-laws`]

    The 65/35 blend of economically disadvantaged and directly certified ADM appears in **no**
    section: it is the department exercising the delegation in R.C. 3317.03(B)(21) to define who
    is economically disadvantaged. Recorded as departmental rather than statutory, which is a
    different durability from the rest of the component.
  calculator: |
    Not a standalone crate. Reproduced for all 609 districts in
    `crates/project/tests/finances_and_the_guarantee.rs`; carried in `crates/project::panel::Dpia`.
