properties:
  name: Disadvantaged Pupil Impact Aid
  function: |
    d1a  FY2025 economically disadvantaged ADM
    d1b  FY2026 directly certified ADM
    d1   = 0.65 x d1a + 0.35 x d1b
    d2   = d1 / enrolled ADM
    d3   = (d2 / 0.533380310606710) ^ 2          <- squared, for all 609 districts

    Aid = d1 x $422 x d3, in effect: the department publishes the total, and the per-pupil amount
    of $422 against the weighted count scaled by the index reproduces it.
  statutory_basis: |
    R.C. 3317.022(A)(4) for the programme and the $422; R.C. 3317.02(I)(1) for the index and its
    squaring; R.C. 3317.03(B)(21) for the count. This node previously cited R.C. 3317.029, which
    does not exist. [verified — `ohio-laws`]

    The 65/35 blend of economically disadvantaged and directly certified ADM appears in **no**
    section: it is the department exercising the delegation in R.C. 3317.03(B)(21) to define who
    is economically disadvantaged. Recorded as departmental rather than statutory, which is a
    different durability from the rest of the component.
  calculator: |
    Not a standalone crate. Reproduced for all 609 districts in
    `crates/project/tests/finances_and_the_guarantee.rs`; carried in `crates/project::panel::Dpia`.
