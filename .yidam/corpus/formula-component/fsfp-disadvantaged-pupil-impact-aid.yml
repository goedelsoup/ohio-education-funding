      statutory there. [verified]
    found_by: |
      Reading the section the citation named, which does not exist in the Revised Code.
    reach: |
      A citation, not a figure. Everything the node says about the mechanism was right and was
      sourced from the department's workbook rather than from the section it misnamed.
  - was: |
      The blend of the two poverty counts was asserted to be incapable of exceeding its larger
