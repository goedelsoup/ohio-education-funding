properties:
  name: Disadvantaged Pupil Impact Aid
  function: |
    d1a  FY2025 economically disadvantaged ADM   <- the sheet's own header, `d1a FY25 ...`
    d1b  FY2026 directly certified ADM           <- `d1b FY26 ...`, a year behind the weights
    d1   = 0.65 x d1a + 0.35 x d1b
    d2   = d1 / enrolled ADM
    d3   = (d2 / 0.533380310606710) ^ 2          <- squared, for all 609 districts

    Aid = d1 x $422 x d3, in effect: the department publishes the total, and the per-pupil amount
    of $422 against the weighted count scaled by the index reproduces it.
  function_tex: |
    \begin{aligned}
    d_{1a} &= \text{FY2025 economically disadvantaged ADM} \\
    d_{1b} &= \text{FY2026 directly certified ADM} && \text{a year behind the weights} \\
    d_1 &= 0.65\,d_{1a} + 0.35\,d_{1b} && \text{blended count} \\
    d_2 &= \frac{d_1}{\text{enrolled ADM}} && \text{disadvantaged share} \\
    d_3 &= \biggl( \frac{d_2}{0.533380310606710} \biggr)^{2} && \text{index, squared} \\
    \text{aid} &= d_1 \times \$422 \times d_3
    \end{aligned}
  statutory_basis: |
    R.C. 3317.022(A)(4) for the programme and the $422; R.C. 3317.02(I)(1) for the index and its
    squaring; R.C. 3317.03(B)(21) for the count. This node previously cited R.C. 3317.029, which
    does not exist. [verified — `ohio-laws`]

    The 65/35 blend appears in **no** section of the Revised Code, and the conclusion this node
    drew from that — "the department exercising the delegation in R.C. 3317.03(B)(21)", recorded
    as departmental rather than statutory — was wrong and is retracted in the revisions above. It
    is **uncodified statutory law**: H.B. 96 sets 75/25 for FY2026 and 65/35 for FY2027 in a table
    of its own, changeable by the next budget and not by the department. [verified — the act,
    `crates/project/fixtures/enacted-school-funding.txt`]

    The retraction sat beside the retracted sentence for a phase, which is its own failure: a
    revisions block that corrects a field and leaves the field standing has recorded the finding
    without applying it.

    What R.C. 3317.03(B)(21) does delegate is narrower and still true — the *definition* of
    "economically disadvantaged". The act then sets weights on two counts whose definitions it
    does not control.
  calculator: |
    Not a standalone crate. Reproduced for all 609 districts in
    `crates/project/tests/finances_and_the_guarantee.rs`; carried in `crates/project::panel::Dpia`.
