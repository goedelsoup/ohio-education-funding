    found_by: |
      H.B. 96's own table, which names the vintage of each term, read against the district's
      two enrolment years.
    reach: |
      It settles the disjunction rather than one half of it — nothing about Edgerton's figure
      is wrong. The same 98.6% appears in the two other districts whose count most exceeds
      current enrolment, so the dispersion is entirely in the denominator.
  - was: |
      The squaring was recorded as "visible in the workbook's own formula and has not been
      located in statute here."
    now: |
      It is at R.C. 3317.02(I)(1)(a), which defines the index as **the square of the quotient**
      of the district's percentage over the statewide one. Not a departmental elaboration — the
      General Assembly's own construction.
    found_by: |
      R.C. 3317.02(I)(1)(a), read via `ohio-laws`.
    reach: |
      The arithmetic was already verified against the department for all 609 districts, so no
      figure changes. What changes is who owns the convexity: a departmental elaboration can be
      undone by the department, and this cannot.
  - was: |
      The 65/35 blend was recorded as "a departmental choice inside a delegation, changeable
