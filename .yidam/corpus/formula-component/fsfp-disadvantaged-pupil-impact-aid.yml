    reach: |
      No figure on the node moves — the published blend was always used as published. What it
      removes is a shortcut anyone would reach for: either count is a tempting poverty proxy
      elsewhere, and the two are not nested.
  - was: |
      Edgerton Local's disadvantaged count was recorded as being "on a different basis than
      enrolment or it is wrong".
    now: |
      It is on a different basis, and the act names which: the blend's first term is the
      **FY2025** count. Edgerton's enrolment fell from 504.48 in FY2025 to 342.38 in FY2026, so
      its count of 497.21 is 98.6% of the enrolment it was measured against and 145% of the one
