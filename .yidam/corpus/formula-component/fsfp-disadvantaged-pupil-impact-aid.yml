      Edgerton's enrolled ADM is 342.3818, and the published figure is that number rounded to
      the two decimals the column carries. The blend would otherwise have given it more
      disadvantaged pupils than pupils.
    found_by: |
      Reproducing the blend for every district and finding the one residual sat exactly on the
      district's enrolled ADM.
    reach: |
      One district in the FY2027 model, and a cap that will bind for any district whose blended
      poverty count approaches its roll. Nothing else on the node moves.
  - was: |
