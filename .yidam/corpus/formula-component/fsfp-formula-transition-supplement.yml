class: formula-component
label: FSFP Formula Transition Supplement
summary: >-
  A second hold-harmless, stacked on top of the guarantee and measured against a different
  base: $63.6 million to 144 districts. It exists because the guarantee protects the wrong
  quantity for some of them.
description: |
  A **second** hold-harmless, stacked on top of the [temporary transitional aid
  guarantee](temporary-transitional-aid-guarantee.yml) and against a different base. Line `[K]` of
  the payment report, $63.6m to **144 districts**. [verified]

  It exists because the guarantee protects the wrong quantity for some districts. The guarantee
  compares foundation funding against `[H2] Funding Base`. This compares **everything the formula
  pays** against `[L1] FY21 Funding Base`:

      [K] = max( [L1]  -  ( [H] Foundation Funding + [I] Guarantee
                            + [J] Supplemental Targeted Assistance + [K] Transportation ),
                 0 )

  So a district whose foundation funding has held up but whose *transportation* has fallen can draw
  this while drawing nothing from the guarantee — and **17 of the 144 do exactly that**. The two
  mechanisms are not nested and neither is a special case of the other. [verified —
  `crates/project/tests/the_supplements_outside_the_formula.rs`, reproducing `[K]` for all 609]

  ### The two FY2021 bases are not derivable from each other

  `[L1]` is generally larger than
  `[H2]`, as it must be to cover more lines — but the difference is **not** the FY2021
  transportation base, and testing that reading is how the corpus found out: the ratio of the gap
  to FY2021 transportation has a median of 1.59 and lands within one percent of unity for only 6
  of 601 districts. `[L1]` is smaller than `[H2]` for **seven** districts, which no additive
  reading permits at all. [verified]

  What `[L1]` is a base *for* is therefore clear from the formula — a FY2021 total formula funding
  figure, on the same footing as the sum it is compared against — and what it is composed *of* is
  not established here. The department publishes it as a value, not a derivation. [open]

  ### Three mechanisms anchored to one year

  With this and [transportation's own
  guarantee](fsfp-transportation.yml), Ohio holds districts harmless against FY2021 in three
  places, on three bases, over three overlapping-but-distinct sets of districts. That is why this
  is a node rather than a clause inside the guarantee's: a reader asking "what is a district held
  at?" has three answers and needs to know which one is operating.

  It is also why the phase-in is less complete than its terminal year suggests. FY2027 is the year
  the Fair School Funding Plan reaches 100% of its computed amount, and in that year **294
  districts are on the guarantee, 144 on this supplement, and 38 on transportation's** — with the
  formula's own output being what all three are measured against and found short. [inference]
properties:
  name: Formula transition supplement
  function: |
    [K] = max( [L1] FY21 Funding Base
               - ( [H] Foundation Funding + [I] Temporary Transitional Aid Guarantee
                   + [J] Supplemental Targeted Assistance + [K] Transportation ),
               0 )

    Supplemental targeted assistance is zero for every district in FY2027, so it drops out of any
    reproduction — but it is in the department's formula and a future biennium funding that line
    would change this one without changing anything else about it.

    Included in [N] Total Formula Funding, so it is inside the formula rather than beside it —
    unlike the performance supplement and preschool special education, which sit in [R].
  statutory_basis: |
    Not in R.C. 3317. The department computes it on `Detail_SFPR` and reports it as line [K].
    **Confirmed uncodified.** The statute audit searched R.C. 3317.022 — the section that assembles
    core foundation funding — and every other section this corpus cites. It is in none of them.
    The authority is the budget act's temporary law, H.B. 96 of the 136th General Assembly, which
    `codes.ohio.gov` does not carry and which lapses with the biennium unless re-enacted.

    That is a statement about **durability**, not about legality; Ohio funds a great deal this way.
    It means this payment has no permanent statutory home, unlike base cost or the categorical
    weights beside it on the same report. Reading the enacted bill text is `lsc-budget`, still
    blocked on PDFs. [verified that it is absent from the Revised Code; the bill section is [open]]

    `[L1]` is likewise absent from the Revised Code, so it is defined in the same temporary law or
    administratively. Either way it is not a permanent-law quantity, which is worth knowing about a
    figure that decides a $63.6m payment. [open]
  calculator: |
    Not a standalone crate. Carried in `crates/project::panel::Transition` and reproduced for all
    609 districts in `crates/project/tests/the_supplements_outside_the_formula.rs`.
  fy2027_scale: |
    $63.6m to 144 districts, of which 17 receive no guarantee. [verified]
