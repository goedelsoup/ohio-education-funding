revisions:
  - was: |
      The zeroed line was read as a dormancy: "a **live zero rather than an absence**: a future
      biennium can fund the line without changing anything else", with the state characterised as
      maintaining a test and declining to attach money to it.
    now: |
      H.B. 96 repealed the payment. The money was taken away, not withheld pending a decision, and
      the FY2025 programme it ended was $52.5m to 36 districts.
    found_by: |
      The act's own list of changes at `crates/project/fixtures/enacted-school-funding.txt`, read
      after the node's 36 qualifying districts turned out to be the same 36 the LSC greenbook
      names as the repeal's losers.
    reach: |
      The node had the consequence of a provision it had never read, and looked complete: an
      empty column was described accurately and attributed to nothing. Any zeroed line in the
      FY2027 model is open to the same error — gifted professional development is the other one
      H.B. 96 repealed, and it reads zero for the same reason.
