properties:
  name: Career-technical education weights
  function: |
    For each category k in 1..5:
      aid_k = FTE_k x weight_k x career-technical base cost per pupil x state share percentage

    associated services = (sum of the five FTE) x 0.0294 x same base cost x state share

    weights = [0.6230, 0.5905, 0.2154, 0.1830, 0.1570]
    career-technical base cost per pupil, FY2027 = $9,855.62
      -- not the $8,241.61 the other weighted categoricals use

    Total = the five plus associated services. Reconciles to the department's published
    `[G] Career-Technical` to the cent for all 609 districts.
  function_tex: |
    \begin{aligned}
    \text{aid}_k &= \text{FTE}_k \times w_k \\
      &\quad \times \text{career-technical base cost per pupil} \times \text{state share} \\
    w &= (0.6230,\ 0.5905,\ 0.2154,\ 0.1830,\ 0.1570) \\
    \text{career-technical base cost per pupil} &= \$9{,}855.62
      && \text{FY2027, not the } \$8{,}241.61 \\
    \text{associated services} &= \biggl( \sum_{k=1}^{5} \text{FTE}_k \biggr) \times 0.0294 \\
      &\quad \times \text{career-technical base cost per pupil} \times \text{state share} \\
    \text{total} &= \sum_{k=1}^{5} \text{aid}_k + \text{associated services}
    \end{aligned}
  statutory_basis: |
    R.C. 3317.014, read. **Codified.** The five multiples are in division (A) to four decimals and
    match the corpus exactly; the separate base cost is statutory too — the section multiplies each
    category by "the statewide average career-technical base cost per pupil for that fiscal year",
    so it is a distinct quantity by legislative construction rather than a departmental convenience.
    [verified — `ohio-laws`]
  calculator: |
    Not a standalone crate. Reproduced for all 609 districts in
    `crates/project/tests/the_remaining_categoricals.rs`; carried in
    `crates/project::panel::CareerTechnical`.
