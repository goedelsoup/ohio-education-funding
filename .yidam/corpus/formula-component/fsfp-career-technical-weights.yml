revisions:
  - was: |
      The counts these weights multiply are frozen at FY2021 — "the sheet's own column headers
      say so: `Category 1 Career Tech FTE-FY21`" — so a FY2027 payment funds the programme a
      district ran six years earlier, and whether that is a hold-harmless, a phase-in artefact
      or a data-availability constraint was recorded as an open question.
    now: |
      There is no freeze. The suffix is a label carried forward with a sheet built for the
      FY2022 report, and the counts under it are FY2026's. The question it opened was a question
      about a spreadsheet.
    found_by: |
      Three things at once, in
      [`crates/project`](../../../crates/project/tests/the_freeze_that_was_a_stale_column_header.rs).
      The department's own vintage table, on the `Directions` sheet of each workbook and the
      `Notes` sheet for the two models before them, names four models and puts the categorical
      counts at FY23, FY23, FY26 (Aug #1) and FY26 (Nov #2) — the one thing in either file drawn
      from FY2021 is the guarantee funding base, which is a dollar amount. The English learner
      column carrying the identical suffix moves in 512 of 611 districts. And every `-FY21`
      column is the same number, district by district, as an unsuffixed column on the sheet the
      calculator tells you to edit — checked at rebuild time, both workbooks, all 611.
    reach: |
      Four nodes carried the claim and all four are corrected together:
      [english learner weights](fsfp-english-learner-weights.yml) and the two `parameter` nodes
      under them. The one that had gone furthest is
      [english-learner-category-multiples](../parameter/english-learner-category-multiples.yml),
      whose `sensitivity` reasoned from the freeze to conclude that what moves the programme is
      composition rather than size — composition does move it, but for the opposite reason.
      No weight, amount or total on this component changes.
properties:
  name: Career-technical education weights
  function: |
    For each category k in 1..5:
      aid_k = FTE_k x weight_k x career-technical base cost per pupil x state share percentage

    associated services = (sum of the five FTE) x 0.0294 x same base cost x state share

    weights = [0.6230, 0.5905, 0.2154, 0.1830, 0.1570]
    career-technical base cost per pupil, FY2027 = $9,855.62
      -- not the $8,241.61 the other weighted categoricals use

    Total = the five plus associated services. Reconciles to the department's published
    `[G] Career-Technical` to the cent for all 609 districts.
  function_tex: |
    \begin{aligned}
    \text{aid}_k &= \text{FTE}_k \times w_k \\
      &\quad \times \text{career-technical base cost per pupil} \times \text{state share} \\
    w &= (0.6230,\ 0.5905,\ 0.2154,\ 0.1830,\ 0.1570) \\
    \text{career-technical base cost per pupil} &= \$9{,}855.62
      && \text{FY2027, not the } \$8{,}241.61 \\
    \text{associated services} &= \biggl( \sum_{k=1}^{5} \text{FTE}_k \biggr) \times 0.0294 \\
      &\quad \times \text{career-technical base cost per pupil} \times \text{state share} \\
    \text{total} &= \sum_{k=1}^{5} \text{aid}_k + \text{associated services}
    \end{aligned}
  statutory_basis: |
    R.C. 3317.014, read. **Codified.** The five multiples are in division (A) to four decimals and
    match the corpus exactly; the separate base cost is statutory too — the section multiplies each
    category by "the statewide average career-technical base cost per pupil for that fiscal year",
    so it is a distinct quantity by legislative construction rather than a departmental convenience.
    [verified — `ohio-laws`]
  calculator: |
    Not a standalone crate. Reproduced for all 609 districts in
    `crates/project/tests/the_remaining_categoricals.rs`; carried in
    `crates/project::panel::CareerTechnical`.
