class: formula-component
label: FSFP Career-Technical Weights
summary: >-
  Five weighted categories of career-technical enrollment plus a sixth weight for associated
  services, $54 million in all. Mechanically identical to the special education weights, except
  that these multiply a career-technical base cost of their own.
description: |
  **$54m**, five weighted categories of career-technical FTE plus a sixth weight for associated
  services. Mechanically it is [special education](fsfp-special-education-weights.yml)'s shape
  exactly — weight times count times a base cost times the state share — and the difference is
  the base cost. [verified]

  ### CTE is weighted against its own base cost

  The five weights multiply a **career-technical base cost per pupil of $9,855.62**, where
  special education and English learners multiply the statewide average of **$8,241.61**. A
  career-technical pupil starts from a base **19.6% higher** before any weight is applied.
  [verified]

  ### The associated-services weight applies to the sum, not to a category

  0.0294 against total CTE FTE across all five categories, $3.2m statewide. It pays for
  services rather than instruction, and it is the one part of the program that does not vary
  with which category a pupil is in. [verified]

  ### The counts are this year's, and the header that said otherwise is four years stale

  The `CTE` sheet heads its five count columns `Category 1 Career Tech FTE-FY21`, and the suffix
  is a label on the FY2022 report the sheet was built for. The department's own table of what
  each variable is drawn from puts the categorical counts at **FY2026**, and the English learner
  column carrying the identical suffix moves in **512 of 611 districts** across the two published
  models. No six-year-old file does that. [verified — `crates/project`]

  ### The weights descend across the five categories

  — 0.623, 0.5905, 0.2154, 0.183, 0.157 — and **R.C. 3317.014 names what each one buys.**
  Unlike special education, the ordering is not severity: it is programme type. The two highest
  multiples are workforce development programmes grouped by field — agricultural and
  environmental systems, construction technologies, engineering and science technologies,
  finance, health science, information technology and manufacturing technologies at 0.6230;
  business and administration, hospitality and tourism, human services, law and public safety,
  transportation systems and arts and communications at 0.5905. The lower multiples are not
  workforce programmes at all: 0.2154 is career-based intervention. So the gap between 0.5905
  and 0.2154 is a gap between kinds of programme rather than between grades of one. [verified —
  `ohio-laws`]

  Why the first group is priced above the second — both are full workforce programmes, and the
  split is by field — is not stated in the section. [open]
findings: |
  So Ohio's weights are not one scale, and a table listing them together — which is the natural
  thing to build, and which the corpus nearly built — understates this program by a fifth. A
  Category 1 CTE pupil at a weight of 0.623 generates $6,140; the same weight against the
  general base would give $5,135. Established from the department's published per-category
  amounts rather than from the transcribed constants, because asserting a difference between
  two numbers copied out of one workbook proves only that they were copied correctly.
  [verified]

  **All five multiples match the statute exactly.** [verified —
  `crates/project/tests/the_statute_behind_the_weights.rs`]

  ### Stable is not frozen, and the workbook has a control for the difference

  Career-technical really is nearly still — **559 of 611 districts** carry an identical FTE
  across the two published models, and the statewide total moves from 28,558 to **28,642**,
  three tenths of a per cent. Gifted moves in 22 districts. Special education moves in 608. All
  three are drawn from the same fiscal year by the same line of the same table, so what separates
  them is the kind of count rather than the calendar: a career-technical FTE is fixed by a course
  schedule and a gifted identification is cumulative, while a special education ADM is
  re-evaluated all year. [verified — `crates/project`]

  One column on that sheet genuinely is held back. The school building count names FY2025 in its
  header *and* in the department's vintage table, and it is identical for **all 611 districts in
  both models**. Nothing else on the sheet manages that, and a count that moves in fifty-two
  districts is not doing what it does. [verified — `crates/project`]

  What survives of the retracted claim is a narrower question the workbook cannot answer. R.C.
  3317.02(E) defines these counts as enrolment "during the school year", and a FY2027 simulation
  cannot use FY2027 counts because FY2027 has not happened — it uses the November 2026 collection
  and says on its own first sheet that "actual aid will be calculated based on actual data".
  Whether the payment is finally recomputed on the payment year's own counts, or whether the
  prior collection is what a district is settled against, is not established here. [open]
