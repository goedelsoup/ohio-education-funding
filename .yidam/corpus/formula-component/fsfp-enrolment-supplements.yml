class: formula-component
label: FSFP Base and Enrollment Growth Supplements
summary: >-
  Two payments that share a sheet and nothing else — a flat $40 for every pupil in every
  district with no test of any kind, and a separate supplement for districts whose enrollment
  is growing.
description: |
  Two payments that share a sheet and nothing else. Lines `[L]` and `[M]`, both inside `[N] Total
  Formula Funding`. [verified]

  **The base funding supplement** is $40 for every pupil in every district, $56.1m statewide, with
  no test of any kind. It is the simplest line in the whole calculation and the only one with no
  conditionality whatever.

  **The enrollment growth supplement** is $250 a pupil for a district whose enrolment rose at least
  **3%** over three years — and it pays on **every** pupil, not on the pupils gained. $39.4m to 43
  districts, against a median district that **shrank 4.8%**. [verified]

  ### Paying on the whole roll turns the threshold into a cliff

  What clearing 3% is worth has
  nothing to do with how close a district came: it is $250 times the district's size. New Lexington
  grew **2.9502%** and drew nothing; three hundredths of a percentage point further and it would
  have received **$430,477**. 3 other districts sit between 2.7% and 3%. [verified —
  `crates/project/tests/the_supplements_outside_the_formula.rs`]

  The cliff sits in a thin part of the distribution, which is where a cliff does its most arbitrary
  work: Ohio's median district is shrinking, so the districts near the threshold are few and their
  neighbours on either side are otherwise alike. [inference]

  ### It points the opposite way to the guarantee

  The
  [guarantee](temporary-transitional-aid-guarantee.yml) pays a district whose enrolment has
  **fallen**; this pays one whose enrolment has **risen**. The same formula cushions movement in
  both directions, which means it responds to enrolment change considerably less than its
  per-pupil construction suggests. **And "whether any district draws both" carried a premise that
  was itself wrong: the base funding supplement has no eligibility test at all.** All 609 districts
  draw it; the growth supplement reaches 43, so the growth districts are a strict subset and "both"
  is a consequence rather than a coincidence. The two share a sheet and nothing else — $56.1m
  spread flat across everyone against $39.4m concentrated on 43 districts behind a 3% cliff, which
  is $92k a district against $916k. [verified —
  `crates/project/tests/questions_the_corpus_left_open.rs`] The guarantee comparison below stands — the guarantee tracks aid rather than enrolment, and property wealth predicts it three
  times more strongly than decline does. [verified]

  ### Still open

  Why 3% and why three years. Both are single numbers with a cliff behind them and
  neither is explained in the calculator. [open]
