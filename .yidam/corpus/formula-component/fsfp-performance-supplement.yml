revisions:
  - was: |
      The statutory home of this payment was recorded as unreadable: "Reading the enacted bill
      text is `lsc-budget`, still blocked on PDFs", with the bill section marked `[open]`.
    now: |
      `lsc-budget` is wired and the act is committed. The H.B. 96 final analysis names the
      sections in its own citation block — `Sections 265.215, 265.220, 265.230, 265.237, 265.239,
      and 265.450` — and what remains open is which of the six, not whether the document can be
      read.
    found_by: |
      A corpus review crossing every blocker claim against the connector registry. `lsc-budget`
      carries `Status::Wired`, its output has been committed at
      `crates/project/fixtures/enacted-school-funding.txt` since the phase that landed it, and
      `crates/project/tests/what_the_act_says_and_the_code_does_not.rs` already asserts two of
      these three supplements' own figures against that file.
    reach: |
      Three nodes carried the sentence verbatim — this one, [the performance
      supplement](fsfp-performance-supplement.yml) and [the enrolment
      supplements](fsfp-enrolment-supplements.yml) — and a fourth,
      [DPIA](fsfp-disadvantaged-pupil-impact-aid.yml), had already gone through the same route and
      recorded a revision for it. The blocker was false on the day the sibling's revision was
      written; nothing compared them. It is the failure that test's own header names — reading a
      recorded claim instead of the source behind it — committed in the class the test was written
      for.
properties:
  name: Performance supplement
  function: |
    Q4 Eligibility = "Yes" if  O1 overall stars > 3.5
                     or        O2 progress rating >= 3
                     or        O2 > O3 (progress higher than the year before)
    O  Supplement  = if eligible then max(O1, O2) x $13 x enrolled ADM else 0

    Paid on `[a] Enrolled ADM`, the same count four of the six categoricals use. Reported in
    [R] Total State Support and not in [N] Total Formula Funding, so no guarantee holds it.
  function_tex: |
    \begin{aligned}
    O_1 &= \text{overall stars} \\
    O_2 &= \text{progress rating} \\
    O_3 &= \text{progress rating, the year before} \\
    Q_4 &= (O_1 > 3.5) \ \text{ or }\ (O_2 \ge 3) \ \text{ or }\ (O_2 > O_3) && \text{eligibility} \\
    O &= \begin{cases}
      \max(O_1, O_2) \times \$13 \times \text{enrolled ADM} & \text{if } Q_4 \\
      0 & \text{otherwise}
    \end{cases} && \text{supplement}
    \end{aligned}
  statutory_basis: |
    Not in R.C. 3317. The department computes it on its own sheet and reports it as line [O]; the
    $13 and the three routes are transcribed from there.
    **Confirmed uncodified.** The statute audit searched R.C. 3317.022 — the section that assembles
    core foundation funding — and every other section this corpus cites. It is in none of them.
    The authority is the budget act's temporary law, H.B. 96 of the 136th General Assembly, which
    `codes.ohio.gov` does not carry and which lapses with the biennium unless re-enacted.

    That is a statement about **durability**, not about legality; Ohio funds a great deal this way.
    It means this payment has no permanent statutory home, unlike base cost or the categorical
    weights beside it on the same report.

    **The act is held, and it names the sections.** The H.B. 96 final analysis is committed at
    `crates/project/fixtures/enacted-school-funding.txt`, and its citation block for *Funding for
    FY 2026 and FY 2027* closes `Sections 265.215, 265.220, 265.230, 265.237, 265.239, and
    265.450` — the six uncodified sections of the act carrying the school financing system for the
    biennium, this payment among them. [verified — `lsc-budget`]

    A bounded list, not a pinpoint. The analysis cites the sections for the topic and not for each
    supplement inside it, and separating them needs the enrolled act rather than LSC's account of
    it. [open — which of the six, not whether]

  calculator: |
    Not a standalone crate. Carried in `crates/project::panel::PerformanceSupplement` and
    reproduced for all 609 districts in
    `crates/project/tests/the_supplements_outside_the_formula.rs`.
  fy2027_scale: |
    $55.7m to 427 of 609 districts, $32.50 to $65.00 per pupil. [verified]
