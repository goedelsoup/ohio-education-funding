class: formula-component
label: FSFP Performance Supplement
summary: >-
  The only place Ohio's funding formula pays on a measured outcome — $13 a pupil times a
  district's star rating, $55.7 million to 427 districts. It sits outside foundation funding,
  and therefore outside the guarantee's protection.
description: |
  **The only place Ohio's school funding formula pays on a measured outcome.** $55.7m to 427
  districts, line `[O]`, outside `[H] Foundation Funding` and therefore outside the
  [guarantee](temporary-transitional-aid-guarantee.yml)'s protection. [verified]

  Every other component in this class pays for an *input* — a pupil, a category of need, a tax
  base. This pays for a **rating**: $13 a pupil times the greater of the district's overall
  star rating and its progress component rating, so the amount runs from $32.50 to $65.00 per
  pupil.

  **Three routes qualify a district and only one is about being good:**

      an overall rating above 3.5 stars        288 districts
      a progress rating of 3 or more           120 more, whatever the overall rating
      a progress rating higher than last year   18 more, whatever the level

  The two progress routes exist to blunt the obvious objection to outcome-based funding — that
  it pays for intake. They carry a fifth of the recipients. [verified]
findings: |
  ### It is distributed inversely to need

  By economically disadvantaged quintile, the mean supplement per pupil runs **$55.92, $43.51,
  $35.62, $30.62, $21.84** from least-poor to poorest, monotonically, and the share of
  districts qualifying runs **94.21% to 47.20%**. The least-poor districts receive **2.56 times per
  pupil** what the poorest do. [verified —
  `crates/project/tests/the_supplements_outside_the_formula.rs`]

  Every figure in that sentence moved when it was first bound to the crate. The table had been
  published as `$54.74, $43.24, $36.21, $30.03, $23.31`, the qualification rates as `91% to 49%`
  and the gradient as `2.3` — none of them what `project::panel` computes, and all of them under
  `[verified]`, because the test that stood behind them asserted the gradient was `> 2.0` rather
  than what it is. The direction of the finding is unchanged and its size is a quarter larger.

  This wants stating precisely rather than as an accusation. Ohio's attainment measures track
  composition — this corpus established that spending per *weighted* pupil against performance
  is substantially a composition proxy — so any program keyed to them follows composition
  whatever its intent. That explains the gradient; it does not remove it. **$55.7m of a formula
  built to equalise flows against the grain of everything else in it**, and no published figure
  says so. The progress routes are what hold the gradient to 2.56 rather than whatever it would
  otherwise be. [inference on the mechanism, [verified] on the measurement]

  ### The gradient is real and the size is not

  Whether the supplement is large enough to matter distributionally has two halves, and they
  point opposite ways.

  The gradient is there and it runs against the grain: **$55.92 per pupil to the least
  disadvantaged fifth of districts against $22.06 to the most**, monotone across all five
  quintiles, a factor of 2.5. But the supplement is **0.77% of realized state aid**, it reaches
  at most **7.0%** of any one district's aid, and the ninetieth-percentile district gets 2.8%.
  A mechanism pointed the wrong way and turned down almost to nothing. [verified —
  `crates/project/tests/questions_the_corpus_left_open.rs`]

  Recorded precisely because it reads as either alarming or trivial depending on which of the
  two numbers is quoted alone. The reason to keep watching it is that the gradient is a
  property of the design and the size is a property of one appropriation.

  $55.7m against $7.28bn of state aid is 0.8%, so a district's whole supplement is smaller than
  the noise in most other lines — and a regressive 0.8% inside a progressive $7.28bn is a
  different object from a regressive program. The gradient is measured; whether it moves any
  district's position is not. [open]
