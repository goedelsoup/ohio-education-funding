class: formula-component
label: Temporary Transitional Aid Guarantee
summary: >-
  The hold-harmless: where the formula computes less for a district than its FY2020 baseline,
  the state pays the baseline instead. In FY2027, the terminal phase-in year, it pays $879
  million to 294 of Ohio's 609 districts.
description: |
  The hold-harmless. When the Fair School Funding Plan computes less for a district than a
  prior-year baseline, the guarantee tops the district up to that baseline instead. [verified]
  Line [I] of the School Finance Payment Report, R.C. 3317.019.

  ### The mechanism, and the clawback inside it

  The department's formula is

      [I] = max( [H2] Funding Base  -  [I1] Open Enrolment Adjustment  -  [H] Foundation Funding,
                 0 )

  `[H2]` is the [guarantee funding base](../parameter/guarantee-funding-base.yml) — the FY2020
  anchor, published per district and never re-based. `[I1]` is the [open enrolment
  clawback](guarantee-open-enrolment-clawback.yml), a reduction for a guaranteed district that
  has shed entering open enrolment beyond a threshold. Each is a mechanism in its own right
  that this line composes rather than contains. [verified]

  Because the guarantee is a difference rather than a rate, any increase in computed funding
  reduces it one-for-one until it reaches zero and the district returns to formula.

  ### It is a nominal floor, so it erodes by construction

  A guarantee written in dollars and anchored to a fixed historical year cannot hold its value.
  A district it protects loses ground every year through no decision by anyone, and nothing in
  the formula records that it happened. "Held at FY2020" is a statement about nominal dollars
  only, and across FY2020-FY2025 prices rose 25.1%. [verified]

  So "temporary transitional" describes the intent and not the mechanism. A guarantee anchored
  to a fixed historical year does not expire; it is escaped, district by district, only as the
  formula grows past a level set in 2020. On the FY2027 evidence, for half of these districts
  that is not close. [inference]

  Still open: whether the statute or subsequent budget acts contemplate re-basing. [open]
findings: |
  ### The limit case, and the panel cannot see it

  **North Bass Local receives $19,672.64, and every cent of it is this guarantee.** Zero base
  cost, zero categoricals, zero transportation, zero of everything the formula computes — a Lake
  Erie island district in Ottawa County that the department does not cost at all, funded because
  it was funded in FY2020. [verified — the department's FY27 calculator, `Summary_SFPR`]

  It is what the mechanism looks like with the formula subtracted out. Every other guaranteed
  district is a comparison between two numbers; this one has only the historical number, and the
  hold-harmless is not topping up its aid but constituting it. Whatever the guarantee is *for*,
  North Bass is the case where nothing else is doing any work.

  Its neighbour **Middle Bass Local** is the other half of the pair and receives nothing at all,
  which is the same fact from the other side: two districts the formula has no answer for, one
  carrying a 2020 figure forward indefinitely and one carrying zero.

  **Neither is in the committed panel**, because the extract is keyed on the base cost sheet and
  the department computes no base cost for either. So the $878,954,627 above is the 609-district
  total and the department's is $878,974,300 — the whole difference is North Bass. [verified —
  [`the_population_the_panel_speaks_for.rs`](../../../crates/project/tests/the_population_the_panel_speaks_for.rs)]
  Every statistical claim in this node is over the 609, and the district that would most sharply
  illustrate it is the one excluded.

  ### Does it buy anything? No — carefully

  Joining the funding model to the 2024-25 report card across the 606 districts every panel
  covers, guarantee status looks like it predicts achievement: districts on the guarantee score
  **+0.187** against the Performance Index, median 89.85 against 85.6. Holding economic
  disadvantage constant the association is **+0.035**. [verified — see
  [`crates/project/tests/guarantee_and_outcomes.rs`](../../../crates/project/tests/guarantee_and_outcomes.rs)]

  The whole of it is poverty. Guaranteed districts are less poor — median economically
  disadvantaged share 42.8% against 51.9% — which is the same wealth gradient the description
  establishes, arriving on the outcome side as an achievement effect that is not there. The
  result holds for Ohio's growth measure as well, and for a continuous reading of guarantee
  dependence rather than the binary one: every combination lands under 0.06 once poverty is held.
  [verified]

  **What it does not say.** Not that the guarantee is useless, and not that its money does
  nothing. Districts are not assigned to the guarantee at random — they are on it because their
  FY2020 receipt exceeded what the formula now computes, which is a function of the same wealth
  and enrollment history that predicts their outcomes. Nothing here identifies an effect. What
  it rules out is the argument from the raw gap: *guaranteed districts perform better, so the
  guarantee is working.* That gap is a composition artifact. [inference]

  A caution the same join makes checkable. **State aid per pupil is not a spending measure.** It
  is 38% of the median district's operating budget and substitutes for local revenue rather than
  adding to it: holding poverty constant, state aid per pupil and total operating spending per
  pupil track each other at +0.035. So the +0.146 recorded for spending against growth and the
  -0.247 for aid against growth are not in tension — they are different variables, and reading
  one as the other is a mistake this node exists to make hard. [verified]

  ### Running the formula without it

  The department's model publishes core foundation funding [H] separately from the guarantee [I],
  so the two can be compared directly rather than inferred. [verified]

  On correlation, the guarantee's effect is modest. State aid per pupil against assessed
  valuation per pupil correlates at **−0.662 on formula alone and −0.605 as realized** — the
  guarantee gives up about 9% of the formula's equalization.

  On levels it is not modest at all. Median guarantee uplift per pupil, by valuation quartile:

      Q1 poorest        $0
      Q2                $0
      Q3              $685
      Q4 wealthiest  $1,154

  **The typical district in the poorer half of Ohio receives nothing from the guarantee**,
  because most such districts are not on it. The typical district in the wealthiest quartile
  receives $1,154 per pupil — which more than doubles the $1,113 the formula would give it.
  [verified] Comparing quartile medians instead of per-district differences gives $21 against
  $1,658; both framings are recorded because either quoted alone invites the wrong reading.

  The correlation understates this because correlation measures how tightly aid tracks wealth,
  not how much money moves. A component can leave the ranking almost intact while transferring
  a great deal. [inference]

  ### A methodological point this forced

  For spending, less dispersion is more equitable. For state aid the sign flips: aid is
  compensatory, so a wide spread means strong targeting and a narrow one means weak targeting.
  Realized aid is measurably *more equal* than formula aid — coefficient of variation 0.563
  against 0.695, restricted range ratio 9.66 against 12.27. [verified — recomputed over the 609
  districts of the committed feed with `dispersion::Dispersion::of`, which is R type 7 on
  `q * (n - 1)` and population variance; the figures this replaces (0.544, 0.677, 9.6, 12.3)
  do not reproduce under any convention in the crate] That equality is the guarantee
  flattening the compensation. Reporting it as an improvement, which the habit from spending
  analysis would invite, gets the direction exactly backwards. See
  [equity](../doctrine/equity.yml).

  ### How far the formula falls below the level it holds districts at

  Because guarantee = baseline − formula, each guaranteed district's FY2020 baseline can be
  recovered as core foundation funding plus its guarantee. [verified]

      FY2027 formula as a share of the district's FY2020 baseline
        median 67.8%      p25 42.3%      102 districts below 50%
        aggregate: $2.15B formula against a $3.03B baseline (71.0%)

      by valuation quartile, guaranteed districts only
        Q1 poorest      91.9%
        Q2              74.1%
        Q3              53.8%
        Q4 wealthiest   43.4%

  The gradient closes the causal chain. The local capacity measure reduces aid to
  property-wealthy districts by design. Their FY2020 baseline was far higher. The guarantee
  holds them there — and for the wealthiest quartile the plan produces less than half of it.
  [inference]

  This is a share of the *statutory base*, which is narrower than a district's booked state aid.
  Read the third correction below before reading it as a shortfall in receipts.

  ### The real erosion, measured within one source

  [verified — [dew-five-year-forecast](../../catalog/dew-five-year-forecast.md) both endpoints,
  [bls-cpi-u](../../catalog/bls-cpi-u.md) deflator] The clearest statement available, because it
  is measured entirely within one source on one definition and touches the calculator nowhere.
  Real change in booked state aid, FY2020 to FY2025, deflated by CPI-U June:

      median guaranteed district   -18.2%      270 of 294 lost ground
      median formula district       -3.3%      184 of 314 lost ground

  Also computed in
  [`crates/project/tests/finances_and_the_guarantee.rs`](../../../crates/project/tests/finances_and_the_guarantee.rs).

  ### The incidence of removal, as a distribution rather than a total

  [verified — [`crates/scenario-delta`](../../../crates/scenario-delta/)] Crossed against wealth,
  per pupil:

      valuation quintile    per-pupil loss on removal
      Q1 (poorest)                    -136.84
      Q2                              -270.84
      Q3                              -490.24
      Q4                            -1,025.91
      Q5 (wealthiest)                 -937.40

  and against the state share of base cost, where it is starker still: the 138 districts at the
  minimum state share lose **$1,003.87** per pupil, against **$160.27** for the quintile the
  formula supports most. The guarantee pays most, per pupil, to the districts the formula says
  need it least. [verified]

  Two things this does *not* say. The gradient is **not monotone** — Q4 loses more per pupil than
  Q5, because the wealthiest districts are small and already floored, so less distance separates
  their formula amount from their baseline. Any claim that the guarantee's benefit rises without
  limit in wealth breaks here. [verified] And the poorest quintile does receive something: 15 of
  its 121 districts are on the guarantee. This is a strong tendency, not a rule. [verified]

  ### A perturbation is inert for a guaranteed district, exactly

  Not approximately: a district paid by the guarantee under two policies that differ anywhere
  except in the guarantee itself moves by **0.000000**, because the guarantee is a `max` against a
  fixed baseline and the same number leaves the same branch twice. For a base cost increase, 256
  of 609 districts are in that condition. This is why the guarantee is the only lever with a
  distinct incidence: every other one is blocked for the same half of the state. [verified]

  It also absorbs reform. Because a guaranteed district's top-up shrinks by exactly what its
  formula amount gains, roughly half of any base cost increase is absorbed rather than delivered
  — the finding that halved the [input-refresh scenario](../scenario/fsfp-input-year-refresh.yml).
  [verified]

  ### And the model cannot see the floor under a formula district

  The baseline is recoverable only for districts *currently* held, because being held is the sole
  thing that discloses it. The 315 districts the formula pays each have an FY2020 baseline sitting
  below their current amount, and no committed source carries it. A simulated **cut** therefore
  lets them fall past a floor that would really catch them: at a 5% phase-in the model has them
  lose 95% of their aid and puts nobody on the guarantee. Those districts hold **46% of Ohio's
  students**, so any scenario that reduces formula aid overstates its savings by an amount that
  cannot be bounded here. [verified for the model's behaviour; the size of the real-world
  correction is [open] and needs FY2020 per-district payments for districts not on the guarantee]

  ### The consequence for equity is direct

  State aid tracks poverty (+0.632) more tightly than property wealth (−0.548), which reads as the
  formula's targeting working. The guarantee is part of why the wealth relationship is not
  stronger: it props up precisely the districts the local capacity measure would fund least.
  [inference — see [equity](../doctrine/equity.yml)]

  It is called temporary and transitional. In FY2027 — the terminal year of the six-year
  phase-in, the year the formula reaches 100% of its computed amount — **294 of 609 districts,
  48.3%, holding 54.1% of base cost enrolled ADM, are funded by it rather than by the formula.**
  [verified] Across those 609 it totals **$878,954,627**, against the department's
  **$878,974,300** over the 611 districts it pays. The $19,672.64 between them is one district,
  North Bass Local, and it is in the findings below. The median guaranteed district sits more than three times
  above what a meaningful base cost increase would give it, so this is not a rounding buffer
  catching a few edge cases; for half the state it is the operative funding mechanism.

  ### Who is on it

  Both candidate explanations — property wealth and enrollment decline — point the same way,
  and one dominates clearly. Property wealth predicts the guarantee roughly three times more
  strongly than enrollment decline does, and by quartile of valuation per pupil the rate runs
  13%, 37%, 68%, 76%: monotonic, with three-quarters of Ohio's wealthiest districts held above
  what the formula computes for them. [verified] The mechanism is not mysterious. Under the
  plan's own logic a property-wealthy district has high local capacity, so its computed state
  share is small — that is the formula working as designed. The guarantee then overrides that
  result and pays the district what it used to get. [inference]

  ### It grows as the phase-in completes, which is the opposite of what the name implies

  [OCG White Paper 015](../../catalog/ocg-white-paper-015.md) reports the FY2024 position — the
  phased-in amount about $741.8 million below what the formula calculated, with 180 districts
  drawing about $181.2 million in guarantee support — and treats the phase-in gap as the
  "unfunded statutory formula" standard for defunding. Set the FY2027 figures beside it:

      FY2024    180 districts     $181.2 million     [verified — as published, secondary]
      FY2027    294 districts     $879.0 million     [verified — department FY2027 model]

  Roughly fivefold in dollars, arriving *at* the terminal year, the year the formula reaches
  100%. The phase-in gap closes and the guarantee does not; the mechanism that carries
  districts to full funding is the hold-harmless rather than the formula. Any account that
  treats FY2027 as the year the question resolves has the direction backwards. [inference]
