class: formula-component
label: Temporary Transitional Aid Guarantee
description: |
  The hold-harmless. When the Fair School Funding Plan computes less for a district than a
  prior-year baseline, the guarantee tops the district up to that baseline instead. [verified]
  Line [I] of the School Finance Payment Report, R.C. 3317.019.

  It is called temporary and transitional. In FY2027 — the terminal year of the six-year
  phase-in, the year the formula reaches 100% of its computed amount — **294 of 609 districts,
  48.3%, holding 54.1% of Ohio's students, are funded by it rather than by the formula.**
  [verified] It totals $878,974,300. The median guaranteed district sits more than three times
  above what a meaningful base cost increase would give it, so this is not a rounding buffer
  catching a few edge cases; for half the state it is the operative funding mechanism.

  **Who is on it, and why.** Both candidate explanations point the same way and one dominates
  clearly. [verified — computed from the department's FY27 model; see
  [`crates/foundation/tests/department_model_fy27.rs`](../../../crates/foundation/tests/department_model_fy27.rs)]

                             enrollment falling fast    stable or rising
      wealthy (> median)              79%                     65%
      poor    (< median)              35%                     15%

  Holding enrollment constant, being above the median in assessed valuation per pupil adds
  about 45 points to the probability of being on the guarantee. Holding wealth constant, fast
  enrollment decline adds about 15. **Property wealth predicts the guarantee roughly three
  times more strongly than enrollment decline does.** By quartile of valuation per pupil the
  rate runs 13%, 37%, 68%, 76% — monotonic, and three-quarters of Ohio's wealthiest districts
  are held above what the formula computes for them. [verified]

  **DOES IT BUY ANYTHING? THE CORPUS CAN NOW ASK, AND THE ANSWER IS NO — CAREFULLY.**
  Joining the funding model to the 2024-25 report card across the 606 districts every panel
  covers, guarantee status looks like it predicts achievement: districts on the guarantee score
  **+0.187** against the Performance Index, median 89.9 against 85.6. Holding economic
  disadvantage constant the association is **+0.035**. [verified — see
  [`crates/project/tests/guarantee_and_outcomes.rs`](../../../crates/project/tests/guarantee_and_outcomes.rs)]

  The whole of it is poverty. Guaranteed districts are less poor — median economically
  disadvantaged share 42.8% against 51.9% — which is the same wealth gradient established
  above, arriving on the outcome side as an achievement effect that is not there. The result
  holds for Ohio's growth measure as well, and for a continuous reading of guarantee dependence
  rather than the binary one: every combination lands under 0.06 once poverty is held. [verified]

  This is the sharpest instance of a rule this corpus wrote down after being caught by it: most
  district-level correlates of the Performance Index are poverty in disguise.

  **What it does not say.** Not that the guarantee is useless, and not that its money does
  nothing. Districts are not assigned to the guarantee at random — they are on it because their
  FY2020 receipt exceeded what the formula now computes, which is a function of the same wealth
  and enrollment history that predicts their outcomes. Nothing here identifies an effect. What
  it rules out is the argument from the raw gap: *guaranteed districts perform better, so the
  guarantee is working.* That gap is a composition artifact. [inference]

  A caution the same join makes checkable. **State aid per pupil is not a spending measure.** It
  is 38% of the median district's operating budget and substitutes for local revenue rather than
  adding to it: holding poverty constant, state aid per pupil and total operating spending per
  pupil track each other at +0.035. So the corpus's +0.146 for spending against growth and the
  -0.247 for aid against growth are not in tension — they are different variables, and reading
  one as the other is a mistake this node exists to make hard. [verified]

  The mechanism is not mysterious. Under the plan's own logic a property-wealthy district has
  high local capacity, so its computed state share is small — that is the formula working as
  designed. The guarantee then overrides that result and pays the district what it used to get.
  [inference]

  **The consequence for equity is direct.** The corpus records that state aid tracks poverty
  (+0.630) more tightly than property wealth (−0.549), and reads that as the formula's targeting
  working. The guarantee is part of why the wealth relationship is not stronger: it props up
  precisely the districts the local capacity measure would fund least.
  [inference — see [equity](../doctrine/equity.yml)]

  **It also absorbs reform.** Because a guaranteed district's top-up shrinks by exactly what its
  formula amount gains, roughly half of any base cost increase is absorbed rather than
  delivered — the finding that halved this corpus's
  [input-refresh scenario](../scenario/fsfp-input-year-refresh.yml). [verified]

  **RUNNING THE FORMULA WITHOUT IT.** The department's model publishes core foundation funding
  [H] separately from the guarantee [I], so the two can be compared directly rather than
  inferred. [verified]

  On correlation, the guarantee's effect is modest. State aid per pupil against assessed
  valuation per pupil correlates at **−0.662 on formula alone and −0.605 as realized** — the
  guarantee gives up about 9% of the formula's equalization.

  On levels it is not modest at all. Median guarantee uplift per pupil, by valuation quartile:

      Q1 poorest        $0
      Q2                $0
      Q3              $685
      Q4 wealthiest  $1,154

  **The typical district in the poorer half of Ohio receives nothing from the guarantee**,
  because most such districts are not on it. The typical district in the wealthiest quartile
  receives $1,154 per pupil — which more than doubles the $1,113 the formula would give it.
  [verified] Comparing quartile medians instead of per-district differences gives $21 against
  $1,658; both framings are recorded because either quoted alone invites the wrong reading.

  The correlation understates this because correlation measures how tightly aid tracks wealth,
  not how much money moves. A component can leave the ranking almost intact while transferring
  a great deal. [inference]

  **A METHODOLOGICAL POINT THIS FORCED.** For spending, less dispersion is more equitable. For
  state aid the sign flips: aid is compensatory, so a wide spread means strong targeting and a
  narrow one means weak targeting. Realized aid is measurably *more equal* than formula aid —
  coefficient of variation 0.544 against 0.677, federal range ratio 9.6 against 12.3.
  [verified] That equality is the guarantee flattening the compensation. Reporting it as an
  improvement, which the habit from spending analysis would invite, gets the direction exactly
  backwards. See [equity](../doctrine/equity.yml).

  **THE BASELINE IS FY2020, AND IT HAS NOT BEEN RE-BASED.** [verified — FY2026 payment report
  line-by-line explanation] The guarantee "ensures that districts do not receive less in FY 2026
  than what they received in **FY 2020**," measured against Base State Funding.

      guarantee = max(0, base_state_funding - core_foundation - open_enrollment_adjustment)

  The adjustment applies only where a district has curtailed entering open enrollment beyond a
  threshold — the greater of 10% of its prior-year entering open enrollment or 20 students —
  and then reduces the base by the statewide average base cost per pupil for each student
  beyond it. It is a disincentive against closing a district's borders, not a general term.
  [verified]

  **This is the finding the corpus has been walking toward.** FY2020 is a
  [Bridge formula](../funding-regime/bridge-formula.yml) year, and one of the two Ohio funded at
  **frozen** levels rather than computing them. So in FY2027, at 100% phase-in, nearly half of
  Ohio's districts are funded at a level set by a placeholder formula in a year it was not even
  run — seven years earlier, and never re-based. [inference]

  Because guarantee = baseline − formula, each guaranteed district's FY2020 baseline can be
  recovered as core foundation funding plus its guarantee. Doing that shows how far the plan
  falls below the level it is holding them at: [verified]

      FY2027 formula as a share of the district's FY2020 baseline
        median 67.8%      p25 42.3%      102 districts below 50%
        aggregate: $2.15B formula against a $3.03B baseline (71.0%)

      by valuation quartile, guaranteed districts only
        Q1 poorest      91.9%
        Q2              74.1%
        Q3              53.8%
        Q4 wealthiest   43.4%

  The gradient closes the causal chain. The local capacity measure reduces aid to
  property-wealthy districts by design. Their FY2020 baseline was far higher. The guarantee
  holds them there — and for the wealthiest quartile the plan produces less than half of it.
  [inference]

  **FY2020 IS NOW OBSERVED, AND THE BASELINE IS NOT A DISTRICT'S FY2020 RECEIPTS.** [verified —
  [dew-five-year-forecast](../../catalog/dew-five-year-forecast.md), FY2023 filing, line 1.035]
  Until this source arrived, FY2020 could only be recovered *from the guarantee*, which made
  every check of the guarantee circular. Districts' audited FY2020 unrestricted grants-in-aid
  are now an independent observation, and the first thing they establish is a distinction the
  recovery above cannot make on its own:

      FY2027 figure as a share of observed FY2020 booked state aid, 294 guaranteed districts
        core foundation + guarantee   median 0.899      <- the base the guarantee holds them at
        total state support           median 1.107      <- what the district is actually paid

  The observation falls **between** the two, which is what a definitional gap looks like rather
  than a funding one. The statutory base excludes transportation, preschool special education,
  special education transportation, and the performance supplement; a district's booked
  unrestricted aid includes them.

  This corpus reported the 0.899 as a shortfall for two phases. It is not one. A narrow FY2027
  numerator over a broad FY2020 denominator manufactures a gap, and the recovery above is
  correct for what it claims — the share of the *statutory base* the formula reaches — and wrong
  for anything that behaves like total receipts. `panel::DistrictRecord::total_state_support`
  exists so the two cannot be confused again. [verified]

  What survived the correction is the comparison against a control, which was the same size on
  either construction: guaranteed districts sit about 25 points below formula-funded ones
  (1.107 against 1.354 wide, 0.899 against 1.186 narrow). A level can be wrong in a way a
  contrast measured the same way is not. [verified]

  **THE GUARANTEE IS A NOMINAL FLOOR, SO IT ERODES BY CONSTRUCTION.** [verified —
  [dew-five-year-forecast](../../catalog/dew-five-year-forecast.md) both endpoints,
  [bls-cpi-u](../../catalog/bls-cpi-u.md) deflator] The clearest statement available, because it
  is measured entirely within one source on one definition and touches the calculator nowhere.
  Real change in booked state aid, FY2020 to FY2025, deflated by CPI-U June:

      median guaranteed district   -18.2%      270 of 294 lost ground
      median formula district       -3.3%      184 of 314 lost ground

  A guarantee written in dollars cannot hold its value. A district it protects loses ground
  every year through no decision by anyone, and nothing in the formula records that it happened.
  "Held at FY2020" is a statement about nominal dollars only, and across FY2020-FY2025 prices
  rose 25.1%. [verified]

  So "temporary transitional" describes the intent and not the mechanism. A guarantee anchored
  to a fixed historical year does not expire; it is escaped, district by district, only as the
  formula grows past a level set in 2020. On the FY2027 evidence, for half of these districts
  that is not close. [inference]

  Still open: whether the statute or subsequent budget acts contemplate re-basing, and what the
  FY2020 figure itself was composed of — the Bridge formula distributed largely by reference to
  still earlier years, so the anchor may reach back further than 2020. [open]

  **THE INCIDENCE OF REMOVAL, AS A DISTRIBUTION RATHER THAN A TOTAL.** [verified —
  [`crates/scenario-delta`](../../../crates/scenario-delta/)] The corpus has carried "$879
  million, 294 districts" for several phases. Crossed against wealth, per pupil:

      valuation quintile    per-pupil loss on removal
      Q1 (poorest)                    -136.84
      Q2                              -270.84
      Q3                              -490.24
      Q4                            -1,025.91
      Q5 (wealthiest)                 -937.40

  and against the state share of base cost, where it is starker still: the 138 districts at the
  minimum state share lose **$1,003.87** per pupil, against **$160.27** for the quintile the
  formula supports most. The guarantee pays most, per pupil, to the districts the formula says
  need it least. [verified]

  Two things this does *not* say. The gradient is **not monotone** — Q4 loses more per pupil than
  Q5, because the wealthiest districts are small and already floored, so less distance separates
  their formula amount from their baseline. Any claim that the guarantee's benefit rises without
  limit in wealth breaks here. [verified] And the poorest quintile does receive something: 15 of
  its 121 districts are on the guarantee. This is a strong tendency, not a rule. [verified]

  **A PERTURBATION IS INERT FOR A GUARANTEED DISTRICT, EXACTLY.** Not approximately: a district
  paid by the guarantee under two policies that differ anywhere except in the guarantee itself
  moves by **0.000000**, because the guarantee is a `max` against a fixed baseline and the same
  number leaves the same branch twice. For a base cost increase, 256 of 609 districts are in that
  condition. This is why the guarantee is the only lever with a distinct incidence: every other
  one is blocked for the same half of the state. [verified]

  **AND THE MODEL CANNOT SEE THE FLOOR UNDER A FORMULA DISTRICT.** The baseline is recoverable
  only for districts *currently* held, because being held is the sole thing that discloses it.
  The 315 districts the formula pays each have an FY2020 baseline sitting below their current
  amount, and no committed source carries it. A simulated **cut** therefore lets them fall past a
  floor that would really catch them: at a 5% phase-in the model has them lose 95% of their aid
  and puts nobody on the guarantee. Those districts hold **46% of Ohio's students**, so any
  scenario that reduces formula aid overstates its savings by an amount the corpus cannot bound.
  [verified for the model's behaviour; the size of the real-world correction is [open] and needs
  FY2020 per-district payments for districts not on the guarantee]
properties:
  name: Temporary transitional aid guarantee
  function: |
    If the district's computed formula funding falls below a prior-year baseline, pay the
    difference. Reported as line [I] of the Summary School Finance Payment Report, separate from
    core foundation funding [H], and included in total formula funding [N].

    Because it is a difference rather than a rate, any increase in computed funding reduces the
    guarantee one-for-one until the guarantee reaches zero and the district returns to formula.
  statutory_basis: R.C. 3317.019. [verified]
  calculator: |
    Not implemented. The absorption effect is computed directly in
    crates/foundation/tests/department_model_fy27.rs; a general implementation belongs in the
    `foundation` crate once the baseline derivation is established. [open]
  fy2027_scale: |
    294 of 609 districts (48.3%); 54.1% of base cost enrolled ADM; $878,974,300 total.
    Guarantee amounts: median $1,946,072, p25 $924,177, p75 $3,684,989, max $25,894,168
    (Columbus City). [verified]
