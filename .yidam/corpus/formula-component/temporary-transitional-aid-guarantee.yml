revisions:
  - was: |
      A hold-harmless and nothing else: computed funding below a baseline, pay the difference.
    now: |
      The department's `[I]` subtracts an [open enrolment
      clawback](guarantee-open-enrolment-clawback.yml) as well. A guaranteed district whose open
      enrolment FTE has fallen by more than `max(10% of last year, 20 FTE)` has its guarantee cut
      by **$8,241.61 for every FTE beyond that threshold** — the statewide average base cost per
      pupil, charged at full value rather than at the district's state share. **43 districts,
      $5.1m withheld.**
    found_by: |
      [`crates/project/tests/the_supplements_outside_the_formula.rs`](../../../crates/project/tests/the_supplements_outside_the_formula.rs),
      reproducing `[I]` for all 609 districts.
    reach: |
      A guarantee described without the clawback reproduces correctly for 566 districts and
      wrongly for 43 — few enough to read as rounding rather than as a missing term, which is how
      twelve phases were built on top of it. **No distributional claim on this node is affected**,
      because those were computed from the department's published `[I]` rather than from this
      node's account of how `[I]` is made. What was wrong was the account.
  - was: |
      The identity of the guarantee's baseline was recorded as `[open]`.
    now: |
      It is `[H2] Funding Base`, published per district on `Detail_SFPR`, and it is the FY2020
      level Ohio froze funding at under the [Bridge
      formula](../funding-regime/bridge-formula.yml). It is **not** `[L1] FY21 Funding Base` on
      the same sheet, which is explicitly labelled and generally larger — that one is the base for
      the [formula transition supplement](fsfp-formula-transition-supplement.yml).
    found_by: |
      The department's FY2026 payment report line-by-line explanation, which states the guarantee
      "ensures that districts do not receive less in FY 2026 than what they received in FY 2020".
    reach: |
      The two bases differ for more than half of districts and `[L1]` is smaller for seven, so
      neither is derivable from the other. Recording the baseline as open had made every check of
      the guarantee circular, because FY2020 could only be recovered *from* the guarantee.
  - was: |
      Guaranteed districts' FY2027 core foundation plus guarantee came to a median of 0.899 of
      their observed FY2020 booked state aid, and this was reported as a shortfall for two phases.
    now: |
      It is a definitional gap, not a funding one. The statutory base excludes transportation,
      preschool special education, special education transportation and the performance
      supplement; a district's booked unrestricted aid includes them. Total state support against
      the same denominator gives a median of **1.107** — the observation falls *between* the two.
    found_by: |
      [dew-five-year-forecast](../../catalog/dew-five-year-forecast.md), FY2023 filing, line
      1.035, which made districts' audited FY2020 unrestricted grants-in-aid an independent
      observation for the first time.
    reach: |
      A narrow FY2027 numerator over a broad FY2020 denominator manufactures a gap.
      `panel::DistrictRecord::total_state_support` exists so the two cannot be confused again.
      What survived the correction is the comparison against a control, which was the same size on
      either construction: guaranteed districts sit about 25 points below formula-funded ones
      (1.107 against 1.354 wide, 0.899 against 1.186 narrow). A level can be wrong in a way a
      contrast measured the same way is not.
properties:
  name: Temporary transitional aid guarantee
  function: |
    [I] Guarantee = if [H2] > [H] and ([H2] - [I1] - [H]) > 0
                     then [H2] - [I1] - [H] else 0

    where [H2] is the guarantee funding base and [I1] the open enrolment adjustment, each of which
    has a node of its own.

    Reported as line [I] of the Summary School Finance Payment Report, separate from core
    foundation funding [H], and included in total formula funding [N].
  function_tex: |
    \begin{aligned}
    H &= \text{foundation funding} \\
    H_2 &= \text{guarantee funding base} && \text{a node of its own} \\
    I_1 &= \text{open enrolment adjustment} && \text{a node of its own} \\
    I &= \begin{cases}
      H_2 - I_1 - H & \text{if } H_2 > H \ \text{ and }\ H_2 - I_1 - H > 0 \\
      0 & \text{otherwise}
    \end{cases} && \text{guarantee}
    \end{aligned}
  statutory_basis: R.C. 3317.019. [verified]
  calculator: |
    Not a standalone crate, and no longer blocked on the baseline. `[H2]` and the clawback's inputs
    are carried in `crates/project::panel::Transition`, and `[I]` is reproduced for all 609
    districts in `crates/project/tests/the_supplements_outside_the_formula.rs`. The absorption
    effect is computed in `crates/foundation/tests/department_model_fy27.rs`. A general
    implementation in the `foundation` crate is now writable. [open]
  fy2027_scale: |
    294 of 609 districts (48.3%); 54.1% of base cost enrolled ADM; $878,954,627 across those
    609, against $878,974,300 over the 611 the department pays. The difference is North Bass
    Local, which the panel excludes and which is 100% guarantee.
    Guarantee amounts: median $1,946,072, p25 $924,177, p75 $3,684,989, max $25,894,168
    (Columbus City). [verified]
