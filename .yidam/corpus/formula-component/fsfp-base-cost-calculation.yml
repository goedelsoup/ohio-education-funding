properties:
  name: FSFP base cost calculation
  function: |
    District Aggregate Base Cost = Teacher Base Cost + Student Support Base Cost + District
    Leadership and Accountability Base Cost + Building Leadership and Operation Base Cost +
    Athletic Co-curricular Activities Base Cost

    District Base Cost Per-Pupil = District Aggregate Base Cost / District Base Cost Enrolled ADM
    Statewide Average Base Cost Per-Pupil = Sum of district aggregates / Sum of district ADM

    Teacher Base Cost = Classroom + Special + Substitute + Professional Development, where
      Funded Classroom Teachers = (K ADM / 20) + (Gr 1-3 / 23) + (Gr 4-8 / 25) + (Gr 9-12 / 27)
                                 + (CTE ADM / 18)
      Funded Special Teachers   = greater of (Base Cost Enrolled ADM / 150) and 6
      Average Teacher Base Cost = (statewide avg teacher salary x 1.16) + avg insurance cost
      Substitute Cost           = (classroom + special teachers) x ($90 x 1.16) x 5 days
      Professional Development  = (classroom + special) x ((salary x 1.16) / 180) x 4 days

    Base Cost Enrolled ADM funds students where they are educated: resident ADM, plus entering
    open enrollment and 80% of JVS ADM and 20% of contract vocational ADM, less exiting open
    enrollment, community and STEM school ADM, and Jon Peterson, Autism, EdChoice, and
    Cleveland Scholarship ADM. Uses the greater of the three-year average or the prior year,
    which stabilizes funding for districts with declining enrollment. [verified]
  function_tex: |
    \begin{aligned}
    \text{funded classroom teachers} &= \frac{\text{K ADM}}{20} + \frac{\text{Gr 1-3 ADM}}{23}
      + \frac{\text{Gr 4-8 ADM}}{25} + \frac{\text{Gr 9-12 ADM}}{27} + \frac{\text{CTE ADM}}{18} \\
    \text{funded special teachers} &= \max\biggl( \frac{\text{base cost enrolled ADM}}{150},\ 6 \biggr) \\
    \text{average teacher base cost} &= (\text{statewide average teacher salary} \times 1.16)
      + \text{average insurance cost} \\
    \text{substitute cost} &= (\text{classroom} + \text{special}) \times (\$90 \times 1.16) \times 5
      && \text{5 days} \\
    \text{professional development} &= (\text{classroom} + \text{special})
      \times \frac{\text{salary} \times 1.16}{180} \times 4 && \text{4 days} \\
    \text{teacher base cost} &= \text{classroom} + \text{special} + \text{substitute}
      + \text{professional development} \\
    \text{district aggregate base cost} &= \text{teacher} + \text{student support}
      + \text{district leadership and accountability} \\
      &\quad + \text{building leadership and operation} + \text{athletic co-curricular} \\
    \text{district base cost per pupil} &= \frac{\text{district aggregate base cost}}{\text{district base cost enrolled ADM}} \\
    \text{statewide average base cost per pupil} &= \frac{\sum \text{district aggregates}}{\sum \text{district ADM}}
    \end{aligned}
  statutory_basis: |
    R.C. 3317.011. Teacher base cost 3317.011(D); student support 3317.011(E); district
    leadership and accountability 3317.011(F); building leadership and operation 3317.011(G);
    athletic co-curricular 3317.011(H). Base Cost Enrolled ADM at R.C. 3317.02(K). [verified]
  calculator: foundation
  fy2022_inputs: |
    Statewide average salaries used, all FY2018 [verified]:
      Superintendent $115,615.69   Other administrator $95,727.51   Principal $91,720.36
      Teacher $62,696.18           Counselor $63,263.80             Librarian/media $68,139.33
      EMIS support $53,695.26      Bookkeeping/accounting $45,387.82
      Administrative assistant $44,955.10   Clerical $32,997.90
      Average annual employer-paid insurance $14,265.53
    Statewide per-pupil amounts [verified]:
      Building $1,129.78   Supplies and academic content $220.35   Athletic co-curricular $163.28
      Academic co-curricular $42.13   Technology $37.50   ITC support $31.00
      Building safety and security $23.29
