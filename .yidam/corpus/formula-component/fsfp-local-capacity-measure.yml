class: formula-component
label: FSFP Local Capacity Measure
description: |
  The Fair School Funding Plan's replacement for the charge-off, and the component that most
  changes which districts win and lose. Rather than asking what a fixed millage would raise
  against valuation, it asks what a district's community can bear — and the answer is a blend,
  weighted **60% assessed property valuation per pupil, 20% federal adjusted gross income per
  pupil, and 20% federal median income per pupil**, scaled by a local capacity percentage.
  [verified]

  That 60/20/20 split is the substance of the reform. Property alone treated a district with
  expensive housing and modest household earnings as wealthy; splitting the income term into an
  aggregate measure (total AGI, which rises with population and with a few very high earners)
  and a median measure (which does not) captures a district whose totals look healthy because
  of concentration at the top. [inference]

  The scaling factor is where the progressivity actually lives, and it is a sliding scale, not
  a constant. A district's local capacity percentage is set by the ratio of its federal median
  income to the state's, benchmarked against the **40th highest district** on that ratio:
  at or above that benchmark the rate is 2.5%; below the state median it is the district's own
  ratio times 2.25%; between the two it interpolates. [verified] A district at half the state
  median income is charged local capacity at roughly 1.125% of its blended wealth, while a
  wealthy district pays 2.5% — so the measure is progressive in rate as well as in base.

  Both wealth terms are computed as the **lesser** of the most recent year and a three-year
  average — valuation from TY20 against TY18-20, income from TY19 against TY17-19 in the FY2022
  calculation. [verified] Taking the lesser is a deliberate protection: a district whose
  valuation spikes on a single reappraisal is not immediately charged for it.

  **The minimum state share is 10%, and this corpus had it at 5%.** The Fair School Funding
  Plan was enacted with a 5% floor and `crates/local-capacity` encoded that as a constant. The
  department's FY2027 calculator states **0.1** for both FY2026 and FY2027, on its `Notes`
  sheet, in as many words. It is set by each biennial budget rather than fixed in permanent law,
  and it doubled. **138 of 609 districts — 22.7% — sit exactly on it**, receiving a floor rather
  than a computed share. [verified]

  That is a large fact about how the measure actually operates. For those 138 districts the
  entire apparatus above — the three wealth terms, the 60/20/20 blend, the progressive rate
  schedule, the 40th-highest-district benchmark — determines nothing. Their aid is a flat
  percentage of base cost. The measure's discrimination stops at the point where a fifth of
  Ohio's districts sit, and doubling the floor moved that point without changing anything the
  formula computes.

  It also censors the data. Where the floor binds, local capacity per pupil is not recoverable
  from published aid by subtraction: all that can be said is that it exceeds 90% of base cost.
  [verified]

  Not modeled here yet: how the 40th-highest-district benchmark moves over time, and whether
  it has. It is a single discretionary number that sets the top of the entire scale. [open]

  **AGAINST THE MECHANISM IT REPLACED.** [verified —
  [`crates/regime-diff`](../../../crates/regime-diff/), the corpus's only aligned component
  pair, run at FY2027 base cost with only the local share substituted]

  The income terms do what they were built to do, and they do it in **both** directions. Ottawa
  Hills Local — high income, unremarkable valuation — is charged **69% more** by local capacity
  than a 23-mill charge-off would ask. Jefferson Township Local — high valuation, low income —
  is charged **26% less**. The district the charge-off treated as the richer of the two is the
  one this measure treats as poorer. [verified]

  The half that gets less attention is the second one. Local capacity is usually described as
  catching wealth the charge-off missed; it also **relieves** districts whose property wealth
  overstated what their residents could bear, and at FY2027 base cost **193 of 606 districts
  would have received more under the charge-off** against 413 under this measure. A reform
  described only as tightening is being described by half. [verified]

  **Across wealth the change of mechanism favours the top.** Mean gain per pupil against the
  charge-off, by valuation quintile: $154.85, $102.38, $107.60, $193.23, **$873.92**. Every
  quintile does better, and the wealthiest does best by a factor of five and a half over the
  poorest. The minimum state share is part of that — the charge-off had no floor and would zero
  out 81 districts entirely — but not the whole of it: splitting the top quintile by whether the
  charge-off would have zeroed it leaves both halves gaining about the same, $908.63 against
  $805.35. [verified]

  So this measure is more discriminating than the charge-off about *which* districts are wealthy
  and simultaneously more generous to wealthy districts overall. Those are not in tension —
  the first is about the ordering and the second about the level — but a claim that cites one
  without the other is quoting half the result. [inference]

  **THE MEASURE IS PUBLISHED, AND THIS CORPUS SPENT ELEVEN PHASES RECOVERING IT BY SUBTRACTION.**
  The FY2027 calculator's `Detail_SFPR` sheet carries `[b1] Per Pupil Capacity Amount` for every
  district. Nothing here read that sheet. The corpus instead derived capacity as base cost minus
  the state's share of it, which is exact for 471 districts and impossible for the 138 where the
  minimum state share binds — and those are precisely the districts where capacity is highest and
  the subtraction understates it, so they were censored rather than reported wrong. [verified]

  The two agree where both exist, to **0.46% at worst**, which is the retrospective check on the
  subtraction and the reason to trust the eleven phases of work built on it. The 138 are no longer
  censored. [verified — `crates/project/tests/finances_and_the_guarantee.rs`]

  **The inputs are held too, and the record here said otherwise.** This node's calculator was
  described as unimplementable because the repository had no income data at any level. It has: the
  same workbook carries a `Valuation & Income` sheet with three tax years of assessed valuation
  and three of federal adjusted gross income per district, and a `# Tax Returns Projection 27`
  sheet with eight years of return counts. The District Profile Report supplies district median
  income. Every argument the measure takes is in a cached file. [verified]

  **And the blend reproduces the published figure.** Taking 60% of the lesser of recent and
  three-year-average valuation, 20% of the same construction on adjusted gross income, and 20% of
  median income times tax returns, the ratio of the department's published capacity to that
  unrated blend behaves exactly as a capacity *rate* should:

      income ratio to state median    implied rate
      0.76                            1.70%
      0.95                            2.15%
      1.02                            2.29%
      1.21                            2.43%
      1.57                            2.56%

  At a ratio of one the implied rate is 2.25%, which is the statutory scale's value there, and the
  top decile is **61 of 61 districts within 0.15 points of the 2.5% cap**. [verified] The
  structure and the sliding scale are both confirmed against the department's own output.

  One correction falls out of it. This node describes the third term as **federal** median income.
  The reproduction above uses the district's **Ohio** median income, which is what the profile
  report publishes and what fits; the federal figure published beside it is an *average* rather
  than a median. Which of the two the statute names should be checked against R.C. 3317.017
  directly rather than against this corpus's own summary of it. [open]
properties:
  name: FSFP local capacity measure
  function: |
    Capacity Valuation V1        = lesser of (most recent TY assessed valuation) and
                                   (3-year average of the three most recent tax years)
    Capacity Gross Income I1     = lesser of (most recent TY federal AGI) and (3-year average)
    C1 Assessed Valuation/Pupil  = V1 / Base Cost Enrolled ADM
    C2 Gross Income/Pupil        = I1 / Base Cost Enrolled ADM
    C3 Median Income/Pupil       = (federal median income x number of state tax returns) / ADM
    C4 Income Ratio              = district federal median income / statewide federal median income
    C5 Benchmark                 = C4 as computed for the 40th highest district
    C6 Local Capacity Percentage = if C4 >= C5              then 0.025
                                   if C4 >  1 and C4 < C5   then ((C4-1) x 0.0025)/(C5-1) + 0.0225
                                   if C4 <= 1               then C4 x 0.0225

    Local Capacity Per-Pupil Amount = ((C1 x 0.6) + (C2 x 0.2) + (C3 x 0.2)) x C6

    Distinct from Targeted Assistance [R.C. 3317.0217], which weights district wealth
    60% property valuation / 40% federal gross income — a different blend for a different
    purpose, and a frequent source of confusion between the two. [verified]
  statutory_basis: R.C. 3317.017; state share and state share percentage at 3317.017(B) and (C). [verified]
  calculator: local-capacity
