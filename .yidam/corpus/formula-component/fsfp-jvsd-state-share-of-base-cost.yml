properties:
  name: JVSD state share of base cost
  function: |
    charged valuation      = lesser of (most recent annual value, three-year average value)
    local capacity         = charged valuation  ×  0.0005

    Prior law, FY2022-FY2025 — a subtraction, with no enrolment term:

      state share $        = aggregate base cost  −  local capacity
      state share %        = 1 − local capacity / aggregate base cost,  floored at 0.10
                             (reported, not applied)

    H.B. 96 item 7, FY2026 onward — the same charge per pupil, then a multiplication:

      base cost per pupil  = aggregate base cost / base cost enrolled ADM   (3-year average)
      capacity per pupil   = local capacity      / base cost enrolled ADM
      state share %        = (base cost per pupil − capacity per pupil) / base cost per pupil,
                             floored at 0.10
      state share $        = base cost per pupil  ×  enrolled ADM  ×  state share %
                                                     (current year)

    The two state share percentages are the same number: the base cost enrolled ADM cancels. What
    the rewrite changes is the ADM the percentage multiplies — from the three-year average built
    into aggregate base cost, to the current year's enrolled ADM.
  statutory_basis: |
    **R.C. 3317.16**, as item 7 of H.B. 96 of the 136th General Assembly rewrote it. The act's own
    list of school financing system calculation revisions carries it. [verified]
    (`crates/project/fixtures/enacted-school-funding.txt`)

    The **0.5-mill rate is not in the amendment** and was not changed by it: it is the charge-off
    rate for joint vocational districts that has stood since before the Fair School Funding Plan,
    and which the plan retired for every other kind of district. See
    [`local-share-charge-off-millage`](../parameter/local-share-charge-off-millage.yml).

    The **10% minimum state share is maintained** from prior law, which the greenbook states
    explicitly. [verified] ([`lsc-hb96-analysis`](../../catalog/lsc-hb96-analysis.md))
  calculator: |
    `crates/dispersion::jvsd_funding`, over six years of the department's own payment reports.
    Not a calculator crate: a JVSD has no IRN in the 609-district panel `project::policy` prices
    its levers over, so nothing in `foundation` or `project` can join it.

    Both methods are enforced twice — `connect::fixtures::jvsd` refuses a report whose charged
    valuation is not the lesser of the two published, whose local capacity is not that valuation
    at half a mill, whose published percentage its own inputs do not reproduce, or whose base cost
    dollars do not reproduce under the method that year's law prescribes; and the reader holds the
    same identities against the committed fixture.
  fy2026_scale: |
    $559,089,218 in total state support to 49 districts, of which $375,986,135 is the state share
    of base cost. Item 7 accounts for $10,249,747 of that — 2.80% more than prior law's
    arithmetic would have paid the same districts in the same year. [verified]
