class: formula-component
label: FSFP Community School Equity Supplement
summary: >-
  A flat per-pupil payment to site-based community schools, and the only formula line no school
  district receives: $34.65 million to 324 schools in FY2027. E-schools and STEM schools are paid
  nothing.
description: |
  A flat per-pupil payment, outside the phase-in and outside the district formula entirely. It is
  the one line of the Fair School Funding Plan that **no school district receives**: its recipients
  are community schools, which Ohio funds directly rather than through the district they draw from.

  [H.B. 33](../legislation/hb-33-2023.yml) of the 135th General Assembly established it at $650 a
  pupil in uncodified law. [H.B. 96](../legislation/hb-96-2025.yml) codified it into R.C. 3317.022
  and cut the rate: **$500 in FY2026 and $400 in FY2027**. [verified]
  (`crates/project/fixtures/enacted-school-funding.txt`, item 10 of the act's own list of school
  financing system revisions)

      equity supplement = enrolled ADM  ×  rate,  for a site-based community school
                        = 0,                      otherwise

  The department's FY2027 simulator states the rate in a header cell of its own — `Detail SFPR`
  row 2, *Equity Suplement per pupil*, against `400` — and pays every recipient that rate times
  its enrolled ADM to the cent, on all **324** of them. [verified — FY2027]
  (`crates/dispersion/src/community_school_funding.rs`)

  **Two of the schedule's three rates are read from a department model rather than from the act.**
  The FY2025 simulator, archived whole, writes its own formula out as `Equity Supplement [a*$650]`
  and pays **317** site-based schools that rate times enrolled ADM — **$54,846,889.80** in all,
  against 18 e-schools and 8 STEM schools paid nothing. [verified]
  (`crates/dispersion/src/community_school_funding.rs`, FY2025 vintage) FY2026's $500 has no such
  model and never will; the finding below says why that is closed rather than pending.

  ### It is paid after the phase-in and before the transition supplement

  The redbook places it precisely: the supplement is *"calculated after the formula's phase-in,
  but before the formula transition supplement"*. [verified] (`lsc-dew-redbook`) That ordering is
  what makes it a supplement rather than a weight — it does not enter the base the phase-in scales,
  and it does enter the sum the [transition
  supplement](fsfp-formula-transition-supplement.yml) is measured against.
findings: |
  ### Who is paid is not who the introduced budget would have paid

  Of the 355 community and STEM schools the department models, **324 receive the supplement and 31
  do not**. The 31 are exactly the **23 e-schools and 8 STEM schools**, paid zero against 35,501
  and 4,586 enrolled ADM between them — so they are not unpaid for being small. [verified — FY2027]
  (`crates/dispersion/src/community_school_funding.rs`)

  **The redbook says the opposite, and it is describing a different bill.** Its account of the
  executive proposal is that it *"codifies the equity supplement into permanent law and expands
  eligibility to STEM schools"*, at an estimated $58.0 million in each year. The enacted act did
  not do the second half. Three enacted sources agree against that one: item 10 pays community
  schools *"that are not internet- or computer-based"*, the greenbook says *"site-based community
  schools"*, and the department's own model pays the eight STEM schools nothing. [verified]
  (`crates/dispersion/src/community_school_funding.rs`)

  The rule for this was already in the corpus — the greenbook is the as-enacted edition and the
  redbook is not — and this is the line it had not been applied to. A reader taking the redbook
  for the law overstates the population by eight schools.

  ### The cut is the rate, not the population

  Almost all of what separates the enacted supplement from the introduced one is the rate rather
  than eligibility. Over the same 324 recipients, the $650 H.B. 33 set would pay
  **$56.3 million** against the enacted **$34,650,906** — a difference of **$21.66 million**,
  against the **$1.8 million** that extending to the eight STEM schools at the enacted rate would
  have added. The rate term is larger by more than an order of magnitude. [verified — FY2027]
  (`crates/dispersion/src/community_school_funding.rs`)

  And the redbook's own $58.0 million estimate is consistent with that reading: $650 applied to
  site-based plus STEM enrolled ADM gives $59.3 million on this year's projections, within 2.2% of
  the figure LSC published for a different year's. [inference]

  ### Two per-pupil lines, one eligibility rule between them

  The same workbook pays a **base funding supplement of $40 a pupil to all 355 schools**, e-schools
  and STEM schools included, and funds STEM schools' facilities at the brick-and-mortar rate rather
  than the e-school one. So the file does not treat "not a site-based community school" as a
  general disqualification; it disqualifies on this line and no other. [verified — FY2027]
  (`crates/dispersion/src/community_school_funding.rs`)
  A finding that STEM schools are funded differently, stated generally, would be wrong in both
  directions.

  ### The middle year of the rate schedule is act-only, permanently

  R.C. 3317.022 runs $650, $500, $400 across FY2025 to FY2027. **2 of the 3** have the
  department's own funding model behind them — FY2025's and FY2027's. [verified]
  (`crates/dispersion/src/community_school_funding.rs`) FY2026 is the one that does not, and the
  reason is not that nobody has looked.

  The department publishes one community school calculator at a time and **replaces it in place**,
  so the FY2026 edition stopped existing at any address the department serves when FY2027's went
  up — and unlike the FY2025 edition it was replaced before any crawler kept a copy. Four searches
  close it rather than one: the Internet Archive holds exactly **two** of these workbooks across
  the whole `State-Funding-For-Schools` tree, FY2019 and FY2025; the archived captures of the
  community school page itself link no calculator in any month of 2025; the FY2027 workbook, which
  carries the previous year's sheet as a hidden leftover, states no $500 anywhere in it; and the
  department's FY2026 actuals are published as school totals with no line breakout, so they cannot
  separate this line out either. [verified]
  (`crates/dispersion/src/community_school_funding.rs`)

  So FY2026's $500 stands on the enacted act and the greenbook and will stay there. That is
  recorded as data rather than as a footnote — `EquityRate::verified_against_a_model` is false for
  that year and true for the other two — because $650, $500 and $400 are otherwise
  indistinguishable in a list. A reader should not take the gap as a retrieval someone could go
  and make.

  ### What the supplement is, in scale

  $34,650,906 is **2.29%** of the $1.51 billion of total state support these 355 schools receive.
  [verified — FY2027] (`crates/dispersion/src/community_school_funding.rs`) It is a small line on
  a large one, and the reason it is worth its own node is not its size: it is the only line in the
  plan computed over a population other than the 609-district panel, and it has no district
  analogue to be compared against.
