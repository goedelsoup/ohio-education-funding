properties:
  name: Community school equity supplement
  function: |
    equity supplement = enrolled ADM  ×  rate,  for a site-based community school
                      = 0,                      for an e-school or a STEM school

    rate = $650 (FY2025, H.B. 33)   verified against the department's FY2025 model
           $500 (FY2026, H.B. 96)   act only, and permanently so
           $400 (FY2027, H.B. 96)   verified against the department's FY2027 model

    Calculated after the formula's phase-in and before the formula transition supplement, so it is
    outside the base the phase-in scales and inside the sum the transition supplement is measured
    against.

    No local share term: community and STEM schools have no taxing authority, so the state share
    is 100% by construction rather than by formula.
  statutory_basis: |
    **R.C. 3317.022**, as H.B. 96 of the 136th General Assembly codified it. That is the change —
    under H.B. 33 the supplement was uncodified temporary law, and the act's own list describes
    itself as codifying it: *"Codifies and incorporates into the system the equity supplement for
    community schools that are not internet- or computer-based community schools with each such
    school receiving a per student payment of $500 in FY 2026 and $400 in FY 2027"*. [verified]
    (`crates/project/fixtures/enacted-school-funding.txt`)

    The exclusion is written into the eligibility clause rather than into a rate: an
    internet- or computer-based community school is named and excluded. **STEM schools are outside
    for a different reason** — they are creatures of R.C. 3326 and are not community schools at
    all, which is why the act's phrase does not need to mention them and why the department's
    model pays them nothing. [inference]
  calculator: |
    `crates/dispersion::community_school_funding`, over the department's FY2027 simulator. The
    archived FY2025 simulator is held beside it as a second `Vintage`, read by the same builder;
    it is there to verify a rate rather than to be differenced against FY2027, which would measure
    four changes at once. Not a calculator crate: nothing in `foundation` or `project` can join
    this population, and
    `decisions/a-supplement-paid-to-a-population-the-panel-does-not-hold` records why it is a
    reported figure rather than a ninth `project::policy` lever.

    The identity is enforced twice — `connect::fixtures::community_schools` refuses the workbook
    if a recipient's payment is not rate times ADM or if an e-school or STEM school is paid at all,
    and the reader holds the same two checks against the committed fixture.
  fy2027_scale: |
    $34,650,906 to 324 site-based community schools, over 86,627 enrolled ADM. 2.29% of the $1.51
    billion these schools receive in total state support. [verified]
