class: formula-component
label: FSFP English Learner Weights
summary: >-
  $36 million, the smallest categorical in the plan, and the only one whose weights run
  downward: a first-year learner draws almost twice a third-year one. It tapers as need
  persists rather than deepening with it.
description: |
  **$36m**, the smallest of the six, and the only weighted categorical in the plan whose
  weights run **downward**. [verified]

  ### The weights descend: 0.2104, 0.1577, 0.1053

  Category 1 is the most recently arrived learner and is funded at almost exactly **twice**
  Category 3. So the program pays most in a pupil's first year and least in their third — it
  tapers as need persists rather than deepening with it. [verified]

  [Special education](fsfp-special-education-weights.yml) runs the other way, ascending from
  0.2435 to 3.9554 as need deepens. A reader who assumes Ohio's weights mean "more need, more
  money" has this one backwards. Established from what districts are actually paid per pupil in
  each category rather than from the transcribed weights. [verified]

  ### The statute settles the mechanism and narrows the motive

  R.C. 3317.016 defines the first category by **time enrolled in schools in the United States**
  — 180 school days or less — and the second as running until the student **achieves a
  proficient score** on the spring administration of the English language proficiency
  assessment. So the taper is keyed to a clock the district does not set and an exit event it
  does not score. [verified — `ohio-laws`]

  That is evidence against the reclassification-incentive reading and it is not proof: a
  district still influences how quickly a pupil reaches proficiency, and the money still falls
  when they do. What can be said is that the statute's own construction is a schedule rather
  than a discretion. Whether the descent expresses a judgement that acquisition costs most at
  the start is still not established. [open]

  ### The counts are not frozen, and watching them move is the taper in action

  The `EL` sheet heads its three count columns `Category 1 EL ADM-FY21`, and the suffix is a
  label on the FY2022 report the sheet was built for. The count moves in **512 of 611 districts**
  between the department's two published models, and it moves the way the schedule says it
  should: Category 1, the most recently arrived, falls **22%**, while Category 3 — already
  scored proficient — rises 12.8% and the total barely moves. That is one year of a cohort
  walking down the taper, visible in the counts. [verified — `crates/project`]
findings: |
  **All three multiples match the statute exactly** — 0.2104, 0.1577, 0.1053. [verified]

  ### Near-universal and almost entirely concentrated, which the total hides both ways

  **505 of 609 districts have at least one English learner** — this is not a big-city program
  by reach. But the median receiving district's entire allocation is about **$6,300**, roughly
  a fifteenth of one teacher, while **38 districts hold 80% of the money** and the largest five
  hold a third. [verified]

  So "almost every district receives English learner funding" and "English learner funding goes
  to a few dozen districts" are both true of the same $36m, and a reader given only the total
  will pick whichever they already believed. That is the general argument for decomposing the
  categorical lump, stated by the smallest program in it. [inference]

  ### Composition moves this programme, and it is now a number

  Because the schedule descends, a pupil who advances a category costs their district money
  without leaving its population. Between the department's two published models **46 districts**
  held or grew their English learner headcount and saw their weighted count fall anyway, out of
  the 524 with any English learner at all. The statewide weighted count falls 3.3% against a
  headcount that falls 1.2%. [verified — `crates/project`]

  ### The vintage itself moved, and the department does not say why

  Its own table covers four models. The FY2024 and FY2025 simulations drew their categorical
  counts from FY2023 — the prior year, an actual. The FY2026 and FY2027 simulations draw them
  from FY2026, which for the later of the two is a year that has not ended. A prior-year count is
  something a district reported and a current-year count is something it is still reporting, and
  the change between them is unexplained in the table that records it. [open]
