class: formula-component
label: Charge-Off Local Share
summary: >-
  How Ohio decided, for roughly three decades, what share of a district's cost the district
  should bear: a statutory millage rate times assessed valuation, subtracted from computed
  cost. Its defect is treating that millage as revenue a district can actually raise.
description: |
  The mechanism by which Ohio decided, for roughly three decades, how much of a district's
  cost the district itself should bear. It multiplies a statutory millage rate by the
  district's total assessed valuation and subtracts the product from the district's computed
  cost; the state pays what remains. [verified]

  Its defect is an assumption. The charge-off treats the statutory millage as revenue the
  district can raise, but under [H.B. 920](../legislation/hb-920-1976.yml) a district's
  effective operating millage is reduced as valuation rises, so many districts could not
  levy at the assumed rate against the assumed base. [verified] A district was charged off
  against money it did not receive — the phenomenon known in Ohio practice as phantom
  revenue, which shows up as an unexplained shortfall between what the formula says a district
  should have and what it actually has. [verified]

  The mechanism is also blind to income. Assessed valuation alone treats a district with
  expensive housing and modest household earnings as wealthy, and asks its residents to pay
  accordingly. Replacing that assumption is the specific thing
  [`fsfp-local-capacity-measure`](fsfp-local-capacity-measure.yml) was built to do.

  ### The blindness, measured, running both ways

  [verified —
  [`crates/regime-diff`](../../../crates/regime-diff/), holding the Fair School Funding Plan's
  own FY2027 base cost fixed and substituting only the local share mechanism]

      Ottawa Hills Local     valuation/pupil  $176,195   (below the state's 40th percentile)
        23-mill charge-off      $4,052.49/pupil
        FSFP local capacity     $6,845.07/pupil          +69%
        base cost aid            $4,312.93 -> $1,520.35

      Jefferson Township Local  valuation/pupil  $513,389
        23-mill charge-off     $11,807.96/pupil
        FSFP local capacity     $8,714.77/pupil          -26%
        base cost aid            $2,032.54 -> $5,125.73

  Ottawa Hills is a high-income district of unremarkable assessed valuation, and a property-only
  measure sees an ordinary district. Jefferson Township is the reverse. **The mechanism the
  charge-off treated as the richer of the two is the one local capacity treats as poorer**, and
  that disagreement is the substance of the reform rather than an artifact of two districts.
  [verified]

  Statewide the change of mechanism is not one-sided: at FY2027 base cost, **413 of 606
  districts do better under local capacity and 193 would have done better under the
  charge-off.** [verified]

  ### And the charge-off had no floor

  A minimum state share is a Fair School Funding Plan
  invention; the charge-off simply truncated at zero. **81 of 606 districts** would have a
  23-mill charge-off exceeding their entire FY2027 computed base cost and would receive no base
  cost aid at all. Ohio's answer at the time was the charge-off supplement — gap aid — which
  reimbursed phantom revenue at about $73.5 million across 145 districts in FY2008, rather than
  a floor. [verified]
properties:
  name: Charge-off local share
  function: |
    local_share = charge_off_millage x district_total_assessed_valuation
    state_aid = computed_cost - local_share
    Charge-off millage is a statutory rate applied uniformly statewide, distinct from the
    district's own effective operating millage.
  statutory_basis: |
    R.C. 3317.022, with the rate set by biennial session law. The 1991-1997 progression is
    recited with its Ohio Laws citations at DeRolph I, paragraph 97. Ohio Laws' online version
    archive for the section begins at 1 July 2014, after the mechanism was retired, so the
    operative text for the charge-off era is not retrievable from `codes.ohio.gov`.
  calculator: |
    regime-diff (computes the local share and differences it against FSFP local capacity);
    millage supplies effective millage inputs.
