class: formula-component
label: FSFP Transportation
summary: >-
  $726 million, with $183 million of special education transportation beside it — together the
  second-largest program in Ohio school funding after targeted assistance, and almost nothing
  about it resembles the rest of the formula.
description: |
  **$726m, and $183m of special education transportation beside it.** Transportation alone is
  larger than [special education](fsfp-special-education-weights.yml), which makes it the
  **second-largest single program in Ohio's school funding** after [targeted
  assistance](fsfp-targeted-assistance.yml). [verified]

  Almost nothing about it resembles the rest of the formula.

  ### Two competing bases, and the district is paid the greater

  $1,337.175 per weighted rider, or $6.867 per bus mile across a 180-day year. **350 districts
  are paid on the mile base**, so the `MAX` is not a formality — it flips for more than half the
  state, and which one won is invisible in the amount. A district paid on miles
  gains nothing from carrying more children on the same routes; one paid on riders gains
  nothing from covering more ground. [verified]

  ### Non-public riders count double, and so do their miles

  `public + 2 x non-public + 1.5 x community or STEM` weights the ridership, and R.C.
  3317.0212(E)(1)(b) puts the same two multiples on *miles driven* — so the premium survives
  whichever of the two bases wins. Non-public riders are 4.5% of riders and 8.5% of weighted
  ridership. Ohio requires districts to transport non-public pupils and those routes are less
  efficient, so a premium is defensible; the size of it is a policy choice sitting in a
  spreadsheet. [verified, and its justification is [open]]

  ### The state minimum share is 50%, against the formula's 10%

  The minimum is statutory and it is five times the formula's. [verified]

  ### Two supplements pulling opposite ways

  An efficiency supplement pays up to 15% more for filling buses, ramping across a
  riders-per-bus index from 1.0 to 1.5. A density supplement pays for the absence of the thing
  efficiency rewards: `(28 - riders per square mile) / 100` against the mile base, times 0.55.
  406 districts draw the first, 388 the second, and 200-odd draw both — which is coherent,
  since being efficient with the buses you run and having few children per square mile are
  different problems. [verified]

  ### A proration on the special education line

  `[J]` is `max(state share, 50%) x reported cost x 0.91746`. A factor below one means the
  appropriation did not cover the computed entitlement, so the published amount is not what a
  district is owed but what there was to divide. See [appropriation proration
  factor](../parameter/appropriation-proration-factor.yml). [verified]
