findings: |
  ### The private and charter channel is wider than the weights, and one part of it is not
  in the formula at all

  The 1.5 and 2.0 weights on riders and miles carry **$82.2m of the $608.9m school bus payment**
  — [the mile split](../parameter/transportation-cost-rates.yml) prices that. They are not the
  whole channel. Two other devices reach the same pupils, both funded from the same GRF line
  item 200502 as earmarks rather than as formula output:

  - **Payment in lieu of transportation**, R.C. 3327.02. Where a district declares a pupil
    impractical to transport, it pays the parent instead. Division (G) has non-public and
    community schools receiving these payments directly and either passing them to the parent or
    buying transportation with them. Historically a **$5,000,000** earmark, halved to
    $2,500,000 in one biennium. [verified] (the section and the greenbooks)
  - **Nontraditional school transportation**, a **$650,000** earmark reimbursing districts for
    carrying community and chartered non-public pupils **on days the district itself is closed**.
    It exists because the calendars differ, which no weight can express. [verified] (the
    greenbooks)

  **And R.C. 3327.02(D) pegs its ceiling to the same lagged statistic the rates are.** The
  payment is "not less than fifty per cent, and not more than the amount determined by the
  department as the average cost of pupil transportation **for the previous school year**". So
  the endogenous, one-year-lagged response to what districts spend — the thing that makes the
  transportation rates move without an act — governs this payment too. A fuel year reaches the
  parent's cheque by the same route and on the same delay. [verified — the section; inference
  that the two averages are the same statistic]

  The predecessor formula did it with a third device again: a **nontraditional rider
  adjustment** of `(nontraditional riders / total riders) × 0.1 × base payment`, a proportional
  uplift rather than a per-rider weight. Ohio has compensated this cost under every formula and
  has never used the same instrument twice. [verified] (the greenbooks)

  ### Where the 2.0 came from, and the only body that said why

  The weight's justification stood unanswered on the ground that the tests measure its effect
  and not its origin. Four committed documents settle the origin and one of them gives a
  reason — though not the body that legislated it.
  ([`crates/project`](../../../crates/project/tests/the_weight_the_legislature_never_explained.rs))

  **It is not inherited.** The non-traditional rider adjustment above is the last thing Ohio paid
  for these riders before the plan, and H.B. 59 **removed** it for FY2014 — *"by removing the
  formula adjustments for (1) nontraditional ridership […] As a result, funding is based only on
  the greater of per rider or per mile costs for each district."* Nothing replaced it: the FY2016,
  FY2018 and FY2020 analyses do not mention it. So eight years separate the repeal of the old
  device from the enactment of the new one, and the old one did not distinguish a non-public rider
  from a community school rider at all — one count, one rate, a share of the payment rather than a
  weight on a pupil. [verified]

  **It originated with the Fair School Funding Plan, already at 2.0.** The plan as Callender and
  Sweeney [introduced it](../../catalog/ohio-bill-versions.md) in February 2021, four months
  before [H.B. 110](../legislation/hb-110-2021.yml) enacted the formula, carries both multiples
  verbatim, and the bill's own strike-and-insert shows what they replaced: *"(1) Multiply
  Calculate the sum of the following:"*. Prior law took one rate times one count; the plan turned
  that product into a weighted sum of three. An un-enacted bill cannot establish what the law is,
  and that is not what it is doing here — it establishes **drafting**, which is the question.
  [verified]

  **No legislative analysis gives a reason, and the weights appear twice in fifteen.** Across the
  twelve [greenbooks](../../catalog/lsc-dew-redbook.md), H.B. 96's greenbook, the redbook for the
  same biennium and the enacted comparison, the transportation weights are mentioned only in
  H.B. 110's — once as item (4) of a six-item list of changes, once inside a calculation box.
  Neither says why, and the two later acts that amended this section did not restate them. The
  same analysis discusses non-public transportation at length three pages on — pickup windows,
  mass transit transfers, compliance deductions — and never joins any of it to the multiple.
  [verified]

  **The department gives a reason, five times, and it is about cost.** Every edition of the
  [line-by-line explanation](../../catalog/dew-sfpr-line-by-line.md) that describes this formula,
  FY2022 through FY2026, says: *"Community school, STEM school and nonpublic riders are weighted
  to reflect the typically higher costs that districts incur to transport these students."* That
  is a stated rationale from the payer, repeated without a word changing for five years.
  [verified]

  **So the question closes on the existence of the premium and narrows to its size.** The
  department's sentence is *one* sentence for *both* weights. It explains why a premium exists; it
  cannot explain why the premium on a non-public rider is a third larger than the premium on a
  community school rider, and it names neither multiple. Nothing in the statute, the plan bill,
  any analysis or any edition argues the difference. The corpus had guessed at the reason — Ohio's
  R.C. 3327.01 duty and less efficient routes — and the guess is the right *kind* of reason and is
  nowhere asserted by a source. What remains open is 2.0 against 1.5, not 2.0 against 1.0. [open]

  **And the 2.0 was legislated twice, a fact no analysis records.** The plan bill's mile base is a
  bare product, and [H.B. 583](../legislation/hb-583-2022.yml) — the plan's own corrections act,
  September 2022 — reprints the section with the mile base still bare, at the very address
  `(E)(1)(b)` the weighted version now occupies. The weights reached *miles driven* in a later act
  than they reached riders, and not one of the fifteen analyses mentions the second occasion.
  Which act did it is not settled by anything committed here. [open]

  ### The appropriation does not cover the entitlement, and this is the arithmetic

  Special education transportation is prorated at 0.917459740976215 because the money ran out.
  What that costs is computable:

      $182,630,489    paid
      $199,061,039    computed entitlement
      $16,430,550     cut to fit

  Set that against the line item. GRF 200502 is enacted at **$959,429,701** for FY2027, up 8.8%
  on FY2026's $882,035,414 — and traditional districts alone claim **$925,120,619** of it once
  the special education entitlement is counted before proration rather than after. That leaves
  **$34.3m** for everything else the line funds: community school and JVSD transportation, bus
  driver training, the nontraditional earmark and payments in lieu.

  An 8.8% increase is not generous against that. It is why the proration exists, and it is why
  the two earmarks that reach private and charter pupils are the smallest and most exposed part
  of the channel. [verified for the figures; inference for what the headroom must cover]

  **440 of the department's 611 districts sit on it** — 72%, against 23% on the formula's floor.
  For most of Ohio, local capacity does not determine transportation aid at all. This is the
  single largest difference between how Ohio equalises instruction and how it equalises getting
  to it, and it is the kind of fact no published total can carry. [verified]

  The denominator is the department's rather than this repository's, and the two differ. The
  committed panel holds **609** districts and gives **438**; the department pays 611 and gives
  440. Both are right about their own population — the two districts between them are Lake Erie
  islands the department computes no base cost for, so they are below the transportation floor
  and outside every figure the crates compute. [verified]
  ([`the_population_the_panel_speaks_for.rs`](../../../crates/project/tests/the_population_the_panel_speaks_for.rs))

  ### Its own guarantee, and not on the year its column says

  `[F]` holds **38 districts** at a fixed historical amount, $24.8m, where the computed amount
  has fallen below it. The calculator heads that amount `[F1] FY21 Trans Funding Base`, and the
  heading is the only place in the record where FY2021 appears. The two sources that *define* the
  base agree with each other instead: R.C. 3317.019(A)(2) pays it on the **FY2020** amount before
  Executive Order 2020-19D's pandemic reductions, less the FY2019 community and STEM
  transportation payment, and the department's own line-by-line explanation states the same two
  terms in five consecutive editions — *"(FY 2019 Capped Transportation – Community/STEM School
  Transportation)"*, ensuring a district *"does not receive less … than what it received in FY
  2020"*. [verified]
  ([`crates/project`](../../../crates/project/tests/the_year_the_column_header_names.rs))

  So it is not a clause of this formula and it is not a third base. It is division (A)(2) of the
  section that pays the [guarantee](temporary-transitional-aid-guarantee.yml) itself: the same
  statute, the same FY2020 anchor, the same reach past the same executive order, floored at zero
  the same way. Ohio holds districts harmless against **two** years across three places, not
  three — only the [formula transition supplement](fsfp-formula-transition-supplement.yml) is on
  FY2021, and LSC's greenbook names each base in one paragraph. The three sets of districts are
  still distinct and still unnested: 294, 144 and 38. [verified] (`crates/project`)

  The heading is not thereby shown to be false. Under
  [H.B. 166](../legislation/hb-166-2019.yml) both years were held at FY2019, so a FY2021
  transportation payment may be the same dollar the section reaches back for — which
  [transportation-cost-rates](../parameter/transportation-cost-rates.yml) keeps as unfilled,
  because settling it needs a per-district figure for one of those years. What is settled is what
  the base *is*: one definition, stated in two places, and neither of them this formula.
  [verified for the definition]

  **That blocker has now been checked rather than asserted, and it holds.** No committed fixture
  carries a per-district FY2020 or FY2021 transportation *payment*. The FY2027 model's
  `trans_fy21_base` is the quantity in question and not an independent check; the FY2026 model
  carries only reported special-education cost, the special-education payment and the total;
  `f33-ohio-panel` carries district *spending* under `V45`, which is what a district laid out
  rather than what the state sent; and `district-finances` splits aid no finer than unrestricted
  against restricted. [verified] So the identification is not unasked — it is waiting on the
  department's per-district payment reports, the source behind `dew-payment-reports`, whose own
  blocker is an authenticated portal rather than an absence. [open] (pending that retrieval)

  ### The general proration factor is an appropriation, not a dial

  `[F3]` is what the corpus's
  [proration factor](../parameter/appropriation-proration-factor.yml) node describes and LSC
  states as a formula: *"Adjustment percentage = (Earmarked appropriation)/(Total statewide
  allocation)"*, applied so as *"to keep the total statewide payment to the amount earmarked for
  such purposes in item 200502"*. The instruction in the budget that revived the formula is
  plainer still — *"ODE is required to prorate the calculated amount for each district to fit
  within the appropriation."* Nobody chooses it. [verified]
  ([`crates/project`](../../../crates/project/tests/the_dial_that_was_an_appropriation.rs))

  **It was below one in FY2010, FY2011, FY2014 and FY2015, and the proof is a payment that only
  exists when it is.** Each of those bienniums created a *supplemental transportation payment*
  defined as `formula allocation − prorated aid`, paid to a targeted set of districts and, in
  FY2014-15, given an earmark of its own — **$25,300,000**. A payment whose formula is the
  difference between the full amount and the prorated one cannot exist unless the proration
  binds, and is not worth appropriating for unless the difference is material. The factor itself
  is published in neither biennium; the payment is. [verified]

  Who it rescued changed with the instrument available. H.B. 1 selected on wealth per pupil and
  ridership density, both at or below the median, using
  [parity aid](fsfp-targeted-assistance.yml)'s wealth measure; H.B. 59 selected on a state share
  index of 0.5 or greater and the same density test. Both mean "poor and sparse", reached two
  ways. [verified]

  ### What it divides by is an earmark inside the line, not the line

  $413,385,915 in FY2014 — **82%** of ALI 200502. The rest of the line pays for special education
  transportation, payments in lieu of transportation, driver training, and the supplement that
  undoes the proration. The seven earmarks sum to the line, and the line is the figure
  [`project::ledger`](../../../crates/project/tests/the_dial_that_was_an_appropriation.rs)
  already held from a different document, to the dollar. [verified]

  ### And for one biennium the line did not pay for transportation

  *"In FY 2012 and FY 2013, the formula was not used and instead the appropriation for pupil
  transportation provided funding for the bridge formula."* So there is no proration for those
  years because there was no entitlement to divide, and ALI 200502 shows two ordinary-looking
  years in which the money changed purpose entirely. An appropriation series read by line item
  cannot see that, which is the general hazard
  [the line origins](../../../crates/project/tests/the_line_origins.rs) exists for. [verified]
revisions:
  - was: |
      Transportation's own guarantee is "a **third** mechanism anchored to FY2021, distinct from
      the guarantee and the formula transition supplement: a different base, a different set of
      districts, and not nested in either. It is a clause of this formula rather than a mechanism
      of its own."
    now: |
      The base is FY2020, and the mechanism is division (A)(2) of the section that pays the main
      guarantee — the same statute, the same anchor, the same exclusion of Executive Order
      2020-19D's reductions. The sets of districts are still distinct. Ohio holds districts
      harmless against two years across three places, not three.
    found_by: |
      [`crates/project`](../../../crates/project/tests/the_year_the_column_header_names.rs), on
      two sources that had been committed the whole time. R.C. 3317.019(A)(2) writes the base as
      the FY2020 amount before the executive order, less the FY2019 community and STEM payment;
      the department's line-by-line explanation gives the same two terms in five consecutive
      editions and glosses them as FY2020. Nothing but the calculator's column heading,
      `[F1] FY21 Trans Funding Base`, says 2021 — and that document's headings had already been
      shown unreliable by
      [`the_freeze_that_was_a_stale_column_header`](../../../crates/project/tests/the_freeze_that_was_a_stale_column_header.rs).
    reach: |
      The class [README](README.md) said Ohio holds districts harmless against FY2021 "in three
      separate places"; the figure manifest labelled the district count "transportation's own
      FY2021 guarantee"; `project::panel::Transportation` documented the field the same way. All
      three are corrected. No amount moves — `[F1]` is the number the department publishes and
      the panel reads, and what changes is what year it is a number *from*. The sibling
      [transportation-cost-rates](../parameter/transportation-cost-rates.yml) had already found
      the statute and recorded the remaining question as needing a per-district figure no source
      carries. That question stays open, and narrows: the five editions give a second definition
      rather than a reconciliation, and under H.B. 166 the two labels may name one dollar.
  - was: |
      The non-public weight was recorded as measured but unjustified, with the reason supplied by
      this corpus rather than by a source: "Ohio requires districts to transport non-public pupils
      and those routes are less efficient, so a premium is defensible; the size of it is a policy
      choice sitting in a spreadsheet."
    now: |
      The reason is the department's and it is about cost, stated identically in five consecutive
      editions of the line-by-line explanation. The R.C. 3327.01 duty and the route-efficiency
      argument are the right *kind* of reason and are asserted by nothing; they are withdrawn. The
      premium's existence is no longer open. Its size is: one departmental sentence covers both
      multiples and so distinguishes neither.
    found_by: |
      [`crates/project`](../../../crates/project/tests/the_weight_the_legislature_never_explained.rs),
      on four documents already committed — the plan bill, the twelve greenbooks, the H.B. 96
      redbook and the five line-by-line editions.
    reach: |
      The `description` section is rewritten and the finding above records the census. Nothing
      computed moves: the weight was always 2.0 in the panel and the tests. What changes is that
      the corpus no longer offers a rationale no source gives.
  - was: |
      The transportation minimum state share is "one schedule set across two budget acts rather
      than five separate decisions", the five published values being "eight through twelve
      twenty-fourths" — an inference from the published series.
    now: |
      Six years, three acts, and the schedule begins at **seven** twenty-fourths in FY2022. H.B. 1
      of the 134th General Assembly writes all six out in one clause as fractions, in February
      2021 — four years before the last of the three acts that enacted them.
    found_by: |
      The same test file. The plan bill states the schedule in words
      (`seven twenty-fourths` … `twelve twenty-fourths`); the enacted sections round the eleventh,
      which is why `forty-five and five-sixths` is published as `forty-five and eighty-three
      hundredths`.
    reach: |
      `properties.statutory_basis` only. The claim was an inference about how many decisions the
      series represents; it is now a reading of a committed text, and it was undercounting both
      the years and the acts.
properties:
  name: Transportation
  function: |
    [b] Weighted ridership = public + 2 x non-public + 1.5 x community/STEM
    [e] Weighted miles     = public miles + 2 x non-public + 1.5 x community/STEM
                             -- the same two multiples, R.C. 3317.0212(E)(1)(b)
    [A1] Per rider base    = [b] x 1337.175
    [A2] Per mile base     = [e] x 6.867 x 180
    [A] School bus         = ROUNDDOWN( max([A1],[A2]) x max(state share, 0.5), 1 )
    [B] Mass transit       = mass transit riders x 1337.175 x 0.35
    [C] Other types        = other riders x 1337.175 x 0.50
    [D2] Efficiency index  = round(round(riders / buses, 4) / capacity target, 4)
    [D] Efficiency         = 0.15 x [A]                       if [D2] >= 1.5
                             ([D2]-1)/0.5 x 0.15 x [A]         if 1.0 <= [D2] < 1.5
                             0                                 if [D2] < 1.0
    [E2] Density           = riders / square miles
    [E] Density supplement = max(0, (28 - [E2]) / 100) x [A2] x 0.55
    [F] Guarantee          = max( [F1] - ([A]+[B]+[C]+[D]+[E]), 0 )
                             -- [F1] is headed "FY21" and is the FY2020 base, R.C. 3317.019(A)(2)
    [G] Transportation     = ([A]+[B]+[C]+[D]+[E]+[F]) x general proration
    [J] SpEd transport     = max(state share, 0.5) x reported SpEd cost x 0.91746

    The school bus line is ROUNDDOWN to a tenth of a dollar, which no other line in the calculator
    is.
  function_tex: |
    \begin{aligned}
    b &= \text{public} + 2 \times \text{non-public} + 1.5 \times \text{community/STEM}
      && \text{weighted ridership} \\
    e &= \text{public miles} + 2 \times \text{non-public} + 1.5 \times \text{community/STEM}
      && \text{weighted miles} \\
    A_1 &= b \times 1337.175 && \text{per rider base} \\
    A_2 &= e \times 6.867 \times 180 && \text{per mile base} \\
    A &= \operatorname{ROUNDDOWN}\bigl( \max(A_1, A_2) \times \max(\text{state share},\ 0.5),\ 1 \bigr)
      && \text{school bus} \\
    B &= \text{mass transit riders} \times 1337.175 \times 0.35 && \text{mass transit} \\
    C &= \text{other riders} \times 1337.175 \times 0.50 && \text{other types} \\
    D_2 &= \operatorname{round}\biggl( \frac{\operatorname{round}(\text{riders} / \text{buses},\ 4)}{\text{capacity target}},\ 4 \biggr)
      && \text{efficiency index} \\
    D &= \begin{cases}
      0.15\,A & \text{if } D_2 \ge 1.5 \\
      \dfrac{D_2 - 1}{0.5} \times 0.15\,A & \text{if } 1.0 \le D_2 < 1.5 \\
      0 & \text{if } D_2 < 1.0
    \end{cases} && \text{efficiency} \\
    E_2 &= \frac{\text{riders}}{\text{square miles}} && \text{density} \\
    E &= \max\biggl( 0,\ \frac{28 - E_2}{100} \biggr) \times A_2 \times 0.55 && \text{density supplement} \\
    F_1 &= \text{FY2020 transportation, pre-reduction} && \text{guarantee base} \\
    F &= \max\bigl( F_1 - (A + B + C + D + E),\ 0 \bigr) && \text{guarantee} \\
    G &= (A + B + C + D + E + F) \times \text{general proration} && \text{transportation} \\
    J &= \max(\text{state share},\ 0.5) \times \text{reported SpEd cost} \times 0.91746
      && \text{SpEd transport}
    \end{aligned}
  statutory_basis: |
    R.C. 3317.0212, read — and it changes what kind of parameter the two rates are.

    **The section contains no dollar figure at all.** $1,337.175 per rider and $6.867 per mile are
    not chosen; they are **measured**. Division (C) directs the department to compute the statewide
    transportation cost per student by "dividing the district's total costs for school bus service
    in the previous fiscal year by its qualifying ridership in the previous fiscal year", then
    excluding "the ten districts with the highest transportation costs per student and the ten
    districts with the lowest". Division (D) does the same per mile. They are **trimmed means of
    what districts themselves reported spending last year**. [verified] (`ohio-laws`)

    That makes them a fourth kind of parameter in this corpus, beside the legislated, the delegated
    and the uncodified: a rate that moves when districts' own behaviour moves, with no one deciding
    it and no bill required. It also means the rates are endogenous — a year in which districts
    spend more on buses raises the rate they are paid at, and the trim is the only thing bounding
    that.

    The efficiency supplement's shape **is** statutory: division (F) states the 1.5 index threshold
    and the 0.15 multiplier the corpus carries. [verified] The 50% floor is in the section too.

    **So are the weights, and they sit on both bases.** Division (E)(1)(a) puts 1.5 on community
    and STEM riders and 2.0 on non-public ones; division (E)(1)(b) puts the same two multiples on
    *miles driven* for the same pupils. The crate had shown the department applies them — `[e]` is
    `public miles + 2 x non-public + 1.5 x community`, exactly, on every district — without
    matching that arithmetic to the clause that requires it. [verified] (crates/project)

    **The guarantee is statutory and it is one section away.** R.C. 3317.019(A)(2), under a name
    that never uses the word: *temporary transitional transportation aid*. [verified]
    (crates/project)

    **The 50% floor is the last term of a schedule, not a standing rule.** LSC's H.B. 33 analysis:
    "The minimum state share for transportation increases from 33.33% in FY 2023 to 37.50% in
    FY 2024 and 41.67% in FY 2025", and [H.B. 96](../legislation/hb-96-2025.yml) carries it to
    45.83% and then 50%. [verified]
    ([`crates/project`](../../../crates/project/tests/the_parameters_before_this_biennium.rs)) The
    five published values are eight through twelve twenty-fourths rounded to two places, so the
    floor has climbed from 33.33 to 50 percentage points in equal annual steps of a twenty-fourth.
    [verified]

    **And it is one decision, a year longer and an act wider than those five values show.**
    [H.B. 1 of the 134th General Assembly](../../catalog/ohio-bill-versions.md) — the plan as
    introduced in February 2021 — writes all six years out in a single clause, as *fractions*
    rather than as percentages: **seven** twenty-fourths in FY2022 through twelve in FY2027, four
    years before the last of the **three** acts that enacted them. The enacted section rounds the
    eleventh rather than carrying the bill's fraction, which is why the published series looks
    like decimals somebody chose: `forty-five and five-sixths` became `forty-five and
    eighty-three hundredths`. [verified]
    ([`crates/project`](../../../crates/project/tests/the_weight_the_legislature_never_explained.rs))
