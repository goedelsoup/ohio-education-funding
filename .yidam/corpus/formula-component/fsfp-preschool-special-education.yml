class: formula-component
label: FSFP Preschool Special Education
summary: >-
  $148 million, and the one component that combines a flat grant with a weight. The flat $4,000
  per pupil is 69% of the program, and a district's wealth does not touch that part of it.
description: |
  **$148m**, line `[P]`, and the one component that combines a flat grant with a weight. Each
  category pays `(ADM x $4,000) + (ADM x weight x average base cost x state share x 0.5)`, all of
  it prorated. [verified]

  ### The flat $4,000 is 69% of the program, and the state share does not touch it

  Only the
  weighted half is reduced by a district's wealth. So this is the one component in Ohio's school
  funding where the wealthiest district and the poorest are funded **identically** for most of what
  they receive. Whether that is deliberate levelling or an artefact of bolting a flat grant onto a
  weighted formula is not established. [open]

  ### The same six weights behave completely differently here

  [School-age special
  education](fsfp-special-education-weights.yml) is steeply top-heavy: Category 6 is 15% of the
  pupils and 48% of the money. Halved and sitting on a flat $4,000, the identical weight vector
  produces near parity — 5,761 Category 6 pupils draw $52.9m against 10,842 Category 2 pupils
  drawing $50.6m. [verified]

  That is the sharpest available argument for decomposing components rather than tabulating
  parameters. A table of Ohio's special education weights describes neither program, because what
  the weights do depends entirely on what sits beside them. [inference]

  ### Its proration factor and the limit beside it are both carried over

  This sheet carries an **appropriation limit** — $147,500,000 — in a cell beside the factor,
  which is the only place in the calculator that shows a proration's two halves at once. At the
  stated 0.96854448 the program totals **$148,408,184**, which is $908,184 over *that* cell.
  [verified — `crates/project/src/panel/supplements.rs`]

  **The cell is stale, and no proration arises.** $147,500,000 is the **FY2025** estimate. The
  enacted act's FY2026 and FY2027 remainder for preschool special education is **$153,976,832**,
  against which $148,408,184 is **$5,568,648 under**. The factor and the limit were carried over
  together from the prior biennium, so a published proration factor is not evidence that a
  proration applied. A third cell states $146,708,228.07, matching neither. See [appropriation
  proration factor](../parameter/appropriation-proration-factor.yml), which holds the full
  account. [verified — the enacted act's LSC analysis, read by
  `crates/project/src/ledger/budget_analysis.rs`]
