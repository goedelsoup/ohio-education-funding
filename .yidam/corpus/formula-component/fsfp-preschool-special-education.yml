revisions:
  - was: |
      At the stated 0.96854448 the program totals $148,408,184 against its own $147,500,000
      limit — $908,184 over — so the program is prorated.
    now: |
      $147,500,000 is the **FY2025** estimate. FY2026 and FY2027 are both $153,976,832, against
      which $148,408,184 is **$5,568,648 under**, and no proration arises. The factor and the
      limit beside it were carried over together from the prior biennium.
    found_by: |
      The correction was made in [appropriation proration
      factor](../parameter/appropriation-proration-factor.yml) from the enacted act's LSC
      analysis, and this node went on republishing the withdrawn reading as `[verified]` with no
      `revisions:` block of its own.
    reach: |
      The mechanism this node describes is unaffected — the flat grant, the halving and the six
      weights are all statutory. What changes is the claim that the appropriation binds: it does
      not, on the year being modelled. A withdrawal recorded in one node does not reach a second
      node that repeats the claim, which is the defect worth naming rather than the figure.
