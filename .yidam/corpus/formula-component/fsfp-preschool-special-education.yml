properties:
  name: Preschool special education
  function: |
    For each category k in 1..6:
      aid_k = ( (ADM_k x $4,000)
                + (ADM_k x weight_k x average base cost per pupil x state share x 0.5) )
              x proration

    weights = the six school-age weights, [0.2435, 0.6179, 1.4845, 1.9812, 2.6830, 3.9554]
    average base cost per pupil, FY2027 = $8,241.61
    proration = 0.96854448, stated beside a $147,500,000 cell that is the FY2025 estimate;
                the FY2027 appropriation is $153,976,832 and the program does not reach it

    Reported in [R] Total State Support and not in [N], so no guarantee holds it.
  function_tex: |
    \begin{aligned}
    \text{aid}_k &= \Bigl( \text{ADM}_k \times \$4{,}000 \\
      &\quad + \text{ADM}_k \times w_k \times \text{average base cost per pupil}
      \times \text{state share} \times 0.5 \Bigr) \\
      &\quad \times \text{proration} && k = 1 \ldots 6 \\
    w &= (0.2435,\ 0.6179,\ 1.4845,\ 1.9812,\ 2.6830,\ 3.9554) && \text{the school-age weights} \\
    \text{average base cost per pupil} &= \$8{,}241.61 && \text{FY2027} \\
    \text{proration} &= 0.96854448
    \end{aligned}
  statutory_basis: |
    R.C. 3317.0213, read. **Codified.** Division (A) states the formula as "($4,000 X the number of
    students who are preschool children with disabilities) + …", and every weighted term carries an
    explicit "X 0.50". Both the flat grant and the halving are the General Assembly's — which is
    what makes this the one component where the wealthiest district and the poorest are funded
    identically for most of what they receive, by design rather than by accident. The **proration**
    is not in the section and is not statutory; see [appropriation proration
    factor](../parameter/appropriation-proration-factor.yml). [verified — `ohio-laws`]
  calculator: |
    Not a standalone crate. Carried in `crates/project::panel::PreschoolSpecialEducation` and
    reproduced for all 609 districts in
    `crates/project/tests/the_supplements_outside_the_formula.rs`.
  fy2027_scale: |
    $148.4m across 26,501 preschool pupils in 606 districts; the flat component is $102.7m of it.
    [verified]
