class: actor
label: Ohio General Assembly
summary: >-
  Ohio's bicameral legislature, and the body Article VI, Section 2 addresses directly: the duty
  to secure a thorough and efficient system falls on it rather than on the department or the
  districts. Every funding regime here is an act of this body.
description: |
  Ohio's bicameral legislature — 99 House members and 33 Senators — and the body Article VI,
  Section 2 addresses directly: the constitutional duty to secure a thorough and efficient
  system of common schools is laid on the General Assembly, not on the Department of Education
  or on districts. [verified] Every Ohio funding regime was created by an act of this body, and
  the school funding formula is enacted inside the biennial operating budget rather than as
  standalone legislation, which means it is renegotiated in full every two years alongside
  every other appropriation. [verified]

  That biennial rhythm is itself a structural fact about Ohio school funding. A formula
  designed with a multi-year phase-in has no protection from a later General Assembly choosing
  not to continue it, and the Fair School Funding Plan's phase-in has been re-legislated in
  each of three consecutive budgets rather than guaranteed by the enactment that created it.
  [inference]

  ### The member's own unit does not exist in the funding system

  A House member votes on a formula whose every output is computed per school district, and
  Ohio publishes no figure for what a House district's schools receive — not because it is
  withheld but because no part of the system has ever needed the number. [verified]

  The reason is structural rather than administrative: school districts and House districts do
  not nest. **339 of Ohio's 609 school districts have population in two or more of the 99 House
  districts**, and Columbus City has population in 11. [verified — computed from Census
  block geography] County can be an attribution, because the department assigns each district
  exactly one; a legislative district cannot be, because most districts genuinely lie in
  several.

  **The body that sets the formula is districted on population and the formula pays on
  pupils**, and those two are not distributed alike: Ohio is 22.0% under 18 statewide and that
  share varies widely between seats. A House district is by construction equal to its
  neighbours in people and unequal in children. [inference]
findings: |
  So the corpus now derives it, by joining Ohio's 276,428 census blocks to their school
  district and their House district and apportioning each district's funding by under-18
  population. [verified — [Census block geography](../../catalog/census-block-geography.md),
  joined to the funding model through the [NCES CCD
  directory](../../catalog/nces-ccd-lea-directory.md), carried in
  `crates/project/src/legislative_district.rs`]

  Every figure that produces is an **estimate**, and the corpus holds it as one. Conservation
  is exact in the arithmetic and not in the published figures: each school district's shares
  sum to one, so the apportionment loses no dollar by construction — but the feed carries each
  seat's total as a rounded dollar figure, and summing 99 of them accumulates. On the committed
  feed the House seats total $7,281,227,593.71 and the Senate seats $7,281,227,592.75 against a
  statewide `realized_aid_total` of $7,281,227,591.65: **the two chambers disagree by $0.96, and
  the House sits $2.06 above the statewide figure and the Senate $1.10.** [verified — `web/public/data/bundle.json`] Read
  the conservation as a property of the method, not as a check a consumer can run to the cent.
  What the estimate supports is
  scale and comparison — how much of Ohio's school money runs through the schools a member
  represents, and how many of those districts are on the guarantee. What it cannot support is
  any statement about a district's entitlement, which is exact and belongs to the district.
  [verified]
