revisions:
  - was: |
      "The two chambers disagree by **$0.97** and each sits $1-2 above the statewide figure."
    now: |
      **$0.96.** The two totals it is drawn from were right — $7,281,227,593.71 and
      $7,281,227,592.75 — and their difference was not. The House sits **$2.06** above
      `statewide.realized_aid_total` and the Senate **$1.10**, so "each sits $1-2 above" was
      also just outside on one side.
    found_by: |
      Subtracting the two figures printed beside it, from the committed feed, while auditing
      #128.
    reach: |
      The instruction the passage exists to give is unchanged: do not reconcile the chambers to
      the cent. The same figure was carried by `crates/bundle`'s rustdoc, the Zod schema comment
      and the catalog entry, and all four are corrected together.
properties:
  name: Ohio General Assembly
  institution_type: legislature
  established: 1803-03-01
  authority: |
    Holds the Article VI, Section 2 duty to provide for a thorough and efficient system of
    common schools. Enacts the biennial operating budget, which carries the school funding
    formula, the appropriation levels that determine phase-in, and the statutory text of every
    parameter. Levies and constrains local taxation authority.
  publishes: |
    Enrolled bill text and session laws via the Legislative Service Commission; fiscal notes
    and budget analyses (redbooks); the Catalog of Budget Line Items.
