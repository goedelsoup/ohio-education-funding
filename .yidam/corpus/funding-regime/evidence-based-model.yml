class: funding-regime
label: Evidence-Based Model
summary: >-
  Ohio's most direct attempt to answer DeRolph on its own terms, and the shortest-lived regime
  here. It specified the resources an adequate education requires, priced each, and summed them
  per district — then was repealed before its third year.
description: |
  Ohio's most direct attempt to answer *DeRolph* on its own terms, and the shortest-lived of its
  funding regimes. Instead of declaring a base cost, the Evidence-Based Model specified
  the resources an adequate education requires — class sizes, instructional staff per pupil,
  counselors, tutors, professional development, technology, building operations — priced each
  at a defined rate, and summed them into a district-specific adequacy amount. [verified]
  The name refers to the claim that each specified resource level was supported by research
  on what improves student outcomes.

  Structurally this is the answer to residual budgeting: the amount is built up from
  components rather than divided down from an appropriation, so the question "why this number"
  has an answer that does not reduce to "that is what was available." [inference]

  It operated for two fiscal years. H.B. 153 repealed it in 2011, before the third year of a
  ten-year phase-in. [verified] Because it never ran at its designed funding level, the model
  was never tested against the outcomes it was built to produce — the corpus can say what it
  would have cost but not what it would have achieved. [inference] Its two operating years
  also coincided with federal stabilization funding, so the state-share figures for FY2010-11
  are not comparable to adjacent years without separating the federal component. [inference]
findings: |
  ### Its last run is still funding Ohio

  The regime operated for two fiscal years, FY2010 and FY2011, and was repealed before the third.
  That makes it the shortest-lived regime in this corpus and, by one measure, the longest-acting:
  **FY2011 is the first term of the anchor chain that funds nearly half of Ohio's districts in
  FY2027.** [verified — [`bridge-formula`](bridge-formula.yml)]

  H.B. 153 did not compute a new starting point. It took each district's FY2011 allocation, divided
  by a recalculated FY2011 ADM to get a per-pupil figure, and adjusted that figure by where the
  district's **charge-off valuation** stood against the statewide median — the same charge-off
  valuation this regime used for the local share of the adequacy amount. A district that never
  cleared a guarantee afterwards has been carried on that figure through six re-anchorings.
  [verified]

  So a corpus that reads only current-law documents will find no trace of this regime in any
  district's FY2027 funding, and it is there — sixteen years down, inside `[H2]`. What is not
  established is how much of any particular district's base is still the FY2011 term. [open]

properties:
  name: Evidence-Based Model
  effective_from: FY2010
  effective_to: FY2011
  distribution_logic: |
    A district adequacy amount was built by specifying resource quantities per pupil or per
    building (staffing ratios, support personnel, professional development, technology,
    operations), pricing each at a defined rate, and summing. Local share was subtracted; the
    state paid the remainder. Designed for a ten-year phase-in toward the full computed
    amount.
  status: superseded
  boundary_note: |
    Repealed by [Am. Sub. H.B. 153](../legislation/hb-153-2011.yml) (2011), before the third year
    of a ten-year phase-in.

    **`superseded` is right about the regime and wrong as a description of its effects.** The act
    that repealed it carried its last run forward: Bridge formula aid begins from each district's
    FY2011 state aid per pupil, and the wealth index it is adjusted by divides by the charge-off
    valuation this regime used to compute a district's local share of the adequacy amount. Every
    later act re-anchored on the year before its own biennium, and the Fair School Funding Plan's
    guarantee has held at FY2020 since. See
    [`bridge-formula`](bridge-formula.yml) for the full chain. [verified] (the greenbook)
