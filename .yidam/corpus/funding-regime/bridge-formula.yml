class: funding-regime
label: Bridge Formula
description: |
  The decade between two attempts at costing out an education, and the regime that shows what
  Ohio does when it has no formula it believes in. Enacted by H.B. 153 in 2011 as an explicit
  placeholder after the Evidence-Based Model was repealed, the bridge approach distributed aid
  largely by reference to what each district had received previously, adjusted by caps
  limiting year-over-year gains and guarantees limiting year-over-year losses. [verified]

  Caps and guarantees are worth understanding as a mechanism, because they detach funding from
  whatever the formula computes. A district whose computed amount rises sharply receives the
  capped amount instead; a district whose computed amount falls receives the guaranteed
  amount instead. When enough districts are on a cap or a guarantee, the operative
  distribution is the prior year's distribution, and the formula becomes advisory. [inference]
  How many districts sat outside the formula in each year of this period is a decisive number
  this node does not yet carry. [open]

  [H.B. 153](../legislation/hb-153-2011.yml) did two further things that compounded the effect
  on the districts least able to absorb it: it removed the funding guarantee, and it began the
  phase-out of the tangible personal property tax replacement payments. [verified] A district in
  an industrial county experienced FY2012 as three simultaneous reductions — the formula freeze,
  the expiry of federal stimulus, and the reimbursement phase-out — none of which is visible in
  a base cost figure. [inference]

  The statewide expenditure record carries a matching signature, and deflating it sharpens the
  picture considerably. In constant FY2022 dollars, per-pupil operating expenditure fell from
  $15,226 in FY2010 to $14,173 in FY2014 — a real decline of about 7%, leaving FY2014
  indistinguishable from FY2006's $14,166. [inference — computed by `deflate`; see
  [per-pupil-operating-expenditure](../metric/per-pupil-operating-expenditure.yml)] It did not
  regain the FY2010 level until FY2018, by which point this regime had been running for six
  years.

  So the decade is not, as the nominal series suggests, a period of flat spending. It is a
  real decline followed by a slow recovery, with the trough at FY2014. [inference] Whether the
  Bridge formula caused it or merely coincided with the stimulus withdrawal and the recession's
  effect on local revenue is still not established — but the thing to be explained is now a
  specific shape with a datable trough rather than an absence of movement. [open]

  The period closed with the funding levels for FY2020 and FY2021 frozen rather than
  computed. [verified] Ohio therefore entered the Fair School Funding Plan having distributed
  aid on the basis of history rather than need for the better part of ten years, which is why
  the plan's designers treated recosting from current data as the point of the exercise.
  [inference]

  **And this regime did not end when it was superseded.** FY2020 — one of the two frozen years,
  under a formula that was explicitly a placeholder — is the baseline for the Fair School
  Funding Plan's
  [temporary transitional aid guarantee](../formula-component/temporary-transitional-aid-guarantee.yml),
  and it has never been re-based. [verified] In FY2027, at 100% phase-in, **48.3% of Ohio
  districts are funded at their FY2020 level rather than by the plan**, at a cost of $879
  million. [verified]

  So the Bridge formula's last frozen year still governs the funding of nearly half the state
  seven years after the regime was replaced. The plan that was meant to end distribution-by-
  history inherited it as a floor. [inference] Whether that is a transitional artefact that
  erodes as the formula grows, or a permanent feature, depends on facts the corpus does not
  have — but for the wealthiest quartile of guaranteed districts the FY2027 formula produces
  only 43% of the FY2020 level, so erosion would be slow. [verified for the ratio; inference
  for the conclusion]
properties:
  name: Bridge Formula
  effective_from: FY2012
  effective_to: FY2021
  distribution_logic: |
    Aid was set by reference to prior-year amounts, modified by successive budgets through
    caps on year-over-year increases and guarantees against year-over-year decreases, with
    varying formula overlays across the period. FY2020 and FY2021 were funded at frozen
    levels.
  status: superseded
  boundary_note: |
    Treated as one regime for a decade that in fact contained several distinct formula
    overlays, including the FY2014-15 and FY2016-17 designs. Whether these warrant separate
    regime nodes, or whether the caps-and-guarantees mechanism is the real continuity, is
    unresolved. [open]
