class: funding-regime
label: Bridge Formula
summary: >-
  The decade between two attempts at costing out an education. Enacted in 2011 as an explicit
  placeholder after the Evidence-Based Model was repealed, it distributed aid by reference to
  what each district had received before, inside caps and guarantees.
description: |
  The decade between two attempts at costing out an education, and the regime that shows what
  Ohio does when it has no formula it believes in. Enacted by H.B. 153 in 2011 as an explicit
  placeholder after the Evidence-Based Model was repealed, the bridge approach distributed aid
  largely by reference to what each district had received previously, adjusted by caps limiting
  year-over-year gains and guarantees limiting year-over-year losses. [verified]

  Caps and guarantees are worth understanding as a mechanism, because they detach funding from
  whatever the formula computes. A district whose computed amount rises sharply receives the
  capped amount instead; a district whose computed amount falls receives the guaranteed amount
  instead. When enough districts are on a cap or a guarantee, the operative distribution is the
  prior year's distribution, and the formula becomes advisory. [inference] How many districts
  sat outside the formula in each year of this period is not established. [open]

  [H.B. 153](../legislation/hb-153-2011.yml) did two further things that compounded the effect
  on the districts least able to absorb it: it removed the funding guarantee, and it began the
  phase-out of the tangible personal property tax replacement payments. [verified] A district
  in an industrial county experienced FY2012 as three simultaneous reductions — the formula
  freeze, the expiry of federal stimulus, and the reimbursement phase-out — none of which is
  visible in a base cost figure. [inference]

  **And this regime did not end when it was superseded.** FY2020 — one of the two frozen years,
  under a formula that was explicitly a placeholder — is the baseline for the Fair School
  Funding Plan's [temporary transitional aid
  guarantee](../formula-component/temporary-transitional-aid-guarantee.yml), and it has never
  been re-based. [verified] In FY2027, at 100% phase-in, **48.3% of Ohio districts are funded
  at their FY2020 level rather than by the plan**, at a cost of $879 million. [verified]

  So the Bridge formula's last frozen year still governs the funding of nearly half the state
  seven years after the regime was replaced. The plan that was meant to end distribution-by-
  history inherited it as a floor. [inference] Whether that is a transitional artefact that
  erodes as the formula grows, or a permanent feature, depends on facts the corpus does not
  have — but for the wealthiest quartile of guaranteed districts the FY2027 formula produces
  only 43% of the FY2020 level, so erosion would be slow. [verified for the ratio; inference
  for the conclusion]
findings: |
  ### The anchor chain, which is what the decade actually did

  Each biennium re-read the guarantee's anchor and left the mechanism alone. Because every base
  includes the *previous* biennium's transitional aid term, a district on the guarantee throughout
  carries its earliest anchor forward the whole way. [verified — each act's own formula box in its
  greenbook, committed at
  [`lsc-education-greenbooks.txt`](../../../crates/project/fixtures/lsc-education-greenbooks.txt)]

      H.B. 59   FY2014-15   100% of FY2013 state aid, base = FY2013 Bridge formula funding
                            + supplemental guarantee + high performance subsidy
                            gain cap 6.25% (FY2014), 10.5% (FY2015)
      H.B. 64   FY2016-17   100% of FY2015; career-technical funds moved outside the
                            guarantee in FY2017 and subtracted from the base
      H.B. 49   FY2018-19   100% of FY2017 — except 95% for districts whose ADM fell 10% or
                            more FY2014→FY2016, scaled from 5%. Base explicitly includes
                            FY2017 temporary transitional aid
      H.B. 166  FY2020-21   no formula: each district's FY2019 allocation, formula amount and
                            state share index frozen at FY2019
      H.B. 110  FY2022-     the Fair School Funding Plan anchors its guarantee at FY2020

  **And it terminates.** The FY2013 base is Bridge formula funding, and
  [H.B. 153](../legislation/hb-153-2011.yml) defines that as each district's **FY2011 state aid per
  pupil** — actual FY2011 allocation over recalculated FY2011 ADM — adjusted by where its charge-off
  valuation per pupil sits against the statewide median, applied to current-year pupils, with a
  floor at **FY2011 total aid net of its federal stimulus portion**. [verified] (the greenbook)

      FY2011      Evidence-Based Model run, net of stimulus
        ↓         H.B. 153: FY2011 per pupil, wealth-indexed, x current ADM; floor at FY2011
      FY2013      H.B. 59:  100% of FY2013
      FY2015      H.B. 64:  100% of FY2015
      FY2017      H.B. 49:  100% of FY2017, or 95% for the fastest-emptying districts
      FY2019      H.B. 166: no formula — every district's FY2019 amount
      FY2020      H.B. 110: the Fair School Funding Plan anchors here, and has never re-based
      FY2027      still held there, at 100% phase-in

  **Sixteen years, six links, and the origin is a formula that no longer exists.** FY2011 state aid
  was computed under the [Evidence-Based Model](evidence-based-model.yml) — including the charge-off
  valuation the index divides by, which the greenbook names as the EBM's own adequacy-share
  valuation — and the act that carried FY2011 forward is the act that repealed it. A district
  guaranteed in every biennium since FY2012 is funded in FY2027 on a per-pupil figure produced by a
  regime this corpus models as superseded. [verified]

  ### The one act of policy the decade contains

  Re-reading an anchor is not a decision about a district; it is a decision about a date. The only
  time the mechanism distinguished between districts on it was H.B. 49's 95% floor for the fastest-
  emptying districts — one condition, in ten years, in four acts. [inference]

  The statewide expenditure record carries a matching signature, and deflating it sharpens the
  picture considerably. In constant FY2022 dollars, per-pupil operating expenditure fell from
  $15,226 in FY2010 to $14,173 in FY2014 — a real decline of about 7%, leaving FY2014
  indistinguishable from FY2006's $14,166. [inference — computed by `deflator`; see
  [per-pupil-operating-expenditure](../metric/per-pupil-operating-expenditure.yml)] It did not
  regain the FY2010 level until FY2018, by which point this regime had been running for six
  years.

  So the decade is not, as the nominal series suggests, a period of flat spending. It is a real
  decline followed by a slow recovery, with the trough at FY2014. [inference] Whether the
  Bridge formula caused it or merely coincided with the stimulus withdrawal and the recession's
  effect on local revenue is still not established — but the thing to be explained is now a
  specific shape with a datable trough rather than an absence of movement. [open]

  The period closed with the funding levels for FY2020 and FY2021 frozen rather than computed.
  [verified] Ohio therefore entered the Fair School Funding Plan having distributed aid on the
  basis of history rather than need for the better part of ten years, which is why the plan's
  designers treated recosting from current data as the point of the exercise. [inference]
properties:
  name: Bridge Formula
  effective_from: FY2012
  effective_to: FY2021
  distribution_logic: |
    Aid was set by reference to prior-year amounts, modified by successive budgets through
    caps on year-over-year increases and guarantees against year-over-year decreases, with
    varying formula overlays across the period. FY2020 and FY2021 were funded at frozen
    levels — literally, at each district's FY2019 allocation, by
    [H.B. 166](../legislation/hb-166-2019.yml).
  status: superseded
  boundary_note: |
    One regime, four acts, and the question is settled: **the caps-and-guarantees mechanism is
    the continuity.** It survives every biennium unchanged in kind while the formula over it is
    built (H.B. 59), extended (H.B. 64), made conditional (H.B. 49) and finally not run at all
    (H.B. 166) — and in that last biennium the bounds are the whole of the distribution. A regime
    boundary drawn at a formula overlay would cut the mechanism that persisted and keep the ones
    that did not. [verified] (the four greenbooks)
