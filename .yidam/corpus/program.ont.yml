class: program
label: Funding Program
foundational_type:
  ontology: ufo
  type: relator
description: |
  A separately-authorized initiative that moves education money outside the base formula,
  binding the state, a recipient, and usually a district whose funding is affected — a
  scholarship or voucher, a facilities assistance program, a competitive grant. It is a
  Relator rather than a bare edge because the arrangement carries its own identity and
  history: an eligibility rule, an appropriation line, an administering body, a per-pupil
  amount, and in several cases its own litigation. It is kept distinct from revenue-stream
  because a voucher is not a channel of money to a district but a diversion away from one.
properties:
  - name: name
    type: string
    description: Program name as it appears in statute and appropriation documents
  - name: mechanism
    type: string
    description: deduction | direct-appropriation | reimbursement | competitive-grant
  - name: eligibility
    type: text
    description: Who qualifies, and how eligibility has changed over time
  - name: amount
    type: text
    description: Per-recipient or per-project amount, by fiscal period
  - name: appropriation_line
    type: string
    description: Budget line item identifier
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. A large share of the corpus's edges
# use a relationship no class declares, and almost all of those are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject those edges or bloat every ontology with
# declarations that each describe one link.
#
# The counts are measured — see "relationship vocabulary" in `.yidam/corpus/README.md`. They are
# not repeated here, because they were: this comment carried three hand-written figures, fifteen
# ontologies carried the same copy, and every figure was stale before anybody re-measured.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: diverts-from
    target: education-agency
    direction: out
    description: The agency whose funding is reduced or displaced by this program
  - relationship: funds
    target: education-agency
    direction: out
    description: An agency this program pays money to, as capital assistance programs do
  - relationship: challenged-by
    target: litigation
    direction: in
    description: A case testing this program's lawfulness
  - relationship: created-by
    target: legislation
    direction: in
    description: The enactment that established the program
  - relationship: administered-by
    target: actor
    direction: in
    description: The institution that operates the program
