class: doctrine
label: Doctrine
foundational_type:
  ontology: ufo
  type: kind
description: |
  A normative principle or analytical frame against which the funding system is judged —
  the constitutional standard of a thorough and efficient system, the distinction between
  adequacy and equity, local control, the residual-budgeting critique, phantom revenue.
  It is a Kind because a doctrine's identity is fixed by its content: adequacy does not
  become equity under any circumstance. Doctrines exist as nodes so the corpus can answer
  whether a regime was fair, not only what it paid.
properties:
  - name: name
    type: string
    description: The principle's common name
  - name: origin
    type: string
    description: Where the principle enters the domain — constitutional text, a decision, or scholarship
  - name: formulation
    type: text
    description: The principle stated precisely enough to be applied to a specific regime
  - name: contested
    type: text
    description: What is disputed about the principle, and by whom
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. A large share of the corpus's edges
# use a relationship no class declares, and almost all of those are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject those edges or bloat every ontology with
# declarations that each describe one link.
#
# The counts are measured — see "relationship vocabulary" in `.yidam/corpus/README.md`. They are
# not repeated here, because they were: this comment carried three hand-written figures, fifteen
# ontologies carried the same copy, and every figure was stale before anybody re-measured.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: tensions-with
    target: doctrine
    direction: out
    description: A principle this one trades against, such that advancing one may cost the other
  - relationship: grounded-in
    target: legislation
    direction: out
    description: The constitutional or statutory text this principle originates in
  - relationship: invoked-by
    target: litigation
    direction: in
    description: A case that reasoned from this principle
  - relationship: applied-to
    target: funding-regime
    direction: in
    description: A regime that has been judged against this principle
  - relationship: operationalized-by
    target: metric
    direction: in
    description: A computable measure that renders this principle testable
