findings: |
  ### Retiring the guarantee is two bills, and they price an order of magnitude apart

  Section 265.225 decides what a guarantee retirement costs, and no lever over the guarantee contains the
  answer. Both, against the FY2027 model:

                       foundation aid   Sec. 265.225 stands   repealed alongside
      removal                -$879.0M               -$79.8M             -$942.5M
      half phase-out         -$439.5M               -$70.8M             -$503.1M
      rebase to 90%          -$248.2M               -$66.2M             -$311.8M

  [verified] Left standing, `[K]` absorbs **$799.1M** of the $879.0M a removal takes off
  foundation aid, and the three policies stop being three policies: a gross range of **3.54** to
  one collapses to **1.21** to one. The middle column is current law, and it says a guarantee
  retirement is nearly free and very nearly rule-invariant. The right column is what *retiring the
  guarantee* means as a policy rather than as a lever. Neither alone is the answer.

  The left column is the one this node published as the cost for eleven phases. It is the right
  number for the wrong quantity — what comes off `[H] + [I]` — and no district's cheque falls by
  it. The measure matters more than the model here: `biennium::Measure` separates foundation aid
  from total state support, and these two columns differ by nothing else.

  ### A guarantee-only lever reaches 167 districts, and 442 are out of reach

  Removal, a half phase-out and a rebase reach **exactly the same districts** — a floor that stops
  holding somebody cannot start holding somebody else — and that set is **167** districts, not the
  294 the guarantee pays. The other **127** are made whole by `[K]`, and they are precisely the 127
  guaranteed districts *already drawing* it: a district at its `[L1]` ceiling is held at a **total**,
  so anything taken off its guarantee is put back pound for pound. [verified]

  **No policy applied to the guarantee alone reaches the **442** districts it does not decide.**
  That is this node's structural claim and the scope is the correction: it was published
  as 315 — the districts the formula pays — which left out the 127 the backstop catches. Extend the
  bill to Section 265.225 and the reach is **311**, past the 294 the guarantee pays, by the **17**
  districts that draw `[K]` and were never on the guarantee. [verified] So the guarantee question
  and the adequacy question are disjoint, and the *hold-harmless* question and the adequacy
  question are not: one of the two devices reaches districts the formula pays.

  ### The largest per-pupil loser is a wealthy suburb, and the poorest district loses nothing

  This is the finding that inverted. Under a half phase-out East Cleveland City loses **$6,489 per
  pupil** of foundation aid — more than twice the next district, on assessed valuation of $141,623
  per pupil against a statewide median of $248,097. Its total state support falls by **zero**:
  `[K]` holds it at `[L1]` to the cent, under a half phase-out and under outright removal alike,
  where the narrow measure says $12,978 per pupil. [verified]

  The largest real per-pupil loss on a removal belongs to **West Geauga Local**, at **$797** per
  pupil on valuation of $604,523 — two and a half times the state's median. Across the set the
  median loser sits at **$318,480** of valuation per pupil and the median district it makes whole
  at **$257,278**. [verified] The backstop therefore filters a guarantee retirement **up** the
  wealth distribution: the districts it catches are the poorer half of the guaranteed population,
  so what is left to cut is the richer half.

  That does not overturn the finding that the guarantee is a wealth mechanism — see
  [`temporary-transitional-aid-guarantee`](../formula-component/temporary-transitional-aid-guarantee.yml),
  whose own quintile table already had the per-pupil loss rising with wealth. It strengthens it,
  and it withdraws the exception this node had recorded against it. *Whether* a district is on the
  guarantee is predicted by property wealth; *how much of a retirement it actually bears* is
  predicted by property wealth too, once the device standing behind it is in the model. The 50 most
  guarantee-dependent districts still have a median valuation of $349,582, well above the state's.
  [inference]

  ### The guarantee is a shock absorber that wears out, and the backstop bills for it up front

  Raising base cost costs the state more per point the higher it goes, because each increment lifts
  more districts off the guarantee and onto a formula that then has to pay them:

      base cost   foundation aid   [K] clawback   total state support   on guarantee   $/point
      +2%          +$106.6M          -$5.0M          +$101.7M               269         $50.8M
      +5%          +$288.1M         -$20.9M          +$267.1M               243         $55.1M
      +10%         +$639.7M         -$42.4M          +$597.3M               204         $66.0M
      +20%       +$1,443.3M         -$51.4M        +$1,391.8M               153         $79.5M

  [verified] The gradient is monotone and steep: the first two points cost **$50.8M** each and
  the last ten cost **$79.5M** each. A fiscal note scoring a large increase by extrapolating from a
  small one **understates the cost**, and the error grows with the size of the proposal — which is
  the direction that matters, since it is the large proposals that get scored this way. The state is
  buying back its own guarantee, and the price rises as it does.

  Here `[K]` runs the *other* way from a guarantee cut. Raising base cost raises realized aid,
  which reduces the supplement, so the clawback makes an increase cheaper than the foundation
  column says — and because it is proportionally largest on the smallest increase (4.7% of +2%
  against 3.6% of +20%), it makes the gradient **steeper** rather than flatter. The warning is
  therefore stronger on the measure a cost is quoted in than on foundation aid alone, which is the
  one place in this node where the correction went that way. What it is not is *half-price*: the
  first two points are about two thirds the price of the last ten, which was true of the figures
  this node published as well and was overstated in the sentence beneath them.

  The foundation column moved too, and `[K]` is not why. It reads **+$106.6M** at two per cent
  where this node published **+$95.4M**, because `base_cost_scale` was given the categoricals
  priced in base cost on 2026-08-09 — recorded at
  [`the-scenario-models-ohio`](../../decisions/scenario-models-ohio.yml), forty days before the
  backstop was modelled at all. The two corrections run opposite ways and nearly cancel:
  **+$11.2M** of categorical scaling against **-$5.0M** of clawback, which is the whole of the
  $6.3M between the figure this node published and the one it now reports. That is the hazard in
  a net figure, and the reason the foundation column is bound here beside the total: a table
  carrying only the net could absorb two unrelated corrections and look very nearly unchanged.

  ### It makes the state's cost predictable — and so does the backstop, on its own

  This is the projection leg and is reported apart from everything above. Carrying each district's
  enrollment forward to **FY2032** by a damped trend from its own FY2024-FY2026 history — statewide
  ADM falls 1.3% — foundation aid under current law is **$7,233M, in a band of $6,958M to $7,582M**
  (±4.3%). With the guarantee removed the same enrollment forecast gives **$6,301M, in a band of
  $5,831M to $6,809M** (±7.8%). [inference] (a forecast, with the caveats below)

  Those are foundation aid, and on total state support the comparison **disappears**. Current law is
  **$8,021M** at a half-width of **4.23%**; the guarantee removed is **$7,943M** at **4.16%** — not
  wider, slightly narrower. `[K]` is itself a floor against a fixed FY2021 total, so it inherits the
  absorbing the guarantee gives up: it is **$926.8M** at FY2032 against $63.6M at FY2027. Repeal
  Section 265.225 beside the guarantee and the half-width is **7.77%**, which is where the doubling
  actually lives. [verified]

  **Retiring the hold-harmless system nearly doubles the state's exposure to enrollment forecast
  error. Retiring the guarantee alone does not.** That is an argument with nothing to do with
  equity or adequacy — it is a budget-stability instrument, working by transferring enrollment risk
  from the state's appropriation to the districts' own planning — and what is new is that the
  instrument is not the guarantee. A device paying $63.6m to 144 districts delivers nearly all of
  it, latently, because what it guarantees is a total. Nobody appears to defend either device on
  these grounds. [inference]

  **18** districts move onto the guarantee between FY2027 and FY2032 under current law, 294 to
  312 — enrollment decline moves the count by about three percentage points of the state, because
  it is already nearly half.

  This paragraph read "only two districts, 294 to 292" until the figures were rechecked against
  the model. That was wrong at the damping of the day as well: at 0.85 the count went 294 to 360,
  and the direction word contradicted its own numbers. It was the one figure on this node that no
  test pinned, which is why it could be wrong in two ways at once and stay that way — it is bound
  now, as `project/districts-on-the-guarantee-fy2032`, along with the six band figures beside it
  that were in the same position. Every delta on this node is bound now too, which is the other
  half of the same lesson and took two more corrections to learn.
properties:
  name: Phasing out the temporary transitional aid guarantee
  question: |
    What does removing, re-basing, or phasing out the temporary transitional aid guarantee do
    to Ohio's districts — under each of the two things the uncodified section that backstops it
    could do — and what does raising base cost cost while it is in place?
  perturbations: |
    guarantee            as-enacted -> removed | rebase:<factor> | phase-out:<remaining>
    backstop             as-enacted -> repealed     (Section 265.225, priced against every rule)
    base_cost_scale      1.00 -> 1.02, 1.05, 1.10, 1.20
    minimum_state_share  0.10 as enacted for FY2026-27, not the 0.05 the plan began with
    phase_in             base cost and categoricals separately, both 1.00 at baseline

    Every run is a simulation at observed enrollment against the department's own FY2027 model,
    which `project::policy::current_law` reproduces to the cent for all 609 districts. Only the
    FY2032 block projects anything.

    `backstop` is a second dial rather than part of the guarantee rule because the two are separate
    instruments in separate law: R.C. 3317.019 names its own years, Section 265.225 is uncodified law of
    H.B. 110 extended by H.B. 96, and a bill could plainly do either.
  input_projections: |
    One leg only, and it is reported apart from every other figure. Enrolled ADM is carried to
    FY2032 by a damped trend (damping 0.30, fitted — see
    [the-fitted-damping](../../decisions/the-fitted-damping.yml)) from a rate that is three-tenths
    the district's own FY2024-FY2026 history and seven-tenths its fourteen-year rate in the
    Census F-33 panel (see [the-shrunk-rate](../../decisions/the-shrunk-rate.yml)), and the
    whole formula is re-run at the low, central, and high end of each district's band rather
    than scaling a central answer — the guarantee is a `max`, so the aid curve has a kink that
    scaling cannot reproduce. `[K]` is a second kink, in the other direction, and is re-derived at
    each end of the band rather than carried across from the central run.

    Assessed valuation is held fixed. It cannot be projected: the corpus has one observation per
    district and Ohio valuation steps on a county reappraisal cycle rather than moving smoothly.
    Local capacity is 60% valuation, so the local side of every projection here is an assumption.
  horizon: FY2027, with one projected leg to FY2032
  results_path: |
    crates/project — `cargo run -p project --bin edfund-project -- --guarantee <rule>
    [--backstop repealed]`. Pinned by crates/project/tests/ — the savings table by
    `what_retiring_the_guarantee_actually_saves.rs` — and by the checkpoints in crates/bundle,
    which the web layer re-derives and must reproduce before it will render a scenario.
  results: |
    total state support, 609 districts, FY2027        Sec. 265.225 stands   repealed alongside
    removal                                                       -$79.8M             -$942.5M
    half phase-out                                                -$70.8M             -$503.1M
    rebase to 90%                                                 -$66.2M             -$311.8M
    districts cut                                                     167                  311
    districts unmoved                                                 442                  298

    foundation aid, the same three rules: -$879.0M, -$439.5M, -$248.2M. Districts cut on that
    measure: 294 under all three. The difference between the two blocks is `[K]`.

    base cost   foundation aid   [K] clawback   total state support   on guarantee   $/point
    +2%          +$106.6M          -$5.0M          +$101.7M               269         $50.8M
    +5%          +$288.1M         -$20.9M          +$267.1M               243         $55.1M
    +10%         +$639.7M         -$42.4M          +$597.3M               204         $66.0M
    +20%       +$1,443.3M         -$51.4M        +$1,391.8M               153         $79.5M

    FY2032 at projected enrollment, foundation aid — current law: $7,233M in a band of $6,958M to
    $7,582M. With the guarantee removed: $6,301M in a band of $5,831M to $6,809M.
    The same on total state support: $8,021M at +/-4.23%, and $7,943M at +/-4.16%. With Section 265.225
