class: scenario
label: Phasing Out the Temporary Transitional Aid Guarantee
summary: >-
  What Ohio's FY2027 model pays if the temporary transitional aid guarantee is removed or wound
  down. A re-run of the department's own model with one lever moved, at observed enrollment — a
  simulation, not a forecast.
description: |
  **RUN.** Reproduce with `cargo run -p project --bin edfund-project -- --guarantee <rule>`.
  Every figure below is a **simulation**, not a forecast: it re-runs the department's own
  FY2027 model with one lever moved, at observed enrollment. Where a projection is used it is
  labelled and reported separately, per [`skills/project`](../../skills/project.md).

  Ohio's FY2027 model pays **$7,281 million** in state foundation aid to 609 districts. **$879
  million of it — 12.1% — is the temporary transitional aid guarantee**, paid to **294
  districts** holding just over half the state's students, holding them at what they received
  in **FY2020**: a [Bridge formula](../funding-regime/bridge-formula.yml) year Ohio froze
  rather than computed. [verified — `crates/project`, which reproduces the department's model to
  the cent]

  This scenario generalises [fsfp-input-year-refresh](fsfp-input-year-refresh.yml) from the
  single district that node refreshes to the whole state.
figures:
  - key: project/districts-on-the-guarantee
    value: 294
    field: description
    as_written: "paid to **294\n  districts**"

findings: |
  ### The three policies are not variants of each other

      removal              -$879.0M    294 districts cut, 315 untouched
      half phase-out       -$439.5M    294 districts cut, 315 untouched
      rebase to 90%        -$87.9M     294 districts cut, 315 untouched

  Removal and phase-out reach exactly the same districts and differ only in depth, because the
  guarantee is a floor and lowering a floor cannot catch anyone the floor was not already
  holding. **No policy applied to the guarantee can reach the 315 districts the formula already
  pays.** [verified] That is the structural fact underneath every distributional argument about
  it: the guarantee question and the adequacy question are disjoint, and a proposal framed as
  fixing the formula by reforming the guarantee changes nothing for half the state.

  ### The largest per-pupil loser is one of Ohio's poorest districts

  Under a half phase-out, East Cleveland City loses **$6,489 per pupil** — more than twice the
  next district. Its guarantee is $13.7 million against $13.3 million of formula aid: **50.7%
  of everything it receives**, $12,978 per pupil, on assessed valuation of $141,623 per pupil
  against a statewide median of $248,097. [verified]

  This does not overturn the finding that the guarantee is a wealth mechanism — see
  [`temporary-transitional-aid-guarantee`](../formula-component/temporary-transitional-aid-guarantee.yml).
  It refines it. *Whether* a district is on the guarantee is predicted by property wealth. *How
  much it depends on the guarantee* is a different distribution, driven by how far enrollment
  has fallen since FY2020 — and the 50 most dependent districts still have a median valuation
  of $349,582, well above the state's. East Cleveland is the exception that shows the two
  questions are not the same question. [inference]

  ### The guarantee is a shock absorber that wears out

  Raising base cost costs the state more per point the higher it goes, because each increment
  lifts more districts off the guarantee and onto a formula that then has to pay them:

      base cost   state cost    on guarantee    marginal cost per point
      +2%          +$95.4M          272            $47.7M
      +5%         +$255.3M          247            $53.3M
      +10%        +$569.7M          207            $62.9M
      +20%       +$1,294.6M         156            $72.5M

  [verified] The first two points of a base cost increase are half-price. The state is buying
  back its own guarantee. A fiscal note scoring a large increase by extrapolating from a small
  one **understates the cost**, and the error grows with the size of the proposal — which is
  the direction that matters, since it is the large proposals that get scored this way.

  ### It makes the state's cost predictable

  This is the projection leg and is reported apart from everything above. Carrying each
  district's enrollment forward to **FY2032** by a damped trend from its own FY2024-FY2026
  history — statewide ADM falls 4.9% — state aid under current law is **$7,125M, in a band of
  $6,889M to $7,379M** (±3.4%). With the guarantee removed the same enrollment forecast gives
  **$6,060M, in a band of $5,711M to $6,430M** (±5.9%). [inference — a forecast, with the
  caveats below]

  **Removing the guarantee nearly doubles the state's exposure to enrollment forecast error.**
  That is an argument for the guarantee that has nothing to do with equity or adequacy: it is a
  budget-stability instrument, and it works by transferring enrollment risk from the state's
  appropriation to the districts' own planning. Nobody appears to defend it on those grounds.
  [inference]

  Only **two** districts move onto the guarantee between FY2027 and FY2032 under current law,
  294 to 292 — enrollment decline barely changes the count, because it is already nearly half.
properties:
  name: Phasing out the temporary transitional aid guarantee
  question: |
    What does removing, re-basing, or phasing out the temporary transitional aid guarantee do
    to Ohio's districts, and what does raising base cost cost while it is in place?
  perturbations: |
    guarantee            as-enacted -> removed | rebase:<factor> | phase-out:<remaining>
    base_cost_scale      1.00 -> 1.02, 1.05, 1.10, 1.20
    minimum_state_share  0.10 as enacted for FY2026-27, not the 0.05 the plan began with
    phase_in             base cost and categoricals separately, both 1.00 at baseline

    Every run is a simulation at observed enrollment against the department's own FY2027 model,
    which `project::policy::current_law` reproduces to the cent for all 609 districts. Only the
    FY2032 block projects anything.
  input_projections: |
    One leg only, and it is reported apart from every other figure. Enrolled ADM is carried to
    FY2032 by a damped trend (damping 0.85) from each district's FY2024-FY2026 history, and the
    whole formula is re-run at the low, central, and high end of each district's band rather
    than scaling a central answer — the guarantee is a `max`, so the aid curve has a kink that
    scaling cannot reproduce.

    Assessed valuation is held fixed. It cannot be projected: the corpus has one observation per
    district and Ohio valuation steps on a county reappraisal cycle rather than moving smoothly.
    Local capacity is 60% valuation, so the local side of every projection here is an assumption.
  horizon: FY2027, with one projected leg to FY2032
  results_path: |
    crates/project — `cargo run -p project --bin edfund-project -- --guarantee <rule>`.
    Pinned by crates/project/tests/ and by the checkpoints in crates/bundle, which the web
    layer re-derives and must reproduce before it will render a scenario.
  results: |
    removal              -$879.0M    294 districts cut, 315 untouched
    half phase-out       -$439.5M    294 districts cut, 315 untouched
    rebase to 90%        -$248.2M    294 districts cut, 315 untouched

    base cost   state cost    on guarantee    marginal cost per point
    +2%          +$95.4M          272            $47.7M
    +5%         +$255.3M          247            $53.3M
    +10%        +$569.7M          207            $62.9M
    +20%       +$1,294.6M         156            $72.5M

    FY2032 at projected enrollment, current law: $7,125M in a band of $6,889M to $7,379M.
    The same with the guarantee removed: $6,060M in a band of $5,711M to $6,430M.
  confidence: |
    The simulation figures are exact against the department's model and carry no interval.

    **"Current law" at FY2032 is not a law, and this node says it because the band is drawn under
    that label.** R.C. 3317.011, 3317.017 and 3317.0217 each apply only for FY2026 and FY2027 by
    their own terms, and forty divisions of five further sections hand their values to a General
    Assembly that has not met. [verified] The FY2032 figures are this formula continued unchanged
    — the only tractable assumption for a five-year question about a two-year statute, and not a
    forecast of what the law will say. See
    [`the-plan-expires-and-the-projection-does-not`](../../decisions/the-plan-expires-and-the-projection-does-not.yml).

    The FY2032 band is not this district's uncertainty. Three observations cannot estimate a
    variance, so the interval rests on the cross-sectional spread of district growth rates used
    as a floor; a district with genuinely volatile enrollment has a wider true interval than
    this reports. FY2026 is itself partly departmental estimate. The damping factor is a
    convention rather than a fitted parameter. [open]

    138 districts sit at the minimum state share and their response to a base cost increase
    cannot be computed, because the floor censors the quantity it would be computed from. They
    are held at the floor, which makes the marginal-cost table a lower bound. [inference]
