  confidence: |
    **This node reports two answers to one question, and the pair is deliberate.** `[I]` is a term
    in `[K]`'s own subtrahend, so what Section 265.225 does is not a detail of a guarantee retirement — it
    is most of its cost. Three answers are coherent:

    - **(a) `[K]` stays as enacted.** The honest model of current law, and why removal saves about a
      tenth of the headline. **Reported.**
    - **(b) `[K]` is repealed alongside.** What "retiring the guarantee" means as a policy rather
      than as a lever. **Reported.**
    - **(c) `[K]` is recomputed against an FY2021 base that excludes `[I]`.** **Not reported**, and
      not for want of a lever: `[L1]` is a single published column per district, and splitting it
      into its guarantee and non-guarantee halves needs FY2021 per-district guarantee payments that
      no committed source carries. The same gap that makes `[H2]` unobservable for a formula
      district makes this unobservable for every district. [open]

    Reporting only one of (a) and (b) re-creates the defect this node was corrected for: (a) alone
    says a guarantee retirement is nearly free, (b) alone says it saves $942.5M, and a reader given
    either would be wrong about the other. [inference]

    The simulation figures are exact against the department's model and carry no interval.

    **"Current law" at FY2032 is not a law, and this node says it because the band is drawn under
    that label.** R.C. 3317.011, 3317.017 and 3317.0217 each apply only for FY2026 and FY2027 by
    their own terms, and forty divisions of five further sections hand their values to a General
    Assembly that has not met. [verified] The FY2032 figures are this formula continued unchanged
    — the only tractable assumption for a five-year question about a two-year statute, and not a
    forecast of what the law will say. Section 265.225 is on weaker ground still: it is uncodified, its
    newest committed text names FY2022 and FY2023, and it survives to FY2027 only because H.B. 96
    extended both devices in one clause. See
    [`the-plan-expires-and-the-projection-does-not`](../../decisions/the-plan-expires-and-the-projection-does-not.yml).

    The FY2032 band is not this district's uncertainty. Three observations cannot estimate a
    variance, so the interval rests on the cross-sectional spread of district growth rates used
    as a floor; a district with genuinely volatile enrollment has a wider true interval than
    this reports. FY2026 is itself partly departmental estimate.

    [verified] **It is a floor, and now a measured one.** Backtested against the F-33 panel,
    realized forecast error is wider than the plus-or-minus one sigma band at every horizon from
    one year to five, under the shipped method and under the one it replaced — the interval never
    over-states. But the margin widens with the horizon, from 1.18x at one year to 1.40x at five,
    because dispersion grows as `horizon^0.60` while the band widens as `horizon^0.50`. Coverage
    falls from 67.3%, very nearly the 68.3% such a band should hold, to 55.8%. Measured in
    `crates/project/tests/the_floor_the_interval_rests_on.rs`.

    [verified] **And the widening rule was recalibrated**, which was the open question here.
    The square root held 55.8% of forecasts at five years against the 68.3% it claimed; fitted to
    coverage the exponent is **0.65**, which holds it within 2.9 points at every horizon the
    backtest reaches. Sigma does not move — it is a measured quantity with a stated source, and
    only the shape in the horizon was wrong. The bands above are the widened ones. Recorded at
    [the-widening-rule](../../decisions/the-widening-rule.yml).

    [verified] **The exponent holds to thirteen years, and five was never the panel's limit.**
    The fit's own six origins reach eleven years — FY2013 plus eleven is FY2024 — and the two the
    panel supports but the fit did not use, FY2011 and FY2012, take it to thirteen. Run there,
    coverage of the **cross-district** error stays within **3.0%** of the 68.3% the band claims at
    every horizon from one to thirteen — **66.1%** held at one year and **69.4%** at thirteen, so
    the line crosses the target rather than drifting off it — and refitting to coverage over the
    longer range returns **0.65** again.
    This node's six-year leg and the feed's ten-year horizon are inside the measured range now
    rather than past it. Measured in
    `crates/project/tests/the_horizons_the_backtest_stopped_short_of.rs`.

    [verified] **What fails past five years is the centre, not the width.** Pooled across origins
    the band's coverage does sink — **64.5%** held at one year, 67.1% at five, **60.1%** at
    thirteen, and at its worst **8.9%** of forecasts short of the target at eleven — and removing
    each origin's own mean puts the whole of that back. At a fixed horizon every origin runs the
    same method over the same districts for the same span, so an origin effect is a year effect, and
    the years are the shutdown: at five years the four origins landing on FY2020 or earlier average
    +0.002 to +0.014 while the two landing on FY2023 and FY2024 average +0.035 and +0.038. Cut every
    target at FY2020 and the pooled band holds within 3.8 points to **nine** years with nothing
    removed. `sigma` is a cross-sectional spread, so it prices cross-district error and a statewide
    level break is not in it at any exponent.

    [verified] **And `horizon^0.60` was partly the window.** The dispersion exponent refits to
    0.573, 0.600 and 0.623 over one to five, seven and nine pre-closure years, and 0.650 over the
    whole reach — it climbs toward the coverage exponent as the range grows. The two targets do
    differ, because the errors are not normal, but the size of the gap was a property of the
    five-year fit rather than of the distribution.

    [verified] **The bias is the binding limit on a long projection, and it is a year effect
    that no correction keyed on a district can reach.** Mean log error reaches **+0.056** at the
    feed's ten-year horizon, so the mean district's point sits about 5.8% high; the statewide
    total's sits **3.2%** high there and was within 0.7% at every horizon to seven years before
    the closure, with a sign that changes from origin to origin. Sorted on anything a forecast
    could see at its origin every quarter of districts is forecast high by about the same amount,
    and a district's long-run rate persists into its next three to nine years at **0.27 to
    0.30** — the three tenths the damping already carries. Decaying the rate toward a share of
    the long-run rate over-corrects at every share above five hundredths, a drift fitted before
    the closure removes half of what crosses it and puts the total a point low before it, and an
    asymmetric band holds less than shifting the centre by the same amount. Neither the centre
    nor the band is corrected. Measured in
    `crates/project/tests/the_bias_that_belongs_to_the_years.rs`.

    [verified] **The bias is published now, beside the projection and as four numbers per
    horizon rather than as a correction.** Over every scored forecast the mean district's log
    error runs −0.0071 at one year and +0.0734 at thirteen, while the state total's — the
    same forecasts summed by size rather than averaged over districts — runs −0.0052 at one
    year and +0.0569 at thirteen. Restricted to forecasts whose target is FY2020 or earlier the
    panel reaches nine years, and there the mean district ends at +0.0272 and the total at
    +0.0171. This node's own projection runs a six-year leg to FY2032, and at six years those
    figures are +0.0117 for the mean district and +0.0036 for the total — so the FY2032 band
    above is centred high on both counts, by roughly three times as much on the district average
    as on the state total, and nothing above is adjusted for it. The same six years across the
    closure read +0.0237 for the mean district — twice the pre-closure figure at the identical
    horizon, which is why the population a six-year statement rests on has to be named rather
    than assumed. The district route's own fan runs this same six-year leg over one district
    instead of 606, and it states both. Both quantities start under the
    truth and end over it, and they do not turn
    together: before the closure the mean district crosses zero at four years and the total not
    until five, so there is a horizon where the average district is already being over-forecast
    and the statewide figure is still low. Neither line on either population turns back — the
    furthest any of the four ever sits from zero is its own last point, 0.0272 and 0.0171 before
    the closure and 0.0734 and 0.0569 across it — so the drift is not a middle-distance
    artefact that washes out, and the deepest horizon is the one where a correction would matter
    most and is trusted least. A level correction sized on one of the two quantities is the wrong
    size for the other, which is why both are published and neither is applied. Computed by
    `crates/project`'s `backtest::bias_profile` and checked against the independent table in
    [`crates/project/tests/the_bias_that_belongs_to_the_years.rs`](../../../crates/project/tests/the_bias_that_belongs_to_the_years.rs),
    carried on the feed's `projection.bias` table, drawn on `/method` beside the coverage profile,
    and decided at
    [the-bias-published-beside-the-point](../../decisions/the-bias-published-beside-the-point.yml).

    138 districts sit at the minimum state share and their response to a base cost increase
    cannot be computed, because the floor censors the quantity it would be computed from. They
    are held at the floor, which makes the base cost table a lower bound. [inference]

    **`[K]` reaches further than this panel does.** H.B. 96 extends the supplement to community
    schools and STEM schools as well as districts, and every figure here is over the 609 city,
    local and exempted village districts the FY2027 model carries. A statewide cost of repealing
    Section 265.225 is larger than the $63.6m column (b) is priced against, by an amount this model cannot
    bound. [verified]
revisions:
  - was: |
      The savings table stated **-$879.0M** for removal, **-$439.5M** for a half phase-out and
      **-$87.9M** for a rebase to 90% — with the `results` property giving **-$248.2M** for that
      same third row — and put **294 districts cut, 315 untouched** against every one of them.
    now: |
      Those are falls in foundation aid, not savings, and only for the first two rows. On total
      state support, which is the measure a cost is quoted in, the three rules save **$79.8M**,
      **$70.8M** and **$66.2M** with Section 265.225 standing, and **$942.5M**, **$503.1M** and
      **$311.8M** with it repealed. **167** districts are cut, not 294, and **442** are untouched,
      not 315.

      The **-$87.9M** was never computed: it is a tenth of $879.0M, reasoned from a tenth off the
      floor. The guarantee is a `max`, so a tenth off the floor pushes **64** districts off it
      altogether and takes their whole top-up — 28.2% of the guarantee. The `results` property's
      **-$248.2M** was the model's own answer to that, and right about the fall in foundation aid.
    found_by: |
      `crates/project::hold_harmless`, which inventoried four hold-harmless devices where the
      corpus had recorded one, and `PolicyEffect::cost` widening to `[R] Total State Support` so
      that `[K]` is inside the figure a lever is priced at. Pinned in
      `crates/project/tests/what_retiring_the_guarantee_actually_saves.rs`.
    reach: |
      The savings table carried no `figures:` entries, so nothing in this repository could see it go
      stale: the crate moved twice and the prose did not move at all, while every gate stayed green.
      That is the #120 shape with nothing on the crate side to disagree with. Every delta on this
      node is bound now, and the manifest holds them as magnitudes because it cannot hold a sign.
  - was: |
      "**No policy applied to the guarantee can reach the 315 districts the formula already
      pays.**" [verified] — offered as the structural fact underneath every distributional argument
      about the guarantee, and as grounds that "a proposal framed as fixing the formula by
      reforming the guarantee changes nothing for half the state".
    now: |
      True of a guarantee-only lever and understated: the unreachable population is **442**, because
      `[K]` makes 127 of the 294 guaranteed districts whole as well. False of the hold-harmless
      system — repealing Section 265.225 alongside reaches **311** districts, including **17** that draw
      `[K]` and were never on the guarantee.
    found_by: |
      `repealing_the_backstop_beside_it_saves_what_both_cost` in `crates/project/src/report.rs`, and
      `a_guarantee_only_lever_reaches_167_districts_and_both_devices_reach_311`.
    reach: |
      The scoped claim is sharper than the unscoped one was, and it changes what the node concludes:
      the guarantee question and the adequacy question are disjoint, and the hold-harmless question
      and the adequacy question are not.
  - was: |
      "The largest per-pupil loser is one of Ohio's poorest districts" — East Cleveland City at
      **$6,489 per pupil** under a half phase-out, offered as the exception showing that dependence
      on the guarantee and wealth are different distributions.
    now: |
      That is its fall in foundation aid. Its total state support does not move at all: `[K]` holds
      it at `[L1]` to the cent. The largest per-pupil loss on a removal is **West Geauga Local** at
      **$797** per pupil, on valuation of $604,523 against the statewide median of $248,097, and the
      median district the retirement cuts sits at **$318,480** against **$257,278** for the median
      district the backstop makes whole.
    found_by: |
      `hold_harmless::retirement`, and
      `the_largest_per_pupil_loser_is_a_wealthy_district_once_the_backstop_is_in_the_model`.
    reach: |
      The exception is withdrawn rather than refined, and the wealth finding it was an exception to
      is stronger without it: the backstop filters a guarantee retirement up the wealth
      distribution. `temporary-transitional-aid-guarantee`'s quintile table already pointed this
      way — Q4 and Q5 losing most per pupil — and the two nodes were in tension until `[K]` was
      modelled.
  - was: |
      "**Removing the guarantee nearly doubles the state's exposure to enrollment forecast
      error.**" [inference] — from a foundation-aid band of ±4.3% under current law against ±7.8%
      with the guarantee removed.
    now: |
      True of foundation aid and false of total state support, where the same two runs are **4.23%**
      and **4.16%** — no wider. `[K]` is a floor against a fixed FY2021 total, so it inherits the
      absorbing the guarantee gives up, reaching **$926.8M** at FY2032. The doubling is recovered
      only when Section 265.225 is repealed as well: **7.77%**.
    found_by: |
      `the_backstop_inherits_the_guarantees_budget_stability`, after `report::forecast` was widened
      to accumulate total state support beside realized aid. The six bound FY2032 figures did not
      move, because they are foundation aid and `[K]` is outside it — which is how a node whose
      savings table was in one measure and whose projection was in the other stayed green.
    reach: |
      The budget-stability argument survives and changes owner. It is an argument for the
      hold-harmless system, and the device that delivers nearly all of it is the one paying $63.6m
      to 144 districts rather than the one paying $879.0m to 294.
  - was: |
      The base cost sweep read **+$95.4M** at two per cent against **272** districts still on the
      guarantee, rising to **+$1,294.6M** at twenty against **156**, at **$47.7M** a point for the
      first two and **$72.5M** for the last ten. The restatement that put `[K]` into this node
      replaced all eight cells and recorded the movement as the backstop's.
    now: |
      Only part of it was. The foundation column is **+$106.6M** at two per cent against **269**,
      and it has read that since **2026-08-09** — forty days before `[K]` entered the model.
      `base_cost_scale` was given the base-cost-denominated categoricals that day: special
      education, English learners and career-technical are each priced as a weight times the
      statewide average base cost per pupil, so a lever that moves the average moves them too.
      That is $812.5m of exposure, it delivered **+$11.2M** more at two per cent, and it lifted
      three more districts off the guarantee — the same **+3** that commit reported for its own
      refresh scenario, 41 lifted rather than 38.

      `[K]` then took **-$5.0M** back out of the same row, in the opposite direction. The $6.3M
      between what this node published and what it now reports is the net of two unrelated
      corrections, and the first restatement attributed all of it to the second one.
    found_by: |
      `git bisect` over the 351 commits between the table's own commit and its restatement, run on
      the `on guarantee` count because that column is decided inside realized aid and so cannot be
      reached by a device paid downstream of it. First bad commit `66e2312`, whose own message
      states the mechanism and whose decision is recorded at
      [`the-scenario-models-ohio`](../../decisions/scenario-models-ohio.yml). Probing its tree
      directly returns $106,645,239.28, to the cent what the crate returns today, so nothing in
      the intervening forty days moved the column again.
    reach: |
      The conclusions are unharmed — the gradient was monotone on the published figures and is
      monotone now, and the fiscal-note warning holds on both. What was wrong was the causation,
      and it was wrong in the entry written to correct exactly this class of error.

      The lesson is not about `[K]`. A table left unbound does not go stale once and get caught;
      it accumulates, and the first correction to reach it inherits every earlier drift as though
      it were part of what the correction found. This node's savings tables were unbound for the
      same reason and for longer. The foundation column is bound now, separately from the total,
      because a figure bound only on the net of two opposing corrections can absorb both and still
      match.
