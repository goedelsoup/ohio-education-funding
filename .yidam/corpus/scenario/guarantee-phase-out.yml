class: scenario
label: Phasing Out the Temporary Transitional Aid Guarantee
summary: >-
  What Ohio's FY2027 model pays if the temporary transitional aid guarantee is removed or wound
  down — priced twice, because the guarantee has a backstop and repealing one does not touch the
  other. The department's own model re-run with one lever moved, at observed enrollment.
description: |
  **RUN.** Reproduce with `cargo run -p project --bin edfund-project -- --guarantee <rule>
  [--backstop repealed]`. Every figure below is a **simulation**, not a forecast: it re-runs the
  department's own FY2027 model with one lever moved, at observed enrollment. Where a projection is
  used it is labelled and reported separately, per [`skills/project`](../../skills/project.md).

  Ohio's FY2027 model pays **$7,281 million** in state foundation aid to 609 districts. **$879
  million of it — 12.1% — is the temporary transitional aid guarantee**, paid to **294
  districts** holding just over half the state's students, holding them at what they received
  in **FY2020**: a [Bridge formula](../funding-regime/bridge-formula.yml) year Ohio froze
  rather than computed. [verified — `crates/project`, which reproduces the department's model to
  the cent]

  **Retiring it is two bills.** `[K]`, the formula transition supplement of uncodified Section
  265.225, tops a district up to its FY2021 base from a total that *already contains the
  guarantee* — so a guarantee that stops being paid becomes a shortfall `[K]` makes good. Left
  standing it absorbs most of the apparent saving; repealed alongside, it does not. R.C. 3317.019
  and Section 265.225 are separate instruments in separate law, and a bill could plainly do either
  without the other, so both are priced below as a pair. See
  [`fsfp-formula-transition-supplement`](../formula-component/fsfp-formula-transition-supplement.yml)
  for the device.

  This scenario generalises [fsfp-input-year-refresh](fsfp-input-year-refresh.yml) from the
  single district that node refreshes to the whole state.
