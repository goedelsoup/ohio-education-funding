class: scenario
label: FSFP Cost Input Refresh vs. Freeze
description: |
  **RUN.** First result. Reproduce with `cargo run --example input_year_refresh -p foundation`.

  The question is the one the FY2026-27 budget turned on: what is the difference between
  running the Fair School Funding Plan on refreshed cost inputs and running it on the FY2022
  inputs [H.B. 96](../legislation/hb-96-2025.yml) carried forward, at the same phase-in
  percentage?

  **THE ANSWER, on the department's own published worked example district** (20,342.13 base
  cost enrolled ADM, 43 buildings), perturbing the classroom teacher salary from the FY2022
  reference of $67,654 to an FY2024 refresh of $73,777.08 — a 9.1% rise:

      base cost per pupil    $7,608.05  ->  $7,960.38     +$352.33   (+4.63%)
      aggregate base cost  $154,763,912 -> $161,931,078  +$7,167,165

  Only the teacher sub-component moves; student support, district leadership, building
  operations, and athletics are unchanged by construction, because the perturbation touches one
  price term. A 9.1% salary rise produces a 4.63% base cost rise — teacher cost is roughly half
  of base cost for a district this size. [verified]

  Scaled to Ohio's FY2022 base cost enrolled ADM of 1,499,918.26, a comparable refresh raises
  **computed base cost statewide by roughly $528 million a year, from the teacher salary term
  alone.** [inference — assumes this district's cost structure is representative] The state's
  appropriation consequence is a different and smaller number; see the incidence result below.

  **THE INCIDENCE RESULT IS SHARPER THAN PREDICTED.** This node predicted, before the run, that
  freezing would fall "disproportionately on the state's portion" and be regressive. It is not
  disproportionate — it is binary:

      local capacity/pupil     share of the increase the district receives
      $500 - $7,000            100%
      $12,000 (at 5% floor)      5%

  Because state aid is the residual after local capacity, a district on formula receives the
  **entire** base cost increase, whatever its wealth. A district whose capacity has pushed it to
  the 5% minimum state share receives 5% of it. There is no gradient between the two — the
  transition is the floor itself. [verified]

  So refreshing the input year is progressive and freezing it is regressive, and the mechanism
  is not that poorer districts gain proportionally more but that wealthier districts are cut out
  almost entirely by the floor. Given that
  [170 of 606 districts sit at the 20-mill floor](../parameter/twenty-mill-floor.yml) — a
  different floor, but correlated with wealth — the share of districts insulated from an input
  refresh is a first-order question this run does not yet answer. [open]

  **STATEWIDE, ALL 606 DISTRICTS.** [verified — see
  [`crates/foundation/tests/statewide_refresh.rs`](../../../crates/foundation/tests/statewide_refresh.rs)]

  Grade-band shares from the department's October FY2024 headcount file, scaled by each
  district's base cost enrolled ADM:

      statewide computed base cost increase   $496.3 million per year
      ADM-weighted average                    $344.75 per pupil
      per-pupil range                         $338.62  to  $580.82

  The single-district extrapolation above gave $528 million; the real distribution gives
  $496.3 million. The gap is mostly denominators — the worked example's grade mix is slightly
  richer than the state's, and FY2024 ADM is lower than the FY2022 base cost ADM used to scale.
  The two agree to within about 6%, which is the useful check on the extrapolation.

  **THE SPREAD HAS A SINGLE CAUSE, AND IT IS THE STAFFING MINIMUM.** The most-affected district
  gains 1.7 times per pupil what the least-affected does — $580.82 against $338.62 — with no
  policy choice involved. **157 of 606 districts** are small enough that the six-teacher special
  teacher minimum binds, and their mean per-pupil gain is $370.75 against $343.53 for everyone
  else. [verified]

  This is the same structural feature that makes small districts expensive per pupil in the
  first place, now visible as an incidence result: a minimum that funds more positions per pupil
  also pays out more per pupil when the price of a position rises. [inference] So a refresh is
  progressive twice over — once through the state share residual, and again through the
  small-district minimums — and a freeze is regressive on both.

  **WHAT THIS RUN IS NOT.** It perturbs one salary of ten. Administrator, counselor, librarian,
  and clerical salaries have all risen since FY2022 and are held fixed, so every figure here is
  a **lower bound**. Career-technical enrollment cannot be separated in the headcount file and
  is treated as ordinary grades 9-12, which understates funded teachers at 1:27 instead of 1:18
  for districts with large CTE programs — pushing the same direction. Grade-band shares come
  from headcount while the scale comes from ADM, which assumes the two distributions match. The
  FY2022 baseline salary is secondary reporting. And districts held on a guarantee are
  off-formula entirely and would receive none of this; the guarantee population remains
  unmodelled and is now the largest single unquantified caveat on the result. [open]

  The perturbation is now concrete. Base cost is built by applying statutory staffing ratios to
  enrollment and pricing each funded position at a **statewide average salary for a reference
  year**, times 1.16 for benefits, plus average employer-paid insurance. [verified] Changing
  the reference year changes exactly those price terms and nothing else — the ratios, the
  minimums, and the ADM definitions are untouched. That makes this a clean single-parameter
  perturbation rather than a re-specification of the model.

  There is also a measured precedent to calibrate against: [H.B. 33](../legislation/hb-33-2023.yml)
  refreshed the reference year from FY2018 to FY2022, and the statewide average base cost moved
  from roughly $7,352 in FY2023 to roughly $8,240 in FY2025 — about 12%, of which the phase-in
  advance accounts for none, since phase-in scales the appropriation rather than the computed
  cost. [inference] A refresh of comparable magnitude is the natural first perturbation to test.

  **Predicted shape, stated in advance so the run can contradict it.** Freezing the reference
  year should bite hardest where salaries have risen fastest since FY2022, and the effect should
  be larger in state-share terms for districts with high state share — because state aid is the
  residual after local capacity, a reduction in computed base cost falls disproportionately on
  the state's portion. [inference] That would make a freeze regressive across the wealth
  distribution despite being uniform in method.

  Two effects will partly offset it and must be reported separately rather than netted:
  districts at the **5% minimum state share** are insulated at the bottom of the state-share
  scale [verified], and districts held on a **guarantee** are off-formula entirely and see no
  effect at all. [inference] If the run does not show the predicted shape, the reasoning above
  is wrong and this node should say so.
properties:
  name: FSFP cost input refresh vs. freeze
  question: |
    Holding the phase-in percentage at its enacted FY2026 and FY2027 values (83.33% and 100%),
    what is the per-district difference in state foundation aid between base cost computed on
    refreshed staffing and salary inputs and base cost computed on the FY2022 inputs carried
    forward by Am. Sub. H.B. 96?
  perturbations: |
    Single perturbation: the cost input reference year in the FSFP base cost calculation
    [R.C. 3317.011].
      Baseline  = FY2022 statewide average salaries and per-pupil operating amounts, as carried
                  forward by H.B. 96. [inference — confirm against the enacted act]
      Perturbed = the most recent fiscal year for which statewide average salary and operating
                  expenditure data are available.
    Affects only the price terms: average salary by staff category, average employer-paid
    insurance cost, and the statewide per-pupil amounts for building, supplies, technology, ITC
    support, safety, and co-curricular activities. Staffing ratios, minimums, ADM definitions,
    local capacity weights, and the phase-in percentage are all held at enacted values.

    For reference, the FY2022 price vector is recorded in full on
    [`fsfp-base-cost-calculation`](../formula-component/fsfp-base-cost-calculation.yml).
  input_projections: |
    None required for FY2026. Enrollment and valuation are observed or estimable from current
    data. FY2027 requires projected enrollment via `project`; that leg must be reported
    separately from the FY2026 leg so projection uncertainty is not mixed into the policy
    effect.
  horizon: FY2026-FY2027
  results_path: |
    crates/foundation/examples/input_year_refresh.rs — the runner is the result, because it is
    deterministic and dependency-free. Re-running it reproduces the figures exactly; there is no
    separate output artifact to drift from the code that made it.
  results: |
    Worked example district, 20,342.13 base cost enrolled ADM:
      teacher salary input      $67,654.00 -> $73,777.08   (+9.05%)
      teacher base cost        $93,787,359 -> $100,954,525
      aggregate base cost     $154,763,912 -> $161,931,078  (+$7,167,165)
      base cost per pupil        $7,608.05 -> $7,960.38     (+$352.33, +4.63%)
    All other sub-components unchanged. [verified]
  confidence: |
    The direction and the incidence structure are robust: they follow from the residual
    definition of state share and the 5% floor, both of which are statutory and both of which
    are verified against the department's published calculation.

    The magnitude is a lower bound and should be quoted as one. Perturbing one salary of ten
    understates a real refresh; the other nine categories would each add to it.

    Two sensitivities remain untested. The FY2022 baseline salary is secondary reporting, so the
    9.05% gap could be off by a point or so in either direction. And districts held on a
    guarantee are off-formula entirely and would receive none of the increase — the guarantee
    population is not modelled here at all, so the "100%" column overstates coverage by however
    many districts are guaranteed. [open]
