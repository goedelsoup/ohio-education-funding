revisions:
  - was: |
      A four-line decomposition of a $465.0 million computed base cost increase, delivering
      $197.1 million as state aid — 42.4% — with the guarantee absorbing $141.6 million and 256
      districts keeping none of it.
    now: |
      The decomposition predated `Policy::base_cost_scale` reaching the categoricals denominated
      in base cost per pupil. A refresh computes **$497.1 million**, not $465.0 million: special
      education, English learners and career-technical are each `weight x base cost per pupil x
      count x state share`, which adds **$32.1 million** the old accounting had nowhere to put.
      With that line present the guarantee absorbs $150.2 million rather than $141.6 million, 253
      districts keep none of it rather than 256, and **$220.6 million is delivered — 44.4%**.
      [verified]
    found_by: |
      An audit of the `/scenario` routes that began at the page and ran back to its sources. The
      page's held-fixed card had taken a proportional product from
      [`scenario/ACTIONS.md`](ACTIONS.md) and printed it as delivered aid (#233); tracing that
      figure found this block still carrying the pre-decision decomposition, and citing
      `who_a_change_reaches.rs` for it — a test that had been updated to the new numbers and now
      asserted different ones than the block quoting it.
    reach: |
      This block and the summary sentence under it. The per-quintile incidence below is unaffected
      — it is computed from the same runs and was already recomputed when the decision was taken,
      which is why its ratio of about fifteen to one did not move.

      The wider correction is #251: the same superseded arithmetic survived in
      [`scenario/ACTIONS.md`](ACTIONS.md) and in
      [`decisions/scenario-models-ohio`](../../decisions/scenario-models-ohio.yml), in both cases
      carrying the strongest claim tag while citing a test that asserts something else. A figure
      corrected in a crate and left standing in three prose carriers is the #120 shape, and this
      is the third time this repository has found it.

      Naming a claim tag in prose is avoided here on purpose: the counter that produces the totals
      in `README.md` matches the token wherever it appears, so a sentence *about* a tag is counted
      as one. This paragraph inflated the verified count by one before it was reworded.
  - was: |
      Every figure perturbed from an FY2022 reference teacher salary of $67,654 — a $496.3
      million statewide headline, $344.75 per pupil ADM-weighted, a $338.62 to $471.10 range,
      and a single-district rise of $352.33 per pupil.
    now: |
      $67,654 was Fordham's figure, secondary reporting, and it was carried as `[inference]`
      because it was never the department's. The department's own FY27 calculator prices the
      FY2022 reference teacher at **$68,022.22**, and the workspace had held that value in
      [`StatewideFactors::fy2027`](../../../crates/foundation/src/lib.rs) since the calculator
      was retrieved — so this node was perturbing from a number its own crate contradicted.
      Corrected, the block scales down by 1/1.0640 throughout: **$466.2 million** statewide,
      $323.97 per pupil, a $318.26 to $442.76 range, and $331.14 per pupil on the worked
      example. [verified]
    found_by: |
      An audit reading the constant against the committed FY27 department-model panel rather
      than against the secondary source it was originally taken from.
    reach: |
      Every derived figure in this node's own runs, and nothing outside them: the guarantee and
      state-share-floor decompositions are computed from the department's model directly and
      never touched the constant, which is why their $465.0 million did not move.

      The correction recovers a cross-validation that the error had hidden. At $496.3 million
      against the department model's $465.0 million the two runs sat 6.3% apart and the node
      presented them as separate answers rather than as a discrepancy. At $466.2 million they
      agree to 0.3%, and the agreement is now the node's strongest evidence rather than its
      loosest end.

      The three sites carrying the literal are gone: all three now read the salary off
      `StatewideFactors::fy2027()`, so a future correction to the price vector cannot leave a
      panel perturbing from a superseded figure again.
  - was: |
      A 1.7x spread with a maximum of $580.82 per pupil, reported through four phases.
    now: |
      The maximum was an artifact. It belonged to Vanlue Local, whose grade-band fixture was
      produced by a headless LibreOffice pipeline that summed the department's withheld `<10`
      grade counts **as zero**. Vanlue has four withheld grades, so its headcount was
      understated by up to 36 in a district of 150 and the `ADM / headcount` scale factor
      driving its funded teacher count was inflated by nearly a third.
    found_by: |
      Re-deriving the grade-band fixture with the withheld counts handled as withheld rather
      than as zero.
    reach: |
      A pipeline defect rather than a modelling one, and it reached only districts with
      withheld grade counts — which is to say small ones, where the proportional distortion is
      largest.
  - was: |
      "Wealthier districts are cut out almost entirely by the floor" — the state share floor
      credited with the incidence result.
    now: |
      The guarantee does more of that work. Across valuation quintiles the count held on the
      guarantee runs 10, 31, 39, 88, 88; in the wealthiest quintile 90 districts are
      guaranteed, 95 are at the floor, and **73 are both**, so the two cannot be summed as
      independent mechanisms. In the poorest quintile **no district is at the floor at all**,
      so there the floor explains nothing whatever. [verified]
    found_by: |
      Crossing floor status against guarantee status per district rather than reading each
      margin alone.
    reach: |
      The incidence result itself stands. What was wrong was the mechanism assigned to it,
      which matters because the two respond to different policy levers.
properties:
  name: FSFP cost input refresh vs. freeze
  question: |
    Holding the phase-in percentage at its enacted FY2026 and FY2027 values (83.33% and 100%),
    what is the per-district difference in state foundation aid between base cost computed on
    refreshed staffing and salary inputs and base cost computed on the FY2022 inputs carried
    forward by Am. Sub. H.B. 96?
  perturbations: |
    Single perturbation: the cost input reference year in the FSFP base cost calculation
    [R.C. 3317.011].
      Baseline  = FY2022 statewide average salaries and per-pupil operating amounts, as carried
                  forward by H.B. 96. [inference — confirm against the enacted act]
      Perturbed = the most recent fiscal year for which statewide average salary and operating
                  expenditure data are available.
    Affects only the price terms: average salary by staff category, average employer-paid
    insurance cost, and the statewide per-pupil amounts for building, supplies, technology, ITC
    support, safety, and co-curricular activities. Staffing ratios, minimums, ADM definitions,
    local capacity weights, and the phase-in percentage are all held at enacted values.

    For reference, the FY2022 price vector is recorded in full on
    [`fsfp-base-cost-calculation`](../formula-component/fsfp-base-cost-calculation.yml).
  input_projections: |
    None required for FY2026. Enrollment and valuation are observed or estimable from current
    data. FY2027 requires projected enrollment via `project`; that leg must be reported
    separately from the FY2026 leg so projection uncertainty is not mixed into the policy
    effect.
  horizon: FY2026-FY2027
  results_path: |
    crates/foundation/examples/input_year_refresh.rs — the runner is the result, because it is
    deterministic and dependency-free. Re-running it reproduces the figures exactly; there is no
    separate output artifact to drift from the code that made it.
  results: |
    Worked example district, 20,342.13 base cost enrolled ADM:
      teacher salary input      $68,022.22 -> $73,777.08   (+8.46%)
      teacher base cost        $94,218,372 -> $100,954,525
      aggregate base cost     $155,194,925 -> $161,931,078  (+$6,736,153)
      base cost per pupil        $7,629.24 -> $7,960.38     (+$331.14, +4.34%)
    All other sub-components unchanged. [verified]
  confidence: |
    The direction and the incidence structure are robust: they follow from the residual
    definition of state share and the 5% floor, both of which are statutory and both of which
    are verified against the department's published calculation.

    The magnitude is a lower bound and should be quoted as one. Perturbing one salary of ten
    understates a real refresh; the other nine categories would each add to it.

    The FY2022 baseline salary is no longer a sensitivity. It was secondary reporting, and it
    was wrong; it is now the department's own $68,022.22 and the 8.46% gap is verified at both
    ends. What that bought is an independent check rather than a narrower error bar: the
    statewide $466.2M and the department model's $465.0M now agree to 0.3%, where the figures
    computed from the secondary salary sat 6.3% apart and were presented as two unreconciled
    answers.

    One sensitivity remains. Districts held on a guarantee are off-formula entirely and would
    receive none of the increase — the guarantee population is not modelled in the
    single-district run above at all, so its "100%" column overstates coverage by however many
    districts are guaranteed. The guarantee section of the findings quantifies this on the
    department's model; the runner has not been rewritten to carry it. [open]
