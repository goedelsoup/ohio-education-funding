class: scenario
label: FSFP Cost Input Refresh vs. Freeze
description: |
  **Specified, not run.** [open] But no longer under-specified: the extraction phase resolved
  every parameter this run needs except the input series themselves.

  The question is the one the FY2026-27 budget turned on: what is the difference, per district,
  between running the Fair School Funding Plan on refreshed cost inputs and running it on the
  FY2022 inputs [H.B. 96](../legislation/hb-96-2025.yml) carried forward, at the same phase-in
  percentage?

  The perturbation is now concrete. Base cost is built by applying statutory staffing ratios to
  enrollment and pricing each funded position at a **statewide average salary for a reference
  year**, times 1.16 for benefits, plus average employer-paid insurance. [verified] Changing
  the reference year changes exactly those price terms and nothing else — the ratios, the
  minimums, and the ADM definitions are untouched. That makes this a clean single-parameter
  perturbation rather than a re-specification of the model.

  There is also a measured precedent to calibrate against: [H.B. 33](../legislation/hb-33-2023.yml)
  refreshed the reference year from FY2018 to FY2022, and the statewide average base cost moved
  from roughly $7,352 in FY2023 to roughly $8,240 in FY2025 — about 12%, of which the phase-in
  advance accounts for none, since phase-in scales the appropriation rather than the computed
  cost. [inference] A refresh of comparable magnitude is the natural first perturbation to test.

  **Predicted shape, stated in advance so the run can contradict it.** Freezing the reference
  year should bite hardest where salaries have risen fastest since FY2022, and the effect should
  be larger in state-share terms for districts with high state share — because state aid is the
  residual after local capacity, a reduction in computed base cost falls disproportionately on
  the state's portion. [inference] That would make a freeze regressive across the wealth
  distribution despite being uniform in method.

  Two effects will partly offset it and must be reported separately rather than netted:
  districts at the **5% minimum state share** are insulated at the bottom of the state-share
  scale [verified], and districts held on a **guarantee** are off-formula entirely and see no
  effect at all. [inference] If the run does not show the predicted shape, the reasoning above
  is wrong and this node should say so.
properties:
  name: FSFP cost input refresh vs. freeze
  question: |
    Holding the phase-in percentage at its enacted FY2026 and FY2027 values (83.33% and 100%),
    what is the per-district difference in state foundation aid between base cost computed on
    refreshed staffing and salary inputs and base cost computed on the FY2022 inputs carried
    forward by Am. Sub. H.B. 96?
  perturbations: |
    Single perturbation: the cost input reference year in the FSFP base cost calculation
    [R.C. 3317.011].
      Baseline  = FY2022 statewide average salaries and per-pupil operating amounts, as carried
                  forward by H.B. 96. [inference — confirm against the enacted act]
      Perturbed = the most recent fiscal year for which statewide average salary and operating
                  expenditure data are available.
    Affects only the price terms: average salary by staff category, average employer-paid
    insurance cost, and the statewide per-pupil amounts for building, supplies, technology, ITC
    support, safety, and co-curricular activities. Staffing ratios, minimums, ADM definitions,
    local capacity weights, and the phase-in percentage are all held at enacted values.

    For reference, the FY2022 price vector is recorded in full on
    [`fsfp-base-cost-calculation`](../formula-component/fsfp-base-cost-calculation.yml).
  input_projections: |
    None required for FY2026. Enrollment and valuation are observed or estimable from current
    data. FY2027 requires projected enrollment via `project`; that leg must be reported
    separately from the FY2026 leg so projection uncertainty is not mixed into the policy
    effect.
  horizon: FY2026-FY2027
  results_path: Not yet produced. [open]
  confidence: |
    Not yet run. When run, the result will be most sensitive to which salary series is used for
    the refreshed year and to the treatment of the two insulated groups — districts at the 5%
    state share floor and districts on a guarantee. The count and enrollment share of both must
    be reported alongside any statewide total, or the total will overstate how many districts
    the change actually reaches. [inference]

    Blocked on: the `foundation` calculator, and per-district FY2026 base cost inputs and
    enrolled ADM from `dew-foundation`. [open]
