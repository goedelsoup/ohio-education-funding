class: school
label: Sheridan High School
description: |
  The building Ohio's constitutional litigation is named after. Nathan DeRolph was a student here
  when the [Ohio Coalition for Equity and Adequacy](../litigation/derolph-i-1997.yml) filed on his
  behalf in Perry County on 19 December 1991. [verified]

  **It is the first school node in this corpus, and it is here because it closes a loop.** The
  corpus has held [Northern Local](../education-agency/northern-local-perry.yml) as an exemplar
  since genesis — the DeRolph origin district, rural and property-poor — and could not name the
  building. The funding side never needed to. The accountability side works at this grain, and the
  first thing it makes sayable is what happened to the school the case was brought for.

  **Thirty-four years later it is a four-star building with a Performance Index of 89.9**, against
  a state where the highest exemplar here reaches 105.9 and the lowest 36.8. [verified —
  `report-card-2425-buildings.csv`] It is neither failing nor comfortable, which is a more useful
  fact than either would have been.

  **And a quarter of its students are chronically absent** — 25.9% in 2024-25, against 2.5% at
  [Barrington Road](barrington-road-elementary.yml) in Upper Arlington. [verified] Chronic
  absenteeism is not decoration here: under Ohio's ESSA plan it is the criterion that decides CSI
  identification for buildings with fewer than three rated components. Sheridan has enough rated
  components that the overall rating governs instead, so the figure carries no consequence for
  this building and would for a smaller one. Whether the rate reflects poverty, distance, or
  something the corpus cannot see is not established. [open]

  **AND IT IS A COMPREHENSIVE SUPPORT AND IMPROVEMENT SCHOOL.** This node said one commit ago
  that the corpus could not tell whether Sheridan had ever been identified, because it held no
  list. It holds the list now. Sheridan is on it: **ATSI 2022, escalated to CSI 2025**. [verified —
  `dispersion::identified`, pinned by test]

  The building Ohio's constitutional litigation is named for is federally identified as one of the
  state's schools needing comprehensive support, thirty-four years after the case was filed on
  behalf of a student who attended it.

  **The route matters and is easy to lose.** Sheridan did not arrive here by performing in the
  lowest 5% — a four-star building with a Performance Index of 89.9 plainly did not. It was
  identified as ATSI in 2022, meaning **one or more student subgroups** performed at or below the
  CSI identification threshold, and it did not exit within three years. Ohio's plan escalates such
  schools to CSI automatically. Forty-two of the 231 CSI schools arrived this way. [verified]

  So the whole-school numbers on this node and its accountability status are not in tension: they
  are measuring different things. A building can be comfortably mid-distribution overall and carry
  a subgroup that is not, and the federal system is built to surface exactly that. Which subgroup
  is not published on the CSI list — it appears on the ATSI list, which carries subgroup columns,
  and Sheridan's 2022 ATSI row is not in the current file because the department republishes each
  list in place rather than archiving cycles. [open]
