  building_irn: 034363 [verified]
  district: Northern Local School District (Perry County), IRN 049056. [verified]
  grades: Not entered; the report card files carry no grade span. [unentered]
  enrollment: 685 in 2024-25, on the report card's building count. [verified]
  performance: |
    Performance Index 89.9 in 2024-25, 91.5 in 2023-24, 89.2 in 2022-23; four stars on the
    achievement component. [verified] Flat across the three years the distress trigger reads,
    and well clear of it.

    The **overall** rating — the number R.C. 3302.10 and CSI identification actually use — is not
    in either published building file. What is held is the achievement component, which is an
    input to it. [unentered]
  chronic_absenteeism: 25.9% in 2024-25. [verified]
  roles: |
    DeRolph plaintiff's school, 1991. [verified] **ATSI 2022; CSI 2025**, the latter by escalation
    after failing to exit ATSI within three years. [verified — `dispersion::identified`] Title I
    served status is not published on these lists and is not held. [unentered]
  series_path: crates/dispersion/fixtures/report-card-2425-buildings.csv, keyed by building IRN 034363. [verified]
