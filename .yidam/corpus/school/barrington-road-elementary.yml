description: |
  The contrast case, chosen the way [Upper Arlington](../education-agency/upper-arlington-city.yml)
  was chosen one level up: to sit at the other end of every axis the corpus cares about.

  **Five stars, a Performance Index of 105.9, and 2.5% chronic absenteeism.** [verified —
  `report-card-2425-buildings.csv`] Against [Anton Grdina](anton-grdina.yml) in Cleveland: 69
  points of Performance Index and 64 points of chronic absenteeism, in the same state, the same
  year, on the same instruments.

  **Its district is the corpus's high-wealth exemplar**, and the accountability data now lets the
  wealth finding and the outcome finding be read on the same object rather than as two separate
  claims about Ohio. What the pair does *not* establish is that the funding difference caused the
  outcome difference — the corpus already records that state aid correlates with poverty more
  tightly than with property wealth, and that spending rises at both ends of the wealth
  distribution. A two-building contrast is an illustration, not an estimate. [inference]

  Stability is the other thing worth noting: 105.9, 106.2, 104.9 across three years. The buildings
  at both ends of this distribution are flat. Whatever moves Ohio's outcomes is not moving these.
  [inference]
