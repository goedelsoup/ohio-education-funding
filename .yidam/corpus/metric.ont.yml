class: metric
label: Metric
foundational_type:
  ontology: ufo
  type: quality
description: |
  A defined, computable measure over education agency data, stated precisely enough that two
  people computing it from the same source get the same number — per-pupil expenditure,
  assessed valuation per pupil, state share percentage, effective millage, the dispersion of
  spending across agencies. It is a Quality inhering in the agency or the system it measures.
  Metrics are separated from parameters because they face the opposite direction: a parameter
  is an input policy chooses, a metric is an output policy produces.
properties:
  - name: name
    type: string
    required: true
    description: The measure's name
  - name: unit
    type: string
    required: true
    values: [dollars, dollars-per-pupil, percent, mills, ratio, index, pupils]
    description: >-
      What one value of the metric is measured in. `pupils` is a membership, full-time-equivalent
      and fractional, and not a count
  - name: definition
    type: text
    required: true
    prose: true
    description: The computation, stated as a formula over named inputs
  - name: inputs
    type: text
    required: true
    prose: true
    description: The source series required, and where each comes from
  - name: caveats
    type: text
    required: true
    prose: true
    description: Known ways this measure misleads, and what it excludes
  - name: calculator
    type: string
    required: true
    description: Name of the crates/ calculator implementing it, if implemented
  - name: series
    type: text
    required: true
    prose: true
    description: >-
      The values this metric takes over what the corpus holds — which years, over which agencies,
      and the figures — with the published series they are computed from. Required: a metric
      without one is a measure the corpus names and has not taken. Every instance holds one, and
      its figures are bound to the crates that compute them, so a series cannot be written from
      memory.
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. A large share of the corpus's edges
# use a relationship no class declares, and almost all of those are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject those edges or bloat every ontology with
# declarations that each describe one link.
#
# The counts are measured — see "relationship vocabulary" in `.yidam/corpus/README.md`. They are
# not repeated here, because they were: this comment carried three hand-written figures, fifteen
# ontologies carried the same copy, and every figure was stale before anybody re-measured.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: derived-from
    target: metric
    direction: out
    description: A measure this one is computed from; composite measures must expose their inputs
  - relationship: measures
    target: education-agency
    direction: out
    description: The agency or agency set this measure is computed over
  - relationship: operationalizes
    target: doctrine
    direction: out
    description: The normative principle this measure renders testable
  - relationship: computed-for
    target: fiscal-period
    direction: out
    description: A fiscal period for which this measure has been computed
  - relationship: projected-by
    target: scenario
    direction: in
    description: A counterfactual that forecasts this measure forward
