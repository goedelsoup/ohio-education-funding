class: intervention
label: Academic Distress Commission
summary: >-
  The point at which Ohio's accountability system stops advising and takes over the district's
  budget. The trigger is arithmetic: three consecutive years below two stars, and the
  department shall establish a commission.
description: |
  The point at which Ohio's accountability system stops advising and takes the district's
  budget.

  **The trigger is a report card rating, three years running.** R.C. 3302.10(A) says the
  department "shall establish an academic distress commission" — shall, not may — for any
  district that has for three consecutive years received an overall grade of "F" under R.C.
  3302.03(C)(3), or an overall performance rating of **less than two stars** under R.C.
  3302.03(D)(3). [verified]

  **The commission is majority state-appointed.** Five members: three by the director of
  education and workforce, one by the president of the district board, one by the mayor.
  Appointments within thirty days of notice; the director designates the chairperson from among
  the director's own three. [verified] An elected board retains one seat on the body that
  supersedes it.

  **And the chief executive officer is paid by the department.** Within sixty days the
  commission appoints a CEO for the district, "who shall be paid by the department of education
  and workforce". [verified] The person exercising the district's authority is not on the
  district's payroll.

  ### The powers are fiscal, which is why the intervention belongs beside the funding

  The CEO's enumerated powers under division (C)(1) include defining employee responsibilities,
  setting compensation, allocating teacher class loads, conducting evaluations, making
  reductions in staff, setting the calendar, contracting for services, modifying board policy,
  establishing grade configurations, determining curriculum, setting class sizes — and **"(j)
  Creating a budget for the district."** [verified]

  The elected board continues to exist and continues to levy. What it no longer does is decide
  how the money is spent. The base cost build-up, the local share, the guarantee and the
  supplements all compute an amount that arrives at a district whose spending decisions have
  been transferred to a state appointee. [inference]

  There is also a fund of its own: under division (G)(2) the CEO "shall establish a separate
  fund to support innovative education programs", holds **sole authority to disburse** from it
  until the district exits, and every disbursement must support the approved improvement plan.
  Moneys appropriated by the General Assembly for that purpose go into it. [verified]

  **The powers escalate by year**, and division (K) replaces the elected board in year four — so
  it is superseded on a schedule rather than at the trigger. Two other divisions move money past
  the district. [verified] Both are set out below.
findings: |
  ### It pays and takes at once, and it is not the same number

  This node used to say "the same number pays and takes", and asked whether any district had
  been in both positions at once. It was checkable. **Youngstown City is under an academic
  distress commission today and the department's FY2027 model pays it $162,207.67** on the
  [performance supplement](../formula-component/fsfp-performance-supplement.yml). All three
  districts that have had a commission are in that model: [verified] (computed; see
  [`crates/project/tests/the_supplements_outside_the_formula.rs`](../../../crates/project/tests/the_supplements_outside_the_formula.rs))

      East Cleveland   3 stars    progress 4   released                 $55,029.14
      Lorain           2 stars    progress 2   dissolved by H.B. 33            $0
      Youngstown       2.5 stars  progress 3   still under one         $162,207.67

  **But it is not the same number, and that is why both positions can be held at once.** R.C.
  3302.10 triggers on the *overall* rating. The supplement pays on the greater of the overall and
  progress ratings, gated by three routes, two of which read progress alone — and both paid
  districts here qualify on the progress route, neither on the star route. Youngstown is taken by
  one component of the report card and paid by another. The corpus already holds why the two can
  disagree: the same spending variable carries **−0.073** against
  [attainment](../metric/performance-index.yml) and **+0.209** against
  [growth](../metric/progress-value-added.yml). [verified]

  **The threshold that pays sits below the threshold that releases.** Division (N)(1) needs three
  stars to *begin* a transition out. 59 districts sit below that — Youngstown among them at 2.5 —
  and **15 of them are paid, $3,036,977.90 between them, not one through the star route.** A
  district can be too poorly rated to start its own release and well enough rated to be paid for
  its performance in the same year. [verified] (computed)

  In the trigger band itself — R.C. 3302.10(A)(1) establishes a commission after three
  consecutive years below two stars — 15 districts sit at two stars or fewer, and exactly one is
  paid: **Jefferson Township Local, $10,426.68**, on a progress rating of 3 against an overall of
  2. [verified] (computed) Two of the 59 are the department's own zero-fill rather than a rating:
  College Corner Local and Kelleys Island Local read 0 stars, and Kelleys Island has an ADM of
  3.51. A report card cannot rate students it is forbidden to report.

  ### Who has actually been under one

  Three districts, on the department's own page: [verified]
  ([`dew-academic-distress-commission`](../../catalog/dew-academic-distress-commission.md), read
  10 August 2026)

      East Cleveland City Schools   released late December 2025; commission ceased under (N)(1)
      Lorain City School District   dissolved by H.B. 33, signed 4 July 2023
      Youngstown City Schools       continuing; the sole district left under one as of January 2026

  **Three commissions have ended three different ways, and only one of them by division (N).** The
  release notice this node previously recorded without opening has now been read, and it dates East
  Cleveland's exit — not on its face, because the letter carries no date line, but from the
  department's own filename (`message-12_25`), the letter's closing promise to visit "in January",
  and reporting of 2 January 2026 that it was sent in late December. **Late December 2025**, and no
  finer. [verified]
  ([`dew-academic-distress-commission`](../../catalog/dew-academic-distress-commission.md), notice
  read 15 September 2026) The district had been under state control since 2018, so its commission
  ran roughly seven years.

  The letter's grounds are division (N)(1) exactly: 16 of 20 benchmarks met, the Performance Index
  up more than 12 points, a 4-star Progress rating, and **an overall rating of 3 stars** — the
  threshold that begins a transition. And "released" is not a softer status than the statute's: by
  (N)(1) the chief executive officer relinquishes control "and the academic distress commission
  shall cease to exist". [verified] So the department's word and R.C. 3310.03(E)(2)'s trigger for
  cutting off first-time scholarships are the same event.

  **The two-to-three star trap is no longer only an inference.** This node reasoned that a district
  between two and three stars can neither re-trigger nor begin its exit. Youngstown sits at 2.5, and
  in January 2026 the department told reporters that its removal "would have to be the result of
  state legislation" — which is the trap described from the other side, by the office that would have
  to apply (N)(1). [verified] Lorain's exit *was* legislation. So of the three, one left by rating,
  one by statute, and the third can reach neither door. [inference]

  All three were under oversight when a 2021 change in state law required an academic
  improvement plan running three school years with annual benchmarks; revised plans were
  approved for all three on 3 December 2021. [verified]

  **Two acts already in this corpus turn out to have accountability effects it did not
  record.** [H.B. 33](../legislation/hb-33-2023.yml) is modelled here for refreshing the cost
  inputs to FY2022 and making EdChoice universal; it also dissolved Lorain's commission. [H.B.
  110](../legislation/hb-110-2021.yml) is modelled as the Fair School Funding Plan act, and the
  2021 improvement-plan requirement dates to the same session. A budget bill in Ohio carries
  the funding formula and the accountability regime in the same instrument, which is an
  argument for holding both domains that only became visible once both were held. [inference]

  **And Cleveland is not one of the three.** Its
  [node](../education-agency/cleveland-municipal.yml) records "state academic distress
  intervention for part of the period" without saying which regime. It was the *former* R.C.
  3302.10 — the pre-2015 arrangement the current section refers to when it speaks of a
  commission "still in existence on October 15, 2015". [inference] Reading the current three as
  the complete history would put Cleveland in the wrong regime and lose the fact that Ohio has
  had two.

  ### Getting out is harder than staying in

  The exit criteria are division (N), and they are not the trigger run backwards. [verified]

  A district *begins* a transition out when it receives an overall grade of "C" or higher, or an
  overall performance rating of **three stars or higher**. That year starts a clock and,
  expressly, "shall not count as one of the two consecutive school years" that follow: the
  transition ends only after two further years at higher than "F", or **two stars or higher**.
  Three years at the fastest, on two different thresholds. And division (N)(2) is the trap — a
  single year back below two stars during the transition ends it, and the district "shall resume
  being fully subject to this section at the point it began its transition", so the escalation
  ladder in divisions (H) through (L) does not reset. It resumes where it stopped.

  **Compare the two.** Entry is three consecutive years *below two stars*. Exit is one year *at
  three stars* and then two years *at two stars*. So the band between two and three stars is
  neither in nor out, and it is a trap for a district already inside: at two-and-a-half stars it
  is not re-triggering, and it cannot start the exit clock either, because that needs three.
  [inference] The section sets no maximum duration; how long a commission lasts is entirely what
  division (N) makes of the ratings. Which years each of the three districts here cleared is not
  established — the corpus holds no district's year-by-year overall rating, only the current
  cross-section. [open]

  There is one other exit, in division (O): if reconstitution or closure leaves the district
  operating no schools at all, the commission ceases to exist. [verified] An intervention whose
  most drastic power is closing schools terminates itself by exercising it.

  ### The flag has a per-building consequence, and it is a dated fact inside a computed file

  Division (G)(3)'s EdChoice switch is now observable per building. The department's *Designated
  List 2026-2027* carries an `Academic Distress School` column, and it is the **one input to the
  designation that this repository reads rather than derives** — every other column rebuilds from
  the raw counts, and this one cannot, because it records whether a commission exists rather than
  any arithmetic. The workbook was authored 13 November 2025, when East Cleveland's commission
  still did. [verified]
  ([`crates/dispersion`](../../../crates/dispersion/tests/the_one_column_the_designation_reads_is_a_dated_fact.rs))

  So the list asserts an Option A eligibility for 2026-2027 that (N)(1) had already ended, and the
  file is still unrevised. What that costs is nothing: East Cleveland's five buildings qualify on
  the performance-and-poverty route as well, and **the only buildings resting on the distress route
  alone are two of Youngstown's**, in the one district still under a commission. [verified]
  (crates/dispersion) An intervention's end reaches the scholarship channel through a column in a
  spreadsheet, and it reached it late.

  **What is still not established.** When Lorain's and Youngstown's commissions were established —
  the department's page gives the 2021 plan requirement and the 2023 dissolution and no start
  dates, and only East Cleveland's is dated, to 2018 by the reporting around its release. [open]
  Whether any commission changed outcomes, which is what the apparatus rests on. [open] And the
  trigger itself is uncomputable from what is held: R.C. 3302.10(A)(1) needs three consecutive
  years of the **overall** district rating, and the corpus holds one year of the Achievement
  component star and no overall rating in any cached report card download. [open] That gap bounds
  what any reproduction here could check — the trigger predicts establishment, not existence, so it
  could not have audited the column above in any case. [inference]
