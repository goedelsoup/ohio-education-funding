properties:
  name: Academic distress commission
  authority: R.C. 3302.10, effective 3 October 2023 in its current form. [verified]
  trigger: |
    Three consecutive years of an overall grade of "F" under R.C. 3302.03(C)(3), or an overall
    performance rating of less than two stars under R.C. 3302.03(D)(3). Also applies where a
    commission established under the former section survived to 15 October 2015 and had by then
    existed for at least four years, in which case the old commission is abolished and a new one
    appointed. [verified]
  unit: education-agency
  exit: |
    Division (N). A transition out **begins** when the district receives an overall grade of "C"
    or higher under R.C. 3302.03(C)(3), or an overall performance rating of three stars or higher
    under (D)(3). It **ends** after two further consecutive school years at higher than "F", or at
    two stars or higher — the qualifying year expressly not counting as one of the two. A single
    year back below the trigger during the transition ends it and returns the district to the
    escalation division it had reached, which does not reset. [verified]

    Minimum three years, on two thresholds: three stars once, then two stars twice. Entry is
    three consecutive years below two stars, so the two-to-three star band accumulates toward
    neither. [inference]

    Division (O) is the other exit: a district left operating no schools, by reconstitution or
    closure, ends its own commission. [verified]

    R.C. 3302.103 is a third, for the three districts under a commission in 2021 only. While a
    district implements its academic improvement plan it is not subject to R.C. 3302.10. Meeting a
    majority of the plan's benchmarks at the end of the three years, or after up to two one-year
    extensions, dissolves the commission. Missing them after five years, or being refused an
    extension, returns the district to R.C. 3302.10. [verified]
  powers: |
    Exercised by a chief executive officer appointed by the commission and paid by the department.
    Employee responsibilities and job descriptions; compensation; teacher class loads; evaluations;
    staff reductions under R.C. 3319.17, 3319.171 and 3319.172; the school calendar; **creating a
    budget for the district**; contracting for services; modifying board policies and procedures;
    grade configurations; curriculum; instructional materials and assessments; class sizes; staff
    professional development. [verified]

    Any previously appointed improvement coordinator under R.C. 3302.04(A) is terminated.
    [verified]

    **Divisions (H) through (L) add to that list by year**, each keyed to the district's report
    card for its first, second, third, fourth and fifth year under the section. Year one: the CEO
    may *reconstitute* any school — change its mission, replace its principal or a majority of its
    staff, contract its operations to a nonprofit or for-profit manager, reopen it as a community
    or STEM school, or permanently close it — and may reopen a collective bargaining agreement to
    renegotiate. Year two: the CEO may unilaterally limit, suspend or alter any provision of that
    agreement, outside bargaining, short of cutting base hourly pay or insurance. Year three:
    continue those alterations. **Year four: a new board of education is appointed** under R.C.
    3302.11, while the CEO retains complete control until relinquishing it under division (N).
    Year five and after: everything already unlocked. [verified]

    So the elected board is superseded on a schedule rather than at the trigger: division (K)
    replaces it in year four. Two other divisions move money past the district. [verified] Both
    are set out under `fiscal_effect`.
  fiscal_effect: |
    Transfers the power to create the district's budget from the elected board to a state-appointed
    chief executive officer whose salary the department pays. [verified] Establishes a separate
    innovation fund the CEO alone may disburse, holding any moneys the General Assembly
    appropriates for the purpose. [verified]

    **And it moves money past the district, which this node previously denied.** The field read
    "does not alter what the funding formula computes for the district — only who decides how it
    is spent", as an inference, until R.C. 3302.10 was read past its powers list. Two divisions
    contradict it. Division (G)(3) makes **every student entitled to attend school in the
    district** eligible for [EdChoice](../program/edchoice-scholarship.yml) for as long as the
    district is subject to the section — a scholarship deduction switched on by a rating, against
    a district already judged to be failing. Division (M) then makes community schools, STEM
    schools, chartered nonpublic schools and *other school districts* enrolling the district's
    residents eligible for an "academic performance bonus" in any year the General Assembly
    appropriates for one, from the second year of the commission onward. [verified]

    So the section appoints a manager for the district and pays its alternatives. Neither channel
    is in the funding formula, and the first is a deduction the formula does not see coming.
    [inference]
unfilled:
  - field: the overall district rating, three consecutive years
    why: >-
      R.C. 3302.10(A)(1)'s trigger needs three consecutive editions and two are held: the
      department's high-level download for 2024-25 and 2025-26, in `dew-report-card-overall`. An
      earlier edition is not registered, so no three-year run can be read yet.
