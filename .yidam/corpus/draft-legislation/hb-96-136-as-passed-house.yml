    relationship: perturbs
    note: >-
      Through `Section 265.235(B)` rather than through the percentage itself, which this stage
      leaves where the act leaves it. The perturbation is to whether the parameter is read.
  - target: ../funding-regime/fair-school-funding-plan.yml
    relationship: baselines-on
  - target: ../funding-regime/bridge-formula.yml
    relationship: revives
    note: >-
      The regime whose construction division (C) reproduces: aid distributed by reference to what
      each district received before, inside a guarantee and a cap. Ohio ran it from 2011 to 2021
      as an acknowledged placeholder, and the Fair School Funding Plan replaced it. `revives`
      rather than `parallels` — the class declares `parallels` for a published template, and this
      is not a resemblance to a model but a return to a regime this state has already had.
