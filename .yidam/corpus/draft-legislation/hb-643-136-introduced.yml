properties:
  provenance: introduced
  designation: H.B. 643
  general_assembly: 136th General Assembly
  sponsors: |
    Representatives **Justin Pizzulli** (R, district 90) and **Anita Somani** (D, district 8),
    both recorded active, with no cosponsors. [verified] It is a two-member bipartisan pair, which
    is worth stating for a bill that would put a ceiling back on a universal eligibility the
    majority enacted.

    Neither has withdrawn and the committee referral has produced nothing, which **is** readable
    after all — see `status` below. The claim that the version index carries no procedural history
    was wrong: the index carries the sponsor roster with an `active` flag, and it advertises two
    further endpoints that carry the history itself.
  status: |
    **As introduced, and no further.** The version index holds one entry and no committee report,
    floor vote, or effective date, and `governor_signed_date`, `concurrence_date` and
    `effective_date` are all null. [verified]

    **The procedural history is readable, and it is empty.** The index advertises
    `.../legislation/hb643/meetings/` and `.../legislation/hb643/amendments/`; both return `200`
    with `[]`. That is a finding rather than a failure, because the same endpoints populate: H.B.
    96 of this General Assembly returns **99** meetings and H.B. 186 returns **14**. So the bill
    has been referred and never heard, rather than the endpoint being unimplemented. Retrieved
    9 September 2026. [verified]

    **What is still not readable is whether it is dead.** A bill that is never reported out simply
    stops, and the General Assembly publishes no marker for that — zero meetings is the same
    record for a bill that will be heard next month and one that never will. That distinction is
    not in the data and no amount of endpoint enumeration produces it. [open]
  text_read: |
    `hb643_00_IN`, first retrieved 20 August 2026 from
    `search-prod.lis.state.oh.us/api/v2/general_assembly_136/legislation/hb643/00_IN/html/` and
    re-retrieved 9 September 2026. Pinned at SHA-256
    `12d3a53247dea420f8210c2cc5daa9cc891500804c51b9c4494993b4d504bca8`, 11,828 bytes.
    [verified — `crates/connect/source-digests.txt`]

    The digest is load-bearing rather than ceremonial. `00_IN` is stable, but a bill's *current*
    text moves under its own URL as it is amended, so a claim about "H.B. 643" that does not name
    a version names a moving target. See [`ohio-bills`](../../catalog/ohio-bills.md).

    **And the digest moved without the bill moving.** The first pin was
    `ea8896c5…`, 11,817 bytes. The document now served is 11 bytes longer and hashes differently,
    and the whole of the difference is that the department's exporter went from LibreOffice
    24.2.7.2 to 25.8.6.2 — CSS properties reordered inside `style` attributes, an empty `<title>`
    filled in. Stripped of markup, the two are **byte-identical across 3,798 characters**. The
    version is stable as a *bill*; the bytes are not. [verified]
  question: |
    What does a real pending bill about school funding look like when it reaches a model built
    around the foundation formula, and how much of one can that model actually price?
  provisions: |
    One provision.

    **1. EdChoice expansion eligibility capped at $500,000 federal AGI.** Amends R.C. 3310.032.
    Binds no parameter and sets no lever. **Not runnable.** [verified]

    The bill's own long title enumerates exactly one section, so this is the whole of it — unlike
    a budget act, where the funding provisions are a few dozen sections out of several thousand
    pages and enumerating them is itself the work.
  unpriced: |
    One of one. The whole bill.

    **EdChoice expansion eligibility (provision 1, R.C. 3310.032).** Outside the model rather than unlevered, and
    further outside than most: the scholarship channel is not partially represented here, it is
    absent. The [`deduction`](../../skills/deduction.md) calculator was declared for this channel
    and never built, because the per-agency participation series it would read does not exist —
    `dew-payment-reports` sits behind the department's authenticated reports portal. [open]

    So there is no figure, and the absence is the finding rather than a gap in this node. A bill
    can be current, real, squarely about school funding, and completely beyond what this
    repository can compute.
