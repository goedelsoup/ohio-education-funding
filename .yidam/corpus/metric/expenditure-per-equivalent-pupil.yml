      exists to correct, one step further along.
properties:
  name: Expenditure per equivalent pupil
  unit: dollars-per-pupil
  definition: |
    expenditure_per_equivalent_pupil = qualifying district expenditures / weighted ADM

    Qualifying expenditures are organized through DEW's Expenditure Flow Model. Weighted ADM is
    average daily membership adjusted upward by DEW formulas intended to reflect the additional
    service costs associated with economically disadvantaged students, English learners, and
    students with disabilities. The weight schedule itself is not held in this corpus. [open]

    Reported all-funds and split into two components that sum to it exactly:
      - federal funds per equivalent pupil
      - state and local funds per equivalent pupil

    Because the components sum to the total, they are not independent predictors and must never
    be entered in one model as though they were.

    Must be reported with the word "equivalent" intact. Dropping it turns a need-normalized
    figure into an apparent headcount average and understates Ohio spending by about a fifth.
  inputs: |
    Expenditures per equivalent pupil and its two components, by district and school year, keyed
    by District IRN — from
    [dew-report-card-spending](../../catalog/dew-report-card-spending.md).

    Operating expenditures with both weighted and unweighted ADM — from the
    [FY2025 Expenditure Expanded List](../../catalog/dew-expenditure-expanded-list.md). This is
    the file that makes the denominator testable rather than arguable.

    Both retrieved by the `dew-report-card` connector and committed at
    [`crates/dispersion/fixtures/report-card-2425-district-data.csv`](../../../crates/dispersion/fixtures/report-card-2425-district-data.csv).
  series: |
    2024-2025, 607 rated traditional districts, as published [verified] (computed from the
    committed fixture, and reproducing OCG White Paper 013 exactly):

                          min      p25   median     mean      p75       max
      total            $8,913  $11,615  $12,856  $13,224  $14,254   $46,716
      state & local    $8,014  $10,976  $12,200  $12,549  $13,644   $46,101
      federal            $106     $392     $526     $675     $786    $4,530

    The same expenditures over the other divisor, FY2025:

      per unweighted pupil   median $16,289   mean $16,920   cv 0.202   p5 $12,936   p95 $22,715
      per weighted pupil     median $12,854   mean $13,223   cv 0.201

    **Dispersion survives the denominator change; the level does not.** Both coefficients of
    variation are 0.20, and both match the 0.202 that `crates/dispersion` computes over the
    FY2024 Cupp Report. Three measures, two years, two divisors, one spread. The weighting moves
    every district's figure down by roughly a quarter without much changing how far apart they
    are — which is why a dispersion statistic is a poor detector of the problem and a correlation
    against an outcome is a good one. [verified]

    The FY2025 headcount median of $16,289 against the Cupp Report's FY2024 $15,646 is a 4.1%
    year-over-year rise from an independent publication. [verified]
  caveats: |
    **The denominator is a partial need adjustment.** Any analysis calling itself unadjusted
    while using this measure is adjusted on one side. This is the main entry above.

    **Not comparable to headcount per-pupil figures**, including
    [per-pupil operating expenditure](per-pupil-operating-expenditure.yml), NCES figures, Census
    F-33 figures, or district five-year forecasts. 21% lower at the median within one file.

    **Components sum to the total.** Federal and state-and-local are shares of one quantity.

    **Weighted ADM is published as a whole number; unweighted ADM carries four decimals.** So a
    recomputed per-equivalent-pupil figure carries quantisation noise inversely proportional to
    district size — Put-in-Bay Local at 77 weighted pupils reconstructs $86 from its published
    $46,716. Immaterial in aggregate, material for any single small district. [verified]

    **Federal relief inclusion is unstated.** The corpus records that including or excluding
    COVID relief moved statewide per-pupil expenditure by $821 in FY2022. The 2024-2025 federal
    mean of $675 is consistent with Title I and IDEA alone, so the tail is probably exhausted,
    but the source does not say. [open]

    **All-funds on the report card, operating on the Expanded List.** The two numerators are not
    identical and the relationship between them has not been established. Every cross-denominator
    comparison above uses the Expanded List's single operating-expenditure total for both sides,
    which is what makes it a controlled comparison. [verified]

    **Population is 607 rated traditional districts**, not the corpus's 606 or 609.
  calculator: |
    Published, not computed. Distribution and association statistics over it are `dispersion`;
    the unweighted-ADM recomputation lives in
    [`crates/dispersion/tests/report_card_2425.rs`](../../../crates/dispersion/tests/report_card_2425.rs)
    and is pinned so a fixture refresh that moves it fails the build.
