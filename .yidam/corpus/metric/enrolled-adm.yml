findings: |
  **THE GUARANTEE MAKES A DISTRICT'S AID COMPLETELY INSENSITIVE TO ITS ENROLLMENT.** [verified —
  `crates/project`]
  The [temporary transitional aid guarantee](../formula-component/temporary-transitional-aid-guarantee.yml)
  pays a fixed dollar amount that enrollment does not enter. For the 294 districts it funds — very
  nearly half the state — running the FY2027 formula at FY2024, FY2025 or FY2026 enrolment
  produces the identical figure to the cent, and projecting their enrollment forward produces a
  flat line with no interval at all. What moves for them is the *formula's* answer, which falls
  as enrollment does; the widening gap between the two is the guarantee.

  **REMOVING THE GUARANTEE NEARLY DOUBLES THE STATE'S EXPOSURE TO ENROLLMENT FORECAST ERROR.**
  [inference — a forecast] At FY2032 enrollment, total state aid under current law is $7,233M in
  a band of $7,017M to $7,494M (±3.3%). With the guarantee removed the same forecast error
  produces ±5.9%, on a band 1.8 times as wide. The guarantee is a shock absorber for the *appropriation* as well as for the
  district, and that is not usually how it is argued about. Recorded in full at
  [guarantee phase-out](../scenario/guarantee-phase-out.yml).

  **THE AID BAND IS TIGHTER THAN THE ENROLLMENT BAND THAT DRIVES IT.** [verified] Necessarily, and
  for the same reason: half the state's aid does not respond to enrollment at all.

  See [dew-mr81-enrollment-archive](../../catalog/dew-mr81-enrollment-archive.md).

  **THE METHOD IS RIGHT AND THE CONSTANT IS NOT.** [verified — `crates/project`]
  This was carried as open for want of an enrollment history longer than three points. The
  history arrived from a different direction than the one expected: not `nces-ccd`, but the F-33
  panel, once it was extended past FY2022 — `V33` fall membership for **602 districts across
  fourteen years**, keyed on `LEAID`, which is also what answers the consolidation worry, since
  a district that stops being surveyed simply leaves the population rather than distorting it.

  Backtested over **13,244 out-of-sample forecasts** — six origins from FY2013 to FY2019,
  horizons of one to five years, the two pandemic years dropped as targets because no method
  predicts a school closure:

  | damping | mean absolute log error |
  |---|--:|
  | 0.20 — the fitted optimum | 0.04031 |
  | 0.30 | 0.04033 |
  | **0.85 — the convention it replaced** | **0.04441** |
  | 1.00 — undamped | 0.04874 |
  | carrying the last observation forward | 0.04340 |

  Damping is the right shape: at its optimum it beats a flat carry-forward by 7.1%, and an
  undamped trend and a least-squares straight line are both worse than either. **But 0.85 damps
  too weakly to collect that gain**, costs about a tenth of the error against the optimum, and on
  three of the four metrics tried is beaten by making no forecast at all. Ohio district
  enrollment is close enough to a random walk that a fitted growth rate is worth carrying for
  about a year; 0.85 carries three-quarters of it into the third.

  A longer fitting window is the larger of the two available improvements and is free — the
  observations are already committed. [verified — `crates/project`]

  **AND THE GUARANTEE ABSORBS MOST OF THE ERROR, WHICH BOUNDS WHAT IT COSTS.** [verified —
  `crates/project`]
  At the feed's FY2036 horizon, moving the damping from 0.85 to 0.30 moves statewide ADM by
  **+3.38%** — 45,294 pupils — and realized state aid by **+1.42%**, or $101.0m. The enrollment
  error is more than twice the aid error for the reason this node already gives: the guarantee
  pays a fixed amount to about half the state, so state cost is far less sensitive to enrollment
  than the enrollment forecast is uncertain. The constant was wrong and the consequence is
  bounded, and both halves belong in the same sentence.

  What moves most is not a dollar figure. **44 districts** change guarantee status at the horizon
  — 356 against 312 — and that is a count the site publishes.

  These figures are measured under `Method::Shrunk`, which is what the feed runs. The same move
  under the plain `Method::Damped` that shipped when the damping was fitted gives +4.66% and
  61,297 pupils, +1.05% and $75.4m, and 47 districts against 44 — and a four-to-one ratio of
  enrollment to aid rather than this two-and-a-half. `the_damping_nobody_fitted` keeps those,
  because they are the evidence [the-fitted-damping](../../decisions/the-fitted-damping.yml)
  was decided on and a decision's evidence has to keep reproducing; the figures above are what
  the same question answers today, pinned in `the_trend_the_damping_discards`.

  **THE LARGEST POPULATION OUTSIDE THE COUNT HAS NO PER-DISTRICT RECORD AT ALL.** [verified —
  `crates/project`]
  ADM counts children a district enrolls. The department's own annual fact sheet counts, in one
  table and one year, every way an Ohio child is schooled instead — 173,156 in chartered private
  schools, 150,914 on vouchers, 116,973 in community schools, 79,006 on inter-district open
  enrolment, 49,524 in joint vocational districts, and **53,051 in home education**, against a
  statewide enrolment of 1,665,521.

  That 1,665,521 is Ohio's *public* enrolment: the community schools are inside it, and home
  education, the chartered private schools and the voucher students at them are not. So home
  education is 3.2% of the public system rather than 3.2% of Ohio's children — the second
  denominator is larger and nothing published states it. On the first, it is larger than the
  joint vocational districts, larger than every Ohio e-school together, and larger than four of
  the five voucher programmes. **It is also
  the only one of the thirteen channels with no per-district record anywhere.** Community schools
  report through EMIS; vouchers are administered per student; open enrolment names both districts.
  A home-education notice is filed with the district of residence under R.C. 3321.042 and no
  statute requires anyone to forward it to the state as a count. EMIS carries withdrawal reason
  `43 — Transferred to Home Education`, which is a flow rather than a stock: a child who begins
  at six and never enrolls is permanently invisible to it.

  **And it grew by a factor of about 1.8 in five years, in one step that never reversed.**
  [inference — a secondary compilation, anchored on one verified year]
  33,328 in 2019-20 to 61,009 in 2024-25, with the step in 2020-21. The series is an aggregator's
  and cannot be verified, but its 2023-24 member is 53,051 and the department's sheet says 53,051,
  which is what identifies it as Ohio's numbers carried forward. Against the committed F-33 panel,
  district enrolment fell 62,609 between FY2020 and FY2024 while home education rose about 19,700
  — **roughly 31% of the decline in magnitude**. That is a size comparison and not a
  decomposition: districts also lost pupils to community schools, to vouchers, and to a falling
  birth cohort, and nothing here apportions between them. What it establishes is that a channel
  carrying no ADM, in no enrolment file, reported per district nowhere, is of the same order as a
  third of the enrolment loss that half the state's guarantee status turns on. See
  [dew-education-landscape](../../catalog/dew-education-landscape.md) and
  [jhu-homeschool-hub](../../catalog/jhu-homeschool-hub.md).

  **[open]** Where home education is concentrated. A population spread across some 600 districts
  is thin almost everywhere and heavy somewhere, and the concentration is what a denominator
  question needs. Only the department can answer it — tracked at
  [#257](https://github.com/goedelsoup/ohio-education-funding/issues/257).

  **AND THE CONSTANT MOVED.** [verified — `crates/project`]
  It was left at 0.85 while only the measurement existed, because changing it moves every
  projection in the published feed, which is a decision to record rather than a number to edit.
  The decision is recorded at
  [the-fitted-damping](../../decisions/the-fitted-damping.yml) and the value is now **0.30** —
  chosen over the 0.20 that minimises the headline metric because the objective is flat between
  them (0.04033 against 0.04031, which no honest reading distinguishes) and 0.30 is the optimum on
  the enrollment-weighted metric, the one that governs a statewide total rather than a typical
  district.

  So a district's fitted growth rate is now nearly spent by the second projected year instead of
  the fourth, and a long horizon sits closer to the last observation — which is what fourteen
  years of Ohio enrollment say it should do.

  **AND THE TWO QUESTIONS THAT DECISION LEFT OPEN ARE ANSWERED — ONE NO, ONE YES.**
  [verified — `crates/project`]

  *A damping per district is noise.* Fitted on each district's own history it looks **15.3%**
  better than the single constant and is **3.6% worse** out of sample. More than two thirds of
  districts fit a boundary of the grid — 316 of 602 at zero, 101 at one — which is what an
  unidentified parameter looks like when it is fitted anyway. Fifteen forecasts cannot locate a
  decay rate. The feed keeps one damping, now for a reason rather than for want of trying.

  *A longer fitting window is worth more than the damping was, and blending beats replacing.*
  Weighting the three-point rate against the district's whole-history rate:

  | weight on the three-point rate | mean absolute log error |
  |---|--:|
  | 1.0 — what the projections do | 0.04033 |
  | **0.3** | **0.03855** |
  | 0.0 — long history alone | 0.03881 |

  Discarding the recent rate is **worse** than keeping about a third of it, so three points carry
  real information about where a district is now and not enough to stand alone. At 0.3 the gain is
  **4.6%**, larger than the 2.4% that moving the damping bought. Re-tuning the damping on top
  moves the optimum to 0.40 and buys a further 0.18%, which is not worth a second change to a
  published constant.

  **AND THE BLEND IS NOW WHAT THE PROJECTIONS USE.** [verified — `crates/project`]
  Recorded at [the-shrunk-rate](../../decisions/the-shrunk-rate.yml). Every district's rate is
  three-tenths its own FY2024-FY2026 history and seven-tenths its fourteen-year rate in the F-33
  panel. Statewide ADM at FY2032 moves from 1,376,970 to **1,384,245** and the count on the
  guarantee from 320 to **312**; aid moves $3M, because the guarantee absorbs most of it.

  **It rests on one assumption, and the assumption is why this took a decision rather than a
  patch.** The projection runs on enrolled ADM and the long rate is `V33` fall membership. The two
  count nearly the same children — their FY2024 levels correlate at **0.9997** across 608
  districts — but their two-year growth rates correlate at only **0.287**. The shrink assumes they
  share a long-run trend while differing in short-run noise, and only three years of ADM exist, so
  nothing here can test it. The disagreement is at once the best evidence that a two-year rate is
  mostly noise and the reason the substitution could not be made mechanically.

  **AND THE THING NEITHER FITTING DECISION COULD SEE IS THAT THE PROJECTIONS RUN HIGH.**
  [verified — `crates/project`]
  Both were scored on mean absolute log error, which is blind to sign. The five-year backtest
  bias falls monotonically as the damping rises — **+0.033** at a damping of zero, **+0.030** at
  the shipped 0.30, **+0.002** undamped — so the damping causes it, and the undamped trend pays
  for its lack of bias with 41% more dispersion. It is a bias-variance trade priced on one side.

  The mechanism is arithmetic rather than anything about Ohio. Damping applies the fitted rate
  for `(1 - d^h)/(1 - d)` year-equivalents whatever the horizon — **1.43 years at 0.30, for every
  horizon past about six** — so a projection misses `h - 1.43` years of trend, and in a shrinking
  population that miss is upward. Sorted by their own fifteen-year rate, the fastest-declining
  quarter of districts are forecast **8.0% high** at five years and the flattest quarter 2.0%
  low; the sign flips exactly where the growth rate does.

  The districts forecast high are disproportionately the ones the guarantee protects, though not
  by a clean gradient: at observed enrollment **57.2%** of the fastest-declining quarter are on
  the guarantee against **34.2%** of the flattest, the two middle quarters sitting at 48.7% and
  53.3%. The over-forecast therefore lands hardest where the guarantee is what pays, and the
  error runs toward under-stating guarantee reliance.

  **AND AT THE PUBLISHED HORIZON THE TREND IS SIMPLY GONE.** [verified — `crates/project`]
  Statewide ADM projected by the shipped method falls 12,500 in the first year, 3,654 in the
  second, 127 in the seventh, and **12 pupils in total between FY2032 and FY2036** — the two
  years this repository publishes — across 609 districts, in a state whose F-33 panel records a
  fall of 208,918 over fifteen years. The undamped trend reaches 1,290,680 at FY2036 against the
  shipped 1,384,232, so the damping holds **93,553 pupils** above it.

  This is not a defect in `series::advance`, which does what damping means. It is that a ten-year
  panel drawn this way carries about four years of demographic content and six years of the same
  number relabelled, and nothing said so. Measured in `the_trend_the_damping_discards`.

  **[open]** Whether the point estimate should be de-biased. 0.30 minimises the error both
  decisions were made on, the backtest reaches five years while the feed publishes ten, and
  undamping trades a known bias for materially more dispersion. What is settled is the size and
  the cause, not the remedy.
