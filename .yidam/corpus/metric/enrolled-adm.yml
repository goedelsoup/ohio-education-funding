findings: |
  **THE GUARANTEE MAKES A DISTRICT'S AID COMPLETELY INSENSITIVE TO ITS ENROLLMENT.** [verified —
  `crates/project`]
  The [temporary transitional aid guarantee](../formula-component/temporary-transitional-aid-guarantee.yml)
  pays a fixed dollar amount that enrollment does not enter. For the 294 districts it funds — very
  nearly half the state — running the FY2027 formula at FY2024, FY2025 or FY2026 enrolment
  produces the identical figure to the cent, and projecting their enrollment forward produces a
  flat line with no interval at all. What moves for them is the *formula's* answer, which falls
  as enrollment does; the widening gap between the two is the guarantee.

  **REMOVING THE GUARANTEE NEARLY DOUBLES THE STATE'S EXPOSURE TO ENROLLMENT FORECAST ERROR.**
  [inference — a forecast] At FY2032 enrollment, total state aid under current law is $7,125M in
  a band of $6,889M to $7,379M (±3.4%). With the guarantee removed the same forecast error
  produces ±5.9%. The guarantee is a shock absorber for the *appropriation* as well as for the
  district, and that is not usually how it is argued about. Recorded in full at
  [guarantee phase-out](../scenario/guarantee-phase-out.yml).

  **THE AID BAND IS TIGHTER THAN THE ENROLLMENT BAND THAT DRIVES IT.** [verified] Necessarily, and
  for the same reason: half the state's aid does not respond to enrollment at all.

  See [dew-mr81-enrollment-archive](../../catalog/dew-mr81-enrollment-archive.md).

  **THE METHOD IS RIGHT AND THE CONSTANT IS NOT.** [verified — `crates/project`]
  This was carried as open for want of an enrollment history longer than three points. The
  history arrived from a different direction than the one expected: not `nces-ccd`, but the F-33
  panel, once it was extended past FY2022 — `V33` fall membership for **602 districts across
  fourteen years**, keyed on `LEAID`, which is also what answers the consolidation worry, since
  a district that stops being surveyed simply leaves the population rather than distorting it.

  Backtested over **13,244 out-of-sample forecasts** — six origins from FY2013 to FY2019,
  horizons of one to five years, the two pandemic years dropped as targets because no method
  predicts a school closure:

  | damping | mean absolute log error |
  |---|--:|
  | 0.20 — the fitted optimum | 0.04031 |
  | 0.30 | 0.04033 |
  | **0.85 — what the projections use** | **0.04441** |
  | 1.00 — undamped | 0.04874 |
  | carrying the last observation forward | 0.04340 |

  Damping is the right shape: at its optimum it beats a flat carry-forward by 7.1%, and an
  undamped trend and a least-squares straight line are both worse than either. **But 0.85 damps
  too weakly to collect that gain**, costs about a tenth of the error against the optimum, and on
  three of the four metrics tried is beaten by making no forecast at all. Ohio district
  enrollment is close enough to a random walk that a fitted growth rate is worth carrying for
  about a year; 0.85 carries three-quarters of it into the third.

  A longer fitting window is the larger of the two available improvements and is free — the
  observations are already committed. [verified — `crates/project`]

  **AND THE GUARANTEE ABSORBS MOST OF THE ERROR, WHICH BOUNDS WHAT IT COSTS.** [verified —
  `crates/project`]
  At the feed's FY2036 horizon, moving the damping from 0.85 to 0.30 moves statewide ADM by
  **+4.66%** — 61,297 pupils — and realized state aid by only **+1.05%**, or $75.4m. The
  enrollment error is four times the aid error for the reason this node already gives: the
  guarantee pays a fixed amount to about half the state, so state cost is far less sensitive to
  enrollment than the enrollment forecast is uncertain. The constant is wrong and the consequence
  is bounded, and both halves belong in the same sentence.

  What moves most is not a dollar figure. **47 districts** change guarantee status at the horizon
  — 367 against 320 — and that is a count the site publishes.

  **THE LARGEST POPULATION OUTSIDE THE COUNT HAS NO PER-DISTRICT RECORD AT ALL.** [verified —
  `crates/project`]
  ADM counts children a district enrolls. The department's own annual fact sheet counts, in one
  table and one year, every way an Ohio child is schooled instead — 173,156 in chartered private
  schools, 150,914 on vouchers, 116,973 in community schools, 79,006 on inter-district open
  enrolment, 49,524 in joint vocational districts, and **53,051 in home education**, against a
  statewide enrolment of 1,665,521.

  That 1,665,521 is Ohio's *public* enrolment: the community schools are inside it, and home
  education, the chartered private schools and the voucher students at them are not. So home
  education is 3.2% of the public system rather than 3.2% of Ohio's children — the second
  denominator is larger and nothing published states it. On the first, it is larger than the
  joint vocational districts, larger than every Ohio e-school together, and larger than four of
  the five voucher programmes. **It is also
  the only one of the thirteen channels with no per-district record anywhere.** Community schools
  report through EMIS; vouchers are administered per student; open enrolment names both districts.
  A home-education notice is filed with the district of residence under R.C. 3321.042 and no
  statute requires anyone to forward it to the state as a count. EMIS carries withdrawal reason
  `43 — Transferred to Home Education`, which is a flow rather than a stock: a child who begins
  at six and never enrolls is permanently invisible to it.

  **And it grew by a factor of about 1.8 in five years, in one step that never reversed.**
  [inference — a secondary compilation, anchored on one verified year]
  33,328 in 2019-20 to 61,009 in 2024-25, with the step in 2020-21. The series is an aggregator's
  and cannot be verified, but its 2023-24 member is 53,051 and the department's sheet says 53,051,
  which is what identifies it as Ohio's numbers carried forward. Against the committed F-33 panel,
  district enrolment fell 62,609 between FY2020 and FY2024 while home education rose about 19,700
  — **roughly 31% of the decline in magnitude**. That is a size comparison and not a
  decomposition: districts also lost pupils to community schools, to vouchers, and to a falling
  birth cohort, and nothing here apportions between them. What it establishes is that a channel
  carrying no ADM, in no enrolment file, reported per district nowhere, is of the same order as a
  third of the enrolment loss that half the state's guarantee status turns on. See
  [dew-education-landscape](../../catalog/dew-education-landscape.md) and
  [jhu-homeschool-hub](../../catalog/jhu-homeschool-hub.md).

  **[open]** Where home education is concentrated. A population spread across some 600 districts
  is thin almost everywhere and heavy somewhere, and the concentration is what a denominator
  question needs. Only the department can answer it — tracked at
  [#257](https://github.com/goedelsoup/ohio-education-funding/issues/257).

  **[open]** Whether to move the constant. It is left at 0.85 for now: changing it moves every
  projection in the published feed, which is a decision to record rather than a number to edit,
  and this file's business was the measurement.
