class: metric
label: Per-Pupil Operating Expenditure
summary: >-
  What a district actually spends per student on day-to-day operations, excluding capital
  outlay. It is the outcome side of every adequacy and equity claim here, and the measure base
  cost per pupil should be read against.
description: |
  What a district actually spends per student on day-to-day operations — salaries, benefits,
  purchased services, supplies — excluding capital outlay and non-elementary-secondary
  programs. It is the outcome side of every adequacy and equity claim about
  Ohio's districts, and the
  measure against which [base cost per pupil](../parameter/base-cost-per-pupil.yml) should be
  read: base cost is what the state says an education costs, this is what districts spend.

  **This metric is not the state's business and that is the point.** A district's operating
  expenditure reflects local revenue, levy history, and local choice as much as state aid.
  Regressing it against [valuation per pupil](assessed-valuation-per-pupil.yml) is the
  wealth-neutrality test; comparing it against base cost per pupil is the adequacy test. It
  answers neither question by itself. [inference]

  **The denominator here is a headcount, and its sibling's is not.** DEW's report card
  publishes [expenditure per equivalent pupil](expenditure-per-equivalent-pupil.yml), which
  divides by an ADM count weighted upward for disadvantage, English learners, and disability.
  That measure runs about **17.8% lower** at the median — $12,856 for 2024-2025 against $15,646
  here for FY2024 — and it is the one sitting next to the Performance Index on the same report card,
  so it is the one an Ohio spending-versus-results argument will reach for. The two are not
  interchangeable in either direction, and the difference is not cosmetic: a need-weighted
  denominator is a need adjustment that suppresses exactly the gradient this metric exposes.
  [verified]

  ### The report card splits this figure by where the money came from
findings: |
  **The statewide series demonstrates why deflation is not optional.** From FY2000 to FY2022,
  Ohio public school operating expenditure per pupil rose from $7,065 to $15,314 — 116.8% in
  nominal terms. Adjusted for inflation, the increase is **26.1%**. [verified] The same fact,
  stated two ways, supports two entirely different arguments about whether Ohio has increased
  its investment in schools, and both numbers are correct. This is the concrete case for the
  `deflator` calculator being a prerequisite rather than a refinement.

  A third framing is also correct and lower still: excluding federal COVID relief funds, FY2022
  operating EPP was $14,493, making real growth **19.4%**. [verified] The $821 per-pupil gap
  between the two FY2022 figures is larger than most policy changes this corpus models.

  Total operating expenditure roughly doubled over the period, $13.0 billion to $25.8 billion,
  while enrollment fell 8.3% from about 1.84 million to about 1.68 million. [verified]
  Per-pupil growth is therefore partly a numerator effect and partly a denominator one, and
  attributing it wholly to spending decisions is wrong.

  Growth is broadly uniform across functions, which is itself informative — it rules out the
  common claim that administrative bloat drove the increase. In real terms FY2000 to FY2022:
  instruction +25.7%, support +28.2%, other +11.4%. [verified] Support grew fastest, but only
  slightly, and from a smaller base.

  ### The disagreement about this series is periodic, not only definitional

  [OCG White Paper 015](../../catalog/ocg-white-paper-015.md) makes the best available case
  that Ohio's funding argument is a quarrel about definitions: it names seven standards for
  "defunding" and answers each. Its per-pupil and real-reduction rows both read **No — up
  ~25-26% real**, which is correct endpoint to endpoint and is this metric's own headline
  figure.

  It is still not the whole answer, because every standard in that table is applied FY2000 to
  FY2022. Deflated year by year this series falls about 7% between FY2010 and FY2014 and does
  not regain its FY2010 level until FY2018. A speaker who says Ohio defunded its schools and is
  thinking of those years is describing something that happened, under the paper's own real and
  per-pupil standards, and no choice among its seven definitions surfaces it. [inference]

  So the rule this metric adds to the deflation rule: **name the window as well as the index.**
  An endpoint pair cannot see an interior reversal, and this series contains three. Two
  speakers can select different windows on one record and both be correct, which is a second
  and independent reason the public argument does not resolve. See
  [`skills/deflator`](../../skills/deflator.md).

  That gradient, computed over the same FY2024 cross-section behind the equity findings above:
  operating expenditure per pupil correlates with the economically disadvantaged share at
  **+0.383** (Spearman +0.348), and mean spending by quintile of disadvantage runs $15,526,
  $15,148, $15,787, $16,103, **$18,990**. [verified] Ohio's highest-poverty fifth of districts
  spends about $3,400 more per headcount pupil than its lowest. Any analysis reporting that
  spending and need are unrelated should be checked for which denominator it used first.

  **The check has now been run, on one numerator against both divisors.** Correlated against
  the [Performance Index](performance-index.yml), FY2025 operating expenditures give **−0.337**
  per unweighted pupil and **−0.015** per weighted pupil; this metric's own FY2024 series gives
  **−0.388**. [verified] Two headcount measures from two publications agree; the weighted one
  is the outlier. The denominator is not a presentation choice.

  A second, independent series also lands here. The FY2025 Expanded List's headcount median of
  $16,289 sits 4.1% above this metric's FY2024 Cupp Report median of $15,646 — two publishers,
  consecutive years, consistent level. [verified] It is the closest thing the corpus has to an
  external validation of this series, and the first time this metric has been checked against
  anything but itself.

  `exp_per_equivalent_pupil_federal` and its state-and-local twin have been in the committed
  fixture since the report card was first extracted and reached no consumer. They are complete
  for all 607 districts and add to the whole to within a rounding — the largest disagreement in
  the fixture is $1. [verified]

  **Federal money is a median 4.20% of a district's operating spending, and 29.04% at the
  top.** 49 districts are above a tenth; Alexander Local in Athens County is the most exposed,
  at $3,280 of $11,294 per equivalent pupil. The floor is 0.7%. [verified — 2024-25 report
  card, computed in `crates/bundle`]

  This is the only quantity in the corpus that measures exposure to a decision Ohio does not
  make. Every other figure here describes a choice by the General Assembly, a county auditor or
  a local electorate; this one describes what happens to a district if a federal appropriation
  changes, and the answer differs by a factor of forty across the state. [inference]

  **The share, not the dollars, is the portable number.** Both parts are published per
  need-weighted pupil, the denominator this corpus has repeatedly warned about and this project
  has twice been caught mixing. A ratio taken inside one denominator carries none; a comparison
  across two does. Any use of the dollar figures has to name the basis, and they are not
  additive with the function breakdown, which divides by an unweighted headcount. [verified]

  **And the correlation that must not be reported alone.** Federal share against the
  Performance Index is **-0.546** raw and **-0.115** holding poverty constant. Federal
  education money is allocated substantially by poverty, so the raw figure is very largely the
  poverty relationship read backwards; quoting it without the control would state a confound as
  a finding, which is the error this corpus most often finds in secondary reporting. Neither
  figure identifies an effect in either direction. [verified]
revisions:
  - was: |
      The figure was carried as a single per-pupil total, with no source split.
    now: |
      `exp_per_equivalent_pupil_federal` and its state-and-local twin are complete for all 607
      districts and add to the whole to within a rounding. [verified]
    found_by: |
      The committed report-card fixture, which has held both columns since the report card was
      first extracted.
    reach: |
      Nothing was wrong; something was unread. The split matters most for FY2020-FY2024, where
      the federal column is [ESSER](../revenue-stream/esser.yml) and a total read as ordinary
      operating spending is not one.
properties:
  name: Per-pupil operating expenditure
  unit: dollars-per-pupil
  definition: |
    operating_expenditure_per_pupil = total operating expenditure / enrollment

    Operating expenditure covers day-to-day spending on running schools and educating students:
    salaries, benefits, purchased services, supplies. It excludes capital outlay (buildings,
    buses) and programs not directly related to elementary and secondary education (adult
    education, community services).

    Must be reported with (a) whether federal relief funds are included, (b) nominal or constant
    dollars and which deflator, and (c) which entity population is counted. Omitting any of the
    three produces a figure that cannot be compared to any other figure.
  inputs: |
    Total operating expenditure and enrollment by entity and fiscal year — NCES National Public
    Education Financial Survey and Common Core of Data, via `census-f33` and `nces-ccd`.
    Deflator — `bls-cpi`, national CPI-U all items, June of each year, aligned to fiscal year end.
  series: |
    Statewide, all Ohio public school entities, nominal:
      FY2000  $7,065   [verified]
      FY2002  ~$8,100  [verified — chart label, approximately $100 precision]
      FY2004  ~$9,000
      FY2006  ~$9,700
      FY2008  ~$10,300
      FY2010  ~$11,200
      FY2012  ~$11,300
      FY2014  ~$11,400
      FY2016  ~$11,900
      FY2018  ~$12,900
      FY2020  ~$13,700
      FY2022  $15,314 including COVID relief; $14,493 excluding  [verified]

    Real growth FY2000-FY2022: +26.1% including relief funds, +19.4% excluding. [verified]
    CPI growth over the same span: +71.9%. [verified]

    Constant FY2022 dollars, computed by the `deflator` calculator
    (`cargo run --example epp_real_series -p deflate`):

      FY2000  $12,143    baseline    [verified]
      FY2002  $13,341    +9.9%       [inference]
      FY2004  $14,058   +15.8%       [inference]
      FY2006  $14,166   +16.7%       [inference]
      FY2008  $13,948   +14.9%       [inference]
      FY2010  $15,226   +25.4%       [inference]
      FY2012  $14,591   +20.2%       [inference]
      FY2014  $14,173   +16.7%       [inference]
      FY2016  $14,630   +20.5%       [inference]
      FY2018  $15,169   +24.9%       [inference]
      FY2020  $15,747   +29.7%       [inference]
      FY2022  $15,314   +26.1%       [verified]
      FY2022  $14,493   +19.4%       excluding federal relief  [verified]

    Intermediate rows are [inference] on the NOMINAL side only: the figures are chart-label
    approximations to about $100. The deflator no longer contributes uncertainty — every CPI
    observation from FY2000 to FY2022 has been checked against the Bureau of Labor Statistics'
    own published series by the [bls-cpi](../../catalog/bls-cpi-u.md) connector, and
    `crates/connect/tests/deflator_matches_bls.rs` re-checks all twenty-three on every test run.
    [verified]

    That check found one error. FY2016 had been transcribed as 241.038 where the published
    index is 241.018, which moved this row from $14,629 to $14,630 — a difference too small to
    change any claim here, and exactly the size of error that a plausible-looking series hides.
    Twenty-two of twenty-three points were typed correctly. The one that was not could only be
    found by going back to the source, which is the argument for the connector rather than for
    more careful typing.

    TWO FINDINGS THE NOMINAL SERIES CONCEALS. [inference]

    Both are now pinned in
    [`crates/deflator/tests/ohio_epp_real_series.rs`](../../../crates/deflator/tests/ohio_epp_real_series.rs)
    rather than left as prose, including a check that perturbs both trough endpoints by the full
    chart-label uncertainty in the direction that would erase the decline and finds it intact.

    Real per-pupil spending did not grow steadily — it fell. From FY2010 to FY2014 it dropped
    from $15,226 to $14,173, a real decline of about 7%, leaving FY2014 statistically
    indistinguishable from FY2006's $14,166. Eight years of no real gain. That trough sits
    inside the [Bridge formula](../funding-regime/bridge-formula.yml) decade and coincides with
    the withdrawal of federal stimulus. Causation is still not established, but the shape is no
    longer merely "near-flat" — it is a decline and a recovery, and the recovery did not reach
    the FY2010 level again until FY2018.

    Real spending peaked in FY2020, not FY2022. At $15,747 it stands about $433 above the
    FY2022 figure of $15,314. Federal COVID relief arrived while prices were still low and was
    then eroded by the FY2021-22 inflation, so the nominal high and the real high are two
    years apart. The FY2020 nominal input is a chart approximation, so the gap should be
    confirmed against exact figures — but it exceeds the approximation error. [open]

    **THE TROUGH HAS NOW BEEN LOCATED DISTRICT BY DISTRICT**, not from the Auditor's dashboard
    but from the federal survey underneath it: the Census F-33 district panel, extended back to
    FY2009 by three NCES archives published under a `_txt` suffix the FY2012-FY2022 files do not
    use. The panel had opened at FY2012, three years inside the decline. [verified — see
    [`crates/dispersion/tests/f33_ohio_panel_trough.rs`](../../../crates/dispersion/tests/f33_ohio_panel_trough.rs)]

    IT WAS BROAD. Of 607 comparable districts, **490 — 81% — spent less per pupil in real terms
    in FY2013 than in FY2010.** Median change -5.6%, first quartile -9.2%. This was not a handful
    of districts cut hard enough to move a statewide average; four in five actually spent less.

    AND NOTHING ABOUT A DISTRICT PREDICTS HOW FAR IT FELL. The obvious hypothesis — a contraction
    coinciding with the withdrawal of federal stimulus, inside the Bridge formula decade, should
    land hardest on districts most dependent on state aid — is not supported. Against the depth
    of the fall:

      FY2010 state share of revenue      +0.029
      FY2010 federal share of revenue    +0.029
      FY2010 local share of revenue      -0.032
      economically disadvantaged share   -0.033   [later vintage, directional]
      assessed valuation per pupil       +0.033   [later vintage, directional]
      log enrollment                     -0.186
      FY2010 spending per pupil          -0.176

    Only size and prior level register at all, both weakly and the second partly mechanical. The
    deepest decile is real — 60 districts averaging -17.6% — but carries 11.8% of pupils, so it
    is a tail rather than the story. [verified]

    A SECOND SOURCE CONFIRMS THE SHAPE. Enrollment-weighted, the F-33 panel falls **6.8%** from
    FY2010 to FY2013 against the Auditor's **6.9%** from FY2010 to FY2014 — different survey,
    different entity set, levels about $1,500 apart, same decline. [verified] The two series are
    not interchangeable and should never be quoted as one; that they agree on the shape is what
    licenses reading them together.

    FY2014 is absent from the NCES archive under every naming the surrounding years use, so the
    district measurement stops at FY2013 and understates the trough — the Auditor's series is
    still falling between FY2012 and FY2014. [open]

    Per-district series also exist on the Auditor's own dashboard, on the same entity basis as
    the statewide series here, and remain unextracted. They would settle the last of it. [open]
    [open]
  caveats: |
    Entity scope is wider than the 611 districts receiving foundation funding: it includes
    JVSDs, educational service centers, community schools, STEM schools, and state- and
    federal-run schools, plus tuition those entities pay to private and out-of-state schools.
    Not interchangeable with a district-only figure.

    Excludes capital entirely, so a district rebuilding its schools under
    [facilities assistance](../program/classroom-facilities-assistance.yml) shows no increase
    here.

    NCES definitions differ from Ohio's; this is not the operating cost the Ohio formula
    computes, and comparing it directly to base cost per pupil requires stating the gap.

    Enrollment denominators differ between NCES counts and Ohio ADM. [verified]
  calculator: dispersion (for cross-agency distribution); deflate (required)
