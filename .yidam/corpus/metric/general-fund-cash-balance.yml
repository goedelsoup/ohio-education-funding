class: metric
label: General Fund Cash Balance
summary: >-
  What a district holds, as against what it is given or what it spends: the general fund's
  carry-over and ending balance from its own five-year forecast. The only stock in a corpus
  otherwise made of flows.
description: |
  What a district *holds*, as against what it is given or what it spends. The general fund's cash
  balance at 1 July (carry-over) and 30 June (ending balance), from the district's own five-year
  forecast filing under R.C. 5705.391.

  The other measures in Ohio school finance are flows — what the state sends, what a formula
  computes, what a district spends. This one is a stock the district controls, and it is the
  figure a board points to when it says it cannot afford something, or that a legislator points
  to when they say it can.

  It is also a **record of money that changed hands** rather than a model. That distinction is
  load-bearing everywhere it appears:
  the funding calculator says what a district is owed, this says what its treasurer booked.

properties:
  name: General fund ending cash balance, and its carry-over
  unit: dollars
  definition: |
    Forecast line 7.020, ending cash balance at 30 June, excluding proposed renewal, replacement
    and new levies. Its companion 7.010 is the same quantity at 1 July — the carry-over from the
    year before — and within a single filing the identity is exact:

        7.020(year) = 7.010(year+1)
        7.010 + (2.080 total revenue and other financing sources) - (5.050 total expenditures
               and other financing uses) = 7.020

    The second identity closes on 2.080 and **not** on 1.070 total revenue, which excludes
    transfers, advances and note proceeds. Using 1.070 leaves the balance unreconciled for all
    but a handful of districts, which is how the wrong line was caught. [verified]

    Reported against the scale of the operation rather than alone:

        cash as years of spending = 7.020 / 5.050

    A dollar figure is meaningless without it. The same $10M is a year of reserve for a small
    district and three weeks for a large one, and Ohio sets no statutory minimum, so this is a
    comparison figure and never a compliance one.
  inputs: |
    [dew-five-year-forecast](../../catalog/dew-five-year-forecast.md), two pinned filings whose
    audited-actual windows tile FY2020-FY2025 without a gap. 660 reporting bodies, covering all
    609 traditional districts the FY2027 funding model pays.
    [bls-cpi-u](../../catalog/bls-cpi-u.md) for any statement in constant dollars.
  caveats: |
    **General fund only.** Capital, food service, and most federal programmes sit in other funds.
    A balance here is not the district's total resources and an expenditure here is not its total
    spending. It must never be compared line-for-line with
    [per-pupil operating expenditure](per-pupil-operating-expenditure.yml), which is computed on
    the department's own definitions over a different base.

    **FY2021-FY2024 are the federal pandemic relief years.** ESSER money was booked in the
    general fund by some districts and separately by others, and it arrived and stopped on a
    schedule with nothing to do with Ohio's formula. A balance rising across that span is not
    evidence about a district's own position. Named in code as
    `project::finances::Finances::pandemic_years` rather than left to a footnote.

    **Nominal figures across this span can have the wrong sign.** CPI-U June rose 25.1% from
    FY2020 to FY2025. Statewide the balance ends 8% *above* where it started in nominal dollars
    and 14% *below* in constant ones, over the 609 districts in the platform feed. Both are
    correct and they support opposite arguments, which is why nothing here may be quoted without
    its basis. [verified]

    **The panel is not one continuously audited series.** The two filings report the FY2022/FY2023
    seam three years apart and disagree about it for more than half of districts — median $2,
    90th percentile $9,054, nine districts over $1M, largest $13.3M. Those are reclassifications
    across the relief years, not errors, and the corpus states them rather than smoothing them.

    **One district's filing carries no cash line at all.** Toronto City (IRN 044917) is absent
    from lines 5.050, 7.010 and 7.020 of the FY2023 filing, so it has no expenditure and no
    balance for FY2020-FY2022 — and, until the correction, published $0 against $9.86M of
    revenue for each of those years while every identity check passed, because a zero balance
    carries over into a zero balance perfectly. It was the tenth of the ten seam restatements
    above, at $8,140,842, and it was neither a restatement nor a reclassification. Pinned as
    `project::finances::INCOMPLETE`, the missing-line counterpart to `PARTIAL`: a row count
    finds a district short of *years*, and cannot find one short of *lines*.

    **A submitted forecast is not a measurement.** Each filing carries five projected years made
    by a treasurer under incentives — a board arguing for a levy and a board defending a balance
    want different numbers on the same line. Only the audited actuals are extracted; the
    committed fixture contains no forecast value.
  calculator: project::finances

