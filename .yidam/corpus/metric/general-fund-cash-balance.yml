findings: |
  **STATEWIDE BALANCES ROSE THROUGH THE RELIEF YEARS AND FELL IN THE FIRST YEAR AFTER THEM.**
  [verified] Over the 660 filing bodies, ending cash rose in every year from $8.37bn in FY2020
  to $11.20bn in FY2024, then fell to $9.14bn. It is the only fall in the series. In FY2020
  dollars the same series ends *below* where it began.

  **FY2025 IS THE YEAR SPENDING CAUGHT UP.** [verified] Revenue rose 4.9% and spending rose
  16.5%, and it was not a handful of large districts — the median district raised spending 13.7%.
  **460 of 659 ran a deficit**, against fewer than half the year before. The difference came out
  of the balances above.

  **THE GUARANTEE IS NOT PRODUCING DISTRICTS THAT SIT ON CASH.** [verified] A standing claim, and
  the panel does not support it: guaranteed districts hold a median 0.319 years of spending
  against 0.338 for districts on the formula — about a week less, in the direction opposite to
  the claim. See
  [temporary transitional aid guarantee](../formula-component/temporary-transitional-aid-guarantee.yml),
  which is where the guarantee's own erosion in real terms is recorded.

  **[open]** Whether the FY2025 drawdown continues, which needs the FY2027 filing and one more
  closed year.

  ### VERY LITTLE OF THE BUILD-UP WAS THE RELIEF, AND THE FORECAST LINES DO SEPARATE IT

  This node recorded, open, that how much of the FY2021-FY2024 build-up was ESSER booked in the
  general fund is something "the forecast lines cannot separate and the federal award data could."
  One of the lines can, and nothing had read it.

  The filing carries two revenue totals. `total_revenue` is the district's own receipts and
  excludes transfers by construction, which is why it does not close the cash identity;
  `total_revenue_and_sources` is every dollar that entered the fund and does. **Their difference is
  transfers, advances and note proceeds — the only route money received into a special revenue fund
  can take into the general fund.** Every consumer in the workspace read the first column and none
  read the second. [verified] (crates/project, `transfers::by_year`, pinned by test)

  **The line has the shape relief would leave.** Statewide it more than doubles across the relief
  years and falls back when the grants end: **$0.28bn in FY2020, rising to $0.72bn in FY2024, then
  $0.43bn in FY2025**. [verified]

  **It does not have the size.** The build-up does not track a district's relief: the correlation
  between ESSER surge per pupil and the FY2021-FY2024 change in ending cash per pupil is **0.075**
  across 606 districts. If the balances were the grants, the districts that received more would
  hold more. They do not, and at the level the question was asked that is the answer.
  [verified] (crates/project, `transfers::build_up_against_relief`, pinned by test)

  **How much is attributable, bounded rather than pinned.** Sizing the relief share needs a level
  the transfers line would have run at without the grants, and the panel holds no clean one. FY2020
  already carries ESSER I, which arrived in the spring of 2020; FY2025 is not a post-period either,
  because ESSER III's obligation deadline fell in September 2024 and liquidation ran into 2025. On
  the FY2020 baseline the excess is $0.86bn — 46.9% of a $1.83bn build-up — and relief explains
  15.1% to 39.4% of it. Levelled against both years the excess is $0.57bn, 31.3%, and relief
  explains **6.4% to 8.8%**. The two ends of each range are a least-squares slope, which a handful
  of large districts pull, and the gap between the outer quartile medians, which they cannot.
  [verified] (crates/project, `transfers::attribution`, pinned by test)

  **What survives every choice is the ceiling: under two fifths, and most plausibly under a tenth.**
  The spread is stated rather than resolved because the corpus cannot defend one baseline over the
  other, and a midpoint would be a number with no argument behind it. [inference]

  This is consistent with the control from the other side. The grants never entered as revenue at
  all: federal revenue in these districts rose 139% across the peak while their general-fund
  revenue *fell*, which is what makes the transfers line the only remaining route and so what makes
  a small number here an answer rather than a gap. See
  [ESSER](../revenue-stream/esser.yml). [verified] (crates/project)

  What the line cannot say is whether a given dollar was a permanent transfer or an advance later
  repaid — the filing reports one figure for transfers, advances and note proceeds together, and
  ESSER was a reimbursement grant, so both are present. It bounds the total either way. [open]
revisions:
  - was: |
      Ten districts restate the FY2022/FY2023 seam by more than $1M, and all ten are
      reclassifications across the relief years rather than errors in either filing.
    now: |
      Nine. [verified] The tenth was Toronto City at $8,140,842, which is not a restatement of
      anything: the FY2023 filing carries no line 7.020 for that district, the extract wrote the
      absence as `0`, and the whole of the district's cash then appeared to arrive between two
      filings. The count was the load-bearing part of the sentence — it is what said how rare
      the disagreement is — so the correction is to the count and to what the tenth case was.
    found_by: |
      `project::finances::the_only_lines_a_filing_omits_are_the_named_ones`, which the
      correction adds. Nothing before it could see the hole: the fixture is uniform width, so a
      district missing a line has a row of exactly the same shape as one that reported every
      line, and the identity checks pass on a zero balance carried into a zero balance.
    reach: |
      The live feed published $0 of expenditure and $0 of cash against $9.86M of revenue for
      Toronto City for FY2020-FY2022, and statewide expenditure and ending cash were understated
      by $9-10M in each of those years. Feed contract `38.0.0` makes the five `finances` figures
      nullable so an unreported line cannot be summed again.
