class: legislation
label: Legislation
foundational_type:
  ontology: ufo
  type: kind
description: |
  An enacted instrument of law that creates, amends, or constrains any part of the funding
  system — a General Assembly bill, most often a biennial budget act, or a provision of the
  Ohio Constitution. It is a Kind: a bill's identity is fixed at enactment and does not
  survive becoming something else. Constitutional provisions are included here rather than
  given a separate class because they occupy the same position in the graph — an authority
  that establishes, constrains, and is litigated against.
properties:
  - name: designation
    type: string
    description: Bill designation (e.g. Am. Sub. H.B. 110) or constitutional citation
  - name: general_assembly
    type: string
    description: Numbered General Assembly that passed it
  - name: signed
    type: date
    description: Date signed or ratified
  - name: effective
    type: date
    description: Date the operative provisions took effect
  - name: effective_note
    type: text
    description: >-
      Which provisions took effect when, where the act has more than one date. Declared because
      an Ohio budget act always does: the appropriation sections are effective on signing and the
      codified amendments ninety days later, so a single `effective` date is right about one half
      and wrong about the other. H.B. 96 is the case that forced it — signed 30 June 2025, with
      every R.C. 3317 section this corpus reads from it dated 30 September — and the node had
      carried the signing date for both.
  - name: subject
    type: text
    description: What the enactment did to the funding system, in two or three sentences
  - name: vetoes
    type: text
    description: Line-item vetoes affecting education funding, where relevant
  - name: accountability_effect
    type: text
    description: >-
      What the enactment did to the accountability regime, as distinct from the funding system.
      Declared because an Ohio budget act carries both in one instrument — H.B. 33 refreshed the
      Fair School Funding Plan's cost inputs and dissolved Lorain's academic distress commission —
      and a class that could record only the funding half would make the other invisible on the
      node where a reader would look for it.
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. A large share of the corpus's edges
# use a relationship no class declares, and almost all of those are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject those edges or bloat every ontology with
# declarations that each describe one link.
#
# The counts are measured — see "relationship vocabulary" in `.yidam/corpus/README.md`. They are
# not repeated here, because they were: this comment carried three hand-written figures, fifteen
# ontologies carried the same copy, and every figure was stale before anybody re-measured.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: establishes
    target: funding-regime
    direction: out
    description: A regime this enactment created
  - relationship: sets
    target: parameter
    direction: out
    description: A parameter value or method this enactment fixed
  - relationship: creates
    target: program
    direction: out
    description: A program this enactment established
  - relationship: constrains
    target: revenue-stream
    direction: out
    description: A revenue channel this enactment limited, froze, or redirected
  - relationship: amends
    target: legislation
    direction: out
    description: A prior enactment this one modified
  - relationship: appropriates-for
    target: fiscal-period
    direction: out
    description: The fiscal period or biennium this enactment funds
  - relationship: grounds
    target: doctrine
    direction: in
    description: A normative principle that originates in this text
  - relationship: enacted-by
    target: actor
    direction: in
    description: The institution that passed or ratified it
  - relationship: prompted-by
    target: litigation
    direction: in
    description: A decision this enactment was a response to
