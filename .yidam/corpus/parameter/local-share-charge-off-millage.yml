class: parameter
label: Local Share Charge-Off Millage
description: |
  The statutory millage rate the state assumed a district could levy against its own assessed
  valuation, used to compute the district's deemed local contribution before state aid.
  [verified] It is the number that made the charge-off mechanism work and the number that made
  it wrong.

  The rate is uniform statewide, which is the point — it expresses a policy judgment that every
  district should contribute the yield of the same effort. [inference] But it is applied
  against valuation alone, and it presumes the district can actually levy at that effective
  rate. Under [H.B. 920](../legislation/hb-920-1976.yml), a district whose reduction factors
  have driven effective operating millage below the charge-off rate is charged for revenue it
  is legally unable to collect at that level. [verified] The shortfall is phantom revenue, and
  it is a direct arithmetic consequence of two provisions that were written independently.

  The parameter is retired: the [Fair School Funding
  Plan](../funding-regime/fair-school-funding-plan.yml) replaced the charge-off with a local
  capacity measure. [verified] The node remains because it governs every state aid figure from
  FY1992 through FY2021, and because the historical series is required for any
  [`regime-diff`](../../skills/regime-diff.md) between the two approaches.

  **THE SERIES IS NOW SOURCED.** This node carried "not yet populated" from genesis and warned
  that the values had to come from statute rather than recollection. They do, and the mechanism
  is less static than "roughly 20 to 23 mills" suggested:

      rate        when                                    authority
      20 mills    in force when DeRolph was filed, 1991   144 Ohio Laws, Part III, 3987, 4122
      20.5 mills  raised during the litigation            Am.Sub.H.B. 152, Sec. 36.12,
                                                            145 Ohio Laws, Part III, 4432-4433
      23 mills    in force at DeRolph I, March 1997       R.C. 3317.022
      23 mills    FY2002-FY2007, by court order           DeRolph III, 93 Ohio St.3d 309, para 62
      23 mills    FY2008                                  LSC, School Funding Complete Resource

  [verified — [DeRolph I](../litigation/derolph-i-1997.yml) at ¶97 recites the progression with
  its session-law citations; the [LSC Complete
  Resource](../../catalog/lsc-school-funding-complete-resource.md) gives the rate and base still
  operative in FY2008. Carried in
  [`crates/regime-diff`](../../../crates/regime-diff/src/charge_off.rs).]

  **THE RATE STOPPED MOVING BECAUSE A COURT STOPPED IT.** Three changes in six years, then
  nothing for the remaining life of the mechanism, is a shape that reads as a policy nobody
  revisited. It is not. [DeRolph III](../litigation/derolph-iii-2001.yml) ordered, at ¶62, that
  "in determining future biennial budgets through fiscal year 2007, the rate of millage charged
  off as the local share of base cost funding under divisions (A)(1) and (2) of R.C. 3317.022
  may not be changed from twenty-three mills, irrespective of the language of R.C.
  3317.012(D)(4) suggesting such a methodology." [verified] For six of the years this parameter
  was flat, the General Assembly was enjoined from moving it.

  The injunction was itself vacated fifteen months later by
  [DeRolph IV](../litigation/derolph-iv-2002.yml), which erased *DeRolph III* entirely.
  [verified] So the rate held at 23 mills through FY2021 under a court order that had ceased to
  exist by the end of 2002 — the constraint outlived its authority, and no bill restored the
  methodology R.C. 3317.012(D)(4) had provided for. Why the General Assembly never returned to
  it is not established here. [open]

  **THE BASE CHANGED WHILE THE RATE STOOD STILL, AND THIS NODE DESCRIBED THE NEW BASE WRONGLY
  FOR ITS WHOLE LIFE.** DeRolph I describes the charge-off as *total taxable value* times a
  percentage. By FY2008 the Legislative Service Commission describes the same 23 mills applied to
  **recognized valuation**. [verified]

  What this node said recognized valuation *is* — "an H.B. 920-adjusted figure deliberately lower
  than total taxable value wherever reduction factors bind" — was wrong, and wrong in a way that
  named the wrong districts. LSC defines it arithmetically:

  > valuation used in calculating a district's local share of the base cost "recognizes" the
  > district's inflationary increase in carryover real property (property that was taxed in the
  > year before) in the reappraisal or update year evenly over three-years instead of all at once.

      recognized, reappraisal or update year = actual - 2/3 x inflationary increase
      recognized, second year                = actual - 1/3 x inflationary increase
      recognized, third year                 = actual

  It is a **three-year phase-in of reappraisal growth**. H.B. 920 holds a district's revenue flat
  by cutting the rate; recognized valuation holds its state aid flat by deferring the base. Two
  mechanisms answering the same event from opposite ends of the same multiplication — and LSC
  discusses them under one heading, "Provisions that Soften the Effect of H.B. 920 Tax Reduction
  Factors", which is the likeliest way the conflation happened. [verified — [LSC Complete
  Resource](../../catalog/lsc-school-funding-complete-resource.md), pp. 19 and 82]

  **The correction changes which districts are affected, not only by how much.** Under the old
  reading the districts overcharged were those with long-bitten reduction factors: a wealth and
  tax-history story. Under the real rule they are the ones whose county reappraised recently.
  Those sets are close to unrelated, and the second is an administrative accident.

  **AND IT IS NOW COMPUTED RATHER THAN MISSING.** The recorded blocker said `tax-abstract` was
  expected to supply recognized valuation and did not. Both halves of that were beside the point:
  the figure is not published per district by anyone, and it does not need to be. The rule is
  arithmetic, and Ohio's staggered county calendar supplies the identification —

    - the Department of Taxation publishes each county's reappraisal and update year, and every
      one of the 88 has exactly one valuation event in TY2022–TY2024;
    - Table SD-1, extended from two tax years to four, then gives each district one event year
      and two quiet ones, so its own ordinary growth measures what the reappraisal added.

  The separation is not marginal: the median county's real property rose **28.6%** in its event
  year against **1.5%** in its quiet ones, and all 88 counties' largest jump falls in the year the
  calendar says. [verified — `crates/regime-diff/src/recognized_valuation.rs` and
  `tests/recognized_valuation_against_the_abstract.rs`]

  At TY2024 recognized valuation is **8.20% below total taxable value statewide — $34.5bn, or
  $793m of charge-off at 23 mills**. It falls entirely by calendar: 12.97% of value for the 184
  districts whose county revalued in TY2024, 7.04% for the 304 in TY2023, and nothing for the 123
  in TY2022. [verified]

  **This is a high point of the cycle and the node should not be read as if it were a constant.**
  LSC put the long-run effect nearer $125m a year, about 2% of valuation; TY2024 is four times
  that because Ohio's 2023–24 revaluations were four times the size LSC's own worked example
  assumes. What is not cyclical is the direction — total taxable value always overstates the
  charge-off. [verified, and the long-run figure is LSC's]

  **One component is still not modelled.** LSC records an **exempt property adjustment** to
  recognized valuation for about 13 districts holding large state-owned exempt property — $836.4m
  in FY2008, $19.2m of local share. It needs the department's own list of those districts. About
  0.3% of statewide valuation, and absent. [open]

  **What the rate was doing to the system.** At 23 mills against a statewide operating rate of
  32.9 mills in TY2006, the base cost formula equalized about **69.9%** of local operating
  revenue; a higher rate equalizes more and a lower rate less. [verified — LSC] And the phantom
  revenue the mechanism generated was large enough to need its own program: the **charge-off
  supplement**, known as gap aid, reimbursed the difference and cost about **$73.5 million
  across 145 districts in FY2008**. [verified — LSC] A mechanism requiring a supplement for a
  quarter of the state is the argument for replacing it.

  **THE PHANTOM REVENUE IS NOW COUNTED, AND IT IS NOT A MINORITY CASE.** This node has asserted
  since genesis that a district whose effective rate has fallen below the charge-off rate is
  charged for revenue it cannot collect. Table SD-1's TY2024 effective Class I rates make it a
  count: **309 of 609 districts — half the state — charge less than the 23 mills the mechanism
  would deem them able to levy.** [verified — computed in `crates/bundle` from
  `regime-diff::TERMINAL_MILLS` against TY2024 Table SD-1]

  The FY2008 comparison is the one worth holding beside it. Gap aid then covered 145 districts
  at $73.5 million. Sixteen years of reduction factors later the same rate against the same kind
  of base would reach twice as many districts, because that is what H.B. 920 does with time:
  every year of valuation growth above the floor moves another district further below any fixed
  assumed rate. The mechanism did not fail once; it was failing progressively, and the
  supplement's cost was a lagging measure of it. [inference]

  A further **65 districts have valuation high enough that 23 mills would exceed their entire
  base cost**, leaving them no state aid at all — the charge-off had no minimum state share, which
  is a Fair School Funding Plan invention. [verified]

  **AND THE HEADLINE COMPARISON REVERSED WHEN THE BASE WAS CORRECTED.** This node recorded that
  "against the counterfactual the median district is $289 per pupil better off under the plan."
  On recognized valuation the median district is **$45 per pupil worse off**, and **316 districts
  would have done better under the charge-off against 290 under the plan** — where the corpus
  previously published 193 against 413. The zeroed count above was 81 on the old base.

  The incidence claim moved further than the level did. The corpus published that *every* wealth
  quintile does better under the plan, most of all the richest. Only the top quintile still gains:
  the bottom four lose by $118 to $365 per pupil, and the poorer the quintile the less it loses.
  The *shape* survives — the plan is genuinely more generous to property-rich districts than the
  charge-off was — but "every quintile gains" was an artifact of charging every district about 8%
  too much on the counterfactual side. [verified —
  `crates/regime-diff/tests/the_charge_off_against_local_capacity.rs`]

  A correction of this size from a definition is the argument for the node carrying the base
  beside the rate, which it did, and for it being right about what the base *is*, which it was
  not.

  **Joint vocational school districts were charged off at 0.5 mills**, not the district rate.
  [verified — LSC] This is the one place the "uniform statewide" description is false, and a
  comparison run over JVSDs at the district rate is wrong by a factor of forty-six.

  **STILL OPEN.** The Evidence-Based Model years and the Bridge formula decade are not
  established. Secondary reporting gives 22 mills for FY2010-11 under the Evidence-Based Model
  and 20 mills applied to total valuation later, and neither is sourced well enough to commit
  here. [open] The corpus deliberately holds three of the four eras rather than a complete
  series with one guessed entry.
properties:
  name: Local share charge-off millage
  kind: |
    **Legislated — and for six years enjoined, which the four-kind taxonomy did not anticipate.**

    The rate sits on the face of R.C. 3317.022 and moved three times by act between 1991 and
    1997. [verified] That is legislated in the ordinary sense.

    But from FY2002 through FY2007 the General Assembly could not have changed it if it wanted
    to: [DeRolph III](../litigation/derolph-iii-2001.yml) at ¶62 ordered the rate held at 23
    mills, "irrespective of the language of R.C. 3317.012(D)(4) suggesting such a methodology" —
    a court overriding a statutory method. [verified] The taxonomy asks what would have to happen
    for a value to change; for those six years the answer was neither an act nor a departmental
    decision nor a district's behaviour, but a change in the law of the case.

    The category is not worth adding for one instance. It is worth recording that the four kinds
    were derived from one regime's parameters in one biennium, and that a parameter with a
    seventy-year span found a fifth mode on the first attempt to classify it.
  unit: mills
  series: |
    20 mills (1991, at DeRolph filing) -> 20.5 mills (Am.Sub.H.B. 152) -> 23 mills (by 1997,
    R.C. 3317.022) -> 23 mills on recognized valuation (FY2008). Evidence-Based Model and Bridge
    formula era rates are [open]. JVSDs: 0.5 mills throughout the observed range.

    The base matters as much as the rate: total taxable value in the DeRolph era, recognized
    valuation by FY2008 — the latter being total taxable value with a reappraisal's inflationary
    increase phased in over three years, **not** an H.B. 920 adjustment, which is what this node
    said until it was checked against LSC. See the description.
  statutory_basis: |
    R.C. 3317.022, with the rate set by biennial session law. Ohio Laws citations for the
    1991-1997 progression are recited at DeRolph I, paragraph 97. Ohio Laws' online version
    archive for R.C. 3317.022 begins at 1 July 2014, after the mechanism was already retired, so
    the operative text for the charge-off era is not retrievable from `codes.ohio.gov` and must
    come from the opinions or from session law.
  simulation_key: charge_off_millage
  sensitivity: |
    Raising the charge-off rate shifts cost from the state to districts, and shifts it most to
    districts with high valuation per pupil — which sounds progressive and is, up to the point
    where a district's effective millage is already below the rate. Beyond that point the
    increase falls entirely on districts that cannot levy it, making the parameter regressive
    in exactly the range where it appears otherwise. [inference] This nonlinearity is why the
    parameter cannot be evaluated without per-district floor status.

    Measured at FY2027 base cost on recognized valuation: **65 of 606 districts** would have a
    23-mill charge-off exceeding their entire computed base cost, and so would receive no base
    cost aid at all. The charge-off had no minimum state share — that is a Fair School Funding
    Plan invention — so the mechanism simply truncated at zero. [verified — `crates/regime-diff`]

    The same count on total taxable value is 81, which is the measure of how much a wrong
    valuation base moves a distributional result: a fifth of this finding was the base.
