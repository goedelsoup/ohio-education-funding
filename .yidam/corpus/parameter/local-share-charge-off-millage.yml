class: parameter
label: Local Share Charge-Off Millage
summary: >-
  The statutory millage rate the state assumed a district could levy against its own assessed
  valuation, used to compute its deemed local contribution before state aid. The number that
  made the charge-off work, and the number that made it wrong.
description: |
  The statutory millage rate the state assumed a district could levy against its own assessed
  valuation, used to compute the district's deemed local contribution before state aid.
  [verified] It is the number that made the charge-off mechanism work and the number that made
  it wrong.

  The rate is uniform statewide, which is the point — it expresses a policy judgment that every
  district should contribute the yield of the same effort. [inference] But it is applied
  against valuation alone, and it presumes the district can actually levy at that effective
  rate. Under [H.B. 920](../legislation/hb-920-1976.yml), a district whose reduction factors
  have driven effective operating millage below the charge-off rate is charged for revenue it
  is legally unable to collect at that level. [verified] The shortfall is phantom revenue, and
  it is a direct arithmetic consequence of two provisions that were written independently.

  The parameter is retired **for city, local and exempted village districts**: the [Fair School
  Funding Plan](../funding-regime/fair-school-funding-plan.yml) replaced their charge-off with a
  local capacity measure. [verified] It is not retired for joint vocational districts, whose local
  share the plan still computes as a half-mill charge-off — see the findings. The node also
  remains because it governs every state aid figure from FY1992 through FY2021, and because the
  historical series is required for any [`regime-diff`](../../skills/regime-diff.md) between the
  two approaches.

  ### The base changed while the rate stood still

  DeRolph I describes the charge-off as *total taxable value* times a percentage. By FY2008 the
  Legislative Service Commission describes the same 23 mills applied to **recognized
  valuation**. [verified]

  > valuation used in calculating a district's local share of the base cost "recognizes" the
  > district's inflationary increase in carryover real property (property that was taxed in the
  > year before) in the reappraisal or update year evenly over three-years instead of all at once.

  ### The fourth era does not exist

  The corpus held three of four eras and declined to guess the fourth. There is no fourth entry.
  The Evidence-Based Model kept a rate and forked its base; the Bridge formula replaced the rate
  with an index yielding a different implied rate per district, and LSC says so in as many words.
  The "20 mills applied to total valuation later" of secondary reporting is the **statewide average
  of that spread**. [verified] The caution was right for a better reason than the one it gave.
findings: |2
    ### The series, sourced

      rate        when                                    authority
      20 mills    in force when DeRolph was filed, 1991   144 Ohio Laws, Part III, 3987, 4122
      20.5 mills  raised during the litigation            Am.Sub.H.B. 152, Sec. 36.12,
                                                            145 Ohio Laws, Part III, 4432-4433
      23 mills    in force at DeRolph I, March 1997       R.C. 3317.022
      23 mills    FY2002-FY2007, by court order           DeRolph III, 93 Ohio St.3d 309, para 62
      23 mills    FY2008                                  LSC, School Funding Complete Resource
      22 mills    FY2010-11, on two bases                 LSC, H.B. 1 greenbook, 128th G.A.
      none        FY2012-FY2021                           LSC, H.B. 59 greenbook, 130th G.A.
      0.5 mill    JVSDs, throughout and still             LSC, H.B. 110 greenbook, 134th G.A.

  [verified] ([DeRolph I](../litigation/derolph-i-1997.yml) at ¶97 recites the progression with
  its session-law citations; the [LSC Complete
  Resource](../../catalog/lsc-school-funding-complete-resource.md) gives the rate and base
  still operative in FY2008; the last three rows are LSC's own budget analyses, committed at
  [`lsc-education-greenbooks.txt`](../../../crates/project/fixtures/lsc-education-greenbooks.txt)
  and read by
  [`crates/project`](../../../crates/project/tests/the_charge_off_after_the_charge_off.rs). Carried
  in [`crates/regime-diff`](../../../crates/regime-diff/src/charge_off.rs).)

  ### The rate stopped moving because a court stopped it

  Three changes in six years, then nothing for the remaining life of the mechanism, is a shape
  that reads as a policy nobody revisited. It is not. [DeRolph
  III](../litigation/derolph-iii-2001.yml) ordered, at ¶62, that "in determining future
  biennial budgets through fiscal year 2007, the rate of millage charged off as the local share
  of base cost funding under divisions (A)(1) and (2) of R.C. 3317.022 may not be changed from
  twenty-three mills, irrespective of the language of R.C. 3317.012(D)(4) suggesting such a
  methodology." [verified] For six of the years this parameter was flat, the General Assembly
  was enjoined from moving it.

  The injunction was itself vacated fifteen months later by [DeRolph
  IV](../litigation/derolph-iv-2002.yml), which erased *DeRolph III* entirely. [verified] So
  the rate held at 23 mills through FY2021 under a court order that had ceased to exist by the
  end of 2002 — the constraint outlived its authority, and no bill restored the methodology
  R.C. 3317.012(D)(4) had provided for. Why the General Assembly never returned to it is not
  established here. [open]

      recognized, reappraisal or update year = actual - 2/3 x inflationary increase
      recognized, second year                = actual - 1/3 x inflationary increase
      recognized, third year                 = actual

  It is a **three-year phase-in of reappraisal growth**. H.B. 920 holds a district's revenue
  flat by cutting the rate; recognized valuation holds its state aid flat by deferring the
  base. Two mechanisms answering the same event from opposite ends of the same multiplication —
  and LSC discusses them under one heading, "Provisions that Soften the Effect of H.B. 920 Tax
  Reduction Factors", which is the likeliest way the conflation happened. [verified] ([LSC
  Complete Resource](../../catalog/lsc-school-funding-complete-resource.md), pp. 19 and 82)

  **The correction changes which districts are affected, not only by how much.** Under the old
  reading the districts overcharged were those with long-bitten reduction factors: a wealth and
  tax-history story. Under the real rule they are the ones whose county reappraised recently.
  Those sets are close to unrelated, and the second is an administrative accident.

  ### Computed rather than missing

  The recorded blocker said `tax-abstract` was expected to supply recognized valuation and did
  not. Both halves of that were beside the point: the figure is not published per district by
  anyone, and it does not need to be. The rule is arithmetic, and Ohio's staggered county
  calendar supplies the identification —

  - the Department of Taxation publishes each county's reappraisal and update year, and every
    one of the 88 has exactly one valuation event in TY2022–TY2024;
  - Table SD-1, extended from two tax years to four, then gives each district one event year and
    two quiet ones, so its own ordinary growth measures what the reappraisal added.

  The separation is not marginal: the median county's real property rose **28.6%** in its event
  year against **1.5%** in its quiet ones, and all 88 counties' largest jump falls in the year
  the calendar says. [verified] (`crates/regime-diff/src/recognized_valuation.rs` and
  `tests/recognized_valuation_against_the_abstract.rs`)

  At TY2024 recognized valuation is **8.20% below total taxable value statewide — $34.5bn, or
  $793m of charge-off at 23 mills**. It falls entirely by calendar: 12.97% of value for the 184
  districts whose county revalued in TY2024, 7.04% for the 304 in TY2023, and nothing for the
  123 in TY2022. [verified]

  **This is a high point of the cycle and the node should not be read as if it were a
  constant.** LSC put the long-run effect nearer $125m a year, about 2% of valuation; TY2024 is
  four times that because Ohio's 2023–24 revaluations were four times the size LSC's own worked
  example assumes. What is not cyclical is the direction — total taxable value always
  overstates the charge-off. [verified] (and the long-run figure is LSC's)

  **One component is still not modelled.** LSC records an **exempt property adjustment** to
  recognized valuation for about 13 districts holding large state-owned exempt property —
  $836.4m in FY2008, $19.2m of local share. It needs the department's own list of those
  districts. About 0.3% of statewide valuation, and absent. [open]

  **What the rate was doing to the system.** At 23 mills against a statewide operating rate of
  32.9 mills in TY2006, the base cost formula equalized about **69.9%** of local operating
  revenue; a higher rate equalizes more and a lower rate less. [verified] (LSC) And the phantom
  revenue the mechanism generated was large enough to need its own program: the **charge-off
  supplement**, known as gap aid, reimbursed the difference and cost about **$73.5 million
  across 145 districts in FY2008**. [verified] (LSC) A mechanism requiring a supplement for a
  quarter of the state is the argument for replacing it.

  ### The phantom revenue, counted — and it is not a minority case

  The FY2008 comparison is the one worth holding beside it. Gap aid then covered 145 districts
  at $73.5 million. Sixteen years of reduction factors later the same rate against the same
  kind of base would reach twice as many districts, because that is what H.B. 920 does with
  time: every year of valuation growth above the floor moves another district further below any
  fixed assumed rate. The mechanism did not fail once; it was failing progressively, and the
  supplement's cost was a lagging measure of it. [inference]

  A further **65 districts have valuation high enough that 23 mills would exceed their entire
  base cost**, leaving them no state aid at all — the charge-off had no minimum state share,
  which is a Fair School Funding Plan invention. [verified]

  ### The comparison against the plan, on the corrected base

  The incidence claim moved further than the level did. The corpus published that *every*
  wealth quintile does better under the plan, most of all the richest. Only the top quintile
  still gains: the bottom four lose by $118 to $365 per pupil, and the poorer the quintile the
  less it loses. The *shape* survives — the plan is genuinely more generous to property-rich
  districts than the charge-off was — but "every quintile gains" was an artifact of charging
  every district about 8% too much on the counterfactual side. [verified]
  (`crates/regime-diff/tests/the_charge_off_against_local_capacity.rs`)

  A correction of this size from a definition is the argument for the node carrying the base
  beside the rate, which it did, and for it being right about what the base *is*, which it was
  not.

  **Joint vocational school districts were charged off at 0.5 mills**, not the district rate.
  [verified] (LSC) This is the one place the "uniform statewide" description is false, and a
  comparison run over JVSDs at the district rate is wrong by a factor of forty-six.

  ### What happened after FY2009, from a source the node had not considered

  The `statutory_basis` below says the operative text for this era "must come from the opinions or
  from session law", because Ohio Laws' version archive for R.C. 3317.022 begins on 1 July 2014.
  There is a third route, committed here the whole time and never read: LSC's education analysis of
  every enacted budget act from the 124th General Assembly through the 135th — 12 documents
  covering FY2002 through FY2025 without a gap. One test opens the file to check that each act the
  budget Catalog cites has a node; nothing had read a sentence of it. [verified]
  ([`crates/project`](../../../crates/project/tests/the_charge_off_after_the_charge_off.rs)) An
  analysis is not an act, and where the two differ the act governs; what an analysis gives that an
  act does not is a *rate and a base stated in prose*, which is the shape a parameter series needs.

  **The Evidence-Based Model kept the mechanism and forked its base.** Districts whose class 1
  effective current expense rate is 20.1 mills or lower — at or very near the [twenty-mill
  floor](twenty-mill-floor.yml) — were charged 22 mills of **total taxable valuation**; every other
  district was charged 22 mills of **recognized valuation**. [verified] The node held the
  recognized-valuation base as a single fact about FY2008 and could not have anticipated a rule
  that assigns bases by floor status.

  **There was a second charge-off the series never held.** Under the law the model replaced,
  districts contributed 23 mills toward base cost *and up to 3.3 mills toward special education,
  career-technical education and transportation*. [verified] The counterfactuals below are about
  base cost and are right to use 23 mills; what is understated is the **total** local contribution
  the mechanism asked for, which was up to 26.3 mills of the same valuation. [inference]

  **And the exempt-property adjustment has a stated rule.** It is recorded below as open for want
  of the department's list of affected districts. The list is still absent; the rule is not.
  Above 25% of potential taxable value exempted from taxation, the excess over 25% comes off the
  base before the charge-off is applied. [verified]

  ### The Bridge formula has no charge-off rate, which is why none could be found

  LSC, analysing H.B. 59 of the 130th:

  > the state share index used for the opportunity grant does not result in a uniform charge-off
  > rate. Rather, if a local share in FY 2014 were to be derived from the state share index and
  > expressed as a charge-off of adjusted valuation, the charge-off rate would vary from 11.3 mills
  > to 22.9 mills (excluding several outlier districts) with the statewide average charge-off being
  > 20.6 mills.

  [verified] Three things follow. The "20 mills applied to total valuation later" the node could
  not source is **20.6 mills and a statewide average**, so entering it as a fourth row would state
  a distribution's mean as a legislated rate. The spread is a factor of two across districts before
  outliers. And *uniform* — which this node's own description calls the point of the parameter, the
  policy judgment that every district contributes the yield of the same effort — is exactly what
  LSC says the index does not produce.

  **The word leaves the analyses a biennium before the reader would expect.** Counted across all
  twelve: 35, 25, 3, 3, then **zero in the Evidence-Based Model's own greenbook**, then 11 in
  H.B. 153 — of which every one is "charge-off *valuation*", the EBM's valuation measure carried
  forward as an index, and not one a rate. H.B. 59 is the last analysis to write "charge-off rate"
  at all, and writes it to say the formula no longer has one. [verified] That is weak evidence
  about a mechanism and strong evidence about a search: the documents that would have carried the
  number stopped discussing the subject, and a reader looking for a fourth rate was looking for the
  wrong shape of thing. [inference]

  ### For joint vocational districts it was never retired

  The [Fair School Funding Plan](../funding-regime/fair-school-funding-plan.yml) replaced the
  charge-off with local capacity for city, local and exempted village districts. It did not for
  JVSDs. LSC, analysing the plan itself:

  > Instead of a per-pupil local capacity amount, the local share of the base cost for JVSDs is
  > calculated by multiplying a 1/2 mill by the lesser of the district's three-year average
  > valuation or most recent valuation. This is consistent with the prior formula for JVSDs.

  [verified] So the mechanism this node describes in the past tense is how a whole class of
  district was funded under the plan as enacted, and `series` below reaches further than "the
  observed range" suggests. What did change is the base — the Bridge formula took the three-year
  average, the plan takes the **lesser** of that and the most recent valuation, which is a guard
  against a district's valuation falling. The same shape as everywhere else in this node: the rate
  holds and the thing it multiplies moves. [verified]
revisions:
  - was: |
      The charge-off was described as 23 mills against *total taxable value*, following DeRolph
      I's own account of it.
    now: |
      By FY2008 the same 23 mills were applied to **recognized valuation**, which is a
      different and smaller base. [verified] The rate never moved; the thing it multiplied did.
    found_by: |
      The Legislative Service Commission's description of the charge-off as it operated in
      FY2008, set against DeRolph I's description of it in 1997.
    reach: |
      Everything computed against the old base was computed against the wrong one, including
      the headline comparison below.
  - was: |
      The parameter was described as retired outright, the Fair School Funding Plan having
      replaced the charge-off with a local capacity measure. The Evidence-Based Model and Bridge
      formula rates were recorded as unestablished, on the ground that the operative text for the
      era could only come from the opinions or from session law.
    now: |
      Retired for city, local and exempted village districts only: **the plan computes a joint
      vocational district's local share as a half-mill charge-off**, which LSC describes as
      "consistent with the prior formula for JVSDs". And the era is sourced — 22 mills on two
      bases under the Evidence-Based Model, and no uniform rate at all under the Bridge formula.
    found_by: |
      LSC's education greenbooks for H.B. 1 of the 128th, H.B. 59 of the 130th and H.B. 110 of the
      134th. Twelve of them have been committed in this repository since the Bridge decade was
      written and nothing had ever read one.
    reach: |
      The series is complete and shorter than expected: there is no fourth rate to hold, because
      the parameter stopped being a parameter in FY2010. The "20 mills" of secondary reporting is
      a statewide average of a per-district spread. And a comparison that treats the charge-off as
      wholly historical is wrong about every joint vocational district.
  - was: |
      "Against the counterfactual the median district is $289 per pupil better off under the
      plan", with 193 districts better off under the charge-off against 413 under the plan.
    now: |
      On recognized valuation the median district is **$45 per pupil worse off** under the
      plan, and **316 districts would have done better under the charge-off against 290**. The
      zeroed count was 81 on the old base.
    found_by: |
      Re-running the counterfactual on recognized valuation after the base was corrected.
    reach: |
      The sign of the headline result reversed. This is the case for why the base correction
      above is a claim and not a definitional footnote.
properties:
  name: Local share charge-off millage
  kind: |
    **Legislated — and for six years enjoined, which the four-kind taxonomy did not anticipate.**

    The rate sits on the face of R.C. 3317.022 and moved three times by act between 1991 and
    1997. [verified] That is legislated in the ordinary sense.

    But from FY2002 through FY2007 the General Assembly could not have changed it if it wanted
    to: [DeRolph III](../litigation/derolph-iii-2001.yml) at ¶62 ordered the rate held at 23
    mills, "irrespective of the language of R.C. 3317.012(D)(4) suggesting such a methodology" —
    a court overriding a statutory method. [verified] The taxonomy asks what would have to happen
    for a value to change; for those six years the answer was neither an act nor a departmental
    decision nor a district's behaviour, but a change in the law of the case.

    The category is not worth adding for one instance. It is worth recording that the four kinds
    were derived from one regime's parameters in one biennium, and that a parameter with a
    seventy-year span found a fifth mode on the first attempt to classify it.
  unit: mills
  series: |
    20 mills (1991, at DeRolph filing) -> 20.5 mills (Am.Sub.H.B. 152) -> 23 mills (by 1997,
    R.C. 3317.022) -> 23 mills on recognized valuation (FY2008) -> **22 mills on two bases**
    (FY2010-11, the Evidence-Based Model) -> **no rate at all** (FY2012-FY2021, the Bridge
    formula). [verified] JVSDs: 0.5 mills throughout, and still, under the Fair School Funding
    Plan as enacted.

    The last two entries are why this is not a series of one kind of thing. The Evidence-Based
    Model applies one rate to total taxable value at the twenty-mill floor and to recognized
    valuation above it; the Bridge formula's state share index yields a different implied rate for
    every district, 11.3 to 22.9 mills at FY2014, averaging 20.6 statewide. A reader wanting one
    number for the Bridge decade should take none.

    The base matters as much as the rate: total taxable value in the DeRolph era, recognized
    valuation by FY2008 — the latter being total taxable value with a reappraisal's inflationary
    increase phased in over three years, **not** an H.B. 920 adjustment, which is what this node
    said until it was checked against LSC. See the description.
  statutory_basis: |
    R.C. 3317.022, with the rate set by biennial session law. Ohio Laws citations for the
    1991-1997 progression are recited at DeRolph I, paragraph 97. Ohio Laws' online version
    archive for R.C. 3317.022 begins at 1 July 2014, after the mechanism was already retired, so
    the operative text for the charge-off era is not retrievable from `codes.ohio.gov`.

    It does not follow that it must come from the opinions or from session law, which is what this
    field said. **LSC's education greenbook for each enacted budget act states the rate and the
    base in prose**, and twelve of them — the 124th General Assembly through the 135th — are
    committed at
    [`lsc-education-greenbooks.txt`](../../../crates/project/fixtures/lsc-education-greenbooks.txt).
    [verified] ([`crates/project`](../../../crates/project/src/greenbook.rs)) An analysis is not an
    act and the act governs where they differ, so a rate taken from here is LSC's account of the
    law rather than the law. For a *parameter series* that is the right trade: session law states a
    rate inside an appropriation act's amending title, and an analysis states it in a sentence
    beside its base.
  written_as: |
    charge-off millage
  simulation_key: charge_off_millage
  sensitivity: |
    Raising the charge-off rate shifts cost from the state to districts, and shifts it most to
    districts with high valuation per pupil — which sounds progressive and is, up to the point
    where a district's effective millage is already below the rate. Beyond that point the
    increase falls entirely on districts that cannot levy it, making the parameter regressive
    in exactly the range where it appears otherwise. [inference] This nonlinearity is why the
    parameter cannot be evaluated without per-district floor status.

    Measured at FY2027 base cost on recognized valuation: **65 of 606 districts** would have a
    23-mill charge-off exceeding their entire computed base cost, and so would receive no base
    cost aid at all. The charge-off had no minimum state share — that is a Fair School Funding
    Plan invention — so the mechanism simply truncated at zero. [verified] (`crates/regime-diff`)

    The same count on total taxable value is 81, which is the measure of how much a wrong
    valuation base moves a distributional result: a fifth of this finding was the base.
