unfilled:
  - field: the current text of R.C. 3317.16
    why: >-
      The joint vocational funding section, which is where the half-mill charge-off would sit in
      current law. The statute extract holds 35 sections and cites this one seven times without
      carrying it, so the plan-era JVSD rate rests on LSC's analysis of H.B. 110 rather than on the
      section itself. Adding it to `ohio-laws` would settle whether the half-mill survived H.B. 33
      and H.B. 96.
  - field: the districts the exempt-property adjustment reaches
    why: >-
      The rule is sourced — above 25% of potential taxable value exempted, the excess comes off the
      base — and the list of districts it binds is the department's and is not published.
