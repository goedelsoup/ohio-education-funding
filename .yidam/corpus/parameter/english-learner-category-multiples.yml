class: parameter
label: English Learner Category Multiples
summary: >-
  Three multiples that run downward — 0.2104, 0.1577, 0.1053 — as a pupil progresses. The only
  weight schedule in the plan that falls as the pupil it prices improves, and it is a taper by
  construction rather than a ranking.
description: |
  Three multiples: 0.2104, 0.1577, 0.1053. Each multiplies the statewide average base cost per
  pupil, the district's ADM in that category, and its state share percentage. [verified] (R.C.
  3317.016)

  **They descend, and what they descend with is time and proficiency.** Category 1 is a pupil
  enrolled in schools in the United States for 180 school days or less. Category 2 is a pupil
  past that threshold and not yet proficient on the spring English language proficiency
  assessment. Category 3 is the two school years *after* the pupil scores proficient. So the
  schedule is a taper: a pupil funded at 0.2104 in their first year is funded at half that two
  years after they stop needing the service, and then at nothing. [verified] (the section)

  That is a different object from the other two schedules. Special education's six ascend with
  severity and career-technical's five sort programme types; both price a standing condition.
  These three price a trajectory, and the number falling is the intended behaviour rather than
  a ranking of need. A table that lists all fourteen of the plan's multiples together makes
  this one look like the cheapest category of something, which it is not. [inference]

  The multiplicand is the general statewide average base cost per pupil, $8,241.61 — the same
  one special education uses and not the career-technical figure. [verified]
findings: |
  ### Category 3 is the one that needs the definition to be read

  A pupil in category 3 has already achieved a proficient score. The money continues for two
  school years afterwards, which is a policy about consolidation rather than about need, and it
  is invisible in the number: 0.1053 beside 0.2104 reads as "less English learner", not as
  "still funded after the pupil stopped being one". [verified for the definition; inference for
  the reading]

  ### The counts are the current year's, and they turn over fast

  The `EL` sheet heads these columns `Category 1 EL ADM-FY21` and this corpus read a vintage off
  the suffix. The department's own table of where each variable is drawn from says otherwise, and
  so do the counts — see
  [fsfp-english-learner-weights](../formula-component/fsfp-english-learner-weights.yml). What is
  true is the thing the mistaken reading was reaching for: between the department's two published
  models the category one count falls by more than a fifth while the headcount barely moves.
  [verified] (crates/project)

  ### They are the 2015 dollars over a new denominator, and nothing else changed

  Before FY2022 the three categories carried per-pupil amounts rather than weights: $1,500,
  $1,125 and $750 in FY2014, raised once to **$1,515**, $1,136 and $758 in FY2015 and then held —
  H.B. 64 says the amounts *"remain unchanged from those used in FY 2015"*, H.B. 49 says the same
  of FY2017, and the Bridge formula computed no categoricals at all. The plan divided those
  amounts by the FY2022 statewide average base cost per pupil of $7,202 and called the quotients
  weights: 1515 ÷ 7202 is 0.2104, 1136 ÷ 7202 is 0.1577, 758 ÷ 7202 is 0.1053. Every one lands
  inside forty cents of the amount it replaced. [verified]
  ([`crates/project`](../../../crates/project/tests/the_weights_that_were_dollar_amounts.rs))

  So English learner funding was carried across the regime change at exactly its 2015 value. The
  conversion to weights is what made it move afterwards: a dollar amount stays where it is put,
  and a weight rises whenever base cost does. The plan gave this schedule no increase and gave it
  an escalator, which are different gifts and only the second is visible in the numbers. The
  companion arithmetic on
  [special education](special-education-category-multiples.yml) — the same conversion, but with a
  scalar attached — shows what an increase looks like when one is given. [verified for the
  arithmetic; inference for the reading]

  ### And the definitions stop at FY2027

  Divisions (B) and (C) each state their criterion "for fiscal years 2026 and 2027" and then
  say that for FY2028 and thereafter the pupil is one who "satisfies criteria specified by the
  general assembly". The multiples themselves are stated without a year — but two of the three
  categories they price cease to be defined, which is the same expiry arriving by a different
  route. [verified] (the section)
properties:
  name: English learner category multiples
  unit: ratio
  kind: |
    **Legislated, with two of the three categories defined only through FY2027.**

    The three multiples in division (A), (B) and (C) carry no fiscal-year condition. The
    *definitions* of categories two and three do: each says "for fiscal years 2026 and 2027" and
    hands FY2028 to the General Assembly. A multiple that survives its category is not a value
    anyone can apply, so the practical durability is the category's and not the number's.

    Worth stating because reading the multiples alone would place this parameter with
    [special education](special-education-category-multiples.yml) — the one schedule that
    genuinely does not expire — when it belongs with the rest.
  series: |
    (A)  0.2104  identified as an English learner, enrolled in United States schools 180 school
                 days or less
    (B)  0.1577  past 180 days and not yet proficient on the spring English language proficiency
                 assessment  [FY2026-27 definition only]
    (C)  0.1053  the two school years following a proficient score  [FY2026-27 definition only]

    All three verified against the Revised Code to the last digit —
    `crates/project/tests/the_statute_behind_the_weights.rs`. [verified]

    Applied to FY2021 English learner counts in the FY2027 model. [verified]
  statutory_basis: |
    R.C. 3317.016, read. "English learner" takes its meaning from R.C. 3301.0731 and the
    proficiency assessment from R.C. 3301.0711(C)(3), so the categories are defined by
    cross-reference and the multiples are here. [verified] (`ohio-laws`)
  simulation_key: |
    `project::panel::categoricals::ENGLISH_LEARNER_WEIGHTS`.

    A constant, not a lever.
  sensitivity: |
    The smallest of the three weighted programmes by money, and the one whose sensitivity is
    least about its own multiples. Because the schedule tapers, what moves this programme is the
    *composition* of a district's English learner population across the three categories rather
    than its size. That was first written as a consequence of counts frozen years earlier, which
    they are not; it survives the correction for the opposite reason, and it is now measured —
    districts that held or grew their English learner population and saw their weighted count
    fall anyway are counted at
    [fsfp-english-learner-weights](../formula-component/fsfp-english-learner-weights.yml).
    [verified] (crates/project)

    Priced in the general statewide average base cost per pupil, so
    [base-cost-per-pupil](base-cost-per-pupil.yml) moves all three together, and the scenario
    runner's `base_cost_scale` carries them along with special education. [verified]
unfilled:
  - field: the FY2028 category definitions
    why: >-
      Divisions (B) and (C) hand them to the General Assembly and the section names no
      successor. The budget act that covers FY2028-29 is where they would first appear.
  - field: why the amounts stopped rising after FY2015
    why: >-
      The committed analyses record that they did — H.B. 64 froze them and no later act moved
      them — and none of them gives a reason. Whether the freeze was deliberate or the residue of
      a budget that raised only what it named is not distinguishable from an analysis.
