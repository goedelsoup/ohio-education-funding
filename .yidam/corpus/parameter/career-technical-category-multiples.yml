class: parameter
label: Career-Technical Category Multiples
summary: >-
  Five multiples from 0.6230 down to 0.1570, plus 0.0294 for associated services, applied to a
  career-technical base cost 19.6% above the general one. Written for FY2026 and FY2027 only:
  from FY2028 the section pays "an amount calculated in a manner determined by the general assembly".
description: |
  Five multiples, one per approved programme category, and a sixth for associated services:
  0.6230, 0.5905, 0.2154, 0.1830, 0.1570, and 0.0294. [verified] (R.C. 3317.014(A) and (B))

  **They descend by programme type, not by severity.** Special education's six ascend with the
  disability; these five sort programmes. The top two are workforce development grouped by
  field — agricultural and environmental systems, construction technologies, engineering and
  science technologies, finance, health science, information technology and manufacturing at
  0.6230; business and administration, hospitality and tourism, human services, law and public
  safety, transportation systems and arts and communications at 0.5905. The gap below them, to
  0.2154, is not a further grade of workforce programme: it is career-based intervention, a
  different kind of thing. [verified] (the section)

  Why the first field group is priced above the second, both being full workforce programmes,
  is not stated in the section. [open]

  **The multiplicand is not the one the other weight schedules use.** These five multiply a
  statewide average *career-technical* base cost per pupil of $9,855.62, where
  [special education](special-education-category-multiples.yml) and
  [English learners](english-learner-category-multiples.yml) multiply $8,241.61 — a base
  **19.6% higher** before any weight applies. That is the General Assembly's construction and
  not a departmental convenience: the section says each category is multiplied by "the
  statewide average career-technical base cost per pupil for that fiscal year". [verified]

  The associated-services multiple is the odd one. 0.0294 applies to the sum of categories one
  through five rather than to any category, so it is the one part of the programme that does
  not vary with which category a pupil is in. [verified]
findings: |
  ### The section prices a third thing, and it is missing for a reason that is not the rate

  R.C. 3317.014(E)(1)(a) pays the lead district of each career technical planning district
  **$3 times the summed enrolled ADM of every district and school in that planning district**,
  for career awareness and exploration. It is a statutory per-pupil rate in the same section as
  the six multiples, and no crate models it: no component, no constant, no column in the
  committed FY2027 calculator extract. [verified] (the section; and searched)

  **It is absent from the calculator and present in the payment report**, which is none of the
  three possibilities an earlier reading of this node offered. Both cached workbooks were
  searched whole this time — every string of every sheet rather than the columns the extract
  reads — and neither holds the words: 2,936 strings over 32 sheets in the FY2027 workbook and
  2,320 over 28 in the FY2026 one, with no occurrence of *aware*, *explor*, *planning*, *CTPD*
  or *lead district* in either, the sole match on the first of those being Delaware. The
  department's line-by-line explanation of the *payment report* then states the formula
  outright, on the Other Adjustments report under "Career Technical Planning District
  Payment": `Career Awareness and Exploration Funding = $3 * Enrolled ADM of member schools and
  districts`. [verified] (`crates/project/fixtures/dew-sfpr-line-by-line.txt`, and both cached
  workbooks)

  The two facts are one fact. The calculator simulates the foundation formula, and this is not
  foundation funding: it is an earmark of GRF line item 200545, Career-Technical Education
  Enhancements — whose legal basis the redbook gives as R.C. 3317.014 together with Sections
  265.10 and 265.260 of H.B. 33 — and not of 200550, Foundation Funding. The omission is a
  boundary between two appropriations rather than a gap in anyone's model, and this repository
  already reads across it: `fixtures/appropriation-lines.csv` carries 200545's totals back to
  FY1999. [verified] (`dew-redbook.txt`, `dew-greenbook.txt`)

  **So the money can be stated rather than estimated, and the cut is bigger than the rate.**
  The earmark falls from $16,255,125 actually spent in FY2025 to $5,000,000 appropriated in
  each of FY2026 and FY2027. The executive budget had proposed $16,325,000 for both years at an
  unchanged $10 per pupil, so the reduction is the General Assembly's rather than the
  Governor's — a distinction the enacted-act summary, which lists only the rate, does not
  carry. The rate's own history is in the same sources, in five editions: $2.50 in FY2022,
  $5.00 in FY2023, $7.50 in FY2024, $10 in FY2025, $3 in FY2026 and FY2027. [verified]

  ### Its recipient is a population nothing here names, and the roster is not the obstacle

  Placing the payment on a district needs two tables: which schools belong to each planning
  district, and which district leads it. **The second is published.**
  [The department's CTPD table](../../catalog/dew-career-technical-planning-districts.md) gives
  each planning district's lead by name and by IRN, with its county, its city and whether it is
  a comprehensive district, a JVSD, a compact or a correctional institution — 92 rows, keyed on
  the identifier this panel already uses, against a legend on the same page whose own total
  reads 91. [verified]

  **The first is not.** That table names leads and not members; the portal that published the
  member rosters no longer resolves in DNS; and the report card site returns one identical
  shell for every path, `/robots.txt` included, so a 200 from it is not evidence that a route
  exists. [verified]

  Whether a membership roster is published anywhere else has not been established — three
  places were tried and the negative result from the third is not a result. It is a live
  question rather than a settled absence. [open]

  What membership actually costs is narrower than it looks, because the department says that
  "every school district belongs to or serves as a Career Technical Planning District". A
  population with no non-members sums to the whole, so the statewide figure needs no roster —
  it is the rate times statewide enrolled ADM, and the greenbook already states it. Only
  attribution to a *recipient* needs membership, and only a lever moving money between
  districts would need that. [inference] (on a sentence that is the department's own)

  ### All six are the FY2017 amounts over one divisor, and that divisor is not published

  Before FY2022 each category carried a per-pupil amount: $4,750 down to $1,200 in FY2014, with
  $225 for associated services, raised 4 per cent a year to FY2017 and then held — H.B. 49 says
  career-technical amounts *"remain unchanged from those used in FY 2017"*, and the Bridge
  formula computed no categoricals at all. Divide each FY2017 amount by the weight that replaced
  it and all six give the same number, **$8,333**, to a few parts in ten thousand. That is the
  rounding of a four-decimal weight, not the residue of six separate decisions: this schedule was
  converted, not repriced. [verified]
  ([`crates/project`](../../../crates/project/tests/the_weights_that_were_dollar_amounts.rs))

  The divisor is worth its own line because nothing states it. These weights multiply the
  career-technical base cost, which R.C. 3317.014 names and does not compute and which LSC's
  analysis defines only by cross-reference to the JVSD figure. So $8,333 is what the plan's own
  arithmetic says the FY2022 career-technical base cost was, recovered from the schedule rather
  than read anywhere — and against the $7,202 general base cost of the same year that is a
  premium of 15.7%, where FY2027's is 19.6%. The gap between the two bases has widened by four
  percentage points and no source in this corpus announces it. [verified for the arithmetic;
  inference for the widening being unannounced]

  ### And the whole schedule is written for two years

  Divisions (C)(2), (D)(2) and (E)(1)(b) each say that for fiscal year 2028 and thereafter the
  amount is "calculated in a manner determined by the general assembly". So the multiples
  above are the FY2026-27 schedule and the section states no successor — which makes any
  projection past FY2027 a projection under a rule the statute does not carry that far. The
  scenario runner projects to FY2032 and FY2036. [verified] (the section, and
  `crates/bundle/src/build.rs`)
properties:
  name: Career-technical category multiples
  unit: ratio
  kind: |
    **Legislated through FY2027, and unstated after it.**

    The five multiples and the associated-services multiple are in the section, to four
    decimals, and only an act can change them while they apply. What an act does *not* have to
    do is let them lapse: divisions (C)(2), (D)(2) and (E)(1)(b) already hand FY2028 onward to
    the General Assembly, so the default is not continuation.

    That is a distinction the four-kind taxonomy does not have a word for, and it is not the
    same as `uncodified`. The enrolment and performance supplements are uncodified — nowhere in
    the Revised Code, alive only in a budget act's temporary law. These multiples are codified,
    published, and citable, and they still stop. See the decision record
    [the four kinds of parameter](../../decisions/the-four-kinds-of-parameter.yml), which
    anticipated that a parameter can change kind at a regime boundary and did not anticipate a
    codified parameter with an expiry written into its own section.
  series: |
    (A)(1)  0.6230  workforce development: agriculture and environmental systems, construction
                    technologies, engineering and science technologies, finance, health science,
                    information technology, manufacturing technologies
    (A)(2)  0.5905  workforce development: business and administration, hospitality and tourism,
                    human services, law and public safety, transportation systems, arts and
                    communications
    (A)(3)  0.2154  career-based intervention
    (A)(4)  0.1830  workforce development: education and training, marketing, workforce
                    development academics, public administration, career development
    (A)(5)  0.1570  family and consumer science
    (B)     0.0294  associated services, against the sum of categories one to five

    All five category multiples verified against the Revised Code to the last digit —
    `crates/project/tests/the_statute_behind_the_weights.rs`. [verified] (crates/project)

    FY2026 and FY2027 only. The section states no value for FY2028 or later. [verified]

    The counts these multiply are the current year's. The calculator's column headers read
    `Category 1 Career Tech FTE-FY21` and this corpus took the suffix for a vintage, until the
    department's own table of where each variable is drawn from was read against it — see
    [fsfp-career-technical-weights](../formula-component/fsfp-career-technical-weights.yml),
    which carries the correction and its evidence. [verified] (crates/project)
  statutory_basis: |
    R.C. 3317.014, read. Divisions (A)(1) to (A)(5) for the category multiples, (B) for
    associated services, (C) and (D) for how each is applied. The separate career-technical
    base cost per pupil is statutory too — the section names it rather than leaving it to the
    department. [verified] (`ohio-laws`)
  simulation_key: |
    `project::panel::categoricals::CTE_WEIGHTS`, with `CTE_ASSOCIATED_WEIGHT` and
    `CTE_BASE_COST_PER_PUPIL` beside it.

    Constants, not levers. Nothing in `Policy` moves them.
  written_as: |
    career-technical base cost per pupil
    associated services
  sensitivity: |
    $54m in all, the smaller of the two weighted programmes, and $3.2m of it is associated
    services. [verified]

    The multiplicand is the exposure that is easy to miss. Because these five are priced in the
    career-technical base cost rather than the general one, a change to
    [base-cost-per-pupil](base-cost-per-pupil.yml) does *not* move them at the same rate — the
    two averages are separate quantities that happen to move together, and a scenario that
    scales one and not the other is making a policy choice rather than an arithmetic one.
    [inference]

    The frozen FY2021 counts mean this programme's sensitivity to *enrolment* is currently
    zero. Growth since 2021 is unfunded and decline since 2021 is unpenalised, so a projection
    that moves career-technical aid with enrolment is modelling something the calculator does
    not do. [verified for the freeze; inference for the consequence]
unfilled:
  - field: career technical planning district membership
    why: >-
      Not the $3 rate, which is in the section, and not the lead districts, whose table the
      department publishes with IRNs. What is missing is which schools belong to which planning
      district, and the one portal that published it no longer resolves. Without it the career
      awareness payment has a statewide total and no recipient.
  - field: the career-technical base cost as the department computes it, in FY2022
    why: >-
      Narrower than it was. This said the department "publishes a JVSD base cost build-up
      somewhere in its model" and the corpus could not reach it. It is reachable and now held:
      the JVSD foundation payment reports carry a 76-column `Base Cost` sheet for each of FY2022
      through FY2027, and among its statewide scalars is the average career-technical base cost
      per pupil — read rather than recovered from the weights. See
      [`dew-jvsd-foundation-payments`](../../catalog/dew-jvsd-foundation-payments.md) and
      [`fsfp-jvsd-state-share-of-base-cost`](../formula-component/fsfp-jvsd-state-share-of-base-cost.yml).

      What is still missing is one year. The FY2022 report predates the column — that year's
      sheet is 72 columns where the later five are 76 — so the FY2022 figure above is still
      recovered from the weights rather than read, and it is the only one that is. The scalar is
      not extracted into the committed fixture either: `jvsd_funding` takes the state share and
      its terms, not the build-up's statewide inputs, so a claim about the series still has to be
      read off the workbook.
