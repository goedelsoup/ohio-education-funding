revisions:
  - was: |
      The anchor chain was recorded as reaching FY2013 and no further: "it does not terminate at
      FY2013 either: that base is Bridge formula funding, which was itself by reference to earlier
      years, and how far below FY2013 it goes is still not established." [open]
    now: |
      It terminates at **FY2011**, an Evidence-Based Model run, net of federal stimulus. H.B. 153
      carried FY2011 aid per pupil forward wealth-indexed, with a floor at the FY2011 dollar
      amount; every later act re-anchored on the year before its own biennium. Six links, sixteen
      years, and the first term comes from a regime repealed by the act that carried it forward.
    found_by: |
      LSC's greenbook for H.B. 153, which states the FY2011 per-pupil derivation and the charge-off
      valuation index as formula boxes. It reached the corpus only when the greenbook series was
      completed across all twelve General Assemblies.
    reach: |
      The node's central claim gets its final year. "Funded at a level set by a placeholder formula
      in a year that formula was not even run" is now sharper still: the placeholder itself was
      carrying a figure from the formula it replaced. What remains open is narrower and different
      in kind — how much of a given district's base is still the FY2011 term rather than a later
      re-anchoring, which is a question about distribution rather than about depth.
  - was: |
      What the FY2020 figure was itself composed of was recorded as not established: "the Bridge
      formula distributed largely by reference to still earlier years, so the anchor may reach back
      further than 2020, and nothing committed here says how far." [open]
    now: |
      It reaches back at least to FY2013, by a chain of four acts that is now documented. FY2020 is
      FY2019 unchanged, because H.B. 166 ran no formula; FY2019 came from a guarantee anchored at
      FY2017, that one at FY2015, and that one at FY2013 — with each base explicitly including the
      previous biennium's transitional aid term, so the anchors compose rather than replace one
      another.
    found_by: |
      LSC's education greenbook for each of the four acts, retrieved and committed as
      `crates/project/fixtures/lsc-education-greenbooks.txt`. Each states its own guarantee base in a
      formula box; reading the four in sequence is what makes the chain visible.
    reach: |
      The node's central claim gets a year older and more literal. "Funded at a level set in a year
      the formula was not even run" was written as a characterisation of FY2020 and is a
      description of it: the run was FY2019's. The corpus's appropriation series showed the freeze
      all along — FY2019, FY2020 and FY2021 are flat to within 0.003% — and nothing had read it as
      one, because no node named the act that caused it.

  - was: |
      The node described `[H2]` as the guarantee's anchor and nothing else, and the panel derived
      it as "this district's receipt, if it is on the guarantee" and zero otherwise — recorded in
      `DistrictRecord::guarantee_baseline` as "unobservable" for a district on formula, "because
      the guarantee is the only thing that reveals the figure".
    now: |
      It is a published column, populated for 608 of 609 districts, and it is the phase-in's
      origin as well as the guarantee's floor.
    found_by: |
      Reading R.C. 3317.022 against the fixture the panel already parses: `funding_base` is
      column 141 of `crates/foundation/fixtures/fy27-department-model.csv` and had been loaded
      into `Transition::funding_base` since that struct existed.
    reach: |
      The 315 districts on formula were modelled with no floor beneath them, so any simulated cut
      let them fall past one Ohio would have caught them on. `scenario-delta` had pinned the gap
      as a known limitation — `Standing::PushedOn` was documented as unreachable — which is the
      failure mode worth naming: the defect was measured, recorded, and given a test that asserted
      it, rather than being chased back to the column that closes it.
properties:
  name: Guarantee funding base
  kind: |
    Legislated in origin and **measured** in practice: no section of R.C. 3317 states a value, and
    the figure is a per-district observation carried forward from FY2020. It changes only if an
    act re-bases it, which has not happened. [inference — the taxonomy is
    [`the-four-kinds-of-parameter`](../../decisions/the-four-kinds-of-parameter.yml)]
  unit: dollars-per-district, nominal and unindexed. [verified]
  statutory_basis: R.C. 3317.019, which names the guarantee without stating the base. [verified]
  series: |
    One value per district rather than one per fiscal period, and it has held at the FY2020 level
    in every year since — FY2022 through FY2027, across three biennial budgets, unchanged.
    [verified] Carried per district in `crates/project::panel::Transition` and reproduced for all
    609 in `crates/project/tests/the_supplements_outside_the_formula.rs`.
  written_as: |
    guarantee funding base
  sensitivity: |
    Nothing in the formula moves it, which is the point: it is the fixed side of a `max`, so a
    guaranteed district is inert to every other lever. What does move it is inflation, and only in
    real terms — 25.1% of its value across FY2020-FY2025. [verified]
  fy2027_scale: |
    Binding for 294 of 609 districts. Aggregate base for those districts $3.03 billion, against
    $2.15 billion the formula computes for them — **70.9%**. [verified]
