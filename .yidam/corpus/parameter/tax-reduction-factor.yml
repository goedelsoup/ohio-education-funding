properties:
  name: Tax reduction factor
  unit: ratio
  kind: |
    Measured. R.C. 319.301(D) specifies the computation and the Tax Commissioner runs it every
    year over each district's values, levy by levy and class by class. [verified] No act sets a
    factor; the General Assembly set the rule in 1976, and a factor moves whenever values do.
  series: |
    Recomputed every tax year for every levy and both classes, and used only for its own year.
    Table SD-1 carries the aggregate result for TY2021 to TY2024 as each district's class rates
    beside its gross rate. [verified] (Table SD-1, `crates/dispersion/src/sd1.rs`)
  statutory_basis: R.C. 319.301, with the classes at R.C. 5713.041 and the credit at R.C. 319.303
  sensitivity: |
    Decides whether a levy's yield follows reappraisal. Above the floor a voted rate yields the
    same dollars on the same property however values move, so any simulation that applies a
    voted rate to a reappraised value overstates local revenue by the reduction. [inference]
