class: parameter
label: Base Cost Per Pupil
summary: >-
  What the state treats as the cost of educating one student before categorical additions — the
  most consequential single number in Ohio school funding, and the one whose meaning has
  changed most from one regime to the next.
description: |
  The amount the state treats as the cost of educating one student before categorical
  additions — the single most consequential number in Ohio school funding, and the one whose
  meaning has changed most.

  Under the [foundation base cost formula](../funding-regime/foundation-base-cost-formula.yml)
  it was a statewide figure set in the biennial budget, and the Supreme Court of Ohio found in
  [*DeRolph I*](../litigation/derolph-i-1997.yml) that it was derived by working backward from
  available appropriation rather than from any costing of an education. [verified] Under the
  [Fair School Funding Plan](../funding-regime/fair-school-funding-plan.yml) it is not set at
  all: each district's base cost is built from staffing ratios and priced inputs, and the
  statewide figure is the **quotient of the summed district aggregates over the summed
  district ADM** — an output, not an input. [verified]

  The FY2022 statewide aggregate was $11,023,233,582.74 over a base cost enrolled ADM of
  1,499,918.26, giving an average base cost per pupil of **$7,349.22**. [verified] The
  career-technical equivalent, computed from the JVSD base cost calculation, was $8,891.03.
  [verified]

  Comparing a pre-2022 base cost to a post-2022 one compares a policy decision to a computed
  output. The comparison is only meaningful with the reference year of the cost inputs stated
  alongside — and the distribution matters as much as the average: districts under roughly 700
  students, about one-sixth of Ohio districts, carry base amounts above $8,000 per pupil
  because minimum staffing floors apply regardless of enrollment. [inference, Fordham] The
  statewide average conceals a bimodal distribution driven by district size.
properties:
  name: Base cost per pupil
  unit: dollars-per-pupil
  kind: |
    **It changed kind at the regime boundary, and this is the parameter that shows the taxonomy
    is not a property of a name.**

    Legislated before the Fair School Funding Plan: a dollar figure set by act — $5,283.00 in
    FY2006, $5,403.00 in FY2007 — that a reader could look up and a legislator could amend.
    [inference]

    Measured under the plan. R.C. 3317.011 does not state a base cost; it specifies a build-up
    from reported inputs — classroom teacher salary at a reference year, average insurance cost,
    staffing ratios — and the statewide average per pupil is what falls out. [verified] The
    $8,241.61 in the department's FY2027 model is an output, not a setting. Nobody chose it, and
    no act would have to change for it to move; what moves it is the cost inputs' reference year,
    which is itself a legislated choice one level up.

    That two-level structure is the substance of the
    [cost input refresh scenario](../scenario/fsfp-input-year-refresh.yml): the lever is which
    year is read, and the thing it moves is a measured quantity. Reading this parameter as
    legislated — as its pre-2021 series invites — makes the refresh look like a policy that sets
    a number, when it is a policy that chooses a measurement.
  series: |
    FY2006  $5,283.00  statutory base cost, foundation formula    [inference]
    FY2007  $5,403.00  statutory base cost, foundation formula    [inference]
    FY2021  $6,020.00  pre-FSFP formula amount                    [inference, Fordham]
    FY2022  $7,349.22  statewide average, FY2018 cost inputs      [verified, department]
    FY2023  $7,352.00  statewide average, FY2018 cost inputs      [inference, Fordham]
    FY2025  $8,240.00  statewide average, FY2022 cost inputs      [inference, Fordham]
    FY2026  $8,242     the FY2024 statewide average, maintained  [verified — LSC greenbook]
    FY2027  $8,242     the same FY2024 amount, maintained again  [verified — LSC greenbook]
            $8,241.61  the calculator's stated multiplier          [verified, department model]
            $8,257.55  aggregate / ADM, which is $15.94 higher     [verified, computed]

    FY2027 detail from the department's own FY27 calculator [verified]:
      statewide aggregate base cost     $11,767,054,639.44
      base cost enrolled ADM              1,425,005.53
      aggregate / ADM                        $8,257.55
      stated average base cost per pupil     $8,241.61   (the calculator's own multiplier)
      classroom teacher salary [s5d]         $68,022.22   (FY2022 reference year)
      average insurance cost   [s4]          $17,152.68

    **Those last two are different quantities and the node used to conflate them.** Dividing the
    aggregate by the ADM gives **$8,257.55**; the figure the calculator carries and multiplies by
    is **$8,241.61**, and the gap is **$15.94 per pupil**.

    **And the gap has an explanation, which the corpus recorded as a mystery.** The multiplier is
    not an FY2027 quantity at all. H.B. 96 holds the categorical multiplicands at their **FY2024**
    values: "The budget maintains the use of the FY 2024 statewide average amounts ($8,242 and
    $9,856, respectively) in FY 2026 and FY 2027." [verified — LSC greenbook] So $8,241.61 is a
    FY2024 average carried forward by statute, while $8,257.55 is what the FY2027 base cost model
    actually computes — two different years, which is why neither is recoverable from the other
    and why the difference is small but not zero.

    Every place this corpus labels $8,241.61 and its career-technical companion $9,855.62 as
    "FY2027" is naming the year they are *used* rather than the year they are *from*. The figures
    are right; the vintage is a third input year beside FY2022 and the phase-in, and the act
    freezes all three. $8,241.61 is the load-bearing one — it
    is what the English learner and special education weights multiply
    ([`project::panel::categoricals::AVERAGE_BASE_COST_PER_PUPIL`](../../../crates/project/src/panel/categoricals.rs))
    and what the open-enrolment clawback charges per FTE — so it is a *stated input* rather than a
    derived average, and it is not recoverable from the two figures above it. Any statement of the
    form "aggregate ÷ ADM = the average the formula uses" is false here by $15.94. [verified —
    summed from `crates/foundation/fixtures/fy27-department-model.csv`, 609 districts]

    Note the ADM trend: 1,499,918.26 in FY2022 against 1,425,005.53 projected for FY2027, a
    5% decline. Aggregate base cost still rises because the per-pupil figure rises faster than
    enrollment falls. [inference]

    Supporting FY2022 detail, all verified from the department's payment report:
      Statewide aggregate base cost      $11,023,233,582.74
      Statewide base cost enrolled ADM    1,499,918.26
      Career-technical base cost/pupil    $8,891.03
      Economically disadvantaged pct      46.7239%
      Districts receiving foundation aid  611
      Total state foundation funding      approximately $7.5 billion

    Still missing: the FY1992-FY2009 statutory series, the Evidence-Based Model's computed
    adequacy amount for FY2010-11, and the FY2024-FY2027 statewide averages. All figures need
    a constant-dollar companion series before any cross-era comparison. [open]
  statutory_basis: R.C. 3317.011, with sub-components at 3317.011(D) through (H). [verified]
  simulation_key: base_cost_per_pupil
  written_as: |
    statewide average base cost per pupil
    average base cost per pupil
    district base cost per pupil
    district aggregate base cost
  sensitivity: |
    Moves every district's computed cost proportionally before local share is applied. Because
    state aid is the residual after local capacity, **a dollar of extra base cost per pupil is
    a dollar of extra state aid per pupil**, not the state's percentage of it: local capacity
    does not move when base cost does. Scaling the state share proportionally instead is the
    obvious-looking mistake, and it understates the cost of an increase by the whole local
    share. [verified — `crates/project`]

    The exception is the bottom of the wealth distribution, where the **minimum state share**
    floors the effect. That minimum is **10%**, not the 5% the plan was enacted with — it is
    set by each biennial budget and it doubled, and **138 of 609 districts sit exactly on it**
    in the FY2027 model. [verified — the department's own Notes sheet states 0.1 for FY2026 and
    FY2027]

    The aggregate response is therefore **not linear**. Each increment lifts districts off the
    [guarantee](../formula-component/temporary-transitional-aid-guarantee.yml) and onto a
    formula that then has to pay them, so the marginal cost per point rises: $47.7M for the
    first two points, $72.5M by the twentieth. A fiscal note extrapolating a large increase
    from a small one understates it, and the error grows with the size of the proposal. See
    [`guarantee-phase-out`](../scenario/guarantee-phase-out.yml). [verified]

    Interacts multiplicatively with
    [fsfp-phase-in-percentage](fsfp-phase-in-percentage.yml): raising base cost while holding
    phase-in constant delivers only the phased fraction of the increase.

    The dominant driver is the teacher salary input. Base cost is majority personnel, priced
    at ($62,696.18 x 1.16) + $14,265.53 = $86,993.10 per funded teacher in FY2022, so the
    parameter's real sensitivity is to the reference year rather than to any legislative
    choice about the number itself. [verified for the arithmetic; inference for the claim
    about dominance]
