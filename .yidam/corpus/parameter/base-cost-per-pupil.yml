    Supporting FY2022 detail, all verified from the department's payment report:
      Statewide aggregate base cost      $11,023,233,582.74
      Statewide base cost enrolled ADM    1,499,918.26
      Career-technical base cost/pupil    $8,891.03
      Economically disadvantaged pct      46.7239%
      Districts receiving foundation aid  611
      Total state foundation funding      approximately $7.5 billion

    Still missing: the FY1992-FY2009 statutory series, the Evidence-Based Model's computed
    adequacy amount for FY2010-11, and the FY2024-FY2027 statewide averages. All figures need
    a constant-dollar companion series before any cross-era comparison. [open]
  statutory_basis: R.C. 3317.011, with sub-components at 3317.011(D) through (H). [verified]
  simulation_key: base_cost_per_pupil
  sensitivity: |
    Moves every district's computed cost proportionally before local share is applied. Because
    state aid is the residual after local capacity, a given percentage change in base cost
    produces a larger percentage change in state aid for districts with high local capacity —
    except at the bottom, where the 5% minimum state share floors the effect entirely.
    [inference]

    Interacts multiplicatively with
    [fsfp-phase-in-percentage](fsfp-phase-in-percentage.yml): raising base cost while holding
    phase-in constant delivers only the phased fraction of the increase.

    The dominant driver is the teacher salary input. Base cost is majority personnel, priced
    at ($62,696.18 x 1.16) + $14,265.53 = $86,993.10 per funded teacher in FY2022, so the
    parameter's real sensitivity is to the reference year rather than to any legislative
    choice about the number itself. [verified for the arithmetic; inference for the claim
    about dominance]
