revisions:
  - was: |
      The 0.96854448 factor was read against the $147,500,000 limit printed beside it, making
      the program $908,184 over its appropriation and prorated.
    now: |
      That limit is the **FY2025** estimate. FY2026 and FY2027 are both $153,976,832, against
      which the program at $148,408,184 is **$5,568,648 under** — so no proration arises at
      all. The factor and the limit were carried over together from the prior biennium.
    found_by: |
      The enacted act's LSC analysis, rather than the proposal the workbook cell was priced
      from.
    reach: |
      The node's reading of the mechanism was right throughout; the cell it read was stale. A
      published proration factor is not evidence that a proration applied.
properties:
  name: Appropriation proration factor
  unit: fraction of the computed entitlement
  kind: |
    **Uncodified, and the taxonomy cannot decide whether it is also delegated — which is a
    sharper statement of this node's open question than the node had.**

    Uncodified is certain: no section of R.C. 3317 sets a proration factor, and the value exists
    because an appropriation was smaller than the entitlement computed against it. [verified]

    What was not certain is who holds the pen. If the factor is arithmetic — the line divided by
    the demand — then it is *measured*, and nobody decides it. The FY2027 factor of 0.96854448
    against the $147,500,000 printed beside it is precise enough to look arithmetic and does not
    close, because that cell is the FY2025 estimate.

    **The year before it closes exactly, and that settles it.** The FY2026 calculator prorates
    the program to $153,976,835.57 against an appropriation of $153,976,832 — $3.57 over, on a
    $154m line. Divide that appropriation by the demand the workbook implies and the factor comes
    out **0.96853808**, against the **0.96853811** the sheet states: agreement to eight decimal
    places. The factor is *measured*. Nobody decides it. [verified]
    ([`crates/project`](../../../crates/project/tests/the_parameters_that_said_they_had_no_prior_year.rs))

    **Which makes the FY2027 factor the anomaly rather than the puzzle.** Run the same arithmetic
    on FY2027 and it gives **1.0049** — the program's demand is below its appropriation and no
    proration arises at all. The calculator applies 0.96854448 anyway, within six millionths of
    the prior year's, and the program lands **$5,568,648 under** the line it is paid from. A
    factor that was computed in FY2026 was carried into a year whose own arithmetic does not
    produce it.

    **And it was edited in, rather than carried forward with the rest.** Every other cell of that
    sheet's header block holds across the two workbooks — the $4,000 base amount, the $8,241.61
    average base cost, all six special education weights, and the $147,500,000 limit, which is
    stale in both. The proration factor is the one cell in the block that moved. So somebody
    typed a new number into a copied sheet, and what produced the difference in the sixth decimal
    place is still not established. [open]
  series: |
    FY2027: special education transportation 0.91746; preschool special education 0.96854448,
    stated beside a $147,500,000 cell that is the **FY2025 estimate** — the FY2027 appropriation
    is $153,976,832 and the program does not reach it, so no proration arises; transportation
    general 1.0.

    FY2026, from the department's calculator a year earlier: special education transportation
    **1.0**; preschool special education **0.96853811**; transportation general 1.0. [verified]
    ([`crates/project`](../../../crates/project/tests/the_parameters_that_said_they_had_no_prior_year.rs))

    So the FY2027 special education transportation proration is **the first one**, and this node
    recorded earlier years as unheld while `crates/project/fixtures/transportation-rates.csv`
    already carried both. [verified]

    The two transportation factors now carry their appropriations with them: the special
    education earmark is $176,897,678 then $194,820,866, and the unearmarked remainder the
    general formula is paid from is $703,348,806 then $762,819,905. A factor without the line it
    divides is an unexplained multiplier, which is the argument `sensitivity` makes for three
    properties rather than one. [verified]
    ([`crates/project`](../../../crates/project/tests/the_denominator_that_is_larger_than_the_model.rs))
  statutory_basis: |
    Set by the appropriation rather than by R.C. 3317, and each of the three divides a different
    half of a line:

        special education transportation   an earmark inside GRF ALI 200502
        transportation, general            what is left of GRF ALI 200502 after its earmarks
        preschool special education        what is left of GRF ALI 200540 after its five

    ~~Whether the department's discretion in setting the factor is bounded.~~ It is not
    discretion. The budget's own language is *"DEW must prorate the payments so as not to exceed
    the amount appropriated"*, and LSC states the arithmetic that produces the number:
    *"Adjustment percentage = (Earmarked appropriation)/(Total statewide allocation)"*. Both
    halves are observable for all three, and all three close. [verified]
    ([`crates/project`](../../../crates/project/tests/the_denominator_that_is_larger_than_the_model.rs))
  simulation_key: proration_factor
  written_as: |
    general proration
    proration
  sensitivity: |
    Linear and universal within a program: every district's amount moves in exact proportion, so a
    proration changes the level and nothing about the distribution. That makes it the one parameter
    here with no incidence to model — and the one most likely to be omitted from a simulation for
    exactly that reason, which would overstate every district's payment by the same fraction.

    A node for this class wants **three** properties and not one: the factor, the appropriation it
    was set against, and the entitlement it was divided into. Holding only the factor cannot detect
    that the preschool one has stopped fitting.
