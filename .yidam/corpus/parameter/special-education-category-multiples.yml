class: parameter
label: Special Education Category Multiples
summary: >-
  Six multiples, 0.2435 to 3.9554, one per disability category — a sixteen-fold range that is
  most of what special education funding is. The only FSFP parameter the Revised Code states
  with no end date, and the only one enacted by an act other than the current budget.
description: |
  Six numbers, written out in R.C. 3317.013 in the same order as the categories they price:
  0.2435, 0.6179, 1.4845, 1.9812, 2.6830, 3.9554. Each multiplies the statewide average base
  cost per pupil, the district's ADM in that category, and its state share percentage.
  [verified — the section, in `crates/project/fixtures/revised-code.txt`]

  **The range is the policy.** A Category 6 pupil generates sixteen times what a Category 1
  pupil does, so which category a child is assigned to is not an administrative detail — it is
  most of the money. Statewide, Category 6 is 15% of the pupils and 48% of the aid; Category 2
  is 65% of the pupils and 34%. [verified — `crates/project`]

  **What they multiply is not obvious from the numbers.** The multiplicand is the general
  statewide average base cost per pupil, $8,241.61, and *not* the career-technical figure
  20% above it that
  [career-technical multiples](career-technical-category-multiples.yml) use. Two schedules,
  two multiplicands, and no published table says so; a reader comparing a special education
  weight against a career-technical one as though they sat on one scale is out by a fifth
  before any pupil is counted. [verified]
findings: |
  ### This is the one that does not expire

  Of the nine Revised Code sections that carry the Fair School Funding Plan's parameters, this
  is the only one stated flatly. Three — R.C. 3317.011, 3317.017 and 3317.0217 — open with
  *"This section shall apply only for fiscal years 2026 and 2027"*. Five more hand their values
  back clause by clause: forty divisions across six sections read *"For fiscal year 2028 and
  each fiscal year thereafter, an amount calculated in a manner determined by the general
  assembly"*. R.C. 3317.013 does neither. [verified — counted over the committed extract]

  It is also the only one of the nine not amended by the current budget act. Its effective date
  is 6 April 2023 and its source is H.B. 554 of the 134th General Assembly; every other section
  here carries H.B. 96 of the 136th and 30 September 2025. [verified — the extract's own
  `date:` and `source:` fields]

  Whether the durability is deliberate or an artefact of the section not having needed
  amendment is not established, and the two are not distinguishable from the text. [open]

  ### The six ratios are the General Assembly's of 2001, carried and never repriced

  Every one of the plan's six is **0.8379** times the corresponding weight in the Evidence-Based
  Model of 2009 — the same constant on all six, agreeing to a part in eight thousand. The plan
  did not re-derive this schedule; it rescaled it. In dollars that is a rise of **11.1%** on the
  FY2017 amounts, identical for every category, which is what a single scalar means and a
  different act from repricing. [verified —
  [`crates/project`](../../../crates/project/tests/the_weights_that_were_dollar_amounts.rs)]

  Those 2009 weights are in turn the FY2002 schedule with one change: category two roughly
  doubled, from 0.3691 to 0.7374, and the other five moved by less than 3 per cent. So the ratios
  Ohio prices disability with in FY2027 are the ratios the 124th General Assembly set, carried
  through four regimes and re-expressed twice. [verified]

  ### And for eight years the schedule was dollars, not multiples

  FY2014 through FY2021 each category carried a per-pupil amount instead of a weight: $1,503 to
  $24,407 in FY2014, rising 2 per cent a year to FY2017 and then frozen — H.B. 49 holds them at
  the FY2017 figures and the Bridge formula computed no categoricals at all. Those amounts are
  the 2009 weights times a single per-pupil figure, $5,171 in FY2014 and $5,431 in FY2017, so
  even the regime that paid in dollars was paying the same six ratios. [verified]

  That is why "the multiples before FY2022" had no answer in the form it was asked: for eight
  years there were none. The ratios, which is what the question was after, never went away.

  ### What moved was which children are in which category

  H.B. 1 reassigned vision-impaired and orthopedically disabled pupils to categories with a
  higher weight, and LSC records it in a sentence rather than a number: in FY2002 category three
  read *"hearing impaired, vision impaired, severe behavior handicapped"* and category four
  *"orthopedically handicapped, other health – major"*; by FY2010 vision impaired had moved into
  category four, where it still is. No weight in any of the four schedules records that, and for
  a child it is the larger change of the two. [verified]

  ### And the range has never been priced

  Naming the categories settles what is being ordered; it does not say what any of it costs. No
  source this corpus holds prices a category, so whether a sixteen-fold funding range tracks a
  sixteen-fold difference in the cost of educating a child is unanswered. [open]

  The history above narrows where an answer could be. Four regimes have applied these six ratios
  and none of them derived them: 2009 rescaled 2001 by category, 2013 converted them to dollars,
  2021 converted them back to weights. Whatever costing sits under the schedule, if one does, is
  older than every source in this corpus. [inference]
properties:
  name: Special education category multiples
  unit: ratio
  kind: |
    **Legislated, and the only one of the plan's schedules that stays legislated past FY2027.**

    R.C. 3317.013 states the six multiples as a bare list with no fiscal-year condition attached
    to any of them, so nothing has to happen for them to hold and an act has to pass for them to
    move. That is what the taxonomy's `legislated` means, and it is the ordinary case a reader
    would assume for all of these. It is in fact the exception — see `findings`.
  series: |
    (A)  0.2435  speech and language disability
    (B)  0.6179  specific learning disabled, developmentally disabled or delayed, other health
                 impairment-minor, preschool developmental delay
    (C)  1.4845  hearing disabled, severe behavior disabled
    (D)  1.9812  vision impaired, other health impairment-major
    (E)  2.6830  orthopedically disabled, multiple disabilities
    (F)  3.9554  autistic, traumatic brain injury, both visually and hearing impaired

    All six verified against the Revised Code to the last digit, not only against the
    department's calculator — `crates/project/tests/the_statute_behind_the_weights.rs`. That
    distinction is the point of the check: every earlier verification confirmed the department
    agreed with *itself*, and a spreadsheet can be internally perfect and still not be the law.
    [verified]

    Unchanged across FY2026 and FY2027, the two years this corpus holds. The section has been
    in force in this form since 6 April 2023. [verified]
  statutory_basis: |
    R.C. 3317.013, read. The categories are defined by cross-reference to Chapter 3323 rather
    than in this section; the multiples are here. The preschool halving of the same six
    multiples is R.C. 3317.0213 and is a separate parameter —
    [preschool special education amounts](preschool-special-education-amounts.yml). [verified]
  simulation_key: |
    `project::panel::categoricals::SPECIAL_EDUCATION_WEIGHTS`.

    A constant, not a lever. `Policy` exposes four fields — the guarantee rule, a base cost
    scale, the minimum state share and two phase-in percentages — and none of them is this. A
    counterfactual that moved a category weight cannot currently be run.
  written_as: |
    the school-age weights
  sensitivity: |
    Moves $722m, the second-largest categorical, and moves it unevenly. Because the caseload is
    concentrated in Category 2 and the money in Category 6, a proportional change to all six
    weights and a change to Category 6 alone have very different distributional shapes: the
    first follows the pupils, the second follows the money. [inference]

    The multiplicand matters as much as the multiple. Every one of these is priced in the
    statewide average base cost per pupil, so
    [base-cost-per-pupil](base-cost-per-pupil.yml) moves all six at once — which is why the
    scenario runner's `base_cost_scale` carries about $812m of categorical exposure on top of
    what base cost alone does. [verified — `crates/project`]

    A program dominated by a category that is a sixth of its caseload is sensitive to
    identification practice in a way a per-pupil program is not. A small change in how many
    children are placed in Category 6 moves more money than a large change in Category 2.
    [inference]
unfilled:
  - field: what set the 0.8379 rescaling
    why: >-
      The committed analyses establish that the plan multiplied the 2009 schedule by one
      constant; none of them says why that constant. The Fair School Funding Plan workgroup's
      own materials, which this corpus does not hold, are where a rationale would be.
  - field: the schedule before FY2002
    why: >-
      The earliest committed LSC analysis is the 124th General Assembly's, and it states the six
      as already settled rather than as new. Whether the 124th set them or inherited them is a
      question for the analyses of the 123rd and earlier, which the extract does not reach.
  - field: what a category costs
    why: >-
      No source this corpus holds prices a disability category. A costing study, or the
      department's own build-up if one exists, is what would settle whether the range tracks
      cost.
