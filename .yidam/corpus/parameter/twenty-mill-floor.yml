properties:
  name: Twenty-mill floor
  unit: mills
  kind: |
    Legislated. R.C. 319.301 states 20 mills, and 2 mills for joint vocational school districts,
    on the face of the section. [verified] It is the purest case of the category in this corpus:
    one number, in permanent law, unmoved since 1976 — which is also what makes it the parameter
    most often mistaken for a fact about the world rather than a choice that could be revisited.
  series: |
    20 mills for city, local, and exempted village school districts; 2 mills for joint
    vocational school districts. In force continuously since Am. Sub. H.B. 920 (1976).
    [verified] Amendments to the surrounding provisions since 1976 have not moved the floor
    itself, but this should be confirmed against current R.C. 319.301. [open]
  statutory_basis: R.C. 319.301
  simulation_key: twenty_mill_floor
  sensitivity: |
    Determines whether a district's local revenue tracks valuation growth or is held flat by
    reduction factors — a binary regime switch, not a continuous effect. Districts at the
    floor also experience reappraisal as a revenue event, which changes the political economy
    of levy campaigns in those districts. [inference] Interacts with
    [charge-off local share](../formula-component/charge-off-local-share.yml): a district
    charged off at an assumed millage it cannot levy is the phantom revenue case.
