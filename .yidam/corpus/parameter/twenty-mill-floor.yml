class: parameter
label: Twenty-Mill Floor
summary: >-
  The limit below which H.B. 920's tax reduction factors may not push a district's effective
  operating millage. A small number that does something large: at the floor, valuation growth
  reaches revenue, and above it, it does not.
description: |
  The limit below which [H.B. 920](../legislation/hb-920-1976.yml)'s tax reduction factors may
  not push a school district's effective operating millage. Set at 20 mills for school
  districts and 2 mills for joint vocational school districts, at R.C. 319.301. [verified]

  It is a small number that does something large. For a district above the floor, reduction
  factors neutralize valuation growth and revenue from existing levies stays roughly flat in
  nominal terms. For a district at the floor, reduction factors stop operating and revenue
  rises directly with assessed valuation. [verified] The two kinds of district are on
  fundamentally different revenue trajectories, and which one a district is on is determined by
  its levy history rather than by any current decision.

  This makes the floor the highest-leverage single parameter in the system for questions about
  local revenue, and a frequent target of reform proposals in both directions. Raising it would
  move more districts onto valuation-linked growth; lowering it would do the opposite.
  [inference] Any credible simulation of a property tax change has to determine floor status
  per district first, because the same change produces opposite effects on the two groups.

  ### The remaining candidate, confirmed in the statute itself

  R.C. 319.301(A)(1): the reductions "do not apply to ... taxes levied at whatever rate is
  required to produce a specified amount of tax money, including a tax levied under section
  5705.199 or 5748.09 of the Revised Code, or an amount to pay debt charges." R.C. 5705.199 is
  the emergency levy section. Fixed-sum levies are exempt from reduction as a matter of law.
  [verified — `ohio-laws`, `crates/project/tests/the_statute_behind_the_weights.rs`]

  An absence of an effect in one group is not an absence of the mechanism, and the correction
  is recorded rather than quietly replaced because the wrong reading was the more natural one.

  ### The floor is not written in mills
findings: |
  **How much the reduction factors have actually taken: the median district has lost 42.4% of
  the millage its voters approved.** The median voted current operating rate is 42.31 mills
  against a median effective Class 1 rate of 23.40, and the largest reduction in the state is
  74.7%. [verified — FY2024 District Profile Report, `current_operating_millage_ty23` against
  `effective_class1_millage_ty23`] This is the magnitude of the mechanism the floor bounds, and
  it went unstated here for as long as it did because the voted-millage column was present in
  the fixture and never parsed. Note the figure is the median of the per-district ratio, not
  one minus the ratio of the two medians, which is a different and meaningless quantity.

  **A defect in the corpus's own calculator, found by running it against the tables.**
  `crates/millage` implemented the floor as a clamp: any district whose reduced rate fell below
  20 mills was raised to 20 only if its voted rate was at least 20, and otherwise took the
  reduced rate unchanged. That reduced the six sub-twenty-mill districts as if the floor did
  not concern them — a district voting 19 mills came out at 9.5 on a doubling of valuation.
  R.C. 319.301(D) states the floor as a guarantee of what twenty mills would raise, so a
  district already below twenty is under the guarantee before any reduction and none applies.
  The published data settles it: all six report voted and effective rates equal to four
  decimals. [verified] Fixed, with `crates/millage/tests/against_published_tables.rs` holding
  the crate to 1,218 published district-years.

  **How many districts sit at the floor: 170 of 606, or 28.1%, in TY2023.** [verified —
  computed from the FY2024 District Profile Report; see
  [`crates/dispersion`](../../../crates/dispersion/tests/cupp_fy24.rs)] A further 63 sit within
  half a mill of it, so 233 districts — more than a third of the state — are at or effectively
  against the floor. The statewide median effective Class 1 rate is 23.40 mills and the maximum
  is 84.29. [verified]

  That distribution is the single most important fact about Ohio local school revenue, and it
  is not a tail phenomenon. More than a quarter of districts are on a revenue trajectory where
  reappraisal raises income directly, and the rest are on one where it does not. Any statewide
  property tax analysis that treats districts as homogeneous is averaging across a regime
  boundary. [inference]

  **An anomaly the corpus's model does not explain.** 20 of the 606 report an effective
  Class 1 rate *below* the floor. 6 of them are straightforward: they never voted twenty mills —
  voted rates of 18.7 to 19.71 — and the floor cannot lift a rate above what voters approved. All six
  are in Appalachian and southern Ohio counties (Vinton, Morrow, Lawrence, Jackson, Pike,
  Scioto), which is itself worth noting: the districts levying least sit in the poorest part of
  the state. [verified]

  The other 14 voted between 23 and 48 mills and still report effective Class 1 rates
  between 19.72 and 19.994 — just below the floor. [verified] Nothing in the corpus's current
  account of R.C. 319.301 explains this. Two candidate explanations were offered when this was
  first recorded; Table SD-1 now lets one of them be tested, and it fails.

  **The combined-base hypothesis is disconfirmed.** If the floor were applied to a combined
  Class 1 and Class 2 base rather than to Class 1 alone, the value-weighted real property rate
  for these districts would pin at 20 mills. It does not: on TY2024 it runs from 19.719 to
  21.562 across the fourteen, and three of them land within a hundredth of 20. Statewide the
  same measure puts **62 of 611** districts at 20.00 against **155** on the Class 1 rate, so
  the Class 1 figure is the one the floor governs. [verified — TY2024 Table SD-1, all four
  counts from the same year]

  The TY2023 column of the same table says 76 of 611 on the combined measure against 172 on
  Class 1, with one of the fourteen within a hundredth of 20. Both years disconfirm the
  hypothesis and neither is the other, which is the reason for naming the year on every count:
  this paragraph previously carried the combined-base count from TY2023 beside the Class 1
  count from TY2024 under a single TY2024 citation, over a denominator of 609 that belongs to
  the FY2027 funding model rather than to Table SD-1's 611 districts.

  R.C. 319.301 never says "twenty mills". It says **two per cent of the taxable value** of the
  class, and **two-tenths of one per cent** for joint vocational districts. Those are the 20
  and 2 mills this node carries, so the figures are right — but the name is a colloquialism for
  a percentage, and a reader searching the statute for the phrase will not find it. [verified]

  Twelve of the fourteen sit within 0.12 mills of the floor and eleven within 0.05, which is
  more consistent with rounding inside the reduction-factor computation than with a different
  base. [inference] Bradford Exempted Village, at 19.7247, is the one that a rounding account
  would not cover.

  **The count is 21, not 20, on the later table.** Table SD-1's TY2024 figures add Kelleys
  Island Local, which the District Profile Report omits entirely: 10.15 effective Class 1 mills
  against $21.2m of taxable value per pupil, the highest in the state by a factor of seven. It
  is the clearest instance of the six-district pattern — one mill raises $21,025 per pupil
  there, so twenty would be an absurdity — and it is invisible to the profile report the corpus
  had been counting from. [verified]

  **What two tax years establish that one could not.** Of the 416 districts that began TY2023
  above the floor, 301 saw their effective Class 1 rate fall by TY2024; of the 193 that began
  at it, 9 did. 97.1% of every effective-rate reduction in Ohio happens above the floor.
  [verified — computed in `crates/bundle` from TY2023 and TY2024 Table SD-1, over the 609
  districts of the FY2027 funding model, at `RATE_FALL_TOLERANCE`]

  The split must be taken at the *start* of the interval. Classifying by the end year lets a
  district that fell *to* the floor be counted as a floor district with a falling rate, which
  puts the outcome being measured inside the category doing the measuring; it moves the
  at-floor fall rate from 4.7% to 21.6% and the headline from 97.1% to 87.7%. [verified]

  **And a caution against the regime language above.** 54 districts sit above the floor by less
  than a twentieth of a mill, and 82 crossed 20.0000 in one direction or the other between the
  two tax years — 61 of those by under five hundredths of a mill. For roughly an eighth of the
  state the binary is settled in the fourth decimal place and is likely to read the other way
  next year. [verified] The regime switch is real and the boundary is sharp in the statute; the
  *assignment* of districts to sides is not stable, and a simulation that treats floor status
  as a fixed district attribute will be wrong about that eighth. [inference]
revisions:
  - was: |
      Of the 193 districts that began TY2023 at the floor, **7** saw their effective Class 1 rate
      fall by TY2024 — an at-floor fall rate of **3.6%**, against a headline **97.7%** of all
      effective-rate reductions occurring above the floor. The end-year-classification variant
      was given as 20.5% and 88.3%.
    now: |
      **9**, **4.7%** and **97.1%**; the variant is **21.6%** and **87.7%**. The 416 districts
      that began above the floor and the 301 of them whose rate fell are unchanged, as is the
      193.
    found_by: |
      Recomputing the passage while auditing #128. The old figures were produced when a fall
      meant a drop of more than `0.0005` mills. Table SD-1 publishes effective rates to four
      decimal places, so the half-unit of its own rounding is `0.00005` — ten times smaller —
      and that is the value `RATE_FALL_TOLERANCE` was given when the rule was unified across the
      site. Two of the nine at-floor falls sit between the two thresholds: noise at the looser
      one, falls at the published precision.
    reach: |
      The reading is unchanged and the contrast survives comfortably — 72% of above-floor
      districts saw a fall against 4.7% of at-floor ones. What changes is that the corpus and
      the site now compute this from the same constant; the site had been showing 97.1% while
      this node said 97.7%.
  - was: |
      That the floor does not apply to emergency and substitute levies was briefly stated in
      reverse, inferred from Table SD-1 alone: the data showed no effect in the group carrying
      them, and that was read as the mechanism being absent.
    now: |
      R.C. 319.301(A)(1) settles it in the statute's own words — the reductions "do not apply
      to ... taxes levied at whatever rate is required to produce a specified amount". The
      absence of a measurable effect in one group is not the absence of the mechanism.
    found_by: |
      R.C. 319.301(A)(1), read directly rather than inferred from the published rates.
    reach: |
      The distributional findings above are unaffected; they were computed from published
      effective rates rather than from this reading of which levies the factors reach.
