class: education-agency
label: Education Agency
foundational_type:
  ontology: ufo
  type: kind
description: |
  An IRN-bearing entity that receives Ohio public education funding and is a unit of
  distribution in the state formula — a city, local, or exempted village school district,
  a joint vocational school district, a community (charter) school, or a STEM school.
  It is a Kind because the identity is rigid: an entity that ceases to be a chartered
  education agency ceases to exist as this thing, rather than persisting in another form.
  The contingent labels attached to agencies in this domain — property-poor, 20-mill-floor,
  DeRolph plaintiff, guarantee district — are Roles it plays, not what it is, and several
  are typically played at once.

  **THE RIGIDITY IS NOW EVIDENCED, AND THE FEDERAL REGISTER DENIES IT.** Three Ohio districts
  ceased inside the window this repository holds — Bettsville into Old Fort in 2014, Ledgemont
  into Berkshire in 2015, Newbury into West Geauga in 2020 — each by a resolution of a county
  educational service center governing board under R.C. 3311.22, which transfers *all* of one
  district's territory to an adjacent one. The order is the service centre's, not the State
  Board's: the State Board appears in that section only as an appeal body, and none of these
  three was appealed. [verified —
  [the audit reports that recite each resolution](../catalog/auditor-district-audits.md), and
  [R.C. 3311.22](../catalog/ohio-revised-code.md)]

  The federal Common Core of Data files all three as *"closed with no effect on another agency's
  boundaries"*, which is the negation of what happened, and files nothing at all on the receiving
  agency. So an entity of this Kind can cease, its territory can move, and the national register
  of these entities can record neither. [verified] (`dispersion::lea_directory`)

  What the Revised Code makes rigid the reporting does not. That gap is the reason `established`
  and any future `ceased` property must come from Ohio's own record rather than from the
  directory that is otherwise the canonical list of these agencies. [inference]
properties:
  - name: irn
    type: string
    description: Information Retrieval Number; the stable statewide identifier for the agency
  - name: agency_type
    type: string
    description: city | local | exempted-village | joint-vocational | community | stem
  - name: county
    type: string
    description: Primary county of the agency's territory
  - name: typology
    type: string
    description: Department typology grouping (rural, small town, suburban, urban) used for peer comparison
  - name: established
    type: date
    description: Date the agency was chartered or organized
  - name: roles
    type: text
    description: Contingent roles the agency plays or has played, each with the fiscal periods it applied
  - name: series_path
    type: string
    description: Path under crates/ to this agency's committed per-fiscal-year numeric series
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. A large share of the corpus's edges
# use a relationship no class declares, and almost all of those are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject those edges or bloat every ontology with
# declarations that each describe one link.
#
# The counts are measured — see "relationship vocabulary" in `.yidam/corpus/README.md`. They are
# not repeated here, because they were: this comment carried three hand-written figures, fifteen
# ontologies carried the same copy, and every figure was stale before anybody re-measured.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: party-to
    target: litigation
    direction: out
    description: The agency was a named plaintiff, defendant, or intervenor in the case
  - relationship: merged-into
    target: education-agency
    direction: out
    description: The agency this one was consolidated into; required to keep long series continuous
  - relationship: peer-of
    target: education-agency
    direction: out
    description: The agency is a comparison peer, by typology or by wealth position
  - relationship: funded-by
    target: revenue-stream
    direction: in
    description: A channel of money that reaches this agency
  - relationship: loses-to
    target: program
    direction: in
    description: A program that diverts funds away from this agency
  - relationship: measured-by
    target: metric
    direction: in
    description: A defined measure computed over this agency's series
