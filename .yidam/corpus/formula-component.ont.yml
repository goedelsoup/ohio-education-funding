class: formula-component
label: Formula Component
foundational_type:
  ontology: ufo
  type: kind
description: |
  A structural mechanism inside a funding regime that performs one identifiable step of the
  distribution calculation — computing a base cost, applying a categorical weight, measuring
  local capacity, or capping and guaranteeing the result. It is the unit at which a regime
  can be compared to its predecessor: two regimes may share a component and differ entirely
  in another. A component is a mechanism, not a number; the numbers it consumes are
  parameters.
properties:
  - name: name
    type: string
    description: The component's name as it appears in statute or department documentation
  - name: function
    type: text
    description: What calculation step the component performs and on what inputs
  - name: statutory_basis
    type: string
    description: Ohio Revised Code sections that define the component
  - name: calculator
    type: string
    description: Name of the crates/ calculator implementing this component, if implemented
  - name: function_tex
    type: text
    description: >-
      The same calculation as `function`, written in LaTeX so the site can set it in type. The
      web build compiles it to MathML with Temml and holds the output to an enumerated allowlist;
      a value that will not compile fails the build rather than rendering an error string.

      The pair is deliberate — `function` stays the aligned ASCII a reader meets in the YAML, and
      it is the statement that was checked against the department's worksheet — but only ONE of
      the two reaches the page. Where `function_tex` exists the node page renders it, under the
      plain name, and the ASCII is not shown; where it does not, the aligned block is. A reader
      never meets one calculation twice. See `shownProperties` in `web/src/lib/prose.ts`.

      Three checks in `web/tests/unit/math.spec.ts` keep the two from drifting: every quantity a
      typeset formula uses has to be introduced by it, the two statements have to name the same
      quantities, and a figure may not appear in the typeset version that the ASCII did not have.
      The first of those was written because the pilot conversion shipped using two quantities it
      never defined.

      NOT every component carries one, and that is a decision rather than a gap. The notation earns
      its place where there is a fraction, a piecewise rule, an exponent or an indexed family; it
      earns nothing on a calculation that is a list of products, where LaTeX would restate the same
      line with a prettier multiplication sign. Two components are deliberately left as ASCII on
      those grounds: `charge-off-local-share`, which is two products, and
      `fsfp-formula-transition-supplement`, which is one maximum over a sum. Converting them would
      add a second statement to keep in step and buy a reader nothing.
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. A large share of the corpus's edges
# use a relationship no class declares, and almost all of those are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject those edges or bloat every ontology with
# declarations that each describe one link.
#
# The counts are measured — see "relationship vocabulary" in `.yidam/corpus/README.md`. They are
# not repeated here, because they were: this comment carried three hand-written figures, fifteen
# ontologies carried the same copy, and every figure was stale before anybody re-measured.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: replaces
    target: formula-component
    direction: out
    description: The component in a prior regime that occupied the same role in the calculation
  - relationship: governed-by
    target: parameter
    direction: out
    description: A dialable value the component consumes
  - relationship: distributes
    target: revenue-stream
    direction: out
    description: The channel of money this component allocates
  - relationship: part-of
    target: funding-regime
    direction: in
    description: The regime this component belongs to
