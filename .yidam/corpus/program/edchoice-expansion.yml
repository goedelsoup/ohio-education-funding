class: program
label: EdChoice Expansion Scholarship
summary: >-
  The income-based statewide voucher, made universally available by H.B. 33 in 2023 with the
  award scaled by family income rather than eligibility gated by it. The largest change to
  Ohio's scholarship channel in its history.
description: |
  The income-based statewide voucher program, made universally available by H.B. 33 in 2023 —
  every Ohio student became eligible for a scholarship, with the award amount scaled by family
  income rather than eligibility gated by it. [verified] This is the largest change to the
  scholarship channel in Ohio's history and the reason the channel is now large enough to
  affect statewide funding arithmetic. [inference]

  The mechanism question is the one that determines whether districts lose money. Under the
  original EdChoice design, a scholarship was funded by deducting from the resident district's
  foundation payment — the district lost the student and the money, and if the student had
  never attended the district, the district lost money for a student it had never educated.
  That last case is the core of the districts' complaint. [verified] Under the Fair School
  Funding Plan it is **not** a deduction — established negatively and exhaustively against the
  FY2027 calculator, and pinned by a test. See `mechanism` below, which is where the
  confirmation and its remaining open edge live. [verified]

  The program was held unconstitutional by a Franklin County trial court in [June
  2025](../litigation/vouchers-hurt-ohio-2025.yml), on Ohio constitutional grounds distinct
  from the federal question *Zelman* settled. That ruling is under appeal. [verified]

  **There are no income bands.** The award is a continuous function of family income, and both
  sections that compute it have been in the committed statute extract since it was wired — see the
  findings. Participation counts by resident district and total appropriation by fiscal period are
  still not held. [open]
findings: |
  **Two advocacy scorecards rank Ohio on this program, and neither measures what this corpus
  measures.** ALEC's [Index of State Education
  Freedom](../../catalog/alec-state-education-freedom-index.md) puts Ohio 10th of 50 at 63.79
  points, grade B+, on programs in law as of June 1, 2024; the Heritage Foundation's [Education
  Freedom Report Card](../../catalog/heritage-education-freedom-report-card.md) put Ohio 12th
  of 51 on education choice and 29th overall in its 2023 edition. [verified] Both are published
  by organizations that advocate for the channel they score, and neither rank is evidence about
  adequacy — ALEC's index has no spending category at all, and Heritage's return-on-investment
  category, where Ohio ranks 47th, treats lower per-pupil spending as better in terms. What the
  two establish jointly is that this channel is large and lightly conditioned by the standards
  of its own advocates. That is a fact about the channel, not about whether Ohio's districts
  are adequately funded, and the ranks are two editions two years apart across the universal
  expansion — so they are not a series and differencing them would invent one. [inference]

  ### The voucher ceiling is pegged to the public formula's own base cost

  R.C. 3317.022 does not fix $5,500 and $7,500. It directs both to "increase in future fiscal years
  by the same percentage that the statewide average base cost per pupil increases in future fiscal
  years". [verified]
  ([`crates/project`](../../../crates/project/tests/the_award_the_statute_computes.rs)) Three
  amounts in the section carry that clause — these two and the [Jon Peterson
  base](jon-peterson-special-needs.yml) — and the two $34,000 special-needs ceilings carry none.

  So raising base cost raises every EdChoice and pilot-project ceiling with it, automatically and
  without a vote on the scholarship channel. The lever is a narrow one: it is the *statewide
  average base cost per pupil* of R.C. 3317.018(A), so an
  [input-year refresh](../scenario/fsfp-input-year-refresh.yml) that lifts that average carries the
  voucher ceiling up with it, while the
  [phase-in](../parameter/fsfp-phase-in-percentage.yml) does not — the phase-in interpolates a
  district's *funding* toward the computed amount and leaves base cost per pupil where it is.
  [inference] The two channels are not independent parameters of one budget; one is indexed to a
  term inside the other.

  That is a different relationship from the one the [deduction](../../skills/deduction.md) question
  asks about. A deduction would make the scholarship a transfer *out of* a district's payment;
  this makes the scholarship's ceiling a *function of* what districts are computed to need. The
  corpus established the first is absent under the plan; the second is present and was not
  recorded anywhere.

  ### And the published average is not evidence about the ceiling

  Every award is the **lesser** of the ceiling and the school's base tuition net of discounts, so
  the 2025 report's $4,958.41 average for this programme is bounded above by a mix of two indexed
  ceilings and by tuition, and cannot be read as saying which of the three binds. [inference] A
  reader wanting to know how much of the ceiling is used needs tuition by school, which the corpus
  does not hold.
