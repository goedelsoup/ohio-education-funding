properties:
  name: EdChoice Expansion Scholarship
  mechanism: |
    Deduction from resident district under the original design; **not a deduction under the Fair
    School Funding Plan.** [verified] Confirmed negatively and exhaustively against the FY2027
    calculator: the payment report's transfer channel is two named lines, `S - Educational
    Service Center` and `T - Other Adjustments`, and neither the thirty-column summary nor the
    fifty-eight-column detail carries a line named for a scholarship or a community school. The
    one unlabelled line is too small to be one — its negative half is $95.6m across 577
    districts, 1.12% of total state support, against scholarship spending on the order of a
    billion a year. See `crates/project/tests/the_voucher_channel_is_absent.rs`.

    What this establishes is that a resident district's foundation payment is not reduced for a
    scholarship student. **What happens instead is now established too, and from the same section
    that computes the formula rather than from the appropriation side.** R.C. 3317.022 directs the
    department to compute and distribute state core foundation funding to six *funding units* —
    districts, the community and STEM school unit, and four scholarship units, of which one is the
    **educational choice scholarship unit**. Division (E) distributes the scholarship to the parent
    "from the funds paid to the educational choice scholarship unit under this section", in monthly
    partial payments. [verified] (R.C. 3317.022)

    So the earlier `[open]` here — "direct appropriation is the natural reading and is not
    established" — is closed, and closed differently from how it was framed. The mechanism is not
    a separate appropriation at all; it is a parallel funding unit inside the foundation
    computation. [verified]
  eligibility: |
    Originally income-limited. Am. Sub. H.B. 33 (2023) made all Ohio students eligible, with
    award amount scaled by family income relative to the federal poverty level rather than
    eligibility restricted by it. [verified] There are no bands to establish — the scaling is
    continuous. See `amount`.
  amount: |
    **A ceiling of $5,500 for grades kindergarten through eight and $7,500 for grades nine
    through twelve, scaled down by family income above 450% of the federal poverty guidelines.**
    [verified] (R.C. 3317.022(A)(10)(a)(ii) and R.C. 3310.08, read by
    [`crates/project`](../../../crates/project/tests/the_award_the_statute_computes.rs))

    The scaling is a curve, not a schedule. R.C. 3310.08 defines a "constant multiplier" of 0.50
    and a "power equation" of the family's income-to-poverty multiple times its natural logarithm;
    read back, the award is the base times **0.5 raised to (income/poverty − 4.5)**. It **halves
    for every further hundred percentage points** of family income relative to poverty, and stops
    at a "minimum amount" of a tenth of the base. [verified]

        family income        K-8 award    9-12 award
        up to 450% FPL       $5,500       $7,500
        550%                 $2,750       $3,750
        650%                 $1,375       $1,875
        750%                   $687.50      $937.50
        782.19% and above      $550         $750

    The last row is derived rather than stated: the statute gives the floor as an amount and never
    says at what income it binds. Solving the decay against the ten per cent floor puts it at
    **7.82 times the federal poverty guidelines**, past which a family's income is no longer an
    input to the award at all. [inference]

    Two things bound what this can be used for. The award is the **lesser** of this and the
    school's base tuition net of discounts, so it is a ceiling and not a payment; and the two base
    amounts "shall increase in future fiscal years by the same percentage that the statewide
    average base cost per pupil increases", so they are the enacted values and a later year's
    payments must be compared against an indexed figure. [verified] The dollar value of 450% of
    poverty is not here: it depends on family size, and the statute reaches it by pointing at
    R.C. 5101.46.
  appropriation_line: |
    **No line of its own — it is paid from the foundation aid appropriation.** Five line items
    "are used to collectively support state foundation aid payments for all public school students
    in the state **and scholarship payments for students enrolled in state scholarship
    programs**": GRF ALI 200550 Foundation Funding, GRF ALI 200502 Pupil Transportation, Fund 5VS0
    ALI 200604, Fund 5YO0 ALI 200491, and Lottery Fund 7017 ALI 200612. [verified] (LSC redbook and greenbook, `crates/project/fixtures/dew-redbook.txt` and
    `dew-greenbook.txt`. Checked against the act as enacted, not only as introduced: the five
    lines and the sentence naming them are identical in both. The *amounts* in that table are
    not — foundation aid was enacted $82m above the proposal — so nothing here quotes one.)

    That is a finding rather than a citation. The scholarship channel does not appear as a
    separate appropriation, so the budget document a reader would consult to size it shows it
    merged with the formula it diverts from — which is part of why this channel is as hard to see
    as the corpus keeps recording it to be.
