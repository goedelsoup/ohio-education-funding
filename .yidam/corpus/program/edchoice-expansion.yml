class: program
label: EdChoice Expansion Scholarship
summary: >-
  The income-based statewide voucher, made universally available by H.B. 33 in 2023 with the
  award scaled by family income rather than eligibility gated by it. The largest change to
  Ohio's scholarship channel in its history.
description: |
  The income-based statewide voucher program, made universally available by H.B. 33 in 2023 —
  every Ohio student became eligible for a scholarship, with the award amount scaled by family
  income rather than eligibility gated by it. [verified] This is the largest change to the
  scholarship channel in Ohio's history and the reason the channel is now large enough to
  affect statewide funding arithmetic. [inference]

  The mechanism question is the one that determines whether districts lose money. Under the
  original EdChoice design, a scholarship was funded by deducting from the resident district's
  foundation payment — the district lost the student and the money, and if the student had
  never attended the district, the district lost money for a student it had never educated.
  That last case is the core of the districts' complaint. [verified] Under the Fair School
  Funding Plan it is **not** a deduction — established negatively and exhaustively against the
  FY2027 calculator, and pinned by a test. See `mechanism` below, which is where the
  confirmation and its remaining open edge live. [verified]

  The program was held unconstitutional by a Franklin County trial court in [June
  2025](../litigation/vouchers-hurt-ohio-2025.yml), on Ohio constitutional grounds distinct
  from the federal question *Zelman* settled. That ruling is under appeal. [verified]

  Award amounts by income band, participation counts by resident district, and total
  appropriation by fiscal period are not held here. [open]
findings: |
  **Two advocacy scorecards rank Ohio on this program, and neither measures what this corpus
  measures.** ALEC's [Index of State Education
  Freedom](../../catalog/alec-state-education-freedom-index.md) puts Ohio 10th of 50 at 63.79
  points, grade B+, on programs in law as of June 1, 2024; the Heritage Foundation's [Education
  Freedom Report Card](../../catalog/heritage-education-freedom-report-card.md) put Ohio 12th
  of 51 on education choice and 29th overall in its 2023 edition. [verified] Both are published
  by organizations that advocate for the channel they score, and neither rank is evidence about
  adequacy — ALEC's index has no spending category at all, and Heritage's return-on-investment
  category, where Ohio ranks 47th, treats lower per-pupil spending as better in terms. What the
  two establish jointly is that this channel is large and lightly conditioned by the standards
  of its own advocates. That is a fact about the channel, not about whether Ohio's districts
  are adequately funded, and the ranks are two editions two years apart across the universal
  expansion — so they are not a series and differencing them would invent one. [inference]
properties:
  name: EdChoice Expansion Scholarship
  mechanism: |
    Deduction from resident district under the original design; **not a deduction under the Fair
    School Funding Plan.** [verified] Confirmed negatively and exhaustively against the FY2027
    calculator: the payment report's transfer channel is two named lines, `S - Educational
    Service Center` and `T - Other Adjustments`, and neither the thirty-column summary nor the
    fifty-eight-column detail carries a line named for a scholarship or a community school. The
    one unlabelled line is too small to be one — its negative half is $95.6m across 577
    districts, 1.12% of total state support, against scholarship spending on the order of a
    billion a year. See `crates/project/tests/the_voucher_channel_is_absent.rs`.

    What this establishes is that a resident district's foundation payment is not reduced for a
    scholarship student. **What happens instead is now established too, and from the same section
    that computes the formula rather than from the appropriation side.** R.C. 3317.022 directs the
    department to compute and distribute state core foundation funding to six *funding units* —
    districts, the community and STEM school unit, and four scholarship units, of which one is the
    **educational choice scholarship unit**. Division (E) distributes the scholarship to the parent
    "from the funds paid to the educational choice scholarship unit under this section", in monthly
    partial payments. [verified] (R.C. 3317.022)

    So the earlier `[open]` here — "direct appropriation is the natural reading and is not
    established" — is closed, and closed differently from how it was framed. The mechanism is not
    a separate appropriation at all; it is a parallel funding unit inside the foundation
    computation. [verified]
  eligibility: |
    Originally income-limited. Am. Sub. H.B. 33 (2023) made all Ohio students eligible, with
    award amount scaled by family income relative to the federal poverty level rather than
    eligibility restricted by it. [verified] Exact bands not yet established. [open]
  amount: Not yet populated. [open] Varies by grade band and family income.
  appropriation_line: |
    **No line of its own — it is paid from the foundation aid appropriation.** Five line items
    "are used to collectively support state foundation aid payments for all public school students
    in the state **and scholarship payments for students enrolled in state scholarship
    programs**": GRF ALI 200550 Foundation Funding, GRF ALI 200502 Pupil Transportation, Fund 5VS0
    ALI 200604, Fund 5YO0 ALI 200491, and Lottery Fund 7017 ALI 200612. [verified] (LSC redbook and greenbook, `crates/project/fixtures/dew-redbook.txt` and
    `dew-greenbook.txt`. Checked against the act as enacted, not only as introduced: the five
    lines and the sentence naming them are identical in both. The *amounts* in that table are
    not — foundation aid was enacted $82m above the proposal — so nothing here quotes one.)

    That is a finding rather than a citation. The scholarship channel does not appear as a
    separate appropriation, so the budget document a reader would consult to size it shows it
    merged with the formula it diverts from — which is part of why this channel is as hard to see
    as the corpus keeps recording it to be.
