class: program
label: Cleveland Scholarship and Tutoring Program
description: |
  Ohio's first voucher program, created in the mid-1990s for students in the Cleveland City
  School District — a single-district program rather than a statewide one, established in the
  context of the district's academic distress and state takeover. [verified]

  Its significance is national. In *Zelman v. Simmons-Harris* (2002) the United States Supreme
  Court upheld the program against a federal Establishment Clause challenge, holding that a
  program of true private choice does not establish religion merely because most participating
  families choose religious schools. [verified] That decision cleared the constitutional path
  for voucher expansion across the country.

  It did not clear the Ohio constitutional path. *Zelman* answered a federal question; whether
  Article VI, Section 2's bar on sectarian control of school funds permits the arrangement is a
  separate question raised in the [2025 EdChoice
  challenge](../litigation/vouchers-hurt-ohio-2025.yml). [inference]

  Per-student amounts, participation counts, and the mechanism by which the program is charged
  against Cleveland's funding are not yet recorded. [open]
properties:
  seeded_because: |
    The origin point of the scholarship channel, and the reference against which the statewide
    programs' scale should be read: it was designed as a targeted intervention in one distressed
    district, and what grew from it was universal eligibility statewide. [inference]
  name: Cleveland Scholarship and Tutoring Program
  mechanism: deduction
  eligibility: |
    Students residing in the Cleveland City School District, subject to income-based priority
    in awarding. Established mid-1990s; exact enacting act and year not yet established. [open]
  amount: Not yet populated. [open]
  appropriation_line: |
    **No line of its own — it is paid from the foundation aid appropriation.** Five line items
    "are used to collectively support state foundation aid payments for all public school students
    in the state **and scholarship payments for students enrolled in state scholarship
    programs**": GRF ALI 200550 Foundation Funding, GRF ALI 200502 Pupil Transportation, Fund 5VS0
    ALI 200604, Fund 5YO0 ALI 200491, and Lottery Fund 7017 ALI 200612. [verified — LSC redbook,
    `crates/project/fixtures/dew-redbook.txt`]

    That is a finding rather than a citation. The scholarship channel does not appear as a
    separate appropriation, so the budget document a reader would consult to size it shows it
    merged with the formula it diverts from — which is part of why this channel is as hard to see
    as the corpus keeps recording it to be.
