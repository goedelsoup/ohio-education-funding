    note: >-
      The other Category 3 line paid to the same schools by a different mechanism. The pair is the
      corpus's clearest instance of the difference between dividing an appropriation and repaying a
      cost, which is why neither node is written without the other.
  - target: ../legislation/hb-96-2025.yml
    relationship: revised-by
    note: >-
      H.B. 96 added diagnostic and therapeutic mental health services and retired Ohio peace
      officers to the permitted uses in R.C. 3317.06, and appropriated to the same line. An
      amendment to the uses, not a new program — which is why it is an edge here rather than a
      node of its own.
