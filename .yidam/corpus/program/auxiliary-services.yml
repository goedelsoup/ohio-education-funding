class: program
label: Auxiliary Services
summary: >-
  The largest channel of state money to Ohio's chartered nonpublic schools that is not a
  scholarship: $166.8 million in FY2025, divided among nonpublic pupils and spent on a statutory
  list of secular services. Older than every voucher in this corpus.
description: |
  GRF line item 200511, and the oldest of the three lines the department groups as Category 3:
  Nonpublic School Support. The money is divided among the chartered nonpublic schools by a
  per-pupil quotient and spent on a list of secular services — textbooks, health and guidance
  services, speech and hearing services, remedial programmes, computer equipment, school safety
  and security — that R.C. 3317.06 sets out in seventeen severable divisions. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  **The section the line is named for does not allocate it.** R.C. 3317.06 opens "Moneys paid to
  school districts under division (E)(1) of section 3317.024 of the Revised Code shall be used for
  the following independent and fully severable purposes", and none of its divisions says how much
  is paid. The allocating sentence is R.C. 3317.024(E)(2)(d), which divides "the total amount
  appropriated for the implementation of sections 3317.06 and 3317.062" by the average daily
  membership in chartered nonpublic schools "as determined as of the last day of October of each
  school year". So this is a quotient of an appropriation and not a price, and its rate falls when
  nonpublic enrolment rises. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  **The money reaches a school by one of two routes, and the school chooses.** Under
  R.C. 3317.024(E)(1) the state pays the resident district, which buys the services and is
  reimbursed for the cost of administering them; under (E)(2) a school that gives notice by 1
  April of an odd-numbered year is paid directly, and R.C. 3317.062 is the same list of permitted
  uses written for that route. A directly-paid school may designate an organisation to receive the
  money, and that organisation "may require the school's governing authority to pay a fee … that
  does not exceed four per cent of the total amount of payments for auxiliary services that the
  school receives from the state". [verified] How the schools divide between the two routes is not
  held here — neither the redbook nor the greenbook reports it. [open]

  This is the programme the corpus missed for as long as it treated state money in private
  schooling as the scholarship question. It predates every voucher modelled here, it is paid
  outside the six funding units of R.C. 3317.022, and it has its own appropriation line where the
  scholarships have an earmark inside one.
findings: |
  ### What it pays, and what it buys

  **$166,816,769 in FY2025**, rising to **$172,262,613** as appropriated for FY2027 — the largest
  of the three Category 3 lines at **68.74%** of the category. Category 3 as a whole paid
  **$242,688,919** in FY2025 and is appropriated **$250,737,573** for FY2027. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  Set beside the channel this corpus did model: the four scholarship programmes that publish an
  expenditure paid **$991,191,150.12** in 2024-25, so Category 3 is **24.48%** of them. That share
  is an **upper bound** and not an estimate — Jon Peterson publishes no expenditure, so the
  denominator is short by one programme. Even bounded, the reading holds: a quarter of the money
  this corpus called the nonpublic channel was never in it. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  ### The line grew by a twelfth and fell by an eighth

  Across FY2020 to FY2025 the appropriation rose **8.25%** in cash and fell **13.48%** in constant
  FY2025 dollars. Category 3 together rose **12.12%** and fell **10.39%**. The nominal series is
  the one a budget document states and it rises in nearly every biennium; the real series is what
  a school buying the same speech therapist experienced. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  ### The per-pupil figure closes on the October the statute names

  R.C. 3317.024(E)(2)(d) divides, and the corpus now holds what it divides by. The department has
  published an October count of chartered nonpublic enrolment every year since 1977 — **49** of
  them, at the building and at the sector, on an attachment page no connector owned. FY2025's
  quotient takes the appropriation net of the College Credit Plus earmark, **$2,739,015**, over the
  **179,693** pupils living in Ohio that the department counted in October 2024. It comes to
  **$913.10**, against the **$913** LSC publishes in both the redbook and the greenbook — a
  published figure and not a forecast, since the two editions agree. [verified]
  ([`crates/project`](../../../crates/project/tests/the_october_the_statute_divides_by.rs))

  Three readings had to be right together for it to close, and each is refutable on its own. The
  numerator is net of an earmark that implements neither section the quotient names. The October
  is the school year's, so FY2025 divides by October 2024 rather than by October 2025. And the
  count is of pupils living in Ohio: over all **181,171** the same file totals, the quotient comes
  out eight dollars lower and matches nothing anyone publishes. [verified]
  ([`crates/project`](../../../crates/project/tests/the_october_the_statute_divides_by.rs))

  ### What the bound was, and why it missed

  Before this series the corpus divided by the department's landscape sheet — **173,156** pupils
  for 2023-24 — and published **$963.39** as an upper bound on the rate. The direction was right
  and the reason recorded for it was wrong. The note said the count was short of the redbook's 747
  chartered nonpublic schools and the greenbook's 725. This series counts **711** schools in
  October 2023, **722** a year later and **749** in October 2025 — so both LSC figures fall inside
  the range the department's own later Octobers cover, and are newer vintages of the same sector
  rather than a disagreement with it. The landscape count was short by a year, and by nothing
  else. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  The landscape sheet is the cross-publisher check now rather than the denominator, and it passes:
  its enrolment and its school count are exactly what the department's own October 2023 data file
  states, from a different office in a different format. Inverting the published rate on the
  appropriation net of the earmark wants **179,713** pupils against the 179,693 counted — a gap of
  twenty in a hundred and eighty thousand, which is what rounding a rate to the dollar costs.
  [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  What the October series still cannot say is which district a building sits in, and under
  R.C. 3317.024(E)(1) that is the district the money moves through. No file on the department's
  page carries a district column in any of the six layouts it has used. [open]

  ### The third line is this line's own money coming back

  ALI 200659, "Auxiliary Services Reimbursement", is carried as a separate line in fund 5980 and is
  not a separate programme. R.C. 3317.064(A) creates its fund out of "excess moneys in the
  auxiliary services personnel unemployment compensation fund", and R.C. 4141.47(A) says that fund
  "shall consist of moneys paid into the fund pursuant to section 3317.06 of the Revised Code" —
  so the line is a two-step reflux of unspent 200511 money. Both LSC editions add the fact that
  settles it: **no transfers have occurred since FY 2013**, so twelve years of spending on it have
  drawn down a balance rather than recycled a flow. It paid **$534,753** in FY2025 and is
  appropriated a round **$650,000** for FY2027. [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))

  ### What H.B. 96 did to it

  [H.B. 96](../legislation/hb-96-2025.yml) amended the uses and created no line. It permits
  auxiliary services funds to be spent on diagnostic and therapeutic mental health services for
  chartered nonpublic pupils, and adds retired Ohio peace officers to those a school may hire as
  security officers with them. The vendored section carries the act as its own source and shows
  both changes in divisions (D), (E) and (P). [verified]
  ([`crates/project`](../../../crates/project/tests/the_lines_that_pay_the_nonpublic_schools.rs))
properties:
  name: Auxiliary Services
  mechanism: direct-appropriation
  eligibility: |
    Chartered nonpublic elementary and high schools, through the district in which they are located
    or — on notice given by 1 April of an odd-numbered year — directly. [verified] There is no
    family-level eligibility test of any kind: unlike every scholarship in this class, the pupil's
    income, disability, and the rating of the district they would otherwise attend are all
    irrelevant. The unit of entitlement is the school's membership. [verified]
  amount: |
    A per-pupil quotient, not a schedule: R.C. 3317.024(E)(2)(d) divides the appropriation for
    R.C. 3317.06 and 3317.062 by the October average daily membership in chartered nonpublic
    schools. LSC publishes $913 for FY2025, and the corpus reproduces it at $913.10: the
    appropriation net of the College Credit Plus earmark, over the 179,693 pupils the department
    counted in Ohio in October 2024. [verified]
  appropriation_line: |
    GRF 200511, with 5980 200659 beside it for the reflux described in `findings`. Both are read
    from `crates/project/fixtures/catalog-line-items.csv` across every LSC catalog edition from
    2006, at the newest vintage that answers for each year. [verified]
unfilled:
  - field: the district each chartered nonpublic school is located in
    why: |
      R.C. 3317.024(E)(1) pays the school district a nonpublic school is located in, so the
      resident-side incidence of this line is a district question and nothing here can answer it.
      No file on the department's Enrollment Data page carries a district column in any of the six
      layouts it has used, and the Chartered Nonpublic School Information page publishes no
      directory to join against. A join on school name was rejected rather than attempted: October
      2023's 711 schools carry 601 distinct names, sixteen of them `St Mary`, and Ohio's 607 public
      districts carry 580 between them.
  - field: how the schools split between the district route and the direct route
    why: |
      R.C. 3317.024(E)(2) makes it a per-school election and neither the redbook nor the greenbook
      reports the result, so the share of the line passing through districts is not held. It
      matters because only the district route generates the administrative reimbursement
      R.C. 3317.06 pays to districts and educational service centres.
