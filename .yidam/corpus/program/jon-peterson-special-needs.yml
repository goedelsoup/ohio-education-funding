class: program
label: Jon Peterson Special Needs Scholarship
summary: >-
  A scholarship for children with disabilities, letting a parent buy special education services
  from an alternative public or a registered private provider instead of taking them from the
  resident district. The only capped scholarship program here.
description: |
  A scholarship for children with disabilities, letting a parent buy special education services
  from an alternative public provider or a registered private provider instead of taking them
  from the resident district. Established by the General Assembly for the 2012-2013 school year
  and named for a former state representative who worked on special education. [verified]
  (R.C. 3310.52; 2025 Scholarship Annual Report)

  **It is capped, and it is the only scholarship program here that is.** Participation may not
  exceed five per cent of the students statewide identified as children with disabilities in the
  previous fiscal year. [verified] (R.C. 3310.52(B)) Nothing comparable bounds EdChoice, the
  expansion, Cleveland or Autism, which makes this the one program whose size is a policy
  decision rather than a demand outcome.

  **It reaches almost every district in the state.** Students enrolled in 2024-2025 came from
  494 school districts — over 80% of Ohio's. [verified] (2025 Scholarship Annual Report) That is
  the widest footprint of any program in this channel, and it is why a per-district figure
  matters more here than anywhere else: a program touching four fifths of districts at 8,680
  students is thin almost everywhere, and a district-level effect is invisible in the statewide
  total.

  **And the per-district breakdown is exactly what this project has not found.** The annual
  report says a breakdown of students per district "is available here" and links to a route on
  the department's reports portal — which answers every path with the same application shell, and
  serves its reports as Power BI embeds behind an entitlement anonymous users do not hold. See
  [`deduction`](../../skills/deduction.md), which records the two routes and what would reach
  them. The program's own publisher points at the file, and nothing this project can fetch
  carries it. [verified] [open]
revisions:
  - was: |
      `amount` gave the six supplements and a $34,000 ceiling with no year, and inferred that an
      unindexed cap over indexed terms would bind progressively. `findings` read the department's
      award tables as a uniform fraction of the statute, recomputed by index, and the FY23 and FY24
      editions' shared table as an index that stood still.
    now: |
      The supplements and the $34,000 are H.B. 96's, for FY2026 and FY2027; FY2025's ceiling was
      $32,445. Every schedule since FY2016 was enacted outright, and the cap has moved with it each
      time. The FY23 edition's table is H.B. 33's FY2024 schedule, and the fractions are ratios of
      enacted schedules.
    found_by: |
      [#779](https://github.com/goedelsoup/ohio-education-funding/issues/779), checking the
      vendored R.C. 3317.022 against LSC's schedules in the H.B. 110, H.B. 33 and H.B. 96 analyses.
    reach: |
      The open question on the FY2023 edition narrows from two columns to one sentence. The
      $39,122 and $5,122 stand: they are H.B. 96's arithmetic and are now labeled as such.
      `dew-jpsn-annual-report` carried the same reading and is corrected alongside.
  - was: |
      The description said the per-district breakdown "has been withdrawn": the annual report
      links a route that returns 404, so the file was published and then taken down.
    now: |
      The 404 carries no information. Every path on `reports.education.ohio.gov` returns the
      byte-identical application shell, `/robots.txt` included, and the report behind the route
      is a Power BI embed behind an entitlement the portal's anonymous token does not carry. The
      breakdown is cited by a current departmental document and this project has not found it.
    found_by: |
      Probed 2026-09-15 and recorded on
      [#10](https://github.com/goedelsoup/ohio-education-funding/issues/10); propagated to this
      node by [#467](https://github.com/goedelsoup/ohio-education-funding/issues/467).
    reach: |
      "Withdrawn" named a remedy — ask the department to restore the file — that rested on
      nothing, and it was listed as the cheapest unblock. What remains is a retrieval question
      with a live route: OH|ID on the portal, which may be scoped to one district's slice.
      Nothing else in this node depended on the reading.
findings: |
  ### Its first year is in the archive, and applications ran a fifth above payments

  The department's archive reaches this program for **FY2013** alone — the year it began — and
  is the only held source that splits it. 2,129 applications; 1,779 scholarships with at least one
  payment made against them. [verified]
  ([`crates/project`](../../../crates/project/tests/the_renewal_that_was_last_years_payments.rs))

  So 350 families applied in the program's first year and were never paid, a sixth of everyone
  who asked. The archive does not say why, and none of its four income-status definitions applies
  to this program. [open] Recorded because the annual report's participation figure is the
  payment count alone, and a reader taking it for demand understates the first year by a fifth.

  ### It has three published years, and the department posted two of them in one afternoon

  This program had an annual report of its own until the 2025 consolidated report absorbed it, and
  two editions were still being served when they were fetched. With the consolidated report's Jon
  Peterson section that is **FY2023, FY2024 and FY2025** — the only participation series any
  scholarship program has between FY2013 and FY2025, and the first year-on-year change in this
  program's participation the department has published anywhere. [verified]
  ([`crates/project`](../../../crates/project/tests/the_three_years_the_jon_peterson_report_gives.rs))

      fiscal year   students   providers   districts   expenditure
      FY2023          8,186        439        487      $81,773,133.70
      FY2024          8,551        500        495      $95,362,957.53
      FY2025          8,680        530        494     $103,944,388.15

  Participation rose **4.46%** and then 1.51%, so the growth is decelerating. Providers grew faster
  than students in both years, so the average provider served fewer children each year. And
  districts of residence rose once and then fell by one while participation kept rising: the reach
  saturated at the four fifths of Ohio's districts the reports claim in prose, and the growth after
  FY2024 is more children from districts already reached. [verified] That last line is what the
  description's "widest footprint of any program in this channel" now rests on — a footprint that
  has stopped widening.

  **The expenditure column is the department's own arithmetic, quoted once.** Only the FY2023
  edition writes a total in words, and it equals the sum of the six disability-category figures
  printed beneath it to the cent. That is what licenses summing the same chart in the two editions
  that state nothing — including the $103,944,388.15 the consolidated report implies and never
  writes. [verified]

  **The publication history is a lapse and a catch-up, not a rolling replacement.** Three older
  editions were served from the department's Annual Reports page as late as June 2023 and were gone
  by June 2024; the FY23 and FY24 editions were both exported from Word on one afternoon in March
  2025, nine months after FY2024 closed, and the page carried no JPSN report at all in between.
  [verified] ([`dew-jpsn-annual-report`](../../catalog/dew-jpsn-annual-report.md)) The three older
  editions — FY2016, FY2017 and FY2020 — exist only in the archive and are not extracted. [open]

  ### The FY2023 edition's award table is FY2024's, and one sentence in it stays open

  **The one expenditure total stated in words is dated to another year.** It says "Total
  expenditures for the JPSN program during the 2021-2022 school year sum to $81,773,133.70" in a
  report headed FY 2023 throughout, grafted onto the end of a paragraph whose first sentence is
  "Prior to the 2021-2022 school year…" — which is where a copy error would come from. The FY24
  edition deletes the sentence and keeps the paragraph and the chart, a deletion rather than a
  correction. [verified] [open]

  **The award table the FY23 edition prints is H.B. 33's FY2024 schedule.** The FY23 and FY24
  editions print the same six maxima to the dollar, $8,941 to $30,000. Two LSC analyses, H.B.
  110's and H.B. 33's, state the FY2023 schedule, and it runs $7,976 to $27,000. The FY24 edition
  and the consolidated report print their own years' enacted schedules exactly. [verified]
  ([`crates/project`](../../../crates/project/tests/the_ceilings_the_budget_acts_wrote.rs))

  This node used to read each table as a uniform fraction of the statutory vector, recomputed by
  index each year, so that two editions printing one table meant an index that stood still. The
  fractions are real, but they are ratios of enacted schedules. FY2025's 0.9542 is $32,445 over
  $34,000, because H.B. 96 raised every position alike. Nothing stood still: H.B. 33 raised
  categories one to five 12.1% between FY2023 and FY2024. [verified]
  ([`crates/project`](../../../crates/project/tests/the_ceilings_the_budget_acts_wrote.rs))

  That removes the tension the two readings turned on. Between the editions, spending per student
  rose 11.6% and the schedule 12.1%; between FY2024 and FY2025, 7.4% and 7.2%. The spend tracks the
  schedule in both years, which is what a FY2023 chart under a FY2023 heading would show.
  [inference] Only the expenditure sentence's "2021-2022" still dates the chart to another year,
  and nothing in the documents settles it. **This corpus carries every column as published.**
  [open]

  ### The two publishers agree on this program's money and not on its counts

  FY2024 is the only fiscal year both the department and the Legislative Service Commission describe,
  so it is the only place either can be checked against the other. [verified]

      FY2024        department                      LSC
      expenditure   $95,362,957.53                  about $95.4 million
      students      8,551                           about 7,800
      providers     500                             454

  The dollars round to each other, which is the strongest independent evidence in the lineage that a
  given edition's spending chart belongs to the fiscal year on its cover. The counts do not: the
  department's participation figure sits 9.6% above LSC's, and its provider count is **46 more** than
  a figure LSC gives unhedged — LSC's 454 falling between the department's own FY2023 and FY2024
  counts, so a reader holding both documents could take it for either year. [verified] Nothing says
  the two count the same population: the department counts providers approved to participate and
  LSC's sentence counts providers children received services from. [inference] The disagreement is
  pinned rather than resolved, and it is why `Bound::spliceable` does not treat a count like LSC's
  as joinable to this series.

  ### The applications series that would fill the gap is printed and unreadable

  Every edition, the consolidated report included, opens Program Participation with a bar chart of
  total applications by fiscal year — ten bars in FY23, eleven in FY24, and **twelve in the
  consolidated report, FY2014 through FY2025**, which is the whole of the channel's participation
  gap and both its edges. Applications counted separately from scholarships paid is the second
  denominator the archive maintains and the shape of evidence this channel's unexplained averages
  need. **None of the bars carries a data label**: `pdftotext` reaches the axis gridlines, the years
  and the legend, and nothing else. The values are in committed bytes and would need the charts'
  geometry read rather than their text. [open]
  ([`dew-jpsn-annual-report`](../../catalog/dew-jpsn-annual-report.md))

properties:
  seeded_because: |
    Named in the [`deduction`](../../skills/deduction.md) calculator as one of the four programs
    it must compute over, and missing from the corpus for as long as that stub has existed.
    [inference]
  name: Jon Peterson Special Needs Scholarship Program
  mechanism: funding-unit
  mechanism_note: |
    **Direct payment as its own funding unit. Not a deduction.** [verified]

    R.C. 3317.022 directs the department to compute and distribute state core foundation funding
    to each eligible *funding unit*, and names six: city, local and exempted village school
    districts; the community and STEM school unit; the educational choice scholarship unit; the
    pilot project scholarship unit; the autism scholarship unit; and **the Jon Peterson special
    needs scholarship unit**. The scholarship is paid to the unit, and R.C. 3310.52(C) has the
    department pay the eligible applicant — or the provider, if the applicant so authorizes.
    [verified] (R.C. 3317.022, R.C. 3310.52)

    This is the positive form of a finding the corpus previously held only negatively. The
    absence of a deduction line in the FY2027 calculator established that a resident district's
    payment is *not* reduced; the funding-unit structure establishes what happens instead. The
    word "deduct" does not appear anywhere in R.C. 3310.41, 3310.51, 3310.52, 3310.01, 3310.03,
    3310.032, 3310.08 or 3313.975 as those sections now stand. [verified]

    **Before FY2022 it was a deduction, and it ran the way the autism program's did.** LSC
    writes that funding "is provided in the same way as that of the Autism program, through a
    transfer of state aid from the resident district to the alternate provider", with the
    scholarship student counted in the resident district's ADM for the state funding formula.
    [verified] ([`crates/project`](../../../crates/project/tests/the_deduction_the_scholarships_were_paid_by.rs))

    The mechanism was shared with that program; the ceiling was not. Autism's was a flat dollar
    cap. This program's was the lesser of the tuition the alternate provider charged and what
    the formula would have paid for the student — the formula amount plus the special education
    amounts used to calculate funding for students in traditional districts — subject to the cap.
    [verified] (the greenbook for H.B. 59 of the 130th, the program's second year)

    What is still open is the per-district arithmetic the deduction produced, not the rule that
    produced it. `dew-payment-reports` is the source for that. [open]
  eligibility: |
    A child identified as having a specific disability, with an Evaluation Team Report and an
    individualized education program specifying the services required. [verified] (2025
    Scholarship Annual Report) The provider must be an alternative
    public provider or a registered private provider as R.C. 3310.51 defines those terms.
    [verified]

    Subject to the five per cent statewide cap in R.C. 3310.52(B). Whether the cap has ever bound
    — whether applications have been refused for reaching it — is not established. [open]

    **H.B. 96 widened the doors from FY2026.** The 2025 report describes kindergarten through
    grade 12. Under prior law three- and four-year-olds and nineteen- to twenty-one-year-olds were
    ineligible, and the act aligned both special-needs scholarships at ages three through
    twenty-one, ending at twenty-two. It admitted a child enrolled in a chartered or nonchartered
    nonpublic school, or home educated. It let a child contract with several providers at once,
    and it let services be delivered virtually. [verified] (R.C. 3310.51 and 3310.52 as held; the
    H.B. 96 greenbook)

    It also requires the department to keep a public list of registered private providers and
    their locations. [verified] (the H.B. 96 greenbook; of the sections vendored, only the Autism
    section, R.C. 3310.41(O), writes the duty out) The directory both
    editions of this program's report link is recorded at
    [`dew-scholarship-provider-directory`](../../catalog/dew-scholarship-provider-directory.md):
    a Power BI report this project cannot read anonymously. Whether it is keyed on IRN is not
    established. [open]
  amount: |
    **FY2025: 8,680 students, $103,944,388.15, across 530 approved providers.** [verified] (2025
    Scholarship Annual Report; the dollar figure is the sum of the report's six disability-category
    totals, which the report displays without totaling)

    LSC's H.B. 96 analysis estimated FY2025 at 8,311 students and $101.1 million, and projects
    8,727 and $112.4 million for FY2026 and 9,163 and $119.2 million for FY2027. [verified] (the
    H.B. 96 greenbook, Table 3)

    The statutory bound is the **least of three** things: the fees charged by the student's
    provider; $7,190 plus a supplement determined by disability category; and a ceiling. The
    section as held is the text H.B. 96 left, effective 30 September 2025, so its figures are
    FY2026's and FY2027's. [verified] (R.C. 3317.022(A)(13), read by
    [`crates/project`](../../../crates/project/tests/the_award_the_statute_computes.rs)) The six
    supplements, beside the effective maxima LSC gives for that biennium and the year before —

        category   supplement   base + supplement   FY2026-27 maximum   FY2025 maximum
        one          $2,855        $10,045             $10,045              $9,585
        two          $5,879        $13,069             $13,069             $12,470
        three       $12,879        $20,069             $20,069             $19,150
        four        $16,890        $24,080             $24,080             $22,977
        five        $22,560        $29,750             $29,750             $28,387
        six         $31,932        $39,122             $34,000             $32,445

    **The formula exceeds its own ceiling.** A category six student computes to $39,122 and is
    paid at most $34,000 — a $5,122 haircut on the most severely disabled category in the
    program. [verified] Category five sits $4,250 below the ceiling.

    The three terms are written to move differently. The base carries a clause indexing it to the
    statewide average base cost per pupil; the supplements carry one indexing them to the special
    education category amounts under R.C. 3317.022(A)(3); the ceiling carries none, the same
    silence `program/autism-scholarship` records for its own. [verified] This node once drew from
    that an inference that the cap would bind progressively, reaching category five next. **The
    budget acts have not let it.** Each has rewritten the schedule outright. [verified]
    ([`crates/project`](../../../crates/project/tests/the_ceilings_the_budget_acts_wrote.rs))

        fiscal years       ceiling   set by
        FY2016-FY2023      $27,000   H.B. 64, from $20,000
        FY2024             $30,000   H.B. 33
        FY2025             $32,445   H.B. 33
        FY2026-FY2027      $34,000   H.B. 96

    In FY2025 the ceiling was $32,445, level with Autism's, and H.B. 96 moved both to $34,000.
    [verified] ([`crates/project`](../../../crates/project/tests/the_ceilings_the_budget_acts_wrote.rs))
    Its schedule raised every effective maximum by the same 4.80%, the ceiling included. The base
    did not move: LSC says the act "keeps the base per-pupil award amount flat at $7,190", and it
    held the statewide average base cost per pupil at its FY2024 value. So the whole rise fell on
    the supplements, and unevenly — category one's amount rose 19.2% and category five's 6.4%.
    [verified] ([`crates/project`](../../../crates/project/tests/the_ceilings_the_budget_acts_wrote.rs))
    A uniform rise in the maximum is steepest in the smallest supplement. [inference]

    The award is therefore category-scaled in the same way the special education weights are, and
    the six category totals in the annual report are the only published decomposition of this
    program's spending. The largest category alone is $74,946,785.41, 72% of the program.
    [verified]
  appropriation_line: |
    **No line of its own — paid from the foundation aid appropriation.** Five line items support
    state foundation aid payments for all public school students *and* scholarship payments for
    students in state scholarship programs: GRF ALI 200550 Foundation Funding, GRF ALI 200502
    Pupil Transportation, Fund 5VS0 ALI 200604, Fund 5YO0 ALI 200491, and Lottery Fund 7017
    ALI 200612. [verified] (LSC redbook and greenbook, `crates/project/fixtures/dew-redbook.txt` and
    `dew-greenbook.txt`. Checked against the act as enacted, not only as introduced: the five
    lines and the sentence naming them are identical in both. The *amounts* in that table are
    not — foundation aid was enacted $82m above the proposal — so nothing here quotes one.)

    **The Catalog of Budget Line Items is extracted**, into
    crates/project/fixtures/catalog-line-items.csv and catalog-line-item-basis.tsv, eighteen
    editions covering FY2002 through FY2027 — so each of the five lines has the per-line history
    with actuals and the Legal Basis this field said were not held. [verified]
    ([`crates/project`](../../../crates/project/tests/the_chapter_that_reached_one_budget_line.rs))

    Reading them says something the list of five does not. **The five lines are anchored in three
    different chapters of the Revised Code and were established across 42 years.** Pupil
    Transportation (GRF 200502) was established by H.B. 191 of the 112th General Assembly, which
    convened in 1977; Fund 5VS0's foundation line by H.B. 166 of the 133rd, in 2019. The lottery
    fund's line, 200612, carries the same name as the general revenue fund's and is authorized
    under R.C. 3770 — the lottery chapter — rather than under R.C. 3317; Fund 5YO0's support line
    cites 3317 beside R.C. 5753, the casino wagering tax. A program with no line of its own is
    paid from five that do not share a statute, a fund or a decade. [verified]
