class: scenario
label: Scenario
foundational_type:
  ontology: ufo
  type: situation
description: |
  A named counterfactual: a set of parameter perturbations, applied against a baseline regime
  over a stated horizon, together with the per-agency results it produces. It is a Situation
  because it is a configuration of the domain held for inspection — a state of affairs that
  obtains under stated assumptions rather than an entity or an event. Scenarios are corpus
  nodes rather than ephemeral tool output so that a projection carries provenance: what was
  assumed, which regime it baselines on, what code produced it, and when.
properties:
  - name: name
    type: string
    description: Short name for the counterfactual
  - name: question
    type: text
    description: The policy question this scenario is constructed to answer
  - name: perturbations
    type: text
    description: Each parameter altered, its baseline value, and its scenario value
  - name: input_projections
    type: text
    description: Which input series were projected rather than observed, and by what method
  - name: horizon
    type: string
    description: Fiscal periods covered by the run
  - name: results_path
    type: string
    description: Path under crates/ to the committed per-agency delta output
  - name: confidence
    type: text
    description: What the result is sensitive to, and where it should not be trusted
  - name: results
    type: text
    description: The figures the run produced, as a table, with the units and the panel they are over
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. Measured across the corpus, 46 of
# the 90 relationships in use are undeclared, and almost all of them are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject a third of the graph's edges or bloat every
# ontology with declarations that each describe one link.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: compares-to
    target: scenario
    direction: out
    description: Another counterfactual this one is set against, isolating one perturbation from another
  - relationship: perturbs
    target: parameter
    direction: out
    description: A parameter whose value this scenario alters
  - relationship: projects
    target: metric
    direction: out
    description: A measure this scenario forecasts under its assumptions
  - relationship: baselines-on
    target: funding-regime
    direction: out
    description: The regime the counterfactual is computed against
  - relationship: horizon-over
    target: fiscal-period
    direction: out
    description: A fiscal period within the run's horizon
  - relationship: simulated-by
    target: draft-legislation
    direction: in
    description: >-
      A draft whose provisions this run prices. Declared here as well as on
      [draft-legislation](draft-legislation.ont.yml) because it changes what a scenario can be
      *for*: a counterfactual authored around a question the levers can express, and a run
      standing in for one clause of a bill somebody else wrote, are the same object serving two
      purposes, and only the second can be partial by construction.
