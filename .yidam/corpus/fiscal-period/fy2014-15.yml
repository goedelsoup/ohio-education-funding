class: fiscal-period
label: FY2014-2015 Biennium
description: |
  A biennium of the [Bridge formula](../funding-regime/bridge-formula.yml) era, created so that
  the decade of per-district finance this corpus now holds has somewhere in the graph to land.
  Before this backfill nothing before FY2022 was addressable and a query about FY2014 had nowhere
  to go.

  **FY2014 is absent from the F-33 archive** under every naming its neighbours answer to, so this biennium is half-measured. Nothing interpolates the missing year.

  **What is measured**, over comparable districts, on federal definitions: [verified —
  `dispersion::ohio_panel`, pinned by test]

      FY2015   local 50.19%   state 42.94%   federal 6.87%   gap $6,599   residual $3,537

  Only FY2015 is measured. FY2014 is not in the archive. [verified]

  These are Census Bureau figures rather than the department's, which is the point of holding
  them: Ohio replaced its funding regime twice inside this decade and renamed most of its own
  categories doing it, so a series from Ohio's own reporting would measure the reporting.
  [inference]

  **This node is thin on purpose.** It carries what the panel measures and the regime in force,
  and not a narrative of the biennium. The appropriating act, the enacted changes and the
  per-district figures the department published are `lsc-budget` work, which now carries the appropriation series from FY2012 and is wired for one
  document. [open]
properties:
  label: FY2014-2015
  kind: biennium
  start: 2013-07-01
  end: 2015-06-30
  appropriating_bill: Am. Sub. H.B. 59 (130th General Assembly). [verified — LSC publishes the biennium's appropriation detail under this bill; see the catalog record `lsc-appropriation-spreadsheet`. The `Am. Sub.` designation is the greenbook's, which is not held here.]
  context: |
    Bridge formula era. Revenue shares and the quartile equalization measure above are from the
    Census F-33 as NCES publishes it, comparable districts only. [verified]
