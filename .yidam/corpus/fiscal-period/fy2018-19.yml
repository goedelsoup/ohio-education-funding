    `crates/project/fixtures/catalog-line-item-basis.tsv`, which names the
    authorising act on every line item it carries]

    **The `Am. Sub.` designation is not confirmed and may not belong here.** The Catalog cites
    this act on 165 line items and prints it bare — `H.B. 49 of the 132nd G.A.` — every time. That
    is not evidence the designation is wrong: LSC uses `Am. Sub.` for the 129th through 131st
    General Assemblies and drops it from the 132nd onward, across H.B. 49, H.B. 166, H.B. 110 and
    H.B. 33 alike, which reads as a change of house style rather than a fact about four bills.
    Recorded as unresolved rather than corrected in either direction. [open]
  context: |
    Bridge formula era. Revenue shares and the quartile equalization measure above are from the
    Census F-33 as NCES publishes it, comparable districts only. [verified]
