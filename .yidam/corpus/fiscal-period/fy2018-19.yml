class: fiscal-period
label: FY2018-2019 Biennium
summary: >-
  A Bridge formula biennium, and the one in which the local funding gap passes $8,000 per pupil
  while the state's share of closing it stays unchanged from FY2012.
description: |
  A biennium of the [Bridge formula](../funding-regime/bridge-formula.yml) era, created so that
  the decade of per-district finance this corpus now holds has somewhere in the graph to land.
  Before this backfill nothing before FY2022 was addressable and a query about FY2018 had nowhere
  to go.

  The local gap passes $8,000 per pupil. The state's share of closing it is unchanged from FY2012.

  **What is measured**, over comparable districts, on federal definitions: [verified —
  `dispersion::ohio_panel`, pinned by test]

      FY2018   local 54.05%   state 39.62%   federal 6.33%   gap $7,558   residual $3,661
      FY2019   local 54.46%   state 38.89%   federal 6.65%   gap $8,444   residual $4,305

  These are Census Bureau figures rather than the department's, which is the point of holding
  them: Ohio replaced its funding regime twice inside this decade and renamed most of its own
  categories doing it, so a series from Ohio's own reporting would measure the reporting.
  [inference]

  **This node is thin on purpose.** It carries what the panel measures and the regime in force,
  and not a narrative of the biennium. The appropriating act, the enacted changes and the
  per-district figures the department published are `lsc-budget` work, which now carries the appropriation series from FY2012 and is wired for one
  document. [open]
  **The appropriating act set the department's own budget at $11.37 billion in FY2018 and $11.48 billion in FY2019.** That is what was appropriated to the Department of Education across every line in its chapter, less the property tax reimbursement items that are numbered as the department's and are carried in the State Revenue Distributions section instead. [verified — the appropriation series, `lsc-appropriation-spreadsheet`] It is a ceiling rather than a payment; what districts received is `dew-foundation`.

