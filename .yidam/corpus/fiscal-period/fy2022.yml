  context: |
    First year of the Fair School Funding Plan. Base cost priced from FY2018 statewide average
    salaries. Phase-in 16.67% for base cost, targeted assistance, special education, English
    learners, gifted, and career-technical; 0% for DPIA. 611 districts; almost $7.5 billion in
    state foundation funding; statewide average base cost $7,349.22 per pupil. Federal COVID
    relief funds in flow. [verified]
