class: fiscal-period
label: FY2022-23 Biennium
summary: >-
  The biennium appropriated by H.B. 110, in which the Fair School Funding Plan began. Phase-in
  ran 16.67% then 33.33%, with base cost priced from FY2018 statewide average salaries in both
  years.
description: |
  July 1, 2021 through June 30, 2023 — the biennium appropriated by
  [Am. Sub. H.B. 110](../legislation/hb-110-2021.yml), and the one in which the Fair School
  Funding Plan began. [verified]

  Phase-in ran 16.67% in FY2022 and 33.33% in FY2023, with base cost priced from FY2018
  statewide average salaries in both years. [verified for FY2022; inference for FY2023] The
  statewide average base cost was $7,349.22 in FY2022 and approximately $7,352 in FY2023 —
  essentially flat, which is what a frozen input year produces. [inference] That flatness is the
  first observable instance of the pattern the corpus tracks through
  [H.B. 33](../legislation/hb-33-2023.yml) and [H.B. 96](../legislation/hb-96-2025.yml).

  H.B. 583 of the same General Assembly made technical corrections to the formula in June 2022,
  incorporated into the FY2022 calculations, and it has [a node](../legislation/hb-583-2022.yml)
  and, since the enrolled act was retrieved, contents: thirteen sections of R.C. 3317 reprinted,
  four of H.B. 110's uncodified sections reopened, and the two statewide transportation cost
  inputs frozen at FY2020 data for both years of this biennium. [verified]
findings: |
  **The appropriating act set the department's own budget at $12.55 billion in FY2022 and $12.73 billion in FY2023.** That is what was appropriated to the Department of Education across every line in its chapter, less the property tax reimbursement items that are numbered as the department's and are carried in the State Revenue Distributions section instead. [verified] (the appropriation series, `lsc-appropriation-spreadsheet`) It is a ceiling rather than a payment; what districts received is `dew-foundation`.
properties:
