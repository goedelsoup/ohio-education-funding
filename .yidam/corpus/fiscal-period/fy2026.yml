class: fiscal-period
label: Fiscal Year 2026
description: |
  July 1, 2025 through June 30, 2026 — the first year of the
  [FY2026-27 biennium](fy2026-27.yml). [verified]

  It is seeded as a fiscal-year node rather than being folded into the biennium because the
  parameters that determine what a district receives are set per year and differ between the
  two years of the biennium. The [phase-in percentage](../parameter/fsfp-phase-in-percentage.yml)
  in particular advances annually inside a biennially-negotiated act, so a district's FY2026
  and FY2027 amounts are different numbers produced by the same enactment. [inference] A corpus
  that recorded only the biennium could not express that.

  FY2026 is also the reference year for the scenario seeded in this corpus and the natural
  baseline for any current-policy comparison, because it is the first period in which enacted
  H.B. 96 provisions are in force. [inference]

  Enrollment, appropriation, and realized per-agency payments will be available from the
  department after the year closes; until then any figure attributed to FY2026 is an estimate
  and must be tagged as one. [open]
properties:
  label: FY2026
  kind: fiscal-year
  start: 2025-07-01
  end: 2026-06-30
  appropriating_bill: Am. Sub. H.B. 96 (136th General Assembly)
  context: |
    First year of the FY2026-27 biennium and the first period under enacted H.B. 96
    provisions. Baseline period for scenario comparison. Actuals not yet available; the year
    is in progress at the time of seeding.
