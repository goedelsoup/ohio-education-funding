class: legislation
label: Sub. H.B. 583 (2022) — corrective and technical changes to the Fair School Funding Plan
summary: >-
  The third of the three acts that make up the Fair School Funding Plan as it actually
  operates, and the one nobody cites. The Legislative Service Commission's own account of the
  current system names it alongside H.B. 110 and H.B. 33.
description: |
  The third of the three acts that make up the Fair School Funding Plan as it actually operates,
  and the one nobody cites.

  LSC's own account of where the current system comes from names exactly three documents: the
  final analysis for [H.B. 110](hb-110-2021.yml), "which enacted the system"; the final analysis
  for **H.B. 583 of the 134th General Assembly, "which made a number of corrective and technical
  changes to it"**; and the final analysis for [H.B. 33](hb-33-2023.yml), "which extended the
  system to the FY2025-FY2026 biennium." [verified —
  [the enacted H.B. 96 analysis](../../../crates/project/fixtures/enacted-school-funding.txt)]

  **A technical corrections act is not a minor one here.** Its corrections are already inside
  every published FY2022 figure, whether or not the act is named beside them. The
  [FY2022 payment report](../fiscal-period/fy2022.yml) is H.B. 110 as corrected by this act, not
  H.B. 110 as passed. Anyone reconciling a FY2022 per-district amount against the text of H.B. 110
  alone is reconciling against a formula that was never run.

  That is the same failure the corpus recorded for [H.B. 94](hb-94-2001.yml), from the other
  direction: there, a citation resolves to a section that has since been repurposed; here, an act
  that everybody cites was amended by one that almost nobody does.

  **What it changed.** The act reprints **13 sections of R.C. 3317** — 3317.011, .0110,
  .014, .016, .017, .019, .02, .0212, .0215, .024, .051, .064 and .25 — and reopens **4**
  uncodified sections of H.B. 110: 265.150 Pupil Transportation, 265.210 Foundation Funding - All
  Students, 265.225 and 265.335. It also amends S.B. 1 of the 134th and H.B. 123 of the 133rd.
  [verified] (the enrolled act)

  Its own appropriation is a single federal line: **$2,415,201 in FY2022 and nothing in FY2023**,
  for the tutoring programme it created, out of American Rescue Plan emergency funds. There is no
  general revenue line in it at all — which is why an act that moved the formula leaves no trace
  in an appropriation series. [verified]
findings: |
  ### The section that assembles foundation funding is the one it did not touch

  **R.C. 3317.022 is absent from the amending title and reprinted nowhere in the act**, while the
  sections around it are reopened wholesale. **10** of the act's own sections cite it, and a
  heading is what none of them is. So the correction reworked the inputs to core foundation funding
  and left the assembly alone — which is a claim about what LSC's word "technical" covers, and it
  covers more than the word suggests. [verified] (`crates/project`'s reader for the enrolled act,
  exercised by `tests/the_act_that_corrected_the_plan.rs`)

  ### The Fair School Funding Plan's first input-year freeze is here, in its first biennium

  Section 13 holds the **statewide average cost per rider and cost per mile** — the two inputs to
  transportation funding under R.C. 3317.0212, and to payment in lieu of transportation under
  3327.02 — at **FY2020 data** for both FY2022 and FY2023. [verified]

  The corpus asks the refresh-versus-freeze question of base cost across biennia, in
  [`fsfp-input-year-refresh`](../scenario/fsfp-input-year-refresh.yml). It starts earlier and
  smaller than that: the plan was enacted in July 2021 and by June 2022 two of its inputs were
  already pinned to a year before it existed. [inference]

  ### And it made prorated scholarships whole, retroactively

  Section 15 provides that a student whose EdChoice expansion award had been cut under division
  (E) of R.C. 3310.032 receives the full amount from the act's effective date. An act characterised
  as technical moved money in the channel the districts are now
  [litigating](../litigation/vouchers-hurt-ohio-2025.yml) over. [verified]

  ### A caveat that belongs on any figure taken from this fixture

  An enrolled act prints amendments as strike-and-insert, and the strike is typographic — it does
  not survive text extraction. Section 265.210 reads *"the section of this act H.B. 110 of the
  134th General Assembly entitled"*, where `this act` is struck and the rest replaces it. Read as
  a run of words it is not what was enacted. `ohio-session-laws` records this hazard as the reason
  H.B. 650 of the 122nd is deliberately unheld; it is present here too, and pinned by a test
  rather than left to be met by surprise. [verified]
properties:
  designation: Sub. H.B. 583
  general_assembly: 134th General Assembly
  signed: 2022-06-24
  effective: 2022-09-23
  subject: |
    Made corrective and technical changes to the Fair School Funding Plan enacted by Am. Sub.
    H.B. 110, incorporated into the FY2022 calculations. Reprinted **13** sections of R.C. 3317
    and reopened **4** uncodified sections of H.B. 110, leaving R.C. 3317.022 untouched. Froze the
    two statewide transportation cost inputs at FY2020 data for the biennium, ended the proration
    of EdChoice expansion scholarships, and appropriated one federal line of $2.4m for a new
    tutoring programme. [verified] (the enrolled act)
  vetoes: |
    Not recorded here, and the enrolled act cannot record it: what the version index serves is the
    text as presented to the Governor, and a line-item veto is exercised after that. The act does
    make an appropriation, so it was vetoable. Settling it needs this act's own LSC final analysis,
    which is a second document and not the one now held. [open]
