revisions:
  - was: |
      "What it changed is not held … This one is a separate PDF that no connector fetches, so the
      corpus can say that corrections were made, that they are operative, and that they are
      technical on LSC's characterisation, and cannot say which provisions moved."
    now: |
      The act is held. It came through `ohio-session-laws` — the same legislature version API that
      already served H.B. 215, H.B. 770 and H.B. 282 — at version code `08_EN`, and is committed
      at `crates/project/fixtures/hb583-corrections.txt`. What the corpus was reaching for was
      LSC's analysis *of* the act; what answers the question is the act.
    found_by: |
      A corpus review crossing every blocker claim against the connector registry, then probing
      the version index directly. Six version codes below `08_EN` return 404 and that one returns
      ninety-four pages.
    reach: |
      It was the sole reason [FY2022-23](../fiscal-period/fy2022-23.yml) carried an `[open]`
      reading "It has no node here" — a sentence written about a node that exists — and the reason
      this node had no `findings` at all. It also turned out to answer a question filed on a
      different node: the formula transition supplement's uncodified home is a *titled* section of
      H.B. 110, which this act quotes by name.
  - was: |
      R.C. 3317.022 "appears ten times as a cross-reference from the sections that were amended".
    now: |
      **10** of the act's own sections cite it. Ten is not a count of occurrences: the phrase
      `section 3317.022 of the Revised Code` is printed 13 times and the number appears 23 times
      in all.
    found_by: |
      Binding the figure to `crates/figures`, which needed a public reader for the act and got one
      at `crates/project::act`. The test standing behind the claim had asserted
      `matches(...).count() > 5` — a lower bound under a figure the corpus published exactly, which
      is the fourth of #158's conventions arriving in a fifth place.
    reach: |
      The number was right and the noun was wrong, so nothing downstream moves. Worth recording
      because the act prints four of those 23 occurrences inside a flattened strike-and-insert,
      where 3317.022 is the struck half twice and the inserted half twice — and the set of citing
      sections is the same ten either way. See this node's own caveat on that hazard. [verified]
