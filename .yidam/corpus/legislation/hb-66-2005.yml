class: legislation
label: Am. Sub. H.B. 66 (2005) — FY2006-07 Budget; Tangible Personal Property Tax Phase-Out
summary: >-
  The FY2006-07 operating budget, which phased out the tangible personal property tax on
  general business over four years. It removed part of the local school tax base by state
  decision and replaced the revenue with a state payment.
description: |
  The FY2006-07 operating budget, which phased out the tangible personal property tax on
  general business — machinery, equipment, inventory, furniture and fixtures — over four
  years beginning in tax year 2006, and separately phased down the assessment rate on
  electric and natural gas utility property. [verified] The tangible personal property tax
  had been a local property tax, levied on the same voted millage as real property, so its
  elimination removed part of the tax base out from under every district that had industrial
  or commercial property in it.

  The act created replacement payments to hold districts harmless, funded from the new
  commercial activity tax. [verified] Those payments were not permanent: the reimbursement
  was scheduled to phase down, and subsequent budgets repeatedly revised the phase-down
  schedule. [verified] The result is a structural substitution — a locally-levied,
  locally-controlled revenue source replaced by a state appropriation subject to
  renegotiation every biennium — concentrated in exactly the districts with the most
  industrial property. [inference]

  The per-district magnitude of the substitution and the current status of the phase-down are
  not established here. [open]
properties:
  designation: Am. Sub. H.B. 66
  general_assembly: 126th General Assembly
  signed: 2005-06-30
  effective: 2005-06-30
  subject: |
    Enacted the FY2006-07 operating budget. Phased out the tangible personal property tax on
    general business property beginning in tax year 2006, phased down utility tangible
    personal property assessment rates, created the commercial activity tax, and established
    replacement payments to school districts for the lost local tax base.
  vetoes: |
    Six, and the first is the only attempt in this corpus to legislate around H.B. 920.
    [verified] (the greenbook)

    **A levy that would have tracked the loss of state aid.** The General Assembly authorised
    districts to put to voters a property tax that **adjusts to offset year-to-year decreases in
    state funding caused by increases in the district's local share of base cost funding**, capped
    at 4% growth a year. LSC says plainly what it was for: it "would have provided one way for
    districts to attempt to counteract the effect of H.B. 920 tax policy that limits revenue growth
    from existing real property." **Vetoed.** See [H.B. 920](hb-920-1976.yml), whose whole subject
    is that limit.

    Also vetoed: a prescribed method for calculating the limited English proficiency funding
    transferred to community schools, leaving the method to the department; a purpose statement for
    the post-secondary enrolment options programme; specific reimbursement rates for the Early
    Learning Initiative, leaving them to Job and Family Services; a delayed effective date that
    would have kept test-scoring companies from personally identifiable student data until July
    2006, so that the veto gave them access immediately; and a reduction of the Ohio Wyami Teacher
    Cohorts earmark from $1.5 million each year to $1.5 million across the biennium.
