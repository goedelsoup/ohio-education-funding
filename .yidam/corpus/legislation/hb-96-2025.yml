class: legislation
label: Am. Sub. H.B. 96 (2025) — FY2026-27 Budget
summary: >-
  The FY2026-27 operating budget, and the third consecutive budget to decide what happens to
  the Fair School Funding Plan's phase-in. It completes the schedule on paper, 83.33% then
  100%, while holding the cost inputs at FY2022.
description: |
  The FY2026-27 operating budget, and the third consecutive budget to decide what happens to
  the Fair School Funding Plan's phase-in. Signed 30 June 2025 after 67 line-item vetoes.
  [verified]

  It takes the phase-in to **83.33% in FY2026 and 100% in FY2027** — completing, on paper, the
  six-year schedule the plan was designed around — while holding the base cost inputs at
  **FY2022** levels rather than refreshing them. [inference] The Governor's executive proposal
  had explicitly frozen base cost at FY2022 levels, and the enacted act carried that forward.
  [inference]

  The two dials have to be read apart to read the act at all. A budget that advances
  the phase-in to 100% while freezing the input year produces a number that is simultaneously
  describable as full implementation and as a real-terms reduction, and both descriptions are
  arithmetically correct — they differ in which parameter they hold fixed. Resolving the
  argument requires the phase-in percentage and the input reference year to be separately
  addressable values with their own series, which is what
  [`fsfp-phase-in-percentage`](../parameter/fsfp-phase-in-percentage.yml) and
  [`fsfp-base-cost-calculation`](../formula-component/fsfp-base-cost-calculation.yml) now are.

  The precedent for the other choice exists and is recent:
  [H.B. 33](hb-33-2023.yml) refreshed the inputs from FY2018 to FY2022 two years earlier.
  [verified] So freezing was a decision against an established practice, not an omission.
  [inference]

  **Numbers not yet established.** The enacted foundation appropriation totals, and the
  identity of the vetoed items affecting education. Figures in circulation must be handled
  carefully: the House-passed Budget in Brief describes bridge-formula funding of $11.24 billion
  in FY2026 and $11.49 billion in FY2027, and a projection of $17.55 billion in total state and
  local formula shares for traditional districts in FY2027 — but the first pair belongs to a
  proposal, not to the enacted act. See the stage caveat in
  [`lsc-hb96-analysis`](../../catalog/lsc-hb96-analysis.md). [open]
properties:
  designation: Am. Sub. H.B. 96
  general_assembly: 136th General Assembly
  signed: 2025-06-30
  effective: 2025-06-30
  subject: |
    Enacted the FY2026-27 operating budget. Continued the Fair School Funding Plan formula at a
    phase-in of 83.33% in FY2026 and 100% in FY2027 while carrying forward FY2022 base cost
    inputs rather than refreshing them. [inference — confirm against the enacted act and the
    LSC Greenbook]
  vetoes: |
    67 line items vetoed before signing. [verified] One of them is an education programme, and the
    greenbook names it. [verified — `crates/project/fixtures/dew-greenbook.txt`]

    The act established the **Nonchartered Educational Savings Account Program**, to begin in the
    2026-27 school year for eligible pupils enrolling in participating nonchartered nonpublic
    schools, administered by the Treasurer of State. **Vetoed.**

    It is the fourth time in this class that a new channel to nonpublic schools was passed and
    struck — after [H.B. 119](hb-119-2007.yml)'s Special Education Scholarship Pilot,
    [H.B. 1](hb-1-2009.yml)'s EdChoice eligibility route and [H.B. 110](hb-110-2021.yml)'s
    conditional-approval scholarships — and the first that would have run outside the chartered
    system entirely. Which of the other 66 touched school funding is still not established. [open]
