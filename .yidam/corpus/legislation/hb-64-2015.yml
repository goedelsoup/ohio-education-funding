class: legislation
label: Am. Sub. H.B. 64 (2015) — FY2016-17 Budget; Capacity Aid
summary: >-
  Kept H.B. 59's formula and moved the guarantee's anchor forward two years, from FY2013 to FY2015.
  Added capacity aid, which pays on what a mill raises rather than on what a district is worth, and
  performance bonuses for graduation and third-grade reading.
description: |
  The second of the four acts of the Bridge-formula decade, and the one that changed the formula's
  content most while changing its architecture least.

  **Capacity aid** is the substantive addition, and it measures something the state share index
  does not: what one mill actually raises per pupil in a district, rather than where the district
  sits in the statewide valuation-and-income ranking. Two districts can share an index position
  and differ in what a levy is worth to them. [verified — the greenbook]

  **Performance bonuses** pay on measured outcomes — a graduation bonus and a third-grade reading
  bonus — which is unusual in Ohio's formula and is the ancestor of the Fair School Funding Plan's
  [performance supplement](../formula-component/fsfp-performance-supplement.yml). A
  **transportation supplement** sits beside base pupil transportation. [verified]

  ### The anchor moves, and moving it is the decade's only recurring act of policy

  Temporary transitional aid had guaranteed 100% of **FY2013** state aid. This act re-computes it
  at 100% of **FY2015**. [verified] That is the whole of what a biennium does to the floor: it does
  not remove it, it does not escalate it, it re-reads it two years later.

  One carve-out shows how carefully the base has to be handled. In FY2017 career-technical
  education and its associated services funds are paid **outside** the guarantee, so the guarantee
  base for that year is adjusted by subtracting each district's FY2016 career-technical funds —
  otherwise the base would guarantee money the formula was no longer counting toward it.
  [verified]
findings: |
  ### It is the most-cited act in the whole Catalog and had no node

  214 budget lines name H.B. 64 in their `legal_basis` in
  [`catalog-line-item-basis.tsv`](../../../crates/project/fixtures/catalog-line-item-basis.tsv) —
  more than any other act the Catalog names, including every act that already had a node.
  [verified]

  ### The appropriation

  Enacted foundation aid is **$7.39 billion in FY2016 and $7.70 billion in FY2017**, a 5.5% and
  4.2% rise. [verified — `appropriation-lines.csv`, lines 200550 and 200612] The decade's growth is
  steady and unremarkable in every year except its last three, which is the finding on
  [H.B. 166](hb-166-2019.yml).

  ### Capacity aid and local capacity are not the same idea twice

  The Fair School Funding Plan's [local capacity](../formula-component/fsfp-local-capacity-measure.yml)
  measure replaced the charge-off and is a *deduction* from what the state pays. Capacity aid was
  an *addition* on top of a formula whose state share came from an index. Both answer "what can
  this district actually raise", from opposite directions, six years apart. Whether the second
  descends from the first is not established here — no `replaces` edge is claimed and
  `regime-diff` aligns neither. [open]
properties:
  designation: Am. Sub. H.B. 64
  general_assembly: 131st General Assembly
  signed: 2015-06-30
  effective: 2015-09-29
  subject: |
    Enacted the FY2016-17 operating budget. Kept H.B. 59's state share index and Opportunity Grant,
    added capacity aid, graduation and third-grade reading bonuses, and a transportation
    supplement. Re-anchored temporary transitional aid from FY2013 to FY2015 and moved
    career-technical funds outside the guarantee for FY2017.
  vetoes: |
    Five, and two of them are the largest funding vetoes in the decade. [verified — the greenbook]

    **The secondary per-pupil guarantee.** The General Assembly wrote a second floor into the
    formula: after the temporary transitional aid guarantee and the gain cap were applied, every
    district would have been guaranteed at least **20% of the formula amount per pupil** — $1,180
    in FY2016 and $1,200 in FY2017 — phased in at 15% and 25%. **Vetoed.** A floor under the floor,
    passed by both chambers and struck by one person, and it appears in no enacted figure this
    corpus holds.

    **The TPP supplement's second year.** The FY2017 appropriation of **$78.3 million** and its
    supporting formula calculations, plus a related provision transferring $12 million of GRF cash
    to the School District TPP Supplement Fund in each fiscal year. **Vetoed**, leaving FY2016's
    supplement in place and FY2017's not. The transfers from the Medicaid Reserve Fund and the
    FY2015 surplus were retained. See
    [`tpp-replacement-payments`](../revenue-stream/tpp-replacement-payments.yml).

    Also vetoed: an exemption from the property tax replacement phase-out for districts containing
    a nuclear power plant where replacement payments were 10% or more of total resources, which
    would have reached exactly two districts — Perry Local in Lake County and Benton-Carroll-Salem
    in Ottawa County; and the removal of the rule requiring a JVSD to spend at least 75% of its
    state career-technical funding on career-technical programmes.
  accountability_effect: |
    Introduced the graduation and third-grade reading bonuses, which pay on report-card measures
    and so join the funding and accountability systems at a point neither
    `accountability-regime` nor the formula nodes currently record. [open]
