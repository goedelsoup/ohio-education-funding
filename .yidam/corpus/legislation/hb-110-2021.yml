class: legislation
label: Am. Sub. H.B. 110 (2021) — FY2022-23 Budget; Fair School Funding Plan
summary: >-
  The FY2022-23 operating budget, which enacted the Fair School Funding Plan. The plan came
  from a workgroup of school treasurers and superintendents convened by Speaker Cupp and
  Representative Patterson, not from executive budget staff.
description: |
  The FY2022-23 operating budget, which enacted the Fair School Funding Plan. The plan came out
  of a workgroup of practitioners — school treasurers and superintendents — convened in late
  2017 by House Speaker Robert Cupp and then-Representative John Patterson, not by executive
  budget staff. [verified] That origin is unusual enough to be a structural fact about the
  plan: it was designed by the people who operate district budgets, and it is the only Ohio
  formula built that way.

  Three departures from everything before it, all confirmed in the department's own methodology
  documentation. [verified]

  **Funds students where they are educated, not where they live.** The deduction and transfer
  of funds from resident districts for students attending community schools, STEM schools,
  scholarship programs, and open enrollment is generally eliminated. This is the mechanism at
  the centre of a decade of district revenue-loss arguments.

  **Establishes an input-based model informed by professional judgment.** Base cost is built
  from student-teacher ratios, minimum service levels, and actual costs, producing a unique
  base cost per pupil for each district and community school in the state.

  **Measures local capacity by property and income together.** The state and local cost
  methodology uses both assessed property values and resident income to determine the state
  share — replacing a charge-off that saw only valuation.

  In FY2022 the plan distributed almost $7.5 billion in state foundation funding to 611 school
  districts, at a phase-in of 16.67% for most components and 0% for Disadvantaged Pupil Impact
  Aid. [verified] The base cost was priced from FY2018 statewide average salaries. [verified]

  [H.B. 583](hb-583-2022.yml) of the same General Assembly made technical corrections to the
  formula in June 2022 and is incorporated into the FY2022 calculations. [verified] Every FY2022
  figure in this corpus is therefore this act *as corrected*, and reconciling one against the text
  of H.B. 110 alone reconciles against a formula that was never run.

  The act specified a six-year phase-in that no enacting General Assembly could bind its
  successors to complete, and the plan has been re-legislated in each subsequent budget.
  [verified]
properties:
  designation: Am. Sub. H.B. 110
  general_assembly: 134th General Assembly
  signed: 2021-06-30
  effective: 2021-07-01
  subject: |
    Enacted the FY2022-23 operating budget and established the Fair School Funding Plan:
    district-specific base cost built from staffing ratios and minimum service levels priced at
    FY2018 statewide average salaries; a local capacity measure combining assessed property
    valuation with resident income; direct state funding of community and STEM school students
    in place of the resident-district deduction; categorical weights for special education,
    economic disadvantage, English learners, gifted, and career-technical; and a six-year
    phase-in of the computed amount, beginning at 16.67% in FY2022.
  vetoes: Line-item vetoes recorded; education funding effect not yet assessed. [open]
