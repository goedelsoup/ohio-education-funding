class: legislation
label: Am. Sub. H.B. 33 (2023) — FY2024-25 Budget
summary: >-
  The FY2024-25 operating budget, and the most consequential single act for the Fair School
  Funding Plan after the one that created it. It refreshed the cost inputs from FY2018 to
  FY2022 salaries — the only time the reference year has moved.
description: |
  The FY2024-25 operating budget, and the most consequential single act for the Fair School
  Funding Plan after the one that created it. Three changes, each of which the corpus needed a
  node to attach to.

  **It refreshed the cost inputs.** The base cost build-up moved from FY2018 statewide average
  salaries to FY2022. [verified] This is the only time the reference year has been updated, and
  it is the proof that the mechanism can work as designed — the base cost statewide average
  moved from roughly $7,352 in FY2023 to roughly $8,240 in FY2025, and most of that is the
  input refresh rather than the phase-in. [inference] It is also the benchmark against which
  [H.B. 96](hb-96-2025.yml)'s decision to hold the year at FY2022 has to be read.

  **It advanced the phase-in** to 50% in FY2024 and 66.67% in FY2025. [inference]

  **It made EdChoice universal.** Eligibility for the expansion scholarship, previously
  income-limited, was opened to all Ohio students with the award amount scaled by family income
  relative to the federal poverty level rather than eligibility gated by it. [verified] This is
  the change that made the scholarship channel large enough to matter in statewide funding
  arithmetic, and it is the change the [2025 Franklin County
  decision](../litigation/vouchers-hurt-ohio-2025.yml) found unconstitutional. [inference]

  It also created the [Department of Education and
  Workforce](../actor/department-of-education-and-workforce.yml), converting the state
  education agency from a body answering to an independent State Board into a cabinet
  department answering to the Governor. [verified]

  **The income bands and the vetoes are now recorded, and both came out differently from how this
  node framed them.** The act prescribed eight bands for FY2024 and switched to the continuous
  formula only from FY2025, so the scale is a table for one year and a curve thereafter —
  [`edchoice-expansion`](../program/edchoice-expansion.yml) carries the schedule and the comparison
  against the curve. [verified] And the act carries **one** veto, not a set of line items: see
  `vetoes`, which is about community school enrolment auditing and touches no scholarship.
  [verified]
  ([`crates/project`](../../../crates/project/tests/the_one_year_the_expansion_had_bands.rs))

  Appropriation totals for the act as a whole are still not recorded here. [open] The scholarship
  channel specifically is not one of them and cannot become one: LSC states in both editions that
  the budget "does not allocate specific amounts to each scholarship program", so there is no
  per-programme appropriation in this act to record. [verified]
properties:
  designation: Am. Sub. H.B. 33
  general_assembly: 135th General Assembly
  signed: 2023-07-04
  effective: 2023-07-04
  effective_note: |
    Two dates, and `effective` above carries the appropriation one. The act was signed
    **4 July 2023** and the appropriation sections took effect then; the codified amendments took
    effect ninety days later, and all ten sections this corpus reads from the act — R.C. 3302.01,
    3302.10, 3310.01, 3310.03, 3310.032, 3310.08, 3313.975, 3317.03, 3327.02 and 5753.11 — are
    dated **3 October 2023** in `crates/project/fixtures/revised-code.txt`. [verified]
    ([`crates/project`](../../../crates/project/fixtures/revised-code.txt), which records the act
    and the date per section)

    That makes `effective` here the signing date, where
    [H.B. 96](hb-96-2025.yml) sets it to the codified one on the reasoning that the sections the
    formula is read from are what the field is for. The two nodes disagree about what the field
    means, and this note records the disagreement rather than settling it. [open]
  subject: |
    Enacted the FY2024-25 operating budget. Updated Fair School Funding Plan cost inputs from
    FY2018 to FY2022; advanced the formula phase-in to 50% in FY2024 and 66.67% in FY2025;
    extended EdChoice Expansion eligibility to all students with income-scaled award amounts;
    replaced the Ohio Department of Education with the cabinet-level Department of Education
    and Workforce. Signing date to be confirmed against the enrolled act. [open]
  vetoes: |
    One, and it is not about a scholarship. [verified]
    ([`crates/project`](../../../crates/project/tests/the_one_year_the_expansion_had_bands.rs),
    which asserts the greenbook carries exactly one `Vetoed provision` section and that its text
    names none of the five programmes)

    The act would have required the Joint Committee on Agency Rule Review to review any change the
    department proposed to its manual of standards and procedures for reviewing and auditing
    community schools' full-time-equivalency enrolment reports. **Vetoed** — the second time in two
    budgets that a provision putting the department's community school accounting under legislative
    rule review was struck; the first was [H.B. 110](hb-110-2021.yml)'s on EMIS.

    The FTE manual decides how much a community school is paid, so what was vetoed is legislative
    review of the document behind the deduct.
  accountability_effect: |
    Dissolved the academic distress commission for Lorain City School District. [verified]
    ([the department's commission page](../../catalog/dew-academic-distress-commission.md)) Not a
    funding provision, and recorded here because an Ohio budget act carries the funding formula
    and the accountability regime in one instrument — a property the corpus could not see until it
    held both domains.
