class: legislation
label: Am. Sub. H.B. 920 (1976) — Tax Reduction Factors
summary: >-
  The single most consequential enactment in Ohio school finance, and the least visible in the
  formula itself. Its tax reduction factors hold a voted levy to roughly the dollars it raised
  when passed, so district revenue does not grow with valuation.
description: |
  The single most consequential enactment in Ohio school finance, and the one least visible
  in the funding formula itself. H.B. 920 created the tax reduction factors codified at
  R.C. 319.301: as reappraisal raises the assessed value of existing real property, the
  effective millage of previously voted levies is reduced so that the levy yields
  approximately the same number of dollars it yielded when passed. [verified]

  The consequence is that a district's revenue from an existing levy does not grow with
  inflation or with rising property values. Growth comes only from new construction, from new
  levies, or from reaching the 20-mill floor below which reduction factors cannot push
  effective operating millage. [verified] A district whose costs rise with inflation must
  therefore return to its voters repeatedly simply to stand still, and districts whose voters
  say no fall behind in real terms without any decision by the General Assembly having been
  made. [inference]

  This is the mechanism that produced the disparities *DeRolph* litigated. It is also why the
  20-mill floor is a funding parameter and not merely a tax-administration detail: for the
  large number of districts sitting at the floor, valuation growth passes through to revenue
  directly, and the entire logic of H.B. 920 is suspended. [verified]
findings: |
  ### The one legislative attempt to work around it was vetoed

  [H.B. 66 of 2005](hb-66-2005.yml) authorised districts to put to voters a property tax that would
  **adjust to offset year-to-year decreases in state funding caused by increases in the district's
  local share of base cost funding**, capped at 4% growth a year — a levy indexed to the loss
  rather than fixed in dollars. LSC's analysis says what it was for in as many words: it "would
  have provided one way for districts to attempt to counteract the effect of H.B. 920 tax policy
  that limits revenue growth from existing real property."

  **The Governor vetoed it.** [verified] (the greenbook, committed at
  `crates/project/fixtures/lsc-education-greenbooks.txt`)

  It is the only provision in this corpus that would have loosened the mechanism this node
  describes, and it never took effect — so it appears in no levy, no valuation and no enacted
  figure here. The reason to record it is that the absence of any workaround in the data reads as
  nobody having tried, and somebody did. [inference]

