class: parameter
label: Formula Parameter
foundational_type:
  ontology: ufo
  type: quality
description: |
  A single named value that a funding regime consumes and the General Assembly sets, carrying
  a series of values across fiscal periods — a base cost per pupil, a special-education
  category weight, the 20-mill floor, a phase-in percentage, a state share index threshold.
  It is a Quality because it is an aspect that inheres in a formula component and cannot
  exist independently of one. Parameters are separated from components because they are the
  surface a counterfactual binds to: a proposed policy change is, almost always, an edit to
  a parameter's value.
properties:
  - name: name
    type: string
    description: The parameter's name in statute or department documentation
  - name: unit
    type: string
    description: dollars-per-pupil | ratio | mills | percent | count
  - name: kind
    type: text
    description: >-
      What sort of thing sets this value, and therefore what would have to happen for it to
      change: legislated | delegated | measured | uncodified. Ohio's funding parameters are four
      different kinds of thing and a spreadsheet renders all four as a number in a cell, which is
      how they came to be listed side by side as though they were the same promise. Legislated —
      written in the section, changed only by an act. Delegated — statute names the department and
      the department decides, within whatever constraint the section imposes. Measured — statute
      specifies a computation over reported data, so the value moves when districts' own behaviour
      moves and nobody decides. Uncodified — nowhere in the Revised Code, set by the biennial
      budget, and gone if it is not re-enacted. Text rather than an enum because a parameter that
      outlives a regime can change kind at the boundary, and because "not in the Revised Code" and
      "not in law" are different claims that this taxonomy has already conflated once.
  - name: series
    type: text
    description: Value per fiscal period, with the enactment that set each value
  - name: statutory_basis
    type: string
    description: Ohio Revised Code section that fixes the value or its method
  - name: simulation_key
    type: string
    description: Identifier the crates/ foundation calculator uses to bind this parameter
  - name: sensitivity
    type: text
    description: What moves when this parameter moves, and which agencies feel it most
# `edges:` below names the relationships this class is *defined by* — the ones a reader needs to
# understand what it connects to. It is not the permitted set. Measured across the corpus, 46 of
# the 90 relationships in use are undeclared, and almost all of them are single-use precise verbs
# (`recovered-funds-from`, `retreats-from`, `reframes`) that say something a generic edge would
# lose. Closing the vocabulary would either reject a third of the graph's edges or bloat every
# ontology with declarations that each describe one link.
#
# Set this to `exhaustive` on a class whose vocabulary is deliberately closed, and the validator
# will reject anything undeclared on it instead of reporting it.
edge_policy: characteristic
edges:
  - relationship: valued-in
    target: fiscal-period
    direction: out
    description: A fiscal period for which this parameter holds a specific value
  - relationship: set-by
    target: legislation
    direction: in
    description: The enactment that fixed this parameter's value or method
  - relationship: consumed-by
    target: formula-component
    direction: in
    description: The component that reads this parameter
  - relationship: perturbed-by
    target: scenario
    direction: in
    description: A counterfactual that alters this parameter's value
