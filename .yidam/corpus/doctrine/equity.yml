class: doctrine
label: Equity
description: |
  The principle that a student's educational resources should not depend on the wealth of the
  district they happen to live in — a relative standard, measured by dispersion across agencies
  rather than against any absolute requirement. [verified as a framing in school finance
  scholarship]

  Equity is the older of the two doctrines in Ohio litigation and the one that lost first. In
  [*Walter*](../litigation/cincinnati-v-walter-1979.yml) the Supreme Court of Ohio held, 4-3,
  that disparity between districts did not by itself violate Article VI, Section 2. [verified]
  The disparities continued to widen under [H.B. 920](../legislation/hb-920-1976.yml), whose
  reduction factors made a district's revenue depend on its levy history and its voters rather
  than on any statewide standard. [inference]

  Equity is the doctrine most readily made computable, and it has now been computed. Across all
  606 traditional districts in FY2024 [verified — see
  [`crates/dispersion`](../../../crates/dispersion/tests/cupp_fy24.rs)]:

  - Operating expenditure per pupil: median $15,646, coefficient of variation **0.202**,
    federal range ratio **1.846**. The district at the 95th percentile spends about 1.85 times
    the district at the 5th.
  - The distribution is right-skewed — the top half runs further above the median than the
    bottom half runs below it — so any mean-based summary overstates the typical district.

  **The wealth-neutrality result is more interesting than the dispersion.** State revenue per
  pupil correlates with assessed valuation per pupil at **−0.549**: aid does fall as property
  wealth rises, so equalisation is real, but property wealth explains only about 30% of the
  variation in state aid. [verified]

  Meanwhile state revenue per pupil correlates with the economically disadvantaged share at
  **+0.630** — more tightly than with property wealth. [verified] Ohio's formula targets
  *poverty* better than it targets *property*. Under a design that adds resident income to
  valuation and weights disadvantaged pupils, that is the mechanism working as intended — and
  it means the classic wealth-neutrality test, run on valuation alone, understates how much
  targeting the system actually does. [inference]

  Local revenue per pupil, by contrast, tracks valuation per pupil at above +0.7. [verified]
  That is the disparity the state formula exists to offset, visible in isolation.

  **One reason the wealth relationship is not stronger has now been identified.** The
  [temporary transitional aid guarantee](../formula-component/temporary-transitional-aid-guarantee.yml)
  holds 48.3% of districts above what the formula computes for them, and its incidence rises
  monotonically with property wealth — 13% of the poorest quartile against 76% of the
  wealthiest. [verified] The local capacity measure reduces state aid to wealthy districts by
  design; the guarantee then restores it. The two mechanisms work against each other, and the
  −0.549 correlation is the net of them rather than a measurement of what the formula alone
  does. [inference]

  **That run has now been done.** State aid against valuation per pupil correlates at −0.662 on
  formula alone and −0.605 as realized, so the guarantee gives up about 9% of the formula's
  equalization. [verified] But the level effect is far larger than the correlation: median
  guarantee uplift is $0 for the two poorest quartiles and $1,154 per pupil for the wealthiest,
  which more than doubles what the formula gives that quartile. A component can leave the
  ranking nearly intact while moving a great deal of money. [inference]

  **AND IT FORCED A CORRECTION TO HOW THIS CLASS MEASURES THINGS.** For *spending*, less
  dispersion is more equitable — that is the assumption behind the coefficient of variation and
  the federal range ratio reported above. For *state aid*, the sign flips. Aid is compensatory,
  so a wide spread means strong targeting and a narrow one means weak targeting.

  Realized aid is more equal than formula aid: CV 0.544 against 0.677, federal range ratio 9.6
  against 12.3. [verified] Read with the spending habit, that looks like the system becoming
  fairer. It is the opposite — the guarantee flattening the compensation. Any dispersion
  statistic in this corpus must therefore state whether its subject is a resource or a
  compensation, because the direction of "better" is not the same. [inference]

  It trades against adequacy in a specific way. Perfect equity is achievable by leveling down —
  every district equally underfunded satisfies equity and fails adequacy. [inference] Ohio has
  never proposed leveling down, but the tension shows up in a milder form every time a reform
  raises the floor without touching the ceiling: adequacy improves, dispersion may not.
properties:
  name: Equity
  origin: |
    School finance litigation of the 1970s; raised in Ohio in Cincinnati Bd. of Edn. v. Walter
    (1979) and again in the DeRolph line.
  formulation: |
    A funding system is equitable in a fiscal period to the extent that variation in
    per-pupil operating resources across agencies is not explained by variation in local
    property wealth or resident income. Testable as the association between per-pupil
    resources and assessed valuation per pupil, and as the dispersion of per-pupil resources
    across the agency distribution.
  contested: |
    Whether equity means equal dollars, equal dollars adjusted for student need, or equal
    outcomes; whether local control is a legitimate defense of disparity or its rationale;
    and whether wealth-neutrality should be measured against property alone or against
    property and income together — the question the Fair School Funding Plan answered by
    including both. [open]
