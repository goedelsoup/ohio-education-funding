class: education-agency
label: Electronic Classroom of Tomorrow (closed)
summary: >-
  A statewide online community school, once among the largest in the country, closed in 2018
  after the department found it could not document participation for much of the enrollment it
  had been paid for. The case establishes what a funded pupil is.
description: |
  A statewide online community school, once among the largest in the country by enrollment, and
  the case that establishes what "funded per pupil" means when the pupil count is contested. It
  closed in January 2018 after the Ohio Department of Education determined it could not
  document participation for a large share of the students it had been funded for, and sought
  recovery of the resulting overpayments. [verified] The Supreme Court of Ohio upheld the
  department's authority to require documentation of participation rather than enrollment.
  [verified]

  The reason it belongs in a funding corpus rather than an oversight one is that it makes the
  formula's central quantity visible. Every Ohio funding regime multiplies a per-pupil amount
  by a student count, and the entire structure rests on that count being right. For a brick and
  mortar district the count is checked by physical attendance. For a statewide e-school it is
  whatever the school reports until someone audits it, and until this case Ohio's rules did not
  clearly require the school to show that funded students were participating. [inference]

  **The numbers are now on the record and they are large.** A 165-page department hearing
  officer's report found that ECOT had counted roughly 9,000 more full-time-equivalent students
  than it could document — inflating its FTE enrollment by about 60% — to receive $108 million
  in state funding. The finding rested on student log-in and log-out data showing that students
  were online for an average of about one hour a day. [verified]

  Recovery followed in three tranches: **$60 million for FY2016**, which the State Board of
  Education voted to claw back; **$19 million** for the 2016-17 school year; and **$44.6
  million** — the entirety of what it was paid — for the final months before it closed in
  January 2018. [verified] ECOT contested the recovery through 2021, when the Supreme Court of
  Ohio held it could not challenge the order. [verified]
findings: |
  The distributional question this raises is the one the corpus should be able to answer and
  cannot yet: under the pre-FSFP deduct mechanism every dollar ECOT was funded came out of a
  resident district's foundation payment, spread across most districts in the state. Whether
  the recovered money returned to those districts, and in what proportion, is unestablished.
  [open]

  ### Peak enrollment, which the federal survey held all along

  ECOT was a community school, so it is never `comparable` and every district measure in
  `crates/dispersion` looks past it. The Census F-33 Ohio panel carries it anyway, for 8 years —
  FY2009 through FY2017, with FY2014 absent as it is for every Ohio agency. [verified]
  ([`crates/dispersion`](../../../crates/dispersion/tests/the_series_the_panel_already_held.rs))

  **Enrollment peaked at 14,153 in FY2016**, nearly double its FY2009 count of 7,272. State
  revenue peaked in the same year at **$109,371,000** — which is the survey's independent reading
  of the "$108 million in state funding" the hearing officer's report gives, from a source this
  corpus does not hold, and it is the year the State Board voted to claw $60 million of it back.
  Two records of the same quantity, 1.3% apart. [verified]

  Across those 8 years ECOT received **$666,576,000** of state money. In FY2016 that made it the
  8th largest recipient of state education money among all 982 Ohio agencies the survey carries,
  behind 7 city districts and ahead of the next community school by more than half again. One
  online school, funded above every district in Ohio but seven. [verified]

  ### And it was funded above the districts the money came out of

  ECOT's state revenue per pupil ran between $7,249 and $7,913 across those years, against a
  statewide district average between $5,241 and $6,036 — **1.3994 times the average district in
  FY2016**, and never below 1.27 in any year the panel holds. Under the deduct mechanism that
  money was subtracted from resident districts' foundation payments, so this is not an incidental
  comparison: districts gave up state aid to fund a school receiving more per pupil than they
  received themselves. [verified]

  The aggregate draw is **0.0124 of everything Ohio's districts received in state money in
  FY2016**, roughly double its FY2009 share. That is the total any per-district apportionment
  would have to sum to.

  ### The pool it drew from, which the survey had carried all along

  The other side of the deduct is in the same panel and had never been read as a distribution.
  `V92` is what each district paid community schools, and across the eleven years it can be read
  in — FY2010 to FY2021 — Ohio's districts were credited with and paid straight out
  **$9,285,168,000**. [verified] (crates/dispersion)

  Against that pool ECOT drew a share of **0.10592**, rising from 8.4% in FY2010 to 11.9% in
  FY2016. One school, against roughly three hundred. [verified] (crates/dispersion)

  **This bounds the apportionment question rather than answering it**, and the difference matters.
  The share above is a statewide average: it says what fraction of the whole pool ECOT took, not
  what fraction of any particular district's deduct went to ECOT, and a district whose residents
  enrolled with ECOT more often than average paid more of its own deduct to it. Decomposing a
  district's payment by receiving school needs the department's deduct file, because the survey
  asks each district for one number. That part is still not established here. [open]

  It opened in 2000 and closed in January 2018, but neither the charter date nor the closure
  date is established to the day, so the node carries no `established` date — the class
  declares that property a `date`, and a year is not one. [open]
