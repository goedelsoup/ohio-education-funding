      crates/dispersion/fixtures/mr81-sponsor-panel.csv       1998-2014 free and reduced lunch
unfilled:
  - field: exact opening and closing dates
    why: The year it opened and the month it closed are held; the days are not.
  - field: the years before 2004
    why: >-
      The directory's first ECOT row is 2004-05 and this node dates the opening to 2000, so the
      committed editions corroborate the closure and not the founding. Whether the CCD carried
      Ohio's e-schools under another agency type before then, or not at all, is not established
      here.
