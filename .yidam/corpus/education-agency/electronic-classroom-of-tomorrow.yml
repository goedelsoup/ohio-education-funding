class: education-agency
label: Electronic Classroom of Tomorrow (closed)
summary: >-
  A statewide online community school, once among the largest in the country, closed in 2018
  after the department found it could not document participation for much of the enrollment it
  had been paid for. The case establishes what a funded pupil is.
description: |
  A statewide online community school, once among the largest in the country by enrollment, and
  the case that establishes what "funded per pupil" means when the pupil count is contested. It
  closed in January 2018 after the Ohio Department of Education determined it could not
  document participation for a large share of the students it had been funded for, and sought
  recovery of the resulting overpayments. [verified] The Supreme Court of Ohio upheld the
  department's authority to require documentation of participation rather than enrollment.
  [verified]

  The reason it belongs in a funding corpus rather than an oversight one is that it makes the
  formula's central quantity visible. Every Ohio funding regime multiplies a per-pupil amount
  by a student count, and the entire structure rests on that count being right. For a brick and
  mortar district the count is checked by physical attendance. For a statewide e-school it is
  whatever the school reports until someone audits it, and until this case Ohio's rules did not
  clearly require the school to show that funded students were participating. [inference]

  **The numbers are now on the record and they are large.** A 165-page department hearing
  officer's report found that ECOT had counted roughly 9,000 more full-time-equivalent students
  than it could document — inflating its FTE enrollment by about 60% — to receive $108 million
  in state funding. The finding rested on student log-in and log-out data showing that students
  were online for an average of about one hour a day. [verified]

  Recovery followed in three tranches: **$60 million for FY2016**, which the State Board of
  Education voted to claw back; **$19 million** for the 2016-17 school year; and **$44.6
  million** — the entirety of what it was paid — for the final months before it closed in
  January 2018. [verified] ECOT contested the recovery through 2021, when the Supreme Court of
  Ohio held it could not challenge the order. [verified]
findings: |
  The distributional question this raises is the one the corpus should be able to answer and
  cannot yet: under the pre-FSFP deduct mechanism every dollar ECOT was funded came out of a
  resident district's foundation payment, spread across most districts in the state. Whether
  the recovered money returned to those districts, and in what proportion, is unestablished.
  [open]

  Peak enrollment and per-district deduction impact remain unpopulated. [open]

  It opened in 2000 and closed in January 2018, but neither the charter date nor the closure
  date is established to the day, so the node carries no `established` date — the class
  declares that property a `date`, and a year is not one. [open]
