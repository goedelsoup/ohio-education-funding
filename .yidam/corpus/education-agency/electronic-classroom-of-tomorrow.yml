  typology: Not applicable; e-school.
  roles: |
    Statewide e-school [verified]. Subject to attendance-based funding recovery, FY2016 and
    FY2017 [verified] (amounts not yet established). Deduct-funded from resident districts
    throughout its operation [verified].
  series_path: |
    Per-agency series are held by IRN across four committed fixtures, not one path: [verified]
      crates/foundation/fixtures/fy27-department-model.csv    FY2027 formula run, 609 districts
      crates/project/fixtures/district-finances.csv           FY2020-FY2024 actuals and balances
