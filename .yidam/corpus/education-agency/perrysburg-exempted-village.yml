class: education-agency
label: Perrysburg Exempted Village School District
summary: >-
  An exempted village district across the Maumee from Toledo, and the more useful suburban
  contrast case precisely because it is not extraordinary: an ordinary well-off Ohio suburb
  spending below the statewide median per pupil.
description: |
  An exempted village district, and the suburban counterpart to
  [Toledo](toledo-city.yml) eleven miles away across the Maumee. [verified]

  It is a better contrast case than [Upper Arlington](upper-arlington-city.yml) for one specific
  purpose: it is *not* extraordinary. Perrysburg spends **$14,632 per headcount pupil**, below
  the statewide median of $16,289, on 5,449 pupils with a 13.8% economically disadvantaged share
  and an 11.3% disability share. [verified — computed; see
  [`crates/dispersion/tests/expenditure_functions_fy25.rs`](../../../crates/dispersion/tests/expenditure_functions_fy25.rs)]
  It is an ordinary well-off Ohio suburb, which is exactly what makes it the right comparator
  when someone wants to know whether an urban district's spending is unusual.

  **What the comparison actually shows.** Toledo spends $6,172 more per pupil and puts a
  markedly smaller share of it in a classroom — 51.3% on instruction against Perrysburg's 62.6%,
  63.4% on classroom instruction against 73.1%. [verified] Perrysburg's operating budget is more
  concentrated on teaching and less on plant and building administration, which is what a newer,
  denser, smaller physical estate looks like in a function table.

  **And where a widely circulated claim went wrong.** A claim that Toledo devotes ~45% of
  spending to special needs against Perrysburg's 14–16% was fact-checked and found false: the
  special-education instruction share is about 14–15% in *both*, and student support about 8% in
  both — 8.1% Toledo, 8.5% Perrysburg, reproducible to the tenth of a point from the
  department's own file. [verified — see
  [OCG fact-check RL-2026-021](../../catalog/ocg-fact-check-021.md)]

  The fact-check's verdict is right. Its gloss is not: it reads Toledo's higher
  special-education dollars per *total* pupil as a "modestly heavier student-need profile," when
  Toledo's disability share is nearly double Perrysburg's. Per student with a disability the
  comparison reverses — roughly $12,600 in Toledo against $18,000–$20,900 here. [inference] A
  share whose denominator is the whole enrollment cannot compare two districts serving very
  different fractions of the population it is meant to describe.

  Not yet held: valuation per pupil, millage, guarantee status, and anything before FY2024.
  [open]
revisions:
  - was: |
      Toledo spends $6,173 more per pupil than Perrysburg.
    now: |
      $6,172. The department publishes $20,804.57 and $14,632.16, whose difference is $6,172.41.
    found_by: |
      Binding the gap to `crates/figures`. The crate test that already checked it asserted
      `close(gap, 6_173.0, 2.0)` — two dollars of tolerance around a figure the corpus published
      to the dollar, so the rounding sat inside the check the whole time.
    reach: |
      One dollar on one figure, stated in this node and in [Toledo](toledo-city.yml). Nothing
      reads the gap to the dollar, and the function shares beside it are untouched. [verified]
