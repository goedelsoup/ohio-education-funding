properties:
  seeded_because: |
    The corpus's second urban exemplar. A circulating claim about its special-education spending
    made it the subject of a published fact-check, and the pair it forms with
    [Perrysburg](perrysburg-exempted-village.yml) is a sharper contrast than any this corpus
    previously held. [verified]
  irn: 044909 [verified] (report card district files)
  agency_type: city
  county: Lucas
  fy2025_profile: |
    Enrolled ADM (unweighted) 21,159.75; weighted ADM 30,758; weight ratio 1.454.
    Operating expenditure $440,219,539.58 — $20,805 per headcount pupil, $14,312 per
    equivalent pupil.
    Economically disadvantaged 98.9% (report-card measure, top-coded by community eligibility);
    students with disabilities 21.9%; English learners 2.4%.
    Performance Index 60.4 (2024-25), 57.9 (2023-24), 58.8 (2022-23).
    Progress effect size −0.02; composite −5.07. [verified]
  typology: |
    Urban, very high poverty. Exact department typology code not yet entered.
  roles: |
    Major urban district throughout the period held [verified]. Subject of OCG fact-check
    RL-2026-021 [verified]. Guarantee status in the FY2027 department model not yet read onto
    this node. [open]
  series_path: |
    crates/dispersion/fixtures/report-card-2425-district-data.csv and
    crates/dispersion/fixtures/expenditure-functions-fy25.csv, keyed by IRN 044909.
