class: education-agency
label: Toledo City School District
summary: >-
  Ohio's fourth-largest district, and the urban half of a pair with Perrysburg eleven miles
  away. High operating spending per pupil against low measured outcomes, which is the shape the
  poverty gradient takes in every Ohio comparison.
description: |
  Ohio's fourth-largest district, and one half of a pair with
  [Perrysburg](perrysburg-exempted-village.yml) — eleven miles apart, one urban and one
  exempted village. [verified]

  **FY2025 in one line:** 21,160 pupils, $440.2 million of operating expenditure, **$20,805 per
  headcount pupil**, a Performance Index of 60.4, and a Progress effect size of −0.02.
  [verified] (computed; see
  [`crates/dispersion/tests/expenditure_functions_fy25.rs`](../../../crates/dispersion/tests/expenditure_functions_fy25.rs))

  ### Where its extra spending goes, which is not where the argument assumed

  Toledo spends $6,172 more per pupil than Perrysburg and a markedly *smaller* share of it in a
  classroom: [verified]

                                    Toledo     Perrysburg
      instruction                    51.3%          62.6%
      classroom instruction (CRI)    63.4%          73.1%
      operations and maintenance     14.8%           7.7%
      school administration           8.5%           4.8%
      pupil support                   8.1%           8.5%
      pupil transportation            1.6%           3.4%

  The function-level gap is an order of magnitude more informative than the special-education
  share the circulating claim happened to name, and it comes from the same file that fact-check
  already cited. Plant and building administration are where an old, large, dispersed physical
  estate shows up in an operating budget; whether that is inefficiency or the cost of the
  buildings Toledo actually has is not a question a share can answer. [inference]
findings: |
  **It is the corpus's clearest case of the denominator problem in the wild.** The same
  operating total divided by weighted ADM gives **$14,312** — which is what the report card
  prints as expenditure per equivalent pupil, and what [OCG White Paper
  013](../../catalog/ocg-white-paper-013.md) analysed. Divided by headcount it gives $20,805,
  which is what [OCG fact-check RL-2026-021](../../catalog/ocg-fact-check-021.md) reported
  three weeks later. A 45% spread for one district in one year, in two publications from one
  author, neither noting the other's basis. [verified] Toledo's weighted ADM is 30,758 against
  21,160 enrolled — a weight ratio of 1.45, the consequence of a 98.9% economically
  disadvantaged share and a 21.9% disability share.

  ### Normalised by the population actually served

  It reports Toledo spending $2,766 per pupil on special-education instruction against
  Perrysburg's $2,032–$2,363, and reads the difference as "consistent with a modestly heavier
  student-need profile." Toledo's disability share is 21.9% against Perrysburg's 11.3% — nearly
  double, not modest. Normalised by the population actually served, Toledo spends roughly
  **$12,600 per student with a disability** against Perrysburg's **$18,000–$20,900**: about a
  third less, not somewhat more. [inference] (the special-education dollars are the
  fact-check's, from audited statements this corpus does not hold; the shares are the report
  card's, so this is an order-of-magnitude normalisation rather than an audited per-pupil cost.
  A 1.94x population difference against a 1.36x spending difference leaves no room for the sign
  to return.)

  This is the corpus's denominator rule arriving a third time and from a new direction. The
  first two were about dividing spending by a need-weighted pupil count; this one is about
  dividing special-education spending by a population that is mostly not receiving it.
  [inference]

  ### The years before FY2024, which the survey holds and this node did not read

  The Census F-33 Ohio panel runs from FY2009 and carries Toledo in every year it holds.
  [verified] ([`crates/dispersion`](../../../crates/dispersion/tests/the_pair_and_its_fifteen_years.rs))

  **Toledo's state revenue per pupil lost 15.1% against prices between FY2010 and FY2024** —
  measured net of the community-school deduct in both years, which is the only way the survey's
  state column is one quantity across that span. Its local revenue per pupil fell 8.14% in real
  terms, while its enrolment fell 21%. Both of Toledo's revenue sources lost ground against
  prices for fourteen years. Beside it, [Perrysburg](perrysburg-exempted-village.yml) lost
  **20.3%** of its state revenue on the same basis and gained 22.3% of its local. [verified]
  ([`crates/dispersion`](../../../crates/dispersion/tests/the_break_that_belonged_to_the_survey.rs))

  The state figures here replace a published pair — Toledo 34.3%, Perrysburg 22.75% — that read
  the column as the survey prints it and so charged each district its own deduct. Correcting it
  halves Toledo's fall and reverses the comparison: on one basis the wealthy district's state
  revenue lost more ground against prices than the high-need one's, and it is the *local* column,
  not the state one, that separates them. [verified]

  ### The apparent step at FY2016 is the survey changing what it counts

  The published series does not decline smoothly: it drops about 30% in a single year at FY2016
  and never returns. **That drop is not Ohio's.** From FY2016 the U.S. Census Bureau subtracts a
  district's payments to community schools from the state revenue it credits the district with,
  and before FY2016 it does not. The Bureau's own state notes give the reason — Ohio's deduct
  puts the same state dollar in the community school's revenue *and* in the resident district's,
  and the subtraction removes the double count — and the note is absent from the FY2015
  documentation and present from the FY2016 documentation. Ohio is the only state it is written
  for. [verified]
  ([`crates/dispersion`](../../../crates/dispersion/tests/the_break_that_belonged_to_the_survey.rs))

  The data locates the same year without the note. Correlating each district's deduct per pupil
  against its change in state revenue per pupil, the deduct predicts the change at one transition
  in eleven — FY2015 to FY2016, at −0.2506 — and the largest reading in any other year is 0.1026;
  putting both years on one basis takes it to 0.0183. Statewide, districts' state revenue falls
  $849.9 million across FY2016 and those same districts paid community schools $920.0 million
  that year, which is the same quantity seen from the other side. [verified]

  ### So the tail was never there, and what is left is one mechanism rather than two

  On one basis **thirteen of Ohio's fourteen largest districts gained** across the step. Columbus
  goes from a published −29.22% to **+14.93%**, Toledo from −20.49% to **+13.88%**, Dayton from
  −3.50% to **+32.14%**. The 27 districts falling more than a fifth become 19, the pupils they
  hold go from 6.7% of the panel to 0.0166 of it, and the median district's gain rises from 9.56%
  to 13.74%. Toledo's own deduct was 35.3% of the state revenue the survey credited it with in
  FY2015, which is most of the 30% fall this node recorded. [verified]

  **What survives is capacity aid.** Across 604 districts the step's strongest correlate is still
  the **log of a district's total assessed value**, at −0.2691, and the gradient is still
  monotone: the smallest-valuation fifth gains 26.79% against the largest fifth's 10.60%, and now
  every fifth gains. FY2016 is [H.B. 64](../legislation/hb-64-2015.yml)'s first year, and LSC's
  greenbook describes its new component in these words: capacity aid "targets funding to smaller
  districts with relatively low total property valuation", "based on the amount a district can
  raise with one mill", "provided to districts that raise less than the median amount". One
  mill's yield is a measure of total valuation, and capacity aid is the only Ohio component that
  prefers a district's *total* valuation to its valuation per pupil — which is the comparison the
  correction leaves standing, standardised −0.1994 against −0.1204. [verified]
  ([`crates/dispersion`](../../../crates/dispersion/tests/what_fell_out_of_the_state_column.rs))

  It is not the only thing in the step, and the published version said it was. On one basis a
  disadvantage term reaches t = +3.92 where the published column had it at +1.38, third of three
  terms that all clear two. A year that raised capacity aid *and* the money that follows need
  should look like this; the published column could not show it because the adjustment had taken
  the largest deducts — which belong to the poorest districts — out of the outcome. [verified]

  The published local share carries the same break in the other direction, because the adjustment
  reaches total revenue too. Ohio's districts appear to go from 50.19% locally funded in FY2015
  to 52.84% in FY2016; on one basis they go from 52.39% to 52.84%. Five sixths of a jump that
  could be read as a shift onto the property tax is the Bureau's bookkeeping. [verified]

  What removed a fifth to a third of the state's contribution to Ohio's high-poverty urban
  districts between FY2013 and FY2016 was the question this node left open. Nothing did. The
  tangible personal property phase-out this node first named is not in it either, on any basis:
  the step correlates +0.1175 with a district's industrial property share, which is the wrong sign
  for that reading. [verified]

  The equalization series was checked against the published step and is untouched by the
  correction as well: it cuts by quartile and takes an unweighted mean over about 152 districts,
  so the poorest quartile's state revenue per pupil rises across FY2016 either way and the band
  [`equity`](../doctrine/equity.yml) states holds. A quartile mean is one tiny district wide, and
  by the same arithmetic it is six enormous districts deep. [verified]

  Three cautions on the series. The survey's state revenue column is every dollar the state sent,
  capital included, so one district-year of it is not that district's foundation aid — a district
  in a build year reports state revenue above its whole current spending. FY2014 is absent from
  the archive. And the deduct column that makes the correction possible is itself reported as a
  zero rather than as a missing value in FY2009 and FY2022, so the corrected series runs FY2010 to
  FY2024 and no earlier. [verified]

  Not yet held: audited-statement figures, and the scholarship deduction that a district of this
  size and poverty carries. The community-school half of it is now held, as the survey's `V92`
  column — $86.0 million in FY2015 — but only in the aggregate the survey reports, not by
  receiving school. [open]
revisions:
  - was: |
      "The tail is mostly small districts with large industrial tax bases — Green Local, Botkins,
      Ridgemont, Otsego, Carey — which is the profile of a district losing tangible personal
      property revenue. Whether that is the cause is not established here, and
      `tpp-replacement-payments` is where it would be settled."
    now: |
      **Withdrawn.** The step has no relationship to industrial property. Against Table SD-1's own
      tax-base composition it correlates +0.09 with industrial share and +0.04 with industrial,
      mineral and public-utility value together — the wrong sign for the reading, which needs
      industrial districts to have fallen. The 27 deep fallers carry a *lower* business-property
      share than everyone else, 0.1412 against 0.1517, and the quintile gradient on business
      property is flat.
    found_by: |
      Measuring it. The characterisation was five district names read off a sorted list, and Table
      SD-1 carries `industrial_value`, `mineral_value` and `public_utility_value` per district,
      which nothing had regressed the step against.
    reach: |
      No figure was bound to the claim. What it cost was a pointer: `tpp-replacement-payments` was
      named as the place the question would be settled and it is not, which would have sent the
      next reader to the wrong fixture. The replacement finding is capacity aid for the median and
      an unexplained urban fall for the tail.
  - was: |
      "27 districts fall more than a fifth and they hold 6.7% of the panel's pupils... Among Ohio's
      14 largest districts the fall separates by poverty rather than by size: Columbus, Cleveland,
      Cincinnati, Toledo and Dayton lose between 21.8% and 38.8% from FY2015 to FY2016... What
      removed a fifth to a third of the state's contribution to Ohio's high-poverty urban districts
      between FY2013 and FY2016 is not established here."
    now: |
      **Withdrawn. Nothing removed it.** The survey's state revenue column is gross of the
      community-school deduct through FY2015 and net of it from FY2016, so the measure charged each
      district its own deduct once and called the result a fall. On one basis thirteen of the
      fourteen largest districts gained: Columbus +14.93%, Toledo +13.88%, Dayton +32.14%. The
      twenty-seven deep fallers become nineteen holding 0.0166 of the panel's pupils rather than
      6.7%. Toledo's own deduct was 35.3% of the state revenue it was credited with in FY2015.
    found_by: |
      Reading the survey's other thirteen state-revenue columns. The panel collapses all of them
      into one `state_revenue` field, and the publisher's documentation carries a note for Ohio and
      for no other state saying that payments to charter schools are subtracted from general
      formula assistance — absent from the FY2015 edition, present from the FY2016 edition. The
      data agrees without the note: a district's deduct predicts its change at that one transition
      and at none of the other ten.
    reach: |
      Wide, and this is the cost of a definitional break nothing had checked. Six figure pins moved
      because `fy2016::frame` is rebuilt on one basis; three long-run figures were restated from
      FY2010 rather than FY2009 because FY2009's deduct is reported as a zero; and the corrected
      pair reverses a published comparison — Perrysburg's state revenue lost more ground against
      prices than Toledo's, not less. The panel now carries the deduct as its own column so the
      correction is available to every consumer rather than to this node.
  - was: |
      "In a model carrying total valuation, valuation per pupil and disadvantage together, total
      valuation is the term that matters: standardised −0.29096 against −0.11219 for wealth per
      pupil, with the disadvantage term not clearing two."
    now: |
      **Revised.** Total valuation is still the largest of the three and still beats wealth per
      pupil, which is the comparison that identifies capacity aid — but at −0.1994 against −0.1204
      rather than by a factor of two, and the disadvantage term reaches t = +3.92. All three terms
      clear two. The step is a year that raised capacity aid and the money that follows need, not
      capacity aid alone.
    found_by: |
      Refitting the same model with the outcome on one basis. The adjustment had removed the
      largest deducts from the outcome, and the largest deducts belong to the poorest districts, so
      the poverty term was being cancelled by an artifact.
    reach: |
      One sentence of this node and one assertion in
      `crates/dispersion/tests/what_fell_out_of_the_state_column.rs`, which pinned the disadvantage
      term *below* two and now pins it above three.
  - was: |
      A published fact-check read Toledo's $2,766 per pupil of special-education instruction
      against Perrysburg's $2,032–$2,363 as "consistent with a modestly heavier student-need
      profile".
    now: |
      Toledo's disability share is 21.9% against Perrysburg's 11.3% — nearly double, not
      modest. Per student **with a disability**, Toledo spends roughly **$12,600** against
      Perrysburg's **$18,000–$20,900**: about a third less, not somewhat more.
    found_by: |
      The report card's own disability shares, applied to the fact-check's audited spending
      figures.
    reach: |
      An order-of-magnitude normalisation rather than an audited per-pupil cost — the
      special-education dollars are the fact-check's, from statements not held here. A 1.94x
      population difference against a 1.36x spending difference leaves no room for the sign to
      return. [inference]
  - was: |
      Toledo spends $6,173 more per pupil than Perrysburg.
    now: |
      $6,172. The department publishes $20,804.57 and $14,632.16, whose difference is $6,172.41.
    found_by: |
      Binding the gap to `crates/figures`. The crate test that already checked it asserted
      `close(gap, 6_173.0, 2.0)` — two dollars of tolerance around a figure the corpus published
      to the dollar, so the rounding sat inside the check the whole time.
    reach: |
      One dollar on one figure, stated in this node and in
      [Perrysburg](perrysburg-exempted-village.yml). Nothing reads the gap to the dollar, and the
      function shares beside it are untouched. [verified]
