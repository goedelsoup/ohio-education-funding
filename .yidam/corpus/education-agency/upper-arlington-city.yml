class: education-agency
label: Upper Arlington City School District
description: |
  A high-wealth suburban district in Franklin County, adjacent to Columbus, seeded as the
  contrast case against [Northern Local](northern-local-perry.yml). Its role in this corpus is
  to make the distributional question concrete: two districts, the same constitutional
  entitlement, and revenue structures that have almost nothing in common. [inference]

  A district at this end of the distribution experiences every mechanism in this corpus
  differently, and often in the opposite direction. High assessed valuation per pupil means
  local millage produces substantial revenue, so the district is far above the
  [20-mill floor](../parameter/twenty-mill-floor.yml) and H.B. 920's reduction factors operate
  fully — which means its existing levies are held flat in nominal terms just like everyone
  else's, and it too must return to voters to keep pace. [inference] The difference is that
  its voters can afford to say yes, and its base is large enough that a mill is worth far
  more.

  Under any residual formula, high local capacity means low state aid, so this district's
  state foundation payment is small and its exposure to phase-in decisions is
  correspondingly small. [inference] That asymmetry is the substance of the claim that a
  uniform cut to foundation aid is not uniform in effect.

  Seeded as an exemplar, not as an accusation: nothing in this node asserts that the district
  did anything other than pass levies its residents supported.
  First hard numbers: IRN 044933, with 1,121 public school students with disabilities in FY2021
  and an IDEA Part B allocation of $1,490,233.42, plus 68 non-public students and an $85,227.82
  proportionate share. [verified] The non-public figure is worth noting on its own — a
  property-rich district with a substantial private-school population in its boundaries is
  exactly the setting in which the scholarship channel operates differently than it does in
  [Northern Local](northern-local-perry.yml). [inference]
