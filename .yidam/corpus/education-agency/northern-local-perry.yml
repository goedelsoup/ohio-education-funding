class: education-agency
label: Northern Local School District (Perry County)
description: |
  A rural district in Perry County, in Ohio's Appalachian southeast, and the origin of
  *DeRolph v. State*: the named plaintiff was a student at Sheridan High School in this
  district. [verified] It is seeded as the anchor case for the property-poor end of Ohio's
  distribution.

  The district is the concrete instance of the mechanism this corpus is built to explain. Low
  assessed valuation per pupil means local millage produces little revenue; under
  [H.B. 920](../legislation/hb-920-1976.yml) what it does produce does not grow with
  inflation; the [charge-off](../formula-component/charge-off-local-share.yml) nonetheless
  assumed a local contribution based on that valuation; and the resulting state aid was
  computed against a base cost the Supreme Court of Ohio found had no derivation. [inference]
  The building conditions the court described in *DeRolph I* were the visible end of that
  chain.

  It is also the right district against which to test whether anything changed. The
  [Fair School Funding Plan](../funding-regime/fair-school-funding-plan.yml)'s local capacity
  measure adds resident income to valuation, which should help a district whose community is
  poorer than its property base suggests — and Perry County is a place where that gap is real.
  [inference] Whether it did, and by how much, is the first calculation this corpus should
  perform. [open]

  First hard numbers: IRN 049056, with 298 public school students with disabilities in FY2021
  and an IDEA Part B allocation of $483,451.88. [verified] Set against
  [Upper Arlington](upper-arlington-city.yml) — 1,121 students with disabilities and
  $1,490,233.42 — the pair gives the corpus its first like-for-like comparison on a single
  federal program, though on a federal formula rather than a state one.

  Valuation per pupil, floor status, and the state funding series remain unpopulated. [open]
