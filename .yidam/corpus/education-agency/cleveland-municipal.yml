class: education-agency
label: Cleveland Municipal School District
summary: >-
  Ohio's largest urban district for most of the period covered here, and where the state's
  voucher channel began. Its valuation is large in absolute terms, so a wealth measure built on
  valuation alone does not classify it as poor.
description: |
  Ohio's largest urban district by enrollment for most of the period this corpus covers, and
  the district where the state's voucher channel began. [verified]

  Urban districts complicate the property-wealth story that Northern Local and Upper Arlington
  tell cleanly. Cleveland's assessed valuation is large in absolute terms, so a wealth measure
  based on valuation alone does not classify it as poor — but its enrollment and its residents'
  incomes tell a different story, and its municipal overburden means property tax capacity is
  shared with city services that suburban districts do not carry. [inference] This is precisely
  the case the [FSFP local capacity measure](../formula-component/fsfp-local-capacity-measure.yml)
  was designed to handle better than the charge-off did, and testing whether it does is a
  concrete question this node exists to support. [open]

  The [Cleveland Scholarship](../program/cleveland-scholarship.yml) makes it the longest
  continuous case of a district funding students who attend elsewhere, which is why any
  analysis of scholarship effects should start here rather than with the 2023 expansion —
  there is three decades of series. [inference]

  First hard numbers: IRN 043786, with 8,027 public school students with disabilities in FY2021
  — more than seven times Upper Arlington's count — and an IDEA Part B allocation of
  $12,818,292.57, plus 609 non-public students and a $903,930.07 proportionate share.
  [verified] The non-public count is the largest of the corpus's three traditional districts
  and is a direct consequence of the
  [Cleveland Scholarship](../program/cleveland-scholarship.yml) having operated in this district
  for three decades. [inference]

  **The FY2024 figures confirm the urban complication and add a surprise.** Assessed valuation
  per pupil is $184,904 — the *lowest* of the three exemplars, below Northern Local's $279,983
  and well under the statewide median of $248,097. [verified] Cleveland's valuation is enormous
  in absolute terms and modest per pupil, because it is divided across 32,744 students. Every
  student in the district is economically disadvantaged: the reported share is 100%. [verified]

  Yet its operating expenditure per pupil is $25,594 — the highest of the three, and roughly
  $10,000 above the statewide median. [verified] State revenue supplies 38.4% and local 31.4%,
  with the balance federal and other. The gap between those shares and the total is where
  high-poverty urban districts differ structurally from both wealthy suburbs and rural
  districts: categorical and federal streams do work here that the base formula does not.
  [inference]

  Effective Class 1 millage is 40.11 against 78.2 voted — comfortably above the floor.
  [verified]

  Scholarship dollar amounts and the state funding series by year remain unpopulated. [open]
properties:
  seeded_because: |
    It sits at the intersection of three mechanisms that operate on no other agency in the same
    combination: high poverty, a large but declining industrial and commercial tax base, and a
    district-specific scholarship program predating every statewide one.
  irn: 043786 [verified — FY2021 IDEA Part B allocation list]
  agency_type: city
  county: Cuyahoga
  fy2021_idea_part_b: |
    Public school students with disabilities: 8,027. Non-public: 609.
    Allocation: $12,818,292.57. Proportionate share: $903,930.07. [verified]
  fy2024_profile: |
    Enrolled ADM 32,743.64; economically disadvantaged 100%; students with disabilities 26.1%.
    Classroom teachers' average salary $81,620.78.
    Assessed valuation per pupil (FY2023) $184,903.95 — lowest of the three exemplars.
    Current operating millage (TY2023) 78.2; effective Class 1 millage 40.1161.
    Total operating expenditure per pupil $25,594.49 — highest of the three.
    State revenue per pupil $10,026.96 (38.41% of total); local $8,204.61 (31.43%);
    total revenue per pupil $26,106.19. [verified — FY2024 District Profile Report]
  typology: |
    Urban, very high poverty. Exact department typology code not yet entered. [unentered]
  established: Not yet established. [unentered]
  roles: |
    Cleveland Scholarship resident district since the mid-1990s [verified]. Subject to state
    academic distress intervention **under the former R.C. 3302.10**, the pre-2015 regime — not
    the current one, whose three districts are East Cleveland, Lorain and Youngstown [inference —
    Cleveland is absent from the department's
    [commission page](../../catalog/dew-academic-distress-commission.md)]. Dates not established
    [open]. Fifteen of its buildings are currently CSI, two ATSI and four TSI [verified —
    `dispersion::identified`]. High-poverty urban district throughout [verified].
  series_path: |
    Per-agency series are held by IRN across four committed fixtures, not one path: [verified]
      crates/foundation/fixtures/fy27-department-model.csv    FY2027 formula run, 609 districts
      crates/project/fixtures/district-finances.csv           FY2020-FY2024 actuals and balances
      crates/dispersion/fixtures/f33-ohio-panel.csv           FY2012-FY2022 revenue, federal basis
      crates/dispersion/fixtures/mr81-sponsor-panel.csv       1998-2014 free and reduced lunch
