properties:
  name: Every Student Succeeds Act
  level: federal
  authority: |
    Elementary and Secondary Education Act as reauthorized by ESSA, 20 U.S.C. 6301 et seq.,
    operated in Ohio through the state's approved Consolidated State Plan. [verified]
  measure: |
    Ohio's own School Report Card overall rating, rank-ordered — not a federal measure. Plus
    chronic absenteeism for schools with fewer than three rated components, and the four-year
    adjusted cohort graduation rate. [verified]
  identification: |
    CSI at the lowest 5% of Title I served schools and "at least" that, the amendment adding an
    explicit permission to identify beyond the threshold; TSI at the bottom 2% of a subgroup rank
    order; ATSI at or below the CSI threshold score. Building-level. CSI and ATSI every three
    years, TSI annually. [verified as proposed]
  effective: |
    ESSA replaced No Child Left Behind for accountability purposes from the 2017-18 school year.
    NCLB has no node here.
unfilled:
  - field: a node for No Child Left Behind
    why: ESSA replaced it for accountability purposes from 2017-18, and the predecessor has no node.
