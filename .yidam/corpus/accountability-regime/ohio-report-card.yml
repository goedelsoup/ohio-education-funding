properties:
  name: Ohio School Report Card
  level: state
  authority: R.C. 3302.03, with definitions at R.C. 3302.01 and building-level consequence at R.C. 3302.12. [verified]
  measure: |
    An overall rating for each district and school building. Expressed as a letter grade under
    division (C)(3) and as a star rating under division (D)(3); the star scale replaced letter
    grades for the 2022-23 report cards and both remain in the section. [verified]

    Six components under division (D)(3): gap closing, achievement, progress, graduation, early
    literacy, and college/career/workforce/military readiness. [verified] Chronic absenteeism
    is *not* one of them — R.C. 3302.03(D)(3)(a)(ii) makes it one of six met-or-not-met measures
    inside gap closing, alongside the gifted indicator, English-language-proficiency improvement,
    and subgroup targets for graduation, achievement and progress. This node listed it as a
    component until the section was read against the list. [verified]

    The corpus holds [performance index](../metric/performance-index.yml) and
    [progress](../metric/progress-value-added.yml) as metrics and not the others.
  identification: |
    The rating is not itself an identification. It is the input two identification systems consume:
    federal CSI, TSI and ATSI selection rank-orders it, and R.C. 3302.10 reads three consecutive
    years of it. [verified]
  effective: |
    In its current form from the 2022-23 report cards, when star ratings replaced letter grades.
    Ohio has published report cards in some form since well before that; the earlier eras are not
    modelled here.
unfilled:
  - field: the components other than performance index and progress
    why: Early literacy, graduation and chronic absenteeism are named in the section and not modelled here.
  - field: the earlier report-card eras
    why: Ohio published report cards long before 2022-23; only the current form is modelled.
