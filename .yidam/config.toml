# What this repository is owed, and how long it may go unowed.
#
# Read by `yidam due`, which reports four clocks together and exits zero however
# much is due — being owed is not being broken, and `yidam doctor` is the report
# that answers whether anything is. A clock with no interval declared here
# reports what it measured and never comes due, which is where this repository
# sat until 2026-08-31: four clocks, all decorative.
#
# `escalate_after` is deliberately NOT set. It turns a standing finding into an
# error after N corpus-touching commits, and the great majority of this corpus's
# findings are malformed claim tags awaiting an editorial pass. Arming the clock
# before that pass lands schedules a red gate with no commit behind it. Set it
# once the claim tags are uniform, not before.
#
# Measured at 9f2c4cc under yidam 0.12.0 (20e7511): 562 of 642 findings. The
# count moves with every corpus commit — it read 409 of 493 at 01cb592 under
# 0.11.0 — so re-measure before quoting it; the ratio is the durable part.
#
# It is NOT one shape. That sentence stood here until 0.12.0 and was wrong in a
# way nothing could see, because the check gave one piece of advice to two
# populations (goedelsoup/yidam#d3b3496). Split:
#
#   citation folded into the tag    524   the shape this repository argues about
#   two standings in one tag         38   `[verified for FY2022; inference for FY2023]`
#
# The second population is not an editorial backlog. Upstream is explicit that
# such a bracket is not a tag and that nothing on disk needs editing for it; the
# repair, where anyone wants one, is to write two claims. So the pass that would
# make the tags uniform is 524, and it will not take the other 38 with it.
#
# 0.12.0 also moved 29 qualified tags into the claim counts (1416 -> 1445), and
# only 17 of those had ever been reported. Twelve were counted as no claim and
# flagged by nothing. Any figure here derived by a different reader — the 455
# detail-carrying tags this paragraph used to quote against — predates that and
# has to be re-derived by its own method before it is quoted again.
#
# That count read 232 of 326 until yidam 0.10.0, and the corpus did not move:
# the check was line-scoped, its code-span mask inverted on a span that wrapped,
# and it never read a class's own prose — goedelsoup/yidam#601, #602 and #603,
# all closed upstream. The residue the fixed check still cannot see is one shape
# and one shape only: detail introduced by a plain space, which `TAG_SEPARATORS`
# excludes deliberately, so no further fix upstream reaches it. It is 46 tags,
# and it is uniform — 23 wrapped, 23 not, spread across all four prose fields
# and `properties`. Neither wrapping nor field predicts it any more, which is
# what closed #256's last open question about a suspected third cause.
#
# The shape being reported is this repository's figure attribution: the citation
# lives inside the tag, where `citedCrates` in `web/src/lib/corpusFigures.ts`
# reads it. Doing the rewrite the finding asks for empties `detail` and takes
# every binding's citation with it, which is what #256 records and what `440e49e`
# reverted. A larger number is a better-calibrated check, not a worse corpus.

[catalog]
# Days, not commits, and that is the one place yidam's clocks disagree on units
# deliberately: a statute does not become stale because you committed, and a
# published enrollment file does not stay fresh because you did not.
#
# Two years rather than one. The 41 sources here are overwhelmingly statutes,
# court records and annual state publications — things that change on their own
# schedule and announce it. The ones that rot are a different problem than the
# ones that age, and rot is what the wayback work already found: two sources
# dead, one moved to a CMS, one recovered only by IRN. A TTL cannot detect that;
# it can only make somebody look. Two years is the interval at which looking is
# worth the interruption.
#
# No entry declares `retrieved:`, so yidam counts from the commit that last
# touched the entry's file and says so in every report. That errs flattering — a
# typo fix reads as a refresh — and is the right default until the catalog
# carries artifact records.
ttl_days = 730

[due]
# These two do NOT share a unit, and the reports say which is which — verified
# against `yidam due` rather than assumed: questions are counted in COMMITS, and
# phases in DAYS. The split follows the rule the prelude gives for the catalog:
# a question going unanswered is a fact about corpus state, so the repository's
# own clock is the honest one; a branch left open is a fact about elapsed time,
# and a phase does not become abandoned because somebody committed elsewhere.
#
# `index_after` is omitted rather than set. There is no vector index, and the
# released binary cannot build one — `index-build` needs the `index` feature,
# which pulls fastembed and lancedb and wants protoc. An interval on a clock
# measuring an artifact this repository has decided not to have would report a
# debt nobody intends to pay.

# 97 questions are open. That is not a backlog, it is what a corpus of open
# inquiry looks like; the ones worth surfacing are the ones nothing has returned
# to across a long stretch of work. 200 commits is roughly two months at this
# repository's rate.
questions_after = 200

# Days. 22 refs are in flight and the oldest opened 2026-08-24, so at 50 days
# none is due and none should be — they are recent. This clock is not the
# instrument for the branches that are merged and simply never deleted, which is
# git hygiene and answers to `git branch --merged`, not to elapsed time. What it
# catches is the other failure: a phase that opened, went quiet, and was still
# open two months later with nobody remembering it.
phases_after = 50
