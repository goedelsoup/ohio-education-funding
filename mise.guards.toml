# mise.guards.toml — local overrides of inherited tasks.
#
# This is a mise *task file*, like `mise.yidam.toml`: tables are task names
# directly (`[schema]`, not `[tasks.schema]`).
#
# It exists because of a precedence rule that is easy to get backwards. An
# inherited task cannot be overridden from `mise.toml` — neither a
# `[tasks.<name>]` block nor a `mise-tasks/<name>` file task shadows a name
# defined in an included task file; the include wins and the local definition is
# not merely outranked but invisible, absent from `mise tasks` entirely. What
# does win is a **later include**: with
#
#   includes = ["mise.yidam.toml", "mise.guards.toml"]
#
# the last file to define a name is the one that runs. So an override has to be
# another task file, listed after the one it overrides, and the ordering in
# `mise.toml` is load-bearing rather than cosmetic.
#
# That makes this file durable in the one way that matters: `mise run
# yidam-vendor-update` replaces `mise.yidam.toml` wholesale, and touches neither
# this file nor the `includes` line in `mise.toml` that orders it.

[schema]
description = "Refuses. `.yidam/schemas/` is this repository's — use `pnpm --dir web schemas`."
# The inherited `[schema]` task runs `yidam schema`, which writes into
# `.yidam/schemas/` — a directory this repository generates itself, from the zod
# definitions in `web/src/lib/schema/`, via `pnpm --dir web schemas`.
#
# The two disagree, and ours is strictly the stricter one. Measured against
# `yidam schema` at 0.12.0, running it costs `corpus-node.json` the entire figure
# binding shape, `findings`, `revisions`, `unfilled`, and `summary` with both its
# 450-character ceiling and its no-markdown-link pattern; `required` falls from
# five fields to three; `additionalProperties` flips to `true`, so a misspelled
# field stops being underlined at all. It then drops 21 further files nothing
# here consumes, which a `git add .yidam` commits silently.
#
# It is not a version problem and no upgrade resolves it: 0.11.0 and 0.12.0
# produce byte-identical output, and both diverge the same way. Re-measured at
# 0.15.0 on the re-vendor to template v0.8.0 — every figure above still holds
# exactly: `required` five fields to three, `additionalProperties` to `true`,
# and 21 extra files. Three CLI majors have not moved it, so the next upgrade
# needs no re-measurement either; this task is the standing answer.
#
# `web/tests/unit/schema.spec.ts` catches the damage after the fact — it compares
# both documents whole, prose fields included, and asserts the directory holds
# exactly the two files the emitter writes. This task is the half that stops it
# happening, so the failure arrives before the tree is dirty rather than after.
run = '''
echo "error: \`mise run schema\` is refused in this repository." >&2
echo >&2
echo "  .yidam/schemas/ is generated from web/src/lib/schema/, not from the" >&2
echo "  ontology. \`yidam schema\` overwrites both committed files with a" >&2
echo "  weaker generic schema and drops 21 more that nothing here consumes." >&2
echo >&2
echo "  regenerate: pnpm --dir web schemas   (or mise run //web:schemas)" >&2
echo >&2
echo "  If it has already run: git checkout -- .yidam/schemas/" >&2
echo "                        git clean -fd .yidam/schemas/" >&2
exit 1
'''

[graph-lint]
description = "Lint the corpus against the baseline ratchet, and fail when a catalog entry's `used-by` disagrees with the citations."
# The inherited `[graph-lint]` is `yidam lint`, and this runs it unchanged. It
# then does one more thing, because the check that covers `used-by` cannot gate.
#
# `catalog-used-by-drift` is Warn severity, so `yidam lint` exits 0 when it
# fires. `yidam catalog-reconcile --dry-run` also exits 0 when it would rewrite
# something. Each entry used to carry a hand-kept list, and 46 of 58 were wrong
# or absent before anyone counted them (#497). Every entry now declares
# `used-by` in frontmatter and `catalog-reconcile` writes it, so the only way to
# go stale is to cite a source and not reconcile. The gate reads the dry run's
# JSON: `reconciled` names every entry it would rewrite, and a current catalog
# has none.
#
# The remedy is `yidam catalog-reconcile` after committing. It refuses an
# uncommitted entry, and it makes one `reconcile:` commit per entry it
# rewrites.
run = '''
set -eu
yidam lint
report=$(yidam catalog-reconcile --dry-run --format json)
stale=$(printf '%s' "$report" | jq -r '.reconciled[].entry')
if [ -n "$stale" ]; then
  echo "error: a catalog entry's used-by disagrees with the citations:" >&2
  printf '%s\n' "$stale" | sed 's/^/  /' >&2
  echo "  commit, then run: yidam catalog-reconcile" >&2
  exit 1
fi
echo "every catalog used-by agrees with the citations"
'''
