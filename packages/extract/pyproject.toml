[project]
name = "ohio-edfund-extract"
version = "0.1.0"
description = "Retrieval and extraction for the Ohio education funding corpus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No dependencies, deliberately. See README.
dependencies = []

[project.scripts]
ohio-edfund-extract = "ohio_edfund_extract.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ohio_edfund_extract*"]
