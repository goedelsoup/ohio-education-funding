# Both gates on every push, and the deploy on every merge to `main`. The gates existed and passed
# for fourteen phases and nothing ran them except a person remembering to; the deploy was a
# command someone typed, which is the same problem one step further along.
#
# Nothing here fetches from the department. Every fixture is committed and every test reads a
# committed fixture, so CI is hermetic and a publisher's outage cannot turn the build red. The
# retrieval path is checked by `edfund-connect verify` when someone runs it, not here.
#
# Every `uses:` is pinned to a commit SHA with the version it was in a trailing comment. A major
# tag like `@v4` is a pointer its owner can move, and one of these actions is handed the token
# that publishes the site — the repository already pins the 206 files it merely reads, and code
# that runs with a production credential deserves at least that. Upgrade by resolving the tag
# again and rewriting both the SHA and the comment; never one without the other.
name: ci

on:
  push:
    branches: ["main", "ma/*", "rigpa/*", "phase/*", "migrate/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Branch and pull-request runs still cancel — the newest push is the only one worth a runner.
  # A `main` run must not: it is the run that deploys, and a deploy killed partway through is a
  # state nobody can read off the dashboard afterwards.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The repository is public, so the default grant is wider than anything here needs. No job writes
# to it: the two gates read the tree, and the deploy job authenticates to Cloudflare with its own
# token rather than with anything GitHub issues.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: crates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `crates/rust-toolchain.toml` names the version and its components. `rustup toolchain
      # install` with no argument installs exactly that; `rustup show` no longer installs anything
      # since rustup 1.28, and before the file existed it reported the runner's own stable.
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates

      - name: fmt
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # The doc links are load-bearing: they are how a reader gets from a calculator to the
      # corpus node that says what it is for, and they broke silently once already.
      - name: doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # Every committed generated artifact: the feed the site serves, both corpus manifests
      # (`figures.json`, `series.json`), the README REGEN blocks, and the site icon. The task is
      # the one the local gate runs, called rather than copied — this job used to carry a
      # hand-written copy that checked two of the five, so a stale `figures.json` merged green
      # and went red on the next person's `//:ci`, where it read as their own finding (#495).
      #
      # Last in this job so it reuses the build above rather than cold-compiling the workspace on
      # a runner of its own. `mise run` installs the `[tools]` it finds missing; Rust is already
      # the pinned toolchain from the first step, so what it actually fetches is node, for
      # `design/logo/outline.ts --check`.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false

      # Same reason as in `graph-lint`: an untrusted config is silently an empty one.
      - name: Trust the configs
        working-directory: .
        run: mise trust --all

      - name: generated files are current
        working-directory: .
        run: mise run //:generated

  # The web gate is five jobs, because only one thing in it has to come first: the build. It ran as
  # one serial job for most of its life, and at 415–604s it was the critical path of every push
  # while the crates beside it finished in ~155s (#647).
  #
  #   web-static (check, lint, unit)         ─┐
  #   web-build  (build → dist.tar.zst)      ─┼─> web-dist  (check:dist, test:dist)
  #                                           └─> web-e2e   [shard 1/3 + measure, 2/3, 3/3]
  #   web        needs all four, and is the check the `main` ruleset requires by name
  #
  # The single job carried two ordering rules, and both survive as something stronger than step
  # order. "Unit before build", so a formula defect reads as a formula failure: `web-static` and
  # `web-build` are separate jobs now, and each failure is reported under its own name. "After
  # `build`" for everything that reads `dist/`: that is a `needs:` edge, and the thing they read is
  # not a directory that happens to be there but the one tarball `web-build` uploaded.
  #
  # One tarball, not 4,500 loose files: uploading the tree was the slow path, and a single
  # `tar --zstd` file is one object to move. Every consumer and `deploy` downloads that same file,
  # so "the bytes Chromium was served are the bytes deployed" holds by construction across jobs, as
  # it used to hold within one.
  #
  # The checkout, pnpm and Node steps repeat in four jobs. They are three lines each and pinned by
  # SHA, and a composite action to share them would be one more file to pin and read.
  web-static:
    name: web static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Full history, not the default single commit: `commitVerbs.spec.ts` ratchets the commit
      # vocabulary over every commit since the practice converged, and a shallow clone would pass
      # it by seeing nothing. The test asserts the clone is not shallow rather than trusting this.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: check
        run: pnpm check

      - name: lint
        run: pnpm lint

      - name: unit
        run: pnpm test:unit

  web-build:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # The default shallow clone. The build reads the tree and never the history — nothing under
      # `src/`, `scripts/` or the configs spawns `git` — and the one test that reads the log runs
      # in `web-static`, which keeps the full clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The only build in the run, and every job after it reads what it produced. The build is
      # where the formula is checked against the Rust checkpoints and where the corpus is parsed,
      # so a failure in either reads as a build failure rather than as a browser that never got a
      # server to talk to. `webServer.command` in playwright.config.ts is gated on `CI`, so
      # Chromium is served this build too, unpacked from the tarball below.
      - name: build
        run: pnpm build

      - name: Pack
        run: tar --zstd -cf dist.tar.zst dist && ls -l dist.tar.zst

      # On every run, not only the ones that deploy: `web-dist` and `web-e2e` read it. Already
      # compressed, so the action is told not to compress it again.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: web/dist.tar.zst
          compression-level: 0
          retention-days: 7

  web-dist:
    name: web dist
    needs: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: web

      - name: Unpack
        run: tar --zstd -xf dist.tar.zst

      # Asks of the built HTML what the route-table test structurally cannot ask of the route
      # table: is there an anchor here a static host cannot serve? Forty relative hrefs shipped
      # while that suite was green.
      - name: dist links
        run: pnpm check:dist

      # The assertions about the built files, which used to run inside the Playwright suite
      # without ever opening a browser. In this job and never in `unit`, which runs without a
      # build on purpose.
      - name: dist
        run: pnpm test:dist

  web-e2e:
    name: web e2e (${{ matrix.shard }}/3)
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one red shard does not hide what the other two would have
      # found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: web

      - name: Unpack
        run: tar --zstd -xf dist.tar.zst

      # On the runner image, not in Playwright's container: the container's fonts differ, and the
      # chrome width and the chart layout are both font-sensitive.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # What the built pages look like, as numbers — reading measure, the census of font sizes,
      # bordered boxes, the chrome above the first heading. Grades nothing: `THRESHOLDS` in
      # `src/lib/measure.ts` is empty and each redesign phase fills in one entry. It is here to
      # print, because the 2026-08 audit found 96 findings behind a gate that was green and never
      # once looked at the page.
      #
      # In one shard only, since it prints rather than grades, and in this job because it needs
      # Chromium for computed style and layout. The runner's fonts are not a laptop's — the
      # font-sensitive columns carry the advance width that produced them so the two are
      # comparable rather than merely different.
      - name: measure
        if: matrix.shard == 1
        run: pnpm measure

      # The e2e suite is what catches the class of bug unit tests structurally cannot: the
      # verification gate held shut on every tab except the one it exists for, and only a real
      # browser found it. `fullyParallel` is on, so Playwright splits by test rather than by file.
      - name: e2e
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7

  # Explained is dev only until it ships (#718), so the build above — the one every job tests and
  # `deploy` publishes — has none of it, and the suites that read it skip. This job builds a second
  # time with `PUBLIC_EXPLAINED=1` and runs them: the dist checks and the whole browser suite, so a
  # topic, its links and the bar's two-column panel stay tested while no reader can reach them.
  # Its build is never uploaded, so it cannot be the one that deploys. One unsharded job rather
  # than a second matrix: it runs beside the others, and sharding would build three more times.
  # Delete it, and the flag, when the section ships.
  web-explained:
    name: web explained
    runs-on: ubuntu-latest
    env:
      PUBLIC_EXPLAINED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: dist links
        run: pnpm check:dist

      - name: dist
        run: pnpm test:dist

      # On the runner image, for the reason `web-e2e` gives: the chrome width is font-sensitive.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: e2e
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-explained
          path: web/playwright-report/
          retention-days: 7

  # The `main` ruleset requires a check named `web`, and that name predates the split. This job is
  # that check: it passes only when every web job above succeeded, and a skipped or cancelled one
  # counts against it. `if: always()` is what makes it report at all when one of them fails — a job
  # whose `needs` failed is otherwise skipped, and a skipped required check reads as passing.
  web:
    name: web
    needs: [web-static, web-build, web-dist, web-e2e, web-explained]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every web job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "web-static web-build web-dist web-e2e web-explained: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  # The corpus's own gate: `yidam lint`, against the baseline ratchet in `.yidam/`.
  #
  # It ran nowhere but a developer's shell until #437. An `edge-target-class` finding reached
  # `main` in #427 and sat there across at least one more merge, and because the ratchet reports
  # anything outside the baseline as "introduced by this change", every branch cut afterwards read
  # someone else's finding as its own. Establishing that it was not cost a `git worktree`.
  #
  # That ratchet behaviour is the argument people reach for AGAINST gating on the lint, and it has
  # it backwards: reading a pre-existing finding as new is only possible while `main` is red, which
  # is the state this job exists to make unreachable. The cost it does carry is real but small — a
  # branch that deliberately introduces an error-severity finding has to `mise run //:graph-lint-
  # bless` in the same PR, with the reason in the commit, which is the ratchet working.
  #
  # `deploy` deliberately does NOT list this job in `needs`. The two gates it does wait on are
  # the ones that decide whether the built site is *correct*; a lint finding about a corpus edge
  # does not make a deployed page wrong, and holding a good build behind one would be a different
  # policy than the one written below.
  graph-lint:
    name: corpus lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false

      # A fresh checkout trusts none of the three `mise.toml` files, and an untrusted config is
      # silently an empty one — `mise run //:graph-lint` would fail as an unknown task rather than
      # as a lint finding.
      - name: Trust the configs
        run: mise trust --all

      # `[tools]` in mise.toml, NOT `mise run //:yidam-build`. Both install the pin in
      # `.yidam.toml` — the `github:goedelsoup/yidam` line is written from it by
      # `yidam-vendor-update` — but only one of them works on a runner.
      #
      # `//:yidam-build` resolves "is this commit tagged?" with `git ls-remote` against the
      # `origin` recorded in `.yidam.toml`, which is an **SSH** URL. A developer has a key, so the
      # tag resolves and the release downloads; a runner has none, `git ls-remote` fails into
      # `2>/dev/null || true`, and an empty tag is indistinguishable from "no release exists". It
      # then falls through to the source build, which clones that same SSH URL and dies on
      # `Permission denied (publickey)` after provisioning a second Rust toolchain. That is what
      # the first run of this job did, and the local rehearsal could not have caught it: the thing
      # that differs is the key.
      #
      # mise's own github backend fetches the release tarball over anonymous HTTPS. `_.path`
      # puts `.yidam/bin` ahead of the shims, so a developer with a `//:yidam-build` install still
      # runs that one and this changes nothing locally; in CI the directory does not exist
      # (gitignored) and the shim answers, with the same version and commit the `[tools]` entry
      # names and the same feature set. That pair is deliberately NOT written out here: it moves
      # on every `yidam-vendor-update`, and a figure beside a thing that moves goes stale unread.
      - name: Install the pinned yidam
        run: mise install "github:goedelsoup/yidam"

      - name: lint
        run: mise run //:graph-lint

  # The site goes live from here, and from nowhere else that anyone should be relying on: a push
  # to `main` that cleared both gates above. `mise run //:deploy` still exists and is still
  # occasionally the right thing, but it is no longer how production changes.
  #
  # Gating on the generated-file check, which runs inside `crates`, matters as much as gating on
  # `web`. The district figures are written into the HTML at build time, so a build over a stale
  # `bundle.json` produces a site that is wrong in its numbers and perfectly green in its tests.
  deploy:
    name: deploy to production
    # `web` is the aggregate of the web jobs, so this waits on `web-static`, `web-dist`, every
    # `web-e2e` shard and `web-explained`, not only on the build that produced the tarball.
    needs: [rust, web]
    # A `pull_request` event resolves `github.ref` to the PR's merge ref rather than to
    # `refs/heads/main`, so it is already excluded. The event test is for `workflow_dispatch`,
    # which can be aimed at `main` and would otherwise redeploy with no commit behind it.
    #
    # The attempt test is the one that is not obvious. This job never checks out; it deploys the
    # `dist` artifact, which lives for seven days. Re-running a superseded `main` run therefore
    # republishes that older commit's build over the live site, with nothing in the git history
    # to say the site moved backwards. A re-run of the gates stays useful; a re-run does not
    # deploy. The cost is that a deploy lost to a transient Cloudflare failure can no longer be
    # recovered by pressing re-run either; that case is what `mise run //:deploy` is for, and it
    # is the case where a person should be looking at what is live anyway.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && github.run_attempt == '1'
    runs-on: ubuntu-latest
    # This names the deployment in the GitHub UI, attaches the live URL to it, and — since the
    # environment carries a deployment branch policy of `main` and nothing else — refuses to run
    # the job at all from any other ref. That is a second, server-side copy of the first half of
    # the `if:` above, in the one place a workflow edit cannot reach.
    #
    # It is not yet the whole gate the commit that introduced it claimed. `CLOUDFLARE_API_TOKEN`
    # and `CLOUDFLARE_ACCOUNT_ID` are still repository-level secrets, readable by any job on any
    # branch, so the branch policy governs this deployment and not the credential. Closing that
    # means re-creating both as environment secrets, which can only be done by someone holding
    # the values.
    environment:
      name: production
      url: https://ohio-education-funding.pages.dev
    steps:
      # No checkout. Nothing here needs the sources: the deployable tree is the tarball
      # `web-build` packed, the same file `web-dist` and every `web-e2e` shard unpacked and tested,
      # and rebuilding it would mean deploying something no test has seen.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist

      - name: Unpack
        run: tar --zstd -xf dist.tar.zst

      # `--branch main` is not optional and cannot be inferred. On direct upload wrangler labels
      # the deployment with whatever branch it can find, and this job has no git tree to find one
      # in; unlabelled, the upload succeeds, a URL is printed, and the live site does not change.
      # `--commit-hash` is what makes the Cloudflare dashboard able to say which commit is serving.
      #
      # The wrangler version is pinned rather than `@latest`, so that a Cloudflare release cannot
      # turn a deploy red on a commit that touched nothing.
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: >-
            pages deploy dist
            --project-name ohio-education-funding
            --branch main
            --commit-hash ${{ github.sha }}
